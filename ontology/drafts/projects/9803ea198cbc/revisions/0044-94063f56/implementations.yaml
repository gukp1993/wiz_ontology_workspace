- id: 2ec06dc3-ac5b-4774-a13d-4003b3a11504
  kind: queryRule
  schemaVersion: 2
  name: 采样值取值规则
  connection: conn-6e4bedfe447e
  steps:
  - id: point
    name: 定位测点
    table: s_attr_scada
    cardinality: one
    where:
    - field: model_name
      op: eq
      value: '{{inputs.model_name}}'
    - field: attr_name
      op: eq
      value: '{{inputs.attr_name}}'
    - field: model_id
      op: eq
      value: '{{inputs.model_id}}'
    select:
    - as: scadaTable
      field: scada_table
    - as: scadaId
      field: scada_id
  - id: storage
    name: 定位采样存储
    table: '{{steps.point.scadaTable}}'
    cardinality: one
    where:
    - field: id
      op: eq
      value: '{{steps.point.scadaId}}'
    select:
    - as: sampleTable
      field: sample_table_name
    - as: sampleField
      field: sample_field_name
  - id: samples
    name: 读取采样记录
    table: '{{steps.storage.sampleTable}}'
    cardinality: many
    where:
    - field: record_time
      op: gte
      value: '{{inputs.startTime}}'
    - field: record_time
      op: lt
      value: '{{inputs.endTime}}'
    select:
    - as: timestamp
      field: record_time
    - as: value
      field: '{{steps.storage.sampleField}}'
  result:
    type: timeSeries
    valueType: double
    step: samples
    timestamp: timestamp
    value: value
    order: ascending
  policies:
    lookupMissing: error
    lookupMultiple: error
    emptySeries: empty
    nullValue: preserve
    identifiers: connectionCatalog
    timezone: project
    range: '[startTime,endTime)'
- id: 02cc29fb-e48e-47d6-a429-081ba338f549
  kind: queryRule
  schemaVersion: 4
  mode: sqlSteps
  name: 采样值测试规则
  connection: conn-6e4bedfe447e
  inputs:
  - name: model_name
    type: string
    description: ''
    source: binding
  - name: attr_name
    type: string
    description: ''
    source: binding
  - name: model_id
    type: string
    description: ''
    source: binding
  steps:
  - id: 542b6032-9968-4aa8-ba60-6ae822400191
    key: step
    name: 步骤1
    cardinality: one
    sql: "SELECT scada_table AS scadaTable,\n       scada_id AS scadaId\nFROM s_attr_scada\n\
      WHERE model_name = :model_name\n  AND attr_name = :attr_name\n  AND model_id\
      \ = :model_id"
  - id: 47fdc5d6-32dd-460b-8442-e3762b3ec0ec
    key: step2
    name: 步骤2
    cardinality: one
    sql: "SELECT sample_table_name AS sampleTable,\n       sample_field_name AS sampleField\n\
      FROM {{step.scadaTable}}\nWHERE id = :step.scadaId"
  - id: f67d8e1b-68c6-4a61-b353-88a68468f21f
    key: step3
    name: 步骤3
    cardinality: many
    sql: "SELECT record_time AS timestamp,\n       {{step2.sampleField}} AS value\n\
      FROM {{step2.sampleTable}}\nORDER BY record_time ASC"
  result:
    step: f67d8e1b-68c6-4a61-b353-88a68468f21f
    type: timeSeries
    valueType: double
    value: value
    timestamp: timestamp
