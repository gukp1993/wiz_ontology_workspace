implementations:
- id: 91a13f8a-c593-47f6-8f4c-854cb370bd25
  contractId: 50359d65-d8da-4a84-b522-98ecc901fdde
  connection: ''
  rule: 查redis，模板key=m_storage_cluster_phase-soc-{id}
  parameters: {}
  environment: ''
  inputBindings:
  - inputId: in_daeb6b69-05d
    source:
      kind: object
      objectType: mg:object_dd80b5fda9284760bb27570be1b637fc
  outputDeclarations:
  - outputId: out_827abba4-10e
    note: ''
- id: 2ec06dc3-ac5b-4774-a13d-4003b3a11504
  kind: queryRule
  schemaVersion: 2
  name: 采样值取值规则
  connection: conn-6e4bedfe447e
  steps:
  - id: point
    name: 定位测点
    table: s_attr_scada
    cardinality: one
    where:
    - field: model_name
      op: eq
      value: '{{inputs.model_name}}'
    - field: attr_name
      op: eq
      value: '{{inputs.attr_name}}'
    - field: model_id
      op: eq
      value: '{{inputs.model_id}}'
    select:
    - as: scadaTable
      field: scada_table
    - as: scadaId
      field: scada_id
  - id: storage
    name: 定位采样存储
    table: '{{steps.point.scadaTable}}'
    cardinality: one
    where:
    - field: id
      op: eq
      value: '{{steps.point.scadaId}}'
    select:
    - as: sampleTable
      field: sample_table_name
    - as: sampleField
      field: sample_field_name
  - id: samples
    name: 读取采样记录
    table: '{{steps.storage.sampleTable}}'
    cardinality: many
    where:
    - field: record_time
      op: gte
      value: '{{inputs.startTime}}'
    - field: record_time
      op: lt
      value: '{{inputs.endTime}}'
    select:
    - as: timestamp
      field: record_time
    - as: value
      field: '{{steps.storage.sampleField}}'
  result:
    type: timeSeries
    valueType: double
    step: samples
    timestamp: timestamp
    value: value
    order: ascending
  policies:
    lookupMissing: error
    lookupMultiple: error
    emptySeries: empty
    nullValue: preserve
    identifiers: connectionCatalog
    timezone: project
    range: '[startTime,endTime)'
