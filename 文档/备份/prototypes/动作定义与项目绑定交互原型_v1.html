<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动作定义与项目绑定 · 交互原型</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#21364b;background:#f4f7fb}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d8e1ee;background:white;color:#284057;border-radius:6px;padding:8px 14px}button:hover{background:#edf3ff}button.primary{background:#2858e9;color:white;border-color:#2858e9}button.active{background:#edf2ff;color:#244fd5;border-color:#7795ff}button:focus-visible,input:focus,select:focus,textarea:focus{outline:2px solid #91b1ff;outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}aside{position:fixed;width:205px;inset:0 auto 0 0;background:#162c40;color:#dbe8f4;padding:24px 16px}.brand{font-size:19px;font-weight:650;margin-bottom:28px}aside button{width:100%;text-align:left;margin:4px 0;background:transparent;color:#dbe8f4;border-color:transparent}aside button:hover{background:#25435d;color:white}aside button.sel{background:#25435d;color:white}aside small{display:block;color:#a7bbcf;margin:20px 8px 8px}.workspace{margin-left:205px}header{background:white;border-bottom:1px solid #dce4ef;padding:20px 30px;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:23px;margin:4px 0}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0 0 10px}.muted,small{color:#677e93}.tag{font-size:12px;border-radius:18px;padding:4px 10px;background:#edf3ff;color:#355ad3}.notice{background:#fff8e7;color:#805d20;border:1px solid #eddfb9;border-radius:8px;padding:12px 16px;margin-bottom:20px}main{padding:24px 30px;max-width:1500px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.card{background:white;border:1px solid #dbe4ee;border-radius:10px;padding:23px;margin-bottom:18px}.cols{display:grid;grid-template-columns:minmax(430px,1fr) 330px;gap:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;color:#334b60}input,select,textarea{width:100%;display:block;margin-top:6px;border:1px solid #ccd8e7;border-radius:6px;padding:10px;background:white;color:#21364b}textarea{resize:vertical;min-height:80px}.full{grid-column:1/-1}.section{border-top:1px solid #e1e8f0;margin-top:22px;padding-top:22px}.hint{font-size:13px;color:#678096;margin:7px 0 13px}.preview{background:#f7faff;border:1px solid #dce6f6;border-radius:8px;padding:16px}.rule{padding:14px;background:#f8fafc;border:1px solid #e1e7ef;border-radius:8px;margin-top:10px}table{border-collapse:collapse;width:100%}th,td{text-align:left;border-bottom:1px solid #e5ebf3;padding:14px 10px}th{color:#6b7c8e;font-weight:500;background:#f8fafc}.error{color:#b73939;margin:10px 0}.ok{color:#187458}.footer{display:flex;align-items:center;gap:12px;margin-top:24px}details{margin-top:20px}summary{cursor:pointer;color:#526c82}code{background:#edf1f6;padding:3px 5px;border-radius:4px}.param{display:grid;grid-template-columns:1.3fr 1fr 100px;gap:12px;align-items:center;margin:10px 0}.param input{margin:0}.steps{font-size:13px;margin-bottom:18px;color:#5e768c}.toast{position:fixed;right:25px;bottom:25px;background:#193d56;color:white;padding:13px 20px;border-radius:8px;box-shadow:0 5px 20px #0002;max-width:440px;z-index:5}dialog{border:0;border-radius:12px;max-width:560px;width:90%;padding:28px;color:#21364b}dialog::backdrop{background:#142c4266}.callout{border-left:3px solid #557bea;padding:5px 15px;margin:18px 0}.switches{display:flex;gap:6px;margin-bottom:16px}@media(max-width:1000px){.cols{grid-template-columns:1fr}.grid{grid-template-columns:1fr}aside{width:165px}.workspace{margin-left:165px}main{padding:18px}.param{grid-template-columns:1fr 1fr}}@media(max-width:650px){aside{position:static;width:auto;padding:10px}.brand,aside small,#menu{display:none}.workspace{margin:0}header{padding:16px}.param{grid-template-columns:1fr}.cols{display:block}}
</style></head><body>
<aside><div class="brand">本体工作台</div><div class="switches"><button id="onto">本体</button><button id="proj">项目</button></div><small id="scope"></small><div id="menu"></div><small>交互原型 V1 · 本期无参数定义<br>示例数据 · 不连接真实系统</small></aside>
<div class="workspace"><header><div><small id="crumb"></small><h1 id="heading"></h1></div><span class="tag">可点击原型 · 未接入业务</span></header><main id="app"></main></div>
<dialog id="modal"><div id="modalbody"></div><div class="footer"><button id="closemodal">关闭预览</button></div></dialog><div class="toast" id="toast" hidden role="status"></div>
<script>
const app=document.getElementById('app'),modal=document.getElementById('modal');let zone='ontology',screen='list',selected='stop',dirty=false,draft=null;
const defs={
stop:{id:'stop',name:'储能设备停止充放电',object:'储能设备',description:'请求指定储能设备停止当前充电或放电，进入不充不放状态。',effect:'向输入的目标储能设备发起停止充放电请求，目标功率为 0。以设备反馈确认停止完成，不直接修改实测功率或 SOC。'},
rename:{id:'rename',name:'修改储能簇名称',object:'储能簇',description:'修改指定储能簇的显示名称，保留身份及归属关系。',effect:'将目标储能簇的显示名称修改为输入的新名称。'},
move:{id:'move',name:'调整所属储能设备',object:'储能簇',description:'调整储能簇的业务归属，不代表执行物理接线变更。',effect:'解除目标储能簇与原所属设备的链接，再建立与输入的目标储能设备的链接；完成后只归属目标设备。'}
};const bindings={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=(items,value)=>items.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('');
const objects=['储能簇','储能设备','储能系统'];
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,4500)}
function nav(z){if(dirty&&!confirm('修改尚未保存到原型，放弃修改？'))return;dirty=false;zone=z;screen='list';render()}
function chrome(){document.getElementById('onto').className=zone==='ontology'?'sel':'';document.getElementById('proj').className=zone==='project'?'sel':'';document.getElementById('scope').textContent=zone==='ontology'?'当前本体 · 储能本体':'当前项目 · 创智园二期';document.getElementById('crumb').textContent=zone==='ontology'?'本体 / 通用动作定义':'项目 / 动作实现绑定';document.getElementById('heading').textContent=zone==='ontology'?'动作定义':'动作绑定';document.getElementById('menu').innerHTML=(zone==='ontology'?['工作概览','对象建模','共享属性库','动作定义','本体校验与发布']:['项目概览','数据连接','对象映射','动作绑定','函数编排','项目校验与发布']).map(x=>`<button ${x.includes('动作')?'class="sel"':''} data-menu="${x}">${x}</button>`).join('');document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>b.dataset.menu.includes('动作')?nav(zone):toast('此原型仅演示动作定义与动作绑定'))}
function render(){chrome();if(screen==='list')list();else if(zone==='ontology')edit();else binding()}
function list(){app.innerHTML=`<div class="notice">${zone==='ontology'?'本期填写动作名称、作用对象、业务定义和业务效果，不单独定义输入参数。具体接口适配在项目绑定。':'模拟引用本体定义；正式产品需发布本体并更新项目引用。此原型不实际发布。'}</div><div class="card"><div class="row between"><h2>动作列表</h2>${zone==='ontology'?'<button class="primary" id="new">＋ 新建动作</button>':''}</div><input id="search" placeholder="搜索动作名称" aria-label="搜索动作"><table><thead><tr><th>动作</th><th>作用对象</th><th>业务效果</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="callout">先体验“储能设备停止充放电”：作用对象选择储能设备，业务效果描述停止充放电。具体操作哪台设备，在项目执行时确定。</div>`;
const rows=()=>{document.getElementById('rows').innerHTML=Object.values(defs).filter(d=>d.name.includes(document.getElementById('search').value)).map(d=>`<tr><td><strong>${esc(d.name)}</strong><br><small>${esc(d.description)}</small></td><td>${esc(d.object)}</td><td style="max-width:450px">${esc(d.effect)}</td><td><button data-edit="${esc(d.id)}">${zone==='ontology'?'编辑':'配置绑定'}</button></td></tr>`).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{selected=b.dataset.edit;draft=structuredClone(defs[selected]);dirty=false;screen='detail';render()})};rows();document.getElementById('search').oninput=rows;
if(document.getElementById('new'))document.getElementById('new').onclick=()=>{selected='action'+Date.now();draft={id:selected,name:'',object:'储能设备',description:'',effect:''};screen='detail';dirty=false;render()}}
function error(d){if(!d.name.trim()||!d.description.trim()||!d.effect.trim())return '请填写动作名称、业务定义和业务效果。';return ''}
function edit(){app.innerHTML=`<button id="back">← 返回动作列表</button><div class="steps">本体定义 → 发布与引用 → 项目绑定</div><div class="cols"><section class="card"><h2>${draft.name?'编辑动作':'新建动作'}</h2><div class="grid"><label>动作名称 *<input id="name" value="${esc(draft.name)}" placeholder="例如：储能设备停止充放电"></label><label>作用对象 *<select id="obj">${opts(objects,draft.object)}</select></label><label class="full">业务定义 *<textarea id="desc" placeholder="说明这个动作的用途">${esc(draft.description)}</textarea></label><label class="full">业务效果 *<textarea id="effect" rows="4" placeholder="执行后期望发生什么？例如：请求目标设备停止充放电，目标功率为 0。">${esc(draft.effect)}</textarea></label></div><p class="hint">用业务语言描述预期变化；不需要先选择修改属性或调整链接。描述本身不会执行指令。</p><div id="errors" class="error" role="alert"></div><div class="footer"><button class="primary" id="save">保存定义</button><button id="preview">预览动作定义</button><button id="cancel">取消</button></div><p class="hint">仅保存到当前原型页面，刷新恢复示例；不写入工作台。</p></section><section><div class="card"><h3>怎么填写？</h3><p><b>业务定义：</b>这个动作有什么用途。</p><p><b>作用对象：</b>这个动作针对哪类业务对象。</p><p><b>业务效果：</b>执行后期望发生什么。</p><p>本期不维护参数清单。修改名称、调整归属等操作所需信息，由项目实现配置。</p><button id="jump">查看项目怎么实现 →</button></div><div class="card"><h3>停止充放电示例</h3><p>作用对象：储能设备。</p><p>固定要求：目标功率为 0。</p><p>完成依据：设备反馈，不将请求受理视为已停止。</p></div></section></div>`;
const collect=()=>{draft.name=document.getElementById('name').value;draft.object=document.getElementById('obj').value;draft.description=document.getElementById('desc').value;draft.effect=document.getElementById('effect').value};
['name','obj','desc','effect'].forEach(id=>document.getElementById(id).oninput=()=>{collect();dirty=true});
document.getElementById('save').onclick=()=>{collect();const e=error(draft);document.getElementById('errors').textContent=e;if(e)return;defs[selected]=structuredClone(draft);dirty=false;toast('已保存到原型，工作台数据未改变')};document.getElementById('preview').onclick=()=>{collect();const e=error(draft);document.getElementById('errors').textContent=e;if(!e)preview()};document.getElementById('back').onclick=document.getElementById('cancel').onclick=()=>nav('ontology');document.getElementById('jump').onclick=()=>{if(dirty||!defs[selected]){toast('请先保存定义');return}zone='project';render()}}
function preview(){document.getElementById('modalbody').innerHTML=`<span class="tag">定义预览 · 不执行</span><h2 style="margin-top:16px">${esc(draft.name)}</h2><p><b>作用对象：</b>${esc(draft.object)}</p><h3>业务定义</h3><p>${esc(draft.description)}</p><h3>业务效果</h3><div class="preview" style="white-space:pre-wrap">${esc(draft.effect)}</div><p class="hint">本期不定义输入参数，也不生成执行表单。具体执行方式由项目绑定实现。</p>`;modal.showModal()}
function binding(){const d=defs[selected],b=structuredClone(bindings[selected]||{method:'调用项目接口',path:'',flow:'',permission:'',mapping:''});app.innerHTML=`<button id="back">← 返回动作绑定列表</button><div class="steps">${esc(d.name)} / 项目实现</div><div class="card"><h2>绑定项目实现</h2><div class="preview"><strong>${esc(d.name)}</strong><p>${esc(d.effect)}</p><small>以上为本体定义，具体接口和参数转换在项目中配置。</small></div><div class="grid section"><label>实现方式 *<select id="method">${opts(['调用项目接口','绑定函数编排'],b.method)}</select></label><label>允许操作的项目角色 *<input id="permission" value="${esc(b.permission)}" placeholder="例如：设备运维人员"></label></div><div id="implementation"></div><label class="section">项目接口／函数参数映射（按需）<textarea id="mapping" placeholder="例如：storageId ← 当前操作设备的项目标识；power ← 固定值 0。无参数接口可留空。">${esc(b.mapping)}</textarea></label><p class="hint">本体不提供参数清单；在这里说明接口实际需要的参数及其来源：当前操作对象、项目配置、固定值或执行时补充填写的信息。原型仅保存说明，不生成执行表单。</p><p class="hint">由项目实现反馈执行结果。请求受理不代表业务效果已完成。</p><div id="binderr" class="error"></div><div class="footer"><button id="savebinding" class="primary">保存绑定</button><button id="backdef">查看本体定义</button></div><p class="hint">保存配置不代表已具备执行能力。</p></div>`;
const impl=()=>{document.getElementById('implementation').innerHTML=b.method==='调用项目接口'?`<label class="section">项目接口路径 *<input id="path" value="${esc(b.path)}" placeholder="填写实际项目接口路径"></label>`:`<label class="section">项目函数编排 *<input id="flow" value="${esc(b.flow)}" placeholder="填写项目编排名称（原型示意）"></label>`;const el=document.getElementById(b.method==='调用项目接口'?'path':'flow');el.oninput=()=>{b[el.id]=el.value;dirty=true}};impl();document.getElementById('method').onchange=e=>{b.method=e.target.value;dirty=true;impl()};['mapping','permission'].forEach(id=>document.getElementById(id).oninput=e=>{b[id]=e.target.value;dirty=true});document.getElementById('savebinding').onclick=()=>{if(!b.permission.trim()||!(b.method==='调用项目接口'?b.path:b.flow).trim()){document.getElementById('binderr').textContent='请填写实现和项目角色。';return}bindings[selected]=structuredClone(b);dirty=false;document.getElementById('binderr').textContent='';toast('绑定已保存到原型，未执行动作')};document.getElementById('back').onclick=()=>nav('project');document.getElementById('backdef').onclick=()=>{if(dirty&&!confirm('放弃未保存的绑定修改？'))return;dirty=false;zone='ontology';draft=structuredClone(d);render()}}
document.getElementById('onto').onclick=()=>nav('ontology');document.getElementById('proj').onclick=()=>nav('project');document.getElementById('closemodal').onclick=()=>modal.close();render();

</script></body></html>
