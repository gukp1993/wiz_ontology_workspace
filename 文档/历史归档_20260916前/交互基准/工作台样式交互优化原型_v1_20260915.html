<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本体工作台 · 管理后台样式优化原型 v1（2026-09-15）</title>
<style>
/* ═══ 设计令牌（借鉴 Tabler/AntPro/Arco/Vben，见交付说明） ═══
   底色/卡片 #f3f5f9 / #ffffff；正文/辅助 #1f2733 / #697386；边框 #e5e8ef
   主色 #245cdf；选中底 #eef3ff；成功/警告/危险 #2fbf71 / #f7a924 / #f0524f
   侧栏 #16202c / #d3deeb；圆角 卡片8 控件6；间距 4/8 栅格 */
:root{--bg:#f3f5f9;--card:#fff;--ink:#1f2733;--muted:#697386;--line:#e5e8ef;--blue:#245cdf;--blue-ink:#1d4fc0;--tint:#eef3ff;--green:#2fbf71;--green-bg:#e9f9f1;--amber:#b97d10;--amber-bg:#fdf3e0;--red:#f0524f;--red-bg:#fdeeee;--nav:#16202c;--nav2:#1c2836;--navtext:#d3deeb;--radius:8px;--r:6px;--shadow:0 1px 2px rgba(16,24,40,.05);--shadow-lg:0 8px 24px rgba(16,24,40,.14);--pad:20px}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3,h4,p{margin:0}h1{font-size:20px;font-weight:600}h2{font-size:16px;font-weight:600}h3{font-size:14px;font-weight:600}strong{font-weight:600}
small{font-size:12px;color:var(--muted)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r);padding:7px 13px;transition:all .15s}
button:hover{border-color:var(--blue);color:var(--blue)}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--blue);border-color:var(--blue);color:#fff}.primary:hover{background:var(--blue-ink);color:#fff}
.danger-ghost{color:var(--red);border-color:transparent;background:none;padding:4px 8px}.danger-ghost:hover{background:var(--red-bg);border-color:transparent;color:var(--red)}
.link-btn{border:0;background:none;color:var(--blue);padding:4px 6px}.link-btn:hover{background:var(--tint)}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:7px 11px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid #b8ceff;outline-offset:0;border-color:var(--blue)}
textarea{min-height:84px;resize:vertical}
label{display:block}label>span{display:block;margin-bottom:6px;font-weight:500}
.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
/* ═══ 外壳：顶栏 + 侧栏 + 主区（Vben/Arco 三段式） ═══ */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.app.collapsed{grid-template-columns:64px minmax(0,1fr)}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;height:52px;padding:0 16px 0 14px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:.3px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#245cdf,#4d8bff);color:#fff;display:grid;place-items:center;font-size:15px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:6px;color:var(--muted);font-weight:500}
.seg button.active{background:var(--card);color:var(--blue);box-shadow:var(--shadow);font-weight:600}
.top-search{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:5px 10px;width:230px;background:var(--bg);font-size:13px}
.top-search kbd{margin-left:auto;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px;background:#fff}
.icon-btn{position:relative;border:0;background:none;padding:6px;border-radius:8px;color:var(--muted)}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.icon-btn .dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--blue);display:grid;place-items:center;font-size:12px;font-weight:600;border:1px solid #d4e0f7}
/* 侧栏（深色，Arco 分组 + Vben 折叠） */
.rail{background:var(--nav);color:var(--navtext);padding:14px 10px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
.ctx{background:var(--nav2);border:1px solid #2a3948;border-radius:8px;padding:9px 10px;margin-bottom:6px}
.ctx small{color:#8fa2b8;display:block;margin-bottom:4px}
.ctx select{background:#0f1722;border-color:#2a3948;color:var(--navtext);padding:6px 8px}
.nav-group{font-size:11px;letter-spacing:1px;color:#7d90a7;padding:10px 10px 4px}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;color:var(--navtext);border-radius:7px;padding:8px 10px;font-weight:500}
.rail nav button .ni{width:18px;text-align:center;opacity:.75}
.rail nav button:hover{background:#223146;color:#fff}
.rail nav button.active{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(36,92,223,.4)}
.rail nav button.active .ni{opacity:1}
.rail .role{margin-top:auto;border-top:1px solid #263544;padding:12px 8px 2px;font-size:12px;color:#8fa2b8}
.rail .role b{color:var(--navtext);display:block;font-size:12px}
.collapsed .ctx,.collapsed .nav-group,.collapsed .role,.collapsed nav button span.tx{display:none}
.collapsed nav button{justify-content:center;padding:10px 0}
/* 主区 */
.main{min-width:0;display:flex;flex-direction:column}
.pagehead{background:var(--card);border-bottom:1px solid var(--line);padding:14px var(--pad) 13px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:3px}
.crumb b{color:var(--ink);font-weight:500}
.pagehead-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pagehead-row .desc{color:var(--muted);font-size:13px;margin-top:2px}
.pagehead-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.save-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:20px;padding:3px 11px;border:1px solid var(--line);background:var(--bg);color:var(--muted)}
.save-pill.ok{background:var(--green-bg);border-color:#bfe8d2;color:#1c8a54}
.save-pill.dirty{background:#fff7e8;border-color:#f2ddb0;color:var(--amber)}
.save-pill.editing{background:var(--tint);border-color:#c9d9f8;color:var(--blue)}
.content{padding:var(--pad);max-width:1180px;width:100%;margin:0 auto}
/* 卡片（Tabler card-header/body） */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2,.card-h h3{margin:0}
.card-h .sub{color:var(--muted);font-size:12px}
.card-h .acts{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.card-b{padding:16px}
/* 统计卡（AntPro stat + trend） */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:border .15s}
.stat:hover{border-color:#b8ceff}
.stat small{display:block}.stat .num{font-size:24px;font-weight:650;letter-spacing:-.5px;margin:2px 0}
.stat .tr{font-size:12px;color:var(--green)}
.stat .ico{float:right;width:30px;height:30px;border-radius:7px;background:var(--tint);color:var(--blue);display:grid;place-items:center;margin-top:-2px}
/* 徽标/标签（Arco 状态点 + TDesign tag） */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:5px;padding:2px 8px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.blue{background:var(--tint);border-color:#ccd9f5;color:var(--blue)}
.tag.green{background:var(--green-bg);border-color:#bfe8d2;color:#1c8a54}
.tag.amber{background:var(--amber-bg);border-color:#f2ddb0;color:var(--amber)}
.tag.red{background:var(--red-bg);border-color:#f5c6c5;color:var(--red)}
.tag .dt{width:6px;height:6px;border-radius:50%;background:currentColor}
/* 表格（ProTable 密度 + 工具栏） */
.tbl-bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tbl-bar input[type=search]{width:220px;margin:0}
.tbl-bar .sp{flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);background:#fafbfd}
td{padding:10px;border-bottom:1px solid #eef1f6;vertical-align:middle}
tbody tr{transition:background .1s}
tbody tr:hover{background:#f8faff}
tbody tr.click{cursor:pointer}
td small{display:block;margin-top:2px}
.row-acts{white-space:nowrap;text-align:right}
.row-acts button{padding:4px 9px;font-size:12px;margin-left:5px}
/* 目录 + 详情（对象/映射工作区） */
.split{display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px;align-items:start}
.dir{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px;box-shadow:var(--shadow)}
.dir .dh{font-size:12px;color:var(--muted);padding:6px 8px;display:flex;justify-content:space-between}
.dir button.item{display:block;width:100%;text-align:left;border:0;background:none;border-radius:7px;padding:9px 10px;margin:1px 0}
.dir button.item:hover{background:var(--bg)}
.dir button.item.active{background:var(--tint);color:var(--blue)}
.dir button.item small{display:block;margin-top:2px;color:var(--muted)}
/* 页签 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 0;flex-wrap:wrap}
.tabs button{border:0;background:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 13px;color:var(--muted);font-weight:500}
.tabs button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.tabs button .cnt{font-size:11px;background:var(--bg);border-radius:8px;padding:1px 7px;margin-left:5px;color:var(--muted)}
.tabs button.active .cnt{background:var(--tint)}
/* 表单 */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin:14px 0}
.full{grid-column:1/-1}
.fhint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6}
details.fold{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
details.fold summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none;display:flex;align-items:center;gap:6px}
details.fold summary::before{content:'▸';transition:.15s}
details.fold[open] summary::before{transform:rotate(90deg)}
.edit-foot{position:sticky;bottom:0;display:flex;gap:9px;align-items:center;background:linear-gradient(transparent,var(--card) 30%);padding:18px 0 4px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:18px}
/* 编辑器外壳：替换主内容 */
.editor-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;flex-wrap:wrap}
.editor-head .back{border:0;background:none;color:var(--muted);padding:6px 10px 6px 0;font-size:13px}
.editor-head .back:hover{color:var(--blue);background:none}
/* 只读摘要（AntPro Descriptions） */
.desc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.desc-grid>div{padding:11px 13px;border-bottom:1px solid #eef1f6;background:#fafbfd}
.desc-grid>div:nth-last-child(-n+2){border-bottom:0}
.desc-grid small{display:block}
.desc-grid .v{font-weight:500;margin-top:2px}
/* 步骤（AntPro Steps） */
.steps{display:flex;gap:0;margin:16px 0 18px}
.step{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;padding:6px 14px;border-radius:8px}
.step .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-size:12px}
.step.active{background:var(--tint);color:var(--blue);font-weight:600}
.step.active .n{background:var(--blue);border-color:var(--blue);color:#fff}
.step.done{color:#1c8a54}.step.done .n{background:var(--green-bg);border-color:#bfe8d2;color:#1c8a54}
.step-arrow{color:#c3ccd9;padding:0 2px}
/* 选项卡（来源三卡） */
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.choices button{text-align:left;padding:13px;border-radius:var(--radius)}
.choices button small{display:block;margin-top:4px}
.choices button.active{border-color:var(--blue);background:var(--tint);color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
/* 抽屉（TDesign/AntPro Drawer） */
.drawer-mask{position:fixed;inset:0;background:rgba(15,23,36,.35);z-index:90;display:flex;justify-content:flex-end}
.drawer{width:min(430px,92vw);background:var(--card);height:100%;overflow:auto;box-shadow:var(--shadow-lg);padding:18px;animation:sl .18s}
@keyframes sl{from{transform:translateX(30px);opacity:.4}}
.drawer-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,36,.4);z-index:95;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border-radius:12px;box-shadow:var(--shadow-lg);width:min(460px,95vw);max-height:88vh;overflow:auto;padding:20px;animation:pop .16s}
@keyframes pop{from{transform:scale(.96);opacity:.5}}
.dialogtools{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
/* Toast */
.toasts{position:fixed;top:60px;right:16px;z-index:120;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:8px;box-shadow:var(--shadow-lg);padding:10px 14px;font-size:13px;min-width:240px;max-width:360px;animation:tin .2s}
.toast.ok{border-left-color:var(--green)}.toast.err{border-left-color:var(--red)}
@keyframes tin{from{transform:translateX(20px);opacity:0}}
/* 时间线（AntPro Timeline） */
.tl{position:relative;padding-left:20px}
.tl::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:0 0 16px}
.tl-i::before{content:'';position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--blue)}
.tl-i.old::before{border-color:#c3ccd9}
/* 空态（Tabler） */
.empty{text-align:center;padding:44px 16px;color:var(--muted)}
.empty .eico{width:46px;height:46px;margin:0 auto 10px;border-radius:12px;background:var(--tint);color:var(--blue);display:grid;place-items:center;font-size:20px}
.empty p{margin:4px 0 14px}
/* 进度条 */
.prog{height:6px;border-radius:4px;background:var(--bg);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--blue);border-radius:4px}
/* 映射行 */
.mapline{display:grid;grid-template-columns:1fr 30px 1fr;gap:8px;align-items:end;margin:10px 0}
.mapline>span{text-align:center;color:var(--muted);padding-bottom:9px}
.filterrow{display:grid;grid-template-columns:1.1fr 24px 1.2fr 30px;gap:7px;align-items:center;margin:8px 0}
.filterrow>span{text-align:center;color:var(--muted)}
.checkrow{display:flex;justify-content:space-between;gap:14px;padding:13px 2px;border-bottom:1px solid #eef1f6;align-items:center}
.checkrow:last-child{border-bottom:0}
.checkrow small{display:block;margin-top:3px}
.chk{display:flex;gap:8px;align-items:center}
.chk input{width:16px;height:16px;accent-color:var(--blue)}
.num{display:inline-grid;place-items:center;width:26px;height:26px;background:var(--tint);color:var(--blue);border-radius:50%;margin-right:9px;font-size:13px}
.readbox{padding:9px 12px;background:#f8fafd;border:1px solid var(--line);border-radius:var(--r);overflow-wrap:anywhere}
.note{background:var(--tint);border:1px solid #d6e2fa;border-radius:var(--r);padding:10px 13px;color:var(--blue-ink);font-size:13px;margin:12px 0}
.spacer{flex:1}
.kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px;background:#fff}
@media(max-width:1080px){.stats{grid-template-columns:1fr 1fr}.app,.app.collapsed{grid-template-columns:64px minmax(0,1fr)}}
@media(max-width:860px){.split{grid-template-columns:1fr}.dir{display:flex;gap:5px;overflow-x:auto}.dir .dh{display:none}.dir button.item{min-width:110px}.app,.app.collapsed{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px}.rail nav{flex-direction:row}.rail .role,.ctx{display:none}.top-search{display:none}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.fgrid,.choices,.desc-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.seg button{padding:5px 9px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<script>
(()=>{
/* ═════════════ 演示数据（业务域：储能；仅原型内存，刷新重置） ═════════════ */
const cp=x=>JSON.parse(JSON.stringify(x));
let seq=40;const uid=p=>p+(++seq);
const models={energy:{name:'储能本体',version:'1.0.0',dirty:false,
 objects:[
  {id:'sys',name:'储能系统',desc:'由储能设备及配套设施构成，作为整体提供能量存储与释放能力。'},
  {id:'dev',name:'储能设备',desc:'由一个或多个储能簇构成、可独立管理的储能设备。'},
  {id:'cluster',name:'储能簇',desc:'由电池模组组成、具有独立监测边界的电池集合。'}],
 properties:[
  {id:'cname',owner:'cluster',name:'名称',desc:'用于辨识和展示储能簇的业务名称。',type:'文本',shape:'scalar',display:true},
  {id:'rated',owner:'cluster',name:'额定功率',desc:'额定条件下允许持续输出或吸收的功率。',type:'数值',shape:'scalar',unit:'kW'},
  {id:'soc',owner:'cluster',name:'实时SOC',desc:'储能簇最新观测的荷电状态，按 0～100 百分数表达。',type:'数值',shape:'scalar',unit:'%'},
  {id:'hist',owner:'cluster',name:'SOC采样序列',desc:'储能簇在不同采集时刻的荷电状态记录。',type:'数值',shape:'timeSeries',unit:'%'},
  {id:'devname',owner:'dev',name:'名称',desc:'储能设备的业务名称。',type:'文本',shape:'scalar'}],
 links:[
  {id:'l1',from:'cluster',to:'dev',name:'所属设备',reverse:'包含储能簇',cardinality:'多对一'},
  {id:'l2',from:'dev',to:'sys',name:'所属系统',reverse:'包含储能设备',cardinality:'多对一'}],
 contracts:[{id:'c1',owner:'cluster',name:'查询储能簇实时SOC',desc:'获取指定储能簇最新的荷电状态。',inputs:[{n:'储能簇',t:'object'}],outputs:[{n:'储能SOC',t:'属性 · 实时SOC'}],convention:'无有效观测值时返回不可用，不能用 0 冒充有效 SOC。',status:'active'}],
 library:[{id:'s1',name:'资产名称',desc:'资产在业务界面中的显示名称。',type:'文本',shape:'scalar',used:2},
          {id:'s2',name:'SOC',desc:'当前剩余电量与参考容量的比值（0~100）。',type:'数值',shape:'scalar',unit:'%',used:1}]}};
const releases={energy:{'1.0.0':{at:'09-10 16:02',note:'初始版本：对象、属性与链接定义',kind:'初始'}}};
const projects={park:{name:'创智园二期',model:'energy',version:'1.0.0',dirty:false,released:'v1',
 bindings:{cluster:{enabled:true,conn:'db',table:'m_storage_cluster_phase',pk:'id',props:{
   cname:{kind:'db',conn:'db',table:'m_storage_cluster_phase',field:'name'},
   rated:{kind:'db',conn:'db',table:'m_storage_cluster_phase',field:'rated_power'},

function edit(kind,draft,isNew=false,id=''){ui.editor={kind,draft:cp(draft),original:JSON.stringify(draft),isNew,id:id||draft.id};ui.leave=null;ui.error='';ui.query='';ui.step=0;render()}

const newMap=p=>({kind:'db',conn:'db',table:project().bindings[ui.object]?.table||'',field:'',idField:'object_id',filters:[],time:'',param:'实例主键',selection:'零或一条',key:'m_storage_cluster-{id}-soc',conv:p.type,impl:''});
function mapValid(final=false){const d=ui.editor.draft,p=eff(props().find(x=>x.id===ui.editor.id));
 if(!d.conn&&d.kind!=='computed')return '请选择数据连接。';if(d.kind==='db'&&!d.table)return '请选择来源表。';
 if(d.kind==='redis'&&p.shape==='timeSeries')return '普通 Redis 标量读取不能返回时间序列。';
 if(d.kind==='computed'&&!d.impl)return '请选择一个已有项目实现。';
 if(ui.step>=1||final){if(d.kind==='db'&&d.table!==project().bindings[ui.object]?.table&&!d.idField)return '请绑定当前实例的匹配字段。';if(d.kind==='redis'&&(!d.key||!d.key.includes('{id}')))return '请使用包含 {id} 的 Key 模板。'}
 if(final&&d.kind==='db'&&!d.field)return '请选择值字段。';if(final&&p.shape==='timeSeries'&&!d.time)return '请选择时间字段。';return ''}
document.getElementById('app').addEventListener('click',ev=>{const el=ev.target.closest('[data-do]');if(!el)return;const a=el.dataset.do,v=el.dataset.value;const e=ui.editor,d=e?.draft;

 if(e&&['nav','space','object','cancel','graph-object','tab'].includes(a)&&JSON.stringify(d)!==e.original){ui.leave={action:a,value:v};render();return}
 if(a==='nav'){navigate(v);return}

 if(a==='object'||a==='graph-object'){ui.object=v;ui.editor=null;ui.tab=ui.space==='model'?'properties':'identity';if(a==='graph-object')ui.mode='list';render();return}
 if(a==='tab'){ui.tab=v;render();return}

 if(a==='add-property'){edit('property',{id:uid('p-'),owner:ui.object,name:'',desc:'',type:'数值',shape:'scalar'},true);return}

 if(a==='save-property'||a==='save-shared'){if(!d.name.trim()||!d.desc.trim()){ui.error='请填写名称和业务定义。';render();return}const list=a==='save-shared'?model().library:model().properties;if(e.isNew)list.push(cp(d));else Object.assign(list.find(x=>x.id===d.id),d);if(d.display)model().properties.forEach(o=>{if(o.owner===d.owner&&o.id!==d.id)o.display=false});saveEditor();return}
 if(a==='pick-library'){edit('library',{});return}
 if(a==='copy-property'||a==='ref-property'){const s=model().library.find(x=>x.id===v);const q={...cp(s),id:uid('p-'),owner:ui.object};if(a==='ref-property')q.shared=v;model().properties.push(q);saveEditor();return}
 if(a==='add-shared'){edit('shared',{id:uid('s-'),name:'',desc:'',type:'数值',shape:'scalar'},true);return}

 if(a==='detach'){delete d.shared;render();return}
 if(a==='usages'){toast('引用于：储能簇 / SOC、储能设备 / 名称','');return}
 if(a==='add-link'||a==='edit-link'){edit('link',a==='add-link'?{id:uid('l-'),from:ui.object,to:objs().find(o=>o.id!==ui.object)?.id,name:'',reverse:'',cardinality:'多对一'}:ctx().links.find(l=>l.id===v),a==='add-link');return}
 if(a==='save-link'){if(!d.name.trim()){ui.error='请填写正向名称。';render();return}if(e.isNew)model().links.push(cp(d));else Object.assign(model().links.find(l=>l.id===d.id),d);saveEditor();return}
 if(a==='enable-object'){project().bindings[ui.object]={enabled:true,props:{}};touch();ui.tab='identity';edit('identity',{conn:'db',table:'m_storage_cluster_phase',pk:'id'});return}
 if(a==='edit-identity'){edit('identity',{conn:project().bindings[ui.object].conn,table:project().bindings[ui.object].table,pk:project().bindings[ui.object].pk});return}

 if(a==='source-kind'){const f=newMap(eff(props().find(x=>x.id===e.id)));f.kind=v;f.conn=v==='redis'?'redis':'db';e.draft=f;ui.error='';render();return}
 if(a==='use-identity'){d.table=project().bindings[ui.object].table;d.filters=[];d.field='';ui.query='';render();return}
 if(a==='use-sample'){d.table='telemetry_sample';d.idField='object_id';d.filters=[{field:'object_type',value:'storage_cluster'},{field:'metric_code',value:'soc'}];d.field='';d.time='';ui.query='';render();return}

 if(a==='save-mapping'){ui.error=mapValid(true);if(ui.error){render();return}project().bindings[ui.object].props[e.id]=cp(d);saveEditor();return}
 if(a==='map-link'){const l=ctx().links.find(l=>l.id===v);edit('map-link',{...l,...(project().linkMap?.[v]||{fromField:'storage_id',toField:'id'})},false,v);return}

 if(a==='add-contract'||a==='edit-contract'){edit('contract',a==='add-contract'?{id:uid('c-'),owner:ui.object,name:'',desc:'',inputs:[{n:'储能簇',t:'object'}],outputs:[{n:'储能SOC',t:'属性'}],convention:''}:model().contracts.find(c=>c.id===v),a==='add-contract');return}

 if(a==='add-input'){d.inputs=d.inputs||[];d.inputs.push({n:'',t:'base'});render();return}
 if(a==='rm-input'){d.inputs.splice(+v,1);render();return}
 if(a==='add-output'){d.outputs=d.outputs||[];d.outputs.push({n:'',t:'base'});render();return}
 if(a==='rm-output'){d.outputs.splice(+v,1);render();return}
 if(a==='edit-impl'){edit('impl',project().impls[v]||{rule:''},false,v);return}
 if(a==='save-impl'){if(!d.rule?.trim()){ui.error='请说明项目的处理规则。';render();return}project().impls[e.id]=cp(d);saveEditor();return}
 if(a==='add-connection'||a==='edit-connection'){edit('connection',a==='add-connection'?{id:uid('conn-'),name:'',engine:'MySQL',host:'',port:'3306',database:'',user:''}:cp(project().connections.find(c=>c.id===v)),a==='add-connection');return}
 if(a==='save-connection'){if(!d.name.trim()||!d.host.trim()||!d.database.trim()){ui.error='请填写连接名称、主机和数据库／DB 索引。';render();return}if(e.isNew)project().connections.push(cp(d));else Object.assign(project().connections.find(c=>c.id===d.id),d);saveEditor();return}
 if(a==='test'){const c=project().connections.find(c=>c.id===v);c.test='testing';render();setTimeout(()=>{c.test='ok';c.ms=30+Math.round(Math.random()*40);toast(`「${c.name}」连接成功（${c.ms}ms，模拟）`);render()},700);return}
 if(a==='test-in-editor'){toast('模拟连接测试成功；正式页走真实探测','ok');return}

 if(a==='add-param'){d['']='';render();return}

 if(a==='new-context'){edit('context',{name:''},true);return}
 if(a==='save-context'){if(!d.name.trim()){ui.error='请填写名称。';render();return}const id=uid('m-');if(ui.space==='model'){models[id]={name:d.name,version:null,dirty:false,objects:[],properties:[],links:[],contracts:[],library:[]};releases[id]={};ui.model=id}else{projects[id]={name:d.name,model:'energy',version:null,dirty:false,bindings:{},linkMap:{},connections:[],impls:{},parameters:{timezone:'Asia/Shanghai',siteCode:''}};ui.project=id}ui.editor=null;navigate('home');return}
