<script>
(()=>{
const root=document.getElementById('ow-iteration');
const cp=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const models={energy:cp(initial),pv:{name:'光伏本体',version:null,dirty:false,objects:[],properties:[],links:[],contracts:[],library:[]}};
const releases={energy:{'1.0.0':cp(initial)},pv:{}};
const projects={park:{name:'创智园二期',model:'energy',version:'1.0.0',dirty:false,released:'v1',bindings:{cluster:{enabled:true,connection:'db',table:'m_storage_cluster_phase',pk:'id',props:{name:{kind:'db',conn:'db',table:'m_storage_cluster_phase',field:'name',match:'identity'},rated:{kind:'db',conn:'db',table:'m_storage_cluster_phase',field:'rated_power',match:'identity'},capacity:{kind:'db',conn:'db',table:'m_storage_cluster_phase',field:'capacity',match:'identity'},soc:{kind:'redis',conn:'redis',key:'m_storage_cluster-{id}-soc',param:'实例主键',conversion:'数值'}}}},connections:[{id:'db',name:'业务数据库',engine:'MySQL',host:'127.0.0.1',database:'energy',port:'3306',test:false},{id:'redis',name:'实时数据缓存',engine:'Redis',host:'127.0.0.1',database:'0',port:'6379',test:false}],implementations:{},parameters:{timezone:'Asia/Shanghai',siteCode:'CZY-02'}}};
const catalogs={m_storage_cluster_phase:['id','name','company','storage_id','rated_power','capacity','asset_code'],telemetry_sample:['object_id','object_type','metric_code','sampled_at','value'],cluster_sample_wide:['cluster_id','sampled_at','soc','power'],m_storage_phase:['id','name','system_id'],m_storage_system:['id','name'],cluster_ext:['cluster_id','company','asset_code']};
const ui={space:'model',model:'energy',project:'park',page:'objects',object:'cluster',tab:'properties',mode:'list',editor:null,step:0,toast:'',error:'',query:'',review:false};
const design={guidance:true,density:'舒适'};
const model=()=>models[ui.model],project=()=>projects[ui.project],ref=()=>releases[project()?.model]?.[project()?.version],ctx=()=>ui.space==='model'?model():ref();
const object=()=>ctx()?.objects.find(o=>o.id===ui.object);

const prop=id=>ctx()?.properties.find(p=>p.id===id);
const effective=(p,m=ctx())=>p.shared?({...p,...m.library.find(s=>s.id===p.shared),id:p.id,owner:p.owner,shared:p.shared}):p;
const objs=()=>ctx()?.objects||[];
const props=()=>ctx()?.properties.filter(p=>p.owner===ui.object)||[];
const title=(id,m=ctx())=>m?.objects.find(o=>o.id===id)?.name||id;
const shape=p=>p.shape==='timeSeries'?'时间序列':'单值';
const touch=()=>{(ui.space==='model'?model():project()).dirty=true;ui.review=false};
const btn=(label,action,value='',cls='')=>`<button type="button" class="${cls}" data-do="${action}" data-value="${esc(value)}">${label}</button>`;
const options=(arr,value)=>arr.map(x=>{const a=typeof x==='string'?{value:x,label:x}:x;return `<option value="${esc(a.value)}" ${String(value)===String(a.value)?'selected':''}>${esc(a.label)}</option>`}).join('');
const select=(key,arr,value)=>{const available=arr.some(x=>String(typeof x==='string'?x:x.value)===String(value));return `<select data-field="${key}">${options(available?arr:[{value:'',label:'请选择'},...arr],value)}</select>`};
const input=(key,val,placeholder='')=>`<input data-field="${key}" value="${esc(val)}" placeholder="${esc(placeholder)}">`;
const textarea=(key,val,placeholder='')=>`<textarea data-field="${key}" placeholder="${esc(placeholder)}">${esc(val)}</textarea>`;
const field=(label,control,hint='',full=false)=>`<label class="${full?'full':''}"><span>${label}</span>${control}${hint?`<small class="hint">${hint}</small>`:''}</label>`;
const tag=t=>`<span class="tag">${esc(t)}</span>`;
const note=t=>`<div class="note">${t}</div>`;
const footer=(action,label='保存到草稿')=>`<div class="footer">${btn(label,action,'','primary')}${btn('取消','cancel')}<small>只影响当前${ui.space==='model'?'本体':'项目'}草稿</small></div>`;

function navigate(page){ui.page=page;ui.editor=null;ui.query='';ui.error='';ui.review=false;render()}
function side(){const list=ui.space==='model'?[['home','工作概览','layout-dashboard'],['objects','对象建模','shapes'],['contracts','计算契约','braces'],['library','共享属性库','library'],['release','校验与发布','git-branch']]:[['home','项目概览','layout-dashboard'],['connections','数据连接','database'],['objects','对象映射','workflow'],['contracts','计算实现','braces'],['release','校验与发布','git-branch']];return `<aside class="rail"><label><small>当前${ui.space==='model'?'本体':'项目'}</small><select data-context="${ui.space}">${options(Object.entries(ui.space==='model'?models:projects).map(([k,v])=>({value:k,label:v.name})),ui.space==='model'?ui.model:ui.project)}</select></label><nav aria-label="${ui.space==='model'?'本体建设':'项目映射'}导航">${list.map(([k,n,i])=>btn(`<i data-lucide="${i}" aria-hidden="true"></i>${n}`,'nav',k,ui.page===k?'active':'')).join('')}</nav><div class="secondary-nav">${btn('＋ 新建'+(ui.space==='model'?'本体':'项目'),'new-context')}<small>${ui.space==='model'?'业务专家 · 维护通用定义':'开发／实施 · 维护项目来源'}</small></div></aside>`}

function render(){const c=ui.space==='model'?model():project();const page=ui.space==='project'?({objects:'对象映射',contracts:'计算实现',home:'项目概览'}[ui.page]||pageNames[ui.page]):pageNames[ui.page];root.innerHTML=`<div class="${design.guidance?'':'guide-off'}"><header class="topbar"><div class="brand"><span class="brand-symbol">◇</span>本体工作台</div><div class="space-tabs" aria-label="工作空间">${btn('本体建设','space','model',ui.space==='model'?'active':'')}${btn('项目映射','space','project',ui.space==='project'?'active':'')}</div><span class="proto">交互原型 · 示例数据 · 刷新重置</span></header><div class="app">${side()}<section class="main"><header class="pagehead"><div><div class="crumb">${esc(c.name)} / ${ui.space==='model'?'抽象定义':'项目配置'} ${ui.space==='project'&&project().version?'· 引用 '+esc(models[project().model].name)+' '+esc(project().version):''}</div><h1>${page||'工作台'}</h1></div><div class="toolbar"><span class="saved">${ui.editor?'正在编辑表单':c.dirty?'● 草稿有修改':'草稿已保存'}</span>${btn('保存草稿','save-all')}${btn('校验与发布','nav','release',ui.page==='release'?'':'primary')}</div></header>${ui.toast?`<div class="toast" role="status">${esc(ui.toast)}${btn('×','dismiss')}</div>`:''}<main class="content">${ui.editor?editorView():pageView()}</main></section></div></div>`;root.style.setProperty('--ow-pad',design.density==='紧凑'?'15px':'22px');if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}})}
function pageView(){if(ui.page==='home')return home();if(ui.page==='objects')return objectWorkspace();if(ui.page==='contracts')return contractsView();if(ui.page==='library')return libraryView();if(ui.page==='connections')return connectionsView();if(ui.page==='upgrade')return upgradeView();if(ui.page==='release')return releaseView();return ''}
function home(){if(ui.space==='model'){const m=model();return `<section class="panel"><div class="rowhead"><div><h2>从一个对象开始，把业务讲清楚</h2><small>对象、属性与链接在同一个工作区维护；计算契约按需补充。</small></div>${tag('业务专家')}</div><div class="checks">${[['定义对象与属性',`${m.objects.length} 个对象 · ${m.properties.length} 个属性`,'objects','继续建模'],['定义计算契约',`${m.contracts.length} 个契约 · 约定输入与输出`,'contracts','查看契约'],['校验并发布本体','形成可供多个项目引用的固定版本','release','查看发布']].map(([t,d,p,a],i)=>`<div class="checkrow"><div><strong><span class="num">${i+1}</span>${t}</strong><small>${d}</small></div>${btn(a,'nav',p,i===0?'primary':'')}</div>`).join('')}</div></section><section class="panel"><div class="rowhead"><div><h3>定义完成后，交给具体项目</h3><small>表名、Redis Key 和函数实现，都在项目映射区维护。</small></div>${btn('进入项目映射 →','space','project')}</div><div class="readonly">${esc(m.name)} ${m.version||'尚未发布'} → 创智园二期 · 固定引用发布版本</div></section>`}const p=project(),r=ref(),errs=projectErrors();return `<section class="panel"><div class="rowhead"><div><h2>${esc(p.name)}</h2><small>${r?'引用 '+esc(r.name)+' '+p.version:'先绑定已发布本体，也可以先配置连接。'}</small></div>${btn(r?'管理引用版本':'绑定本体版本','nav','upgrade')}</div><div class="checks">${[['连接数据源',`${p.connections.length} 个连接 · 供所有对象映射复用`,'connections','配置连接'],['映射业务对象',r?'当前启用 '+Object.values(p.bindings).filter(b=>b.enabled).length+' 个对象':'绑定本体后可选择对象','objects','继续映射'],['检查并发布项目配置',errs.length?errs.length+' 个配置项待处理':'配置项已齐全，尚未执行验证','release','检查问题']].map(([t,d,page,a],i)=>`<div class="checkrow"><div><strong><span class="num">${i+1}</span>${t}</strong><small>${d}</small></div>${btn(a,'nav',page,page==='objects'?'primary':'')}</div>`).join('')}</div></section>${r?`<section class="panel"><div class="rowhead"><div><h3>继续配置：储能簇</h3><small>从公共采样表映射 SOC 的时间和值。</small></div>${btn('配置 SOC 采样序列','quick-history','','primary')}</div></section>`:''}<section class="panel"><h3>项目参数</h3><div class="formgrid"><div><small>时间数据默认时区</small><p>${esc(p.parameters.timezone)}</p></div><div><small>站点编码</small><p>${esc(p.parameters.siteCode||'未填写')}</p></div></div>${btn('维护参数','parameters')}</section>`}
function objectWorkspace(){if(!ctx())return `<section class="panel empty"><h2>先选择要使用的本体版本</h2><p>项目连接可提前配置；对象映射需要一份已发布的本体。</p>${btn('选择本体版本','nav','upgrade','primary')}</section>`;if(!objs().length)return `<section class="panel empty"><h2>从第一个对象开始</h2><p>只需名称和业务定义，随后在对象内补充属性与链接。</p>${btn('＋ 新建对象','add-object','','primary')}</section>`;if(!object())ui.object=objs()[0].id;const o=object(),b=ui.space==='project'?binding():null;
return `<div class="rowhead"><div class="toolbar">${ui.space==='model'?btn('对象列表','mode','list',ui.mode==='list'?'primary':'')+btn('关系画布','mode','graph',ui.mode==='graph'?'primary':''):'<small>先选对象，再配置身份、属性与链接。</small>'}</div>${ui.space==='model'?btn('＋ 新建对象','add-object'):''}</div>${ui.mode==='graph'&&ui.space==='model'?graphView():`<div class="split"><aside class="directory"><div class="dirlabel"><small>对象类型 · ${objs().length}</small></div>${objs().map(x=>btn(`${esc(x.name)}<small>${ui.space==='model'?ctx().properties.filter(p=>p.owner===x.id).length+' 个属性':project().bindings[x.id]?.enabled?'已启用映射':'尚未启用'}</small>`,'object',x.id,x.id===ui.object?'active':'')).join('')}</aside><section class="panel"><div class="rowhead"><div><h2>${esc(o.name)}</h2><small>${esc(o.desc)}</small></div>${ui.space==='model'?btn('编辑定义','edit-object'):tag(b?.enabled?'项目映射':'未启用')}</div>${ui.space==='project'&&!b?.enabled?`<div class="empty"><h3>这个项目需要使用${esc(o.name)}吗？</h3><p>按实际范围启用，无需映射本体中的所有对象。</p>${btn('启用并配置身份来源','enable-object','','primary')}</div>`:`<div class="tabs">${(ui.space==='model'?[['properties','属性'],['links','链接'],['capabilities','计算契约']]:[['identity','实例识别'],['properties','属性取值'],['links','链接映射']]).map(([k,n])=>btn(n,'tab',k,ui.tab===k?'active':'')).join('')}</div>${ui.tab==='identity'&&ui.space==='project'?identityView():ui.tab==='links'?linksView():ui.tab==='capabilities'?contractsList(ui.object):propertiesView()}`}</section></div>`}`}
function graphView(){const node=id=>btn(`<strong>${esc(title(id))}</strong><small class="hint">${ctx().properties.filter(p=>p.owner===id).length} 个属性 · 打开维护 →</small>`,'graph-object',id,'graph-node');return `<section class="panel"><div class="rowhead"><h2>对象与业务链接</h2><small>点击对象进入维护 · 属性保留在对象内</small></div><div class="flow">${ctx().links.map(l=>`<div class="graph">${node(l.from)}<div class="graph-edge">${esc(l.name)} ↓</div>${node(l.to)}</div>`).join('')}${ctx().objects.filter(o=>!ctx().links.some(l=>l.from===o.id||l.to===o.id)).map(o=>`<div class="graph">${node(o.id)}</div>`).join('')}</div></section>`}
function propertiesView(){const ps=props();return `<div class="rowhead"><small>${ui.space==='model'?'定义属性的含义与结果形态':'每个属性配置一种生效来源'}</small>${ui.space==='model'?`<div class="toolbar">${btn('从属性库添加','pick-library')}${btn('＋ 新增属性','add-property','','primary')}</div>`:''}</div>${ps.length?`<div class="tablewrap"><table class="table"><thead><tr><th>属性</th><th>${ui.space==='model'?'类型／形态':'来源'}</th><th>${ui.space==='model'?'复用方式':'状态'}</th><th></th></tr></thead><tbody>${ps.map(raw=>{const p=effective(raw),v=binding()?.props?.[p.id];return `<tr><td><strong>${esc(p.name)}</strong>${p.display?' <small>显示名称</small>':''}<small>${ui.space==='project'?p.type+' · '+shape(p):p.unit?'单位 '+esc(p.unit):''}</small></td><td>${ui.space==='model'?esc(p.type)+'<small>'+shape(p)+'</small>':v?sourceSummary(v):'<span class="muted">尚未配置</span>'}</td><td>${ui.space==='model'?raw.shared?'共享引用':raw.template?'模板副本':'对象私有':v?'<span class="ok">已配置</span>':'<span class="warn">待配置</span>'}</td><td>${btn(ui.space==='model'?'编辑':v?'修改':'配置',ui.space==='model'?'edit-property':'map-property',p.id)}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><h3>给${esc(object().name)}添加第一个属性</h3><p>例如名称、额定功率或 SOC。</p>${ui.space==='model'?btn('＋ 新增属性','add-property','','primary'):''}</div>`}${ui.space==='project'?'<small class="hint">配置将保存在当前项目，本体中的属性定义保持独立。</small>':''}`}
function sourceSummary(v){if(v.kind==='db')return `数据库<small class="code">${esc(v.table)} · ${esc(v.field)}${v.time?' + '+esc(v.time):''}</small>`;if(v.kind==='redis')return `Redis<small class="code">${esc(v.key)}</small>`;return `函数结果<small>${esc(v.implementation||'待选实现')}</small>`}
function identityView(){const b=binding();return `<div class="rowhead"><div><h3>如何识别一个${esc(object().name)}实例</h3><small>这里只决定有哪些实例，属性可以来自其他表或 Redis。</small></div>${btn(b.table?'修改':'配置','edit-identity','','primary')}</div><div class="formgrid"><div><small>来源表</small><div class="readonly code">${esc(b.table||'未配置')}</div></div><div><small>实例主键</small><div class="readonly code">${esc(b.pk||'未配置')}</div></div></div><details><summary>已登记补充来源（可选）</summary><p class="hint">用于复用关联路径或配置对象链接。属性直接选择其他表时，无需先在这里登记。</p>${b.extra?`<div class="readonly">${esc(b.extra.table)} · ${esc(b.extra.left)} = ${esc(b.extra.right)}</div>`:''}${btn('登记补充表','add-source')}</details><div class="footer">${btn('继续配置属性取值 →','tab','properties','primary')}</div>`}
function linksView(){const ls=ctx().links.filter(l=>l.from===ui.object||l.to===ui.object);return `<div class="rowhead"><small>${ui.space==='model'?'一份链接定义，正反两个阅读方向':'从两端对象已配置的表选择字段'}</small>${ui.space==='model'?btn('＋ 新增链接','add-link'):''}</div>${ls.map(l=>`<div class="checkrow"><div><strong>${esc(title(l.from))} → ${esc(l.name)} → ${esc(title(l.to))}</strong><small>${esc(l.cardinality)}${l.reverse?' · 反向：'+esc(l.reverse):''}${ui.space==='project'?' · '+(project().linkMap?.[l.id]?'已配置':'未配置（按需）'):''}</small></div>${btn(ui.space==='model'?'编辑':'配置',ui.space==='model'?'edit-link':'map-link',l.id)}</div>`).join('')||'<div class="empty">暂无与此对象关联的链接。</div>'}`}
function contractsList(owner){const cs=ctx()?.contracts.filter(c=>!owner||c.owner===owner)||[];return cs.map(c=>`<div class="checkrow"><div><strong>${esc(c.name)}</strong><small>${esc(c.input)} → ${esc(effective(ctx().properties.find(p=>p.id===c.output)||{name:'未选输出'}).name)}</small></div>${btn(ui.space==='model'?'查看与编辑':project().implementations[c.id]?'维护实现':'配置实现',ui.space==='model'?'edit-contract':'implement',c.id)}</div>`).join('')||`<div class="empty"><h3>按业务需要定义计算能力</h3><p>直接读取一个字段不要求先创建计算契约。</p>${ui.space==='model'?btn('新建计算契约','add-contract'):''}</div>`}
function contractsView(){return `<section class="panel"><div class="rowhead"><div><h2>${ui.space==='model'?'约定需要什么输入、返回什么结果':'让通用契约在当前项目中实现'}</h2><small>${ui.space==='model'?'定义业务能力，具体取值规则在项目中维护。':'参数从哪里取、Redis 或数据库怎么查，在实现内填写。'}</small></div>${ui.space==='model'?btn('＋ 新建契约','add-contract','','primary'):''}</div>${contractsList()}</section>`}
function libraryView(pick=false){return `<section class="panel"><div class="rowhead"><div><h2>${pick?'为'+esc(object().name)+'添加属性':'共享属性库'}</h2><small>复制后独立维护；引用时沿用共享定义。</small></div>${pick?btn('返回对象','cancel'):btn('＋ 新建共享属性','add-shared')}</div>${model().library.map(p=>`<div class="checkrow"><div><strong>${esc(p.name)}</strong><small>${esc(p.type)} · ${shape(p)}${p.unit?' · '+esc(p.unit):''}</small><small>${esc(p.desc)}</small></div><div class="toolbar">${pick?btn('复制为私有','copy-property',p.id)+btn('引用共享','ref-property',p.id):btn('维护定义','edit-shared',p.id)+btn('查看引用','usages',p.id)}</div></div>`).join('')||'<div class="empty">尚无共享属性，可先在对象中建立私有属性。</div>'}</section>`}
function connectionsView(){return `<section class="panel"><div class="rowhead"><div><h2>项目数据连接</h2><small>连接统一配置，供属性、实例识别和计算实现选用。</small></div>${btn('＋ 新建连接','add-connection','','primary')}</div>${project().connections.map(c=>`<div class="checkrow"><div><strong>${esc(c.name)}</strong> ${tag(c.engine)}<small>${esc(c.host)}:${esc(c.port)} · ${esc(c.database)}</small><small class="${c.test?'ok':'muted'}">${c.test?'模拟测试成功 · 示例目录就绪':'示例连接 · 未测试'}</small></div><div class="toolbar">${btn('测试（模拟）','test',c.id)}${btn('配置','edit-connection',c.id)}</div></div>`).join('')||'<div class="empty">添加第一个连接后，映射页即可下拉选择。</div>'}<details><summary>表结构目录</summary><small class="hint">此原型使用示例目录，正式功能从连接读取并支持搜索。</small>${Object.keys(catalogs).map(t=>`<div class="checkrow"><span class="code">${t}</span><small>${catalogs[t].length} 个字段</small></div>`).join('')}</details></section>`}
function modelErrors(m=model()){return [...m.objects.filter(o=>!o.name.trim()||!o.desc.trim()).map(o=>({text:'对象名称或业务定义未完成',object:o.id})),...m.properties.filter(p=>!effective(p,m).name?.trim()||!effective(p,m).desc?.trim()).map(p=>({text:(p.name||'新属性')+'缺少名称或业务定义',object:p.owner,property:p.id}))]}
function projectErrors(){const p=project(),r=ref();if(!r)return [{text:'尚未引用本体版本',page:'upgrade'}];let out=[];for(const [id,b] of Object.entries(p.bindings)){if(!b.enabled)continue;if(!b.table||!b.pk)out.push({text:title(id,r)+'：尚未配置实例识别',object:id,tab:'identity'});for(const pr of r.properties.filter(x=>x.owner===id)){if(!b.props?.[pr.id]&&!b.excluded?.includes(pr.id))out.push({text:title(id,r)+' / '+effective(pr,r).name+'：尚未配置来源',object:id,property:pr.id})}}return out}
function releaseView(){const isModel=ui.space==='model',errors=isModel?modelErrors():projectErrors(),c=isModel?model():project();return `<section class="panel"><div class="rowhead"><div><h2>检查${isModel?'本体定义':'项目配置'}</h2><small>${isModel?'只检查通用定义，不要求配置数据库。':'只检查当前启用的对象与属性，不要求实现全部本体。'}</small></div>${tag(errors.length?errors.length+' 项待处理':'配置项齐全')}</div>${errors.map((e,i)=>`<div class="checkrow"><div><span class="warn">待处理</span>　${esc(e.text)}</div>${btn('去处理 →','issue',i)}</div>`).join('')||`<div class="note">${isModel?'示例定义完整，可继续预览发布。':'示例配置项已填写，未执行真实业务数据验证。'}</div>`}${!isModel&&ref()?`<details><summary>本项目属性使用范围</summary><small class="hint">暂不使用的属性可以明确排除，后续随时启用。</small>${Object.entries(c.bindings).filter(([,b])=>b.enabled).map(([id,b])=>ref().properties.filter(p=>p.owner===id).map(p=>`<label class="checkbox field"><input type="checkbox" data-include="${p.id}" data-owner="${id}" ${!b.excluded?.includes(p.id)?'checked':''}>${esc(title(id))} · ${esc(effective(p).name)}</label>`).join('')).join('')}</details>`:''}</section><section class="panel"><div class="rowhead"><div><h3>发布${isModel?'本体版本':'项目配置快照'}</h3><small>${isModel?'发布后可被多个项目固定引用；项目主动升级。':'保存可追溯的配置版本，发布不代表已运行。'}</small></div></div>${errors.length?'<p class="muted">先处理上方问题，再发布当前草稿。</p>':`<label class="field"><span>变更说明</span><textarea id="ow-release-note" placeholder="本次调整了什么，例如补充 SOC 采样序列映射"></textarea></label>${isModel?`<label class="field"><span>示例变更类型</span><select id="ow-release-kind"><option value="minor">兼容补充 · 次版本</option><option value="major">类型／口径变化 · 主版本</option></select><small>原型演示选择；正式系统根据差异提出分类并校验。</small></label>`:''}${btn('确认发布（原型演示）','publish','','primary')}`}</section><section class="panel"><h3>已发布版本</h3><div class="checkrow"><strong>${isModel?c.version||'暂无版本':c.released||'暂无快照'}</strong><small>${isModel?'项目固定引用，不跟随草稿':'仅保存本次原型中的状态'}</small></div>${isModel?btn('在项目中使用此本体 →','space','project'):btn('管理引用的本体版本 →','nav','upgrade')}</section>`}
function upgradeView(){const p=project();return `<section class="panel"><h2>${p.version?'管理引用版本':'绑定本体版本'}</h2><p class="hint">先看变化，再决定是否切换项目草稿；已发布项目快照保持不变。</p><form id="ow-upgrade"><div class="formgrid">${field('本体',`<select name="model">${options(Object.entries(models).filter(([id])=>Object.keys(releases[id]).length).map(([id,m])=>({value:id,label:m.name})),p.model)}</select>`)}${field('目标版本',`<select name="version">${options(Object.keys(releases[p.model]||{}).reverse(),models[p.model]?.version)}</select>`)}</div>${p.version?`<div class="readonly">当前固定引用：${esc(models[p.model].name)} ${esc(p.version)}</div>`:note('尚未绑定本体。只有发布过的版本可以被项目引用。')}<div class="footer">${btn('比较版本与配置影响','compare','','primary')}${btn('返回项目概览','nav','home')}</div><div id="ow-compare"></div></form></section>`}
