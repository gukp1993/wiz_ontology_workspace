<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动作接口映射 · 交互原型 V1</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f4f7fb;color:#23384e;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;padding:8px 14px;border:1px solid #d5dfec;border-radius:6px;background:white}button:hover{background:#eff4ff}button.primary{background:#2858e8;border-color:#2858e8;color:white}button.link{color:#2858e8;border:0;background:none;padding:4px 8px}button:focus-visible,input:focus,select:focus,textarea:focus{outline:2px solid #99b5ff;outline-offset:2px}input,select,textarea{width:100%;border:1px solid #cbd7e7;border-radius:6px;background:white;padding:10px}textarea{resize:vertical;line-height:1.7}aside{position:fixed;inset:0 auto 0 0;width:205px;background:#172d41;color:#e0e9f3;padding:25px 16px}.brand{font-size:20px;font-weight:700;margin-bottom:27px}aside small{color:#aabed0}aside button{width:100%;background:none;border:0;color:#dce7f1;text-align:left;margin:6px 0}aside button.active,aside button:hover{background:#29465f;color:white}.workspace{margin-left:205px}header{padding:21px 30px;background:white;border-bottom:1px solid #dce4ee}h1{font-size:23px;margin:3px 0}h2{font-size:19px;margin:0}h3{font-size:15px;margin:0}small,.muted{color:#72839a}main{padding:24px 30px}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px}.card{background:white;border:1px solid #dce4ee;border-radius:9px;padding:22px}.objects button{display:block;width:100%;text-align:left;margin-top:13px}.objects button.active{color:#2858e8;background:#eef4ff;border-color:#86a3f4}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.tabs{display:flex;border-bottom:1px solid #dae3ee;margin:20px 0}.tabs button{border:0;border-radius:0;border-bottom:3px solid transparent;background:none}.tabs button.active{color:#2858e8;border-bottom-color:#2858e8}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%}td,th{padding:14px 10px;border-bottom:1px solid #e4eaf2;text-align:left;vertical-align:top}th{background:#f7f9fc;color:#6b7d93;font-weight:500}td small{display:block;margin-top:6px}.note{font-size:12px;color:#73869c;margin:12px 0}.empty{text-align:center;padding:35px;color:#77899d}.badge{font-size:12px;background:#eef3fc;padding:4px 9px;border-radius:6px}.banner{background:#f0f5ff;border:1px solid #dbe6fc;padding:13px 16px;border-radius:7px;color:#546c8d;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}label.field{display:block;margin-top:14px}label.field>input,label.field>select,label.field>textarea{margin-top:7px}.required{color:#b93636}.section{border-top:1px solid #e0e7f0;padding-top:23px;margin-top:25px}details{border:1px solid #dce4ee;border-radius:7px;padding:14px 17px;margin-top:23px}summary{cursor:pointer}dialog{padding:0;border:1px solid #d8e2ed;border-radius:12px;width:min(1160px,95vw);max-height:92vh;color:#23384e}dialog::backdrop{background:#152b4166}.modalhead{position:sticky;top:0;z-index:3;background:white;padding:20px 25px;border-bottom:1px solid #dce4ee;display:flex;justify-content:space-between;align-items:center}.modalbody{padding:0 25px 22px}.modalfoot{position:sticky;bottom:0;z-index:3;background:white;border-top:1px solid #dce4ee;padding:15px 25px;display:flex;justify-content:flex-end;gap:10px}.paramtable{min-width:890px}.paramtable th:nth-child(1){width:16%}.paramtable th:nth-child(2){width:14%}.paramtable th:nth-child(3){width:21%}.paramtable th:nth-child(4){width:24%}.paramtable th:nth-child(5){width:16%}.paramtable input,.paramtable select{padding:8px;min-height:40px}.paramtable td{padding:10px 6px}.error{color:#b62b35;white-space:pre-line}.request{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8fc;border:1px solid #dfe7f1;padding:18px;border-radius:7px;font:13px/1.8 ui-monospace,SFMono-Regular,monospace;max-height:340px;overflow:auto}.toast{position:fixed;bottom:25px;right:25px;background:#1c3d56;color:white;border-radius:7px;padding:12px 20px;z-index:20}button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:900px){aside{width:160px}.workspace{margin-left:160px}.layout{grid-template-columns:160px 1fr}main{padding:16px}}@media(max-width:650px){aside{position:static;width:auto;padding:10px}.brand,aside p,aside small{display:none}aside button{width:auto;display:inline-block}.workspace{margin:0}.layout,.grid{grid-template-columns:1fr}.card{padding:16px}header{padding:16px}}
</style></head><body><aside><div class="brand">本体工作台</div><p><small>当前项目</small><br>创智园二期</p><button data-nav>项目概览</button><button data-nav>数据连接</button><button class="active">对象映射</button><button data-nav>取值规则库</button><button data-nav>项目校验与发布</button><small style="display:block;margin-top:45px">交互原型 · 示例数据<br>不发送真实请求</small></aside><div class="workspace"><header><small>创智园二期 / 项目映射</small><h1>对象映射</h1></header><main><div class="layout"><section class="card objects"><h3>对象类型</h3><button id="device" class="active">储能设备</button><button id="cluster">储能簇</button></section><section class="card"><div class="row between"><h2 id="objectTitle">储能设备</h2><span class="badge">本体动作 · 项目接口</span></div><div class="tabs"><button data-tab>实例识别</button><button data-tab>属性取值</button><button data-tab>链接映射</button><button class="active">动作</button></div><p class="muted">为对象关联的动作配置 HTTP 接口及请求参数。</p><div class="tablewrap"><table><thead><tr><th>动作名称</th><th>接口地址</th><th>操作</th></tr></thead><tbody id="actions"></tbody></table></div></section></div><p class="note">本页仅演示接口配置。保存只影响当前页面，刷新恢复示例。</p></main></div><dialog id="editor" aria-labelledby="editTitle"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const actions=[{id:'stop',name:'停止充放电',definition:'请求指定储能设备停止充电或放电，进入不充不放状态。',inputs:[{id:'device',name:'目标设备',type:'object'}]},{id:'power',name:'设置目标功率',definition:'请求指定储能设备按输入的目标功率运行。',inputs:[{id:'device',name:'目标设备',type:'object'},{id:'targetPower',name:'目标功率',type:'number'}]}];
const properties=[{id:'controlCode',name:'控制设备编码',type:'string'},{id:'name',name:'显示名称',type:'string'},{id:'ratedPower',name:'额定功率',type:'number'}];
let currentObject='储能设备',currentAction=null,draft=null,dirty=false;const bindings={};
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(window.timer);window.timer=setTimeout(()=>$('toast').hidden=true,3500)}
function key(){return currentObject+':'+currentAction.id}
function render(){$('objectTitle').textContent=currentObject;$('device').className=currentObject==='储能设备'?'active':'';$('cluster').className=currentObject==='储能簇'?'active':'';$('actions').innerHTML=currentObject==='储能簇'?'<tr><td colspan="3" class="empty">此示例未为储能簇关联动作。</td></tr>':actions.map(a=>{const b=bindings['储能设备:'+a.id];return `<tr><td><strong>${esc(a.name)}</strong></td><td>${b?`<span class="badge">${esc(b.method)}</span> ${esc(b.url)}`:'尚未配置'}</td><td><button class="link" data-config="${a.id}">${b?'修改接口':'配置接口'}</button></td></tr>`}).join('');document.querySelectorAll('[data-config]').forEach(b=>b.onclick=()=>openEditor(b.dataset.config))}
function options(values,current){return values.map(v=>{const [value,label]=Array.isArray(v)?v:[v,v];return `<option value="${esc(value)}" ${value===current?'selected':''}>${esc(label)}</option>`}).join('')}
function emptyBinding(){return {method:'POST',url:'',bodyFormat:'json',description:'',params:[],auth:{kind:'none',credential:'',location:'header',name:''}}}
function mark(){dirty=true}
function openEditor(id){currentAction=actions.find(a=>a.id===id);draft=structuredClone(bindings[key()]||emptyBinding());dirty=false;editor()}
function editor(){$('editor').innerHTML=`<div class="modalhead"><h2 id="editTitle">配置接口 · ${esc(currentAction.name)}</h2><button id="closeEditor">关闭</button></div><div class="modalbody"><div class="banner"><strong>本体动作：${esc(currentAction.name)}</strong><br>${esc(currentAction.definition)}<div class="note">来自本体定义，在项目映射中只读。</div></div><div class="grid"><label class="field">请求方式 <span class="required">*</span><select id="method">${options(['GET','POST','PUT','PATCH','DELETE'],draft.method)}</select></label><label class="field">接口地址 <span class="required">*</span><input id="url" value="${esc(draft.url)}" placeholder="https://ems.example.com/api/devices/{deviceId}/stop"><p class="note">填写完整地址；路径占位符需要配置同名路径参数。</p></label><label class="field" id="bodyFormatField" hidden>请求体格式 <span class="required">*</span><select id="bodyFormat">${options([['json','JSON'],['form','表单（application/x-www-form-urlencoded）']],draft.bodyFormat)}</select></label></div><label class="field">接口说明 <small>（选填）</small><textarea id="description" rows="2" placeholder="说明接口用途和返回含义">${esc(draft.description)}</textarea></label><div class="section"><div class="row between"><h3>请求参数</h3><div class="row"><button id="example" class="link">填入停止充放电示例</button><button id="addParam">＋ 添加参数</button></div></div><p class="note">用动作输入、对象信息或固定值，为接口的每个参数指定来源。认证密钥在下方引用，不填写在参数固定值中。</p><div class="tablewrap"><table class="paramtable"><thead><tr><th>参数名</th><th>参数位置</th><th>取值来源</th><th>来源项 / 固定值</th><th>值类型</th><th></th></tr></thead><tbody id="params"></tbody></table></div></div><details id="authDetails"><summary>认证配置（选填）</summary><div class="grid"><label class="field">认证方式<select id="authKind">${options([['none','无认证'],['bearer','Bearer Token'],['apiKey','API Key']],draft.auth.kind)}</select></label><div id="authExtra"></div></div><div class="grid" id="apiKeyExtra"></div><p class="note">凭据列表为占位示例，不含真实密钥。这里只选择凭据引用。</p></details><div class="section"><div class="row between"><h3>请求示意</h3><button id="refreshPreview">更新示意</button></div><p class="note">仅展示请求结构。变量保留占位符，认证值隐藏，不发送请求。</p><pre id="request" class="request"></pre></div><div id="errors" class="error" role="alert"></div></div><div class="modalfoot"><button id="cancel">取消</button><button class="primary" id="save">保存</button></div>`;
$('closeEditor').onclick=$('cancel').onclick=closeEditor;for(const name of ['method','url','bodyFormat','description'])$(name).oninput=e=>{draft[name]=e.target.value;mark();if(name==='method')renderParams();preview()};$('authKind').onchange=e=>{draft.auth.kind=e.target.value;draft.auth.credential='';mark();authFields();preview()};$('addParam').onclick=()=>{draft.params.push({id:'p'+Date.now()+Math.random(),name:'',position:'body',source:'fixed',value:'',valueType:'string'});mark();renderParams();preview()};$('example').hidden=currentAction.id!=='stop';$('example').onclick=()=>{if(dirty&&!confirm('用示例替换当前接口和参数填写？'))return;draft={...emptyBinding(),method:'POST',url:'https://ems.example.com/api/storage/stop',description:'示例：请求停止设备充放电，返回指令编号；受理不等于设备已停止。',params:[{id:'device',name:'deviceId',position:'body',source:'identity',value:'',valueType:'number'},{id:'power',name:'power',position:'body',source:'fixed',value:'0',valueType:'number'}]};dirty=true;editor()};$('refreshPreview').onclick=preview;$('save').onclick=save;renderParams();authFields();preview();if(!$('editor').open)$('editor').showModal()}
function sourceType(p){if(p.source==='fixed')return p.valueType;if(p.source==='identity')return 'number';if(p.source==='attribute')return properties.find(x=>x.id===p.value)?.type||'';return currentAction.inputs.find(x=>x.id===p.value)?.type||''}
function renderParams(){$('bodyFormatField').hidden=!draft.params.some(p=>p.position==='body');$('params').innerHTML=draft.params.map(p=>`<tr data-row="${p.id}"><td><input data-field="name" aria-label="参数名" value="${esc(p.name)}" placeholder="例如 deviceId"></td><td><select data-field="position" aria-label="参数位置">${options([['path','路径'],['query','Query'],['header','请求头'],['body','请求体']],p.position)}</select></td><td><select data-field="source" aria-label="取值来源">${options([['input','动作输入'],['identity','当前对象实例主键'],['attribute','当前对象属性'],['fixed','固定值']],p.source)}</select></td><td>${p.source==='identity'?'<span class="badge">当前对象的实例主键</span>':p.source==='input'?`<select data-field="value" aria-label="动作输入"><option value="">请选择输入</option>${options(currentAction.inputs.map(x=>[x.id,x.name]),p.value)}</select>`:p.source==='attribute'?`<select data-field="value" aria-label="对象属性"><option value="">请选择已映射属性</option>${options(properties.map(x=>[x.id,x.name]),p.value)}</select>`:p.valueType==='boolean'?`<select data-field="value" aria-label="固定布尔值">${options([['true','是'],['false','否']],p.value)}</select>`:`<input data-field="value" aria-label="固定值" value="${esc(p.value)}" placeholder="${p.valueType==='number'?'例如 0':'输入文本'}">`}</td><td>${p.source==='fixed'?`<select data-field="valueType" aria-label="固定值类型">${options([['string','文本'],['number','数值'],['boolean','是/否']],p.valueType)}</select>`:`<small>${({string:'文本',number:'数值',boolean:'是/否',object:'对象引用'})[sourceType(p)]||'请选择来源'} · 继承来源</small>`}</td><td><button class="link" data-remove="${p.id}">移除</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">尚未添加参数。无参接口可以直接保存。</td></tr>';
$('params').querySelectorAll('[data-row]').forEach(row=>{const p=draft.params.find(p=>p.id===row.dataset.row);row.querySelectorAll('[data-field]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',e=>{const k=el.dataset.field;p[k]=e.target.value;if(k==='source')p.value=p.source==='fixed'?'':'';if(k==='valueType')p.value=p.valueType==='boolean'?'true':'';mark();if(['source','valueType','position','value'].includes(k)&&el.tagName==='SELECT')renderParams();preview()}))});$('params').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{draft.params=draft.params.filter(p=>p.id!==b.dataset.remove);mark();renderParams();preview()})}
function authFields(){const a=draft.auth;$('authExtra').innerHTML=a.kind==='none'?'':`<label class="field">凭据引用 <span class="required">*</span><select id="credential"><option value="">请选择项目凭据</option>${options([['ems-demo','EMS 控制服务凭据（示例）'],['gateway-demo','园区网关凭据（示例）']],a.credential)}</select></label>`;$('apiKeyExtra').innerHTML=a.kind==='apiKey'?`<label class="field">参数位置<select id="authLocation">${options([['header','请求头'],['query','Query']],a.location)}</select></label><label class="field">参数名称 <span class="required">*</span><input id="authName" value="${esc(a.name)}" placeholder="X-API-Key"></label>`:'';for(const [id,k] of [['credential','credential'],['authLocation','location'],['authName','name']])if($(id))$(id).oninput=e=>{a[k]=e.target.value;mark();preview()}}
function valueOf(p){if(p.source==='identity')return '${当前对象.实例主键}';if(p.source==='input')return '${动作输入.'+(currentAction.inputs.find(x=>x.id===p.value)?.name||'待选择')+'}';if(p.source==='attribute')return '${当前对象.'+(properties.find(x=>x.id===p.value)?.name||'待选择')+'}';if(p.valueType==='number')return p.value.trim()!==''&&Number.isFinite(Number(p.value))?Number(p.value):'待填写数值';if(p.valueType==='boolean')return p.value==='true';return p.value}
function preview(){let url=draft.url||'（待填写接口地址）',headers=[],query=[],body={};for(const p of draft.params){const n=p.name||'待填写参数名',v=valueOf(p);if(p.position==='path')url=url.split('{'+n+'}').join(String(v));if(p.position==='query')query.push(n+'='+String(v));if(p.position==='header')headers.push(n+': '+v);if(p.position==='body')body[n]=v}const a=draft.auth;if(a.kind==='bearer')headers.push('Authorization: Bearer [受保护凭据]');if(a.kind==='apiKey')(a.location==='query'?query:headers).push((a.name||'待填写认证参数名')+(a.location==='query'?'=':': ')+'[受保护凭据]');if(query.length)url+=(url.includes('?')?'&':'?')+query.join('&');const hasBody=draft.params.some(p=>p.position==='body');if(hasBody)headers.push('Content-Type: '+(draft.bodyFormat==='json'?'application/json':'application/x-www-form-urlencoded'));$('request').textContent=draft.method+' '+url+'\n'+headers.join('\n')+(hasBody?'\n\n'+(draft.bodyFormat==='json'?JSON.stringify(body,null,2):Object.entries(body).map(([k,v])=>k+'='+v).join('&')):'')}
function validate(){const errors=[];if(!draft.url.trim())errors.push('请填写接口地址。');else if(!/^https?:\/\//i.test(draft.url))errors.push('请填写以 http:// 或 https:// 开头的完整接口地址。');const seen=new Set();for(const [i,p] of draft.params.entries()){const label='参数 '+(i+1);if(!p.name.trim())errors.push(label+'：请填写参数名。');const k=p.position+':'+(p.position==='header'?p.name.toLowerCase():p.name);if(seen.has(k))errors.push(label+'：同一位置的参数名重复。');seen.add(k);if(['input','attribute'].includes(p.source)&&!p.value)errors.push(label+'：请选择取值来源项。');if(p.source==='fixed'&&p.valueType==='number'&&(p.value.trim()===''||!Number.isFinite(Number(p.value))))errors.push(label+'：请输入有效数值。');if(p.position==='path'&&!draft.url.includes('{'+p.name+'}'))errors.push(label+'：地址中不存在对应的 {'+p.name+'} 占位符。');if(['path','query','header'].includes(p.position)&&sourceType(p)==='object')errors.push(label+'：该位置不能直接传对象，请选择实例主键或具体属性。')}
for(const m of draft.url.matchAll(/\{([^{}]+)\}/g))if(!draft.params.some(p=>p.position==='path'&&p.name===m[1]))errors.push('路径参数 {'+m[1]+'} 尚未配置。');if(draft.method==='GET'&&draft.params.some(p=>p.position==='body'))errors.push('GET 请求请把参数放在 Query 或路径中。');if(draft.auth.kind!=='none'&&!draft.auth.credential)errors.push('请选择认证凭据引用。');if(draft.auth.kind==='apiKey'&&!draft.auth.name.trim())errors.push('请填写 API Key 参数名称。');if(draft.auth.kind==='bearer'&&draft.params.some(p=>p.position==='header'&&p.name.toLowerCase()==='authorization'))errors.push('Authorization 已由认证配置提供，请移除重复请求头。');return errors}
function save(){const errors=validate();$('errors').textContent=errors.join('\n');if(errors.length){$('errors').scrollIntoView({block:'center',behavior:'smooth'});return}bindings[key()]=structuredClone(draft);dirty=false;$('editor').close();render();toast('接口配置已保存到原型，未发送请求')}
function closeEditor(){if(dirty&&!confirm('放弃尚未保存的接口配置？'))return;dirty=false;$('editor').close()}
$('editor').addEventListener('cancel',e=>{e.preventDefault();closeEditor()});$('device').onclick=()=>{currentObject='储能设备';render()};$('cluster').onclick=()=>{currentObject='储能簇';render()};document.querySelectorAll('[data-nav],[data-tab]').forEach(b=>b.onclick=()=>toast('本原型只展示对象映射中的动作接口配置'));window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});render();
</script></body></html>
