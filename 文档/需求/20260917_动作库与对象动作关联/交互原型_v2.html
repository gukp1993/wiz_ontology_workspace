<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动作定义与项目绑定 · 交互原型</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#21364b;background:#f4f7fb}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d8e1ee;background:white;color:#284057;border-radius:6px;padding:8px 14px}button:hover{background:#edf3ff}button.primary{background:#2858e9;color:white;border-color:#2858e9}button.active{background:#edf2ff;color:#244fd5;border-color:#7795ff}button:focus-visible,input:focus,select:focus,textarea:focus{outline:2px solid #91b1ff;outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}aside{position:fixed;width:205px;inset:0 auto 0 0;background:#162c40;color:#dbe8f4;padding:24px 16px}.brand{font-size:19px;font-weight:650;margin-bottom:28px}aside button{width:100%;text-align:left;margin:4px 0;background:transparent;color:#dbe8f4;border-color:transparent}aside button:hover{background:#25435d;color:white}aside button.sel{background:#25435d;color:white}aside small{display:block;color:#a7bbcf;margin:20px 8px 8px}.workspace{margin-left:205px}header{background:white;border-bottom:1px solid #dce4ef;padding:20px 30px;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:23px;margin:4px 0}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0 0 10px}.muted,small{color:#677e93}.tag{font-size:12px;border-radius:18px;padding:4px 10px;background:#edf3ff;color:#355ad3}.notice{background:#fff8e7;color:#805d20;border:1px solid #eddfb9;border-radius:8px;padding:12px 16px;margin-bottom:20px}main{padding:24px 30px;max-width:1500px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.card{background:white;border:1px solid #dbe4ee;border-radius:10px;padding:23px;margin-bottom:18px}.cols{display:grid;grid-template-columns:minmax(430px,1fr) 330px;gap:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;color:#334b60}input,select,textarea{width:100%;display:block;margin-top:6px;border:1px solid #ccd8e7;border-radius:6px;padding:10px;background:white;color:#21364b}textarea{resize:vertical;min-height:80px}.full{grid-column:1/-1}.section{border-top:1px solid #e1e8f0;margin-top:22px;padding-top:22px}.hint{font-size:13px;color:#678096;margin:7px 0 13px}.preview{background:#f7faff;border:1px solid #dce6f6;border-radius:8px;padding:16px}.rule{padding:14px;background:#f8fafc;border:1px solid #e1e7ef;border-radius:8px;margin-top:10px}table{border-collapse:collapse;width:100%}th,td{text-align:left;border-bottom:1px solid #e5ebf3;padding:14px 10px}th{color:#6b7c8e;font-weight:500;background:#f8fafc}.error{color:#b73939;margin:10px 0}.ok{color:#187458}.footer{display:flex;align-items:center;gap:12px;margin-top:24px}details{margin-top:20px}summary{cursor:pointer;color:#526c82}code{background:#edf1f6;padding:3px 5px;border-radius:4px}.param{display:grid;grid-template-columns:1.3fr 1fr 100px;gap:12px;align-items:center;margin:10px 0}.param input{margin:0}.steps{font-size:13px;margin-bottom:18px;color:#5e768c}.toast{position:fixed;right:25px;bottom:25px;background:#193d56;color:white;padding:13px 20px;border-radius:8px;box-shadow:0 5px 20px #0002;max-width:440px;z-index:5}dialog{border:0;border-radius:12px;max-width:560px;width:90%;padding:28px;color:#21364b}dialog::backdrop{background:#142c4266}.callout{border-left:3px solid #557bea;padding:5px 15px;margin:18px 0}.switches{display:flex;gap:6px;margin-bottom:16px}@media(max-width:1000px){.cols{grid-template-columns:1fr}.grid{grid-template-columns:1fr}aside{width:165px}.workspace{margin-left:165px}main{padding:18px}.param{grid-template-columns:1fr 1fr}}@media(max-width:650px){aside{position:static;width:auto;padding:10px}.brand,aside small,#menu{display:none}.workspace{margin:0}header{padding:16px}.param{grid-template-columns:1fr}.cols{display:block}}
</style></head><body>
<aside><div class="brand">本体工作台</div><div class="switches"><button id="onto">本体</button><button id="proj">项目</button></div><small id="scope"></small><div id="menu"></div><small>交互原型 V2 · 动作库与对象关联<br>示例数据 · 不连接真实系统</small></aside>
<div class="workspace"><header><div><small id="crumb"></small><h1 id="heading"></h1></div><div class="row"><a href="需求说明.md">需求说明</a><a href="开发计划.md">开发计划</a><a href="执行指令.md">执行指令</a><span class="tag">可点击原型 · 未接入业务</span></div></header><main id="app"></main></div>
<dialog id="modal"><div id="modalbody"></div><div class="footer"><button id="closemodal">关闭预览</button></div></dialog><div class="toast" id="toast" hidden role="status"></div>
<script>
const app=document.getElementById('app'),modal=document.getElementById('modal');let zone='ontology',screen='list',selected='stop',currentObject='device',dirty=false,draft=null;
const defs={
stop:{id:'stop',name:'停止充放电',description:'请求目标对象停止当前充电或放电。',effect:'请求目标对象停止充放电，目标功率为 0；以设备反馈确认完成，不直接改写实测功率或 SOC。'},
rename:{id:'rename',name:'修改显示名称',description:'更改目标对象的业务显示名称，保留其身份。',effect:'将目标对象的显示名称更新为操作人员指定的新名称。'},
move:{id:'move',name:'调整所属储能设备',description:'调整目标对象的业务归属。',effect:'解除原所属设备链接，再关联目标储能设备；完成后仅归属目标设备。'}
};const objects=[{id:'device',name:'储能设备'},{id:'cluster',name:'储能簇'},{id:'system',name:'储能系统'}];
const relations={device:['stop','rename'],cluster:['rename','move'],system:[]};const bindings={};
const objectName=id=>objects.find(o=>o.id===id)?.name||id;
const users=id=>objects.filter(o=>relations[o.id].includes(id));
function goObject(id){if(dirty&&!confirm('放弃未保存的修改？'))return;dirty=false;zone='ontology';currentObject=id;screen='objects';render()}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=(items,value)=>items.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('');

function toast(s){const t=document.getElementById('toast');t.textContent=s;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,4500)}
function nav(z){if(dirty&&!confirm('修改尚未保存到原型，放弃修改？'))return;dirty=false;zone=z;screen='list';render()}
function chrome(){document.getElementById('onto').className=zone==='ontology'?'sel':'';document.getElementById('proj').className=zone==='project'?'sel':'';document.getElementById('scope').textContent=zone==='ontology'?'当前本体 · 储能本体':'当前项目 · 创智园二期';document.getElementById('crumb').textContent=zone==='ontology'?'本体 / 通用动作定义':'项目 / 动作实现绑定';document.getElementById('heading').textContent=zone==='ontology'?'动作定义':'动作绑定';document.getElementById('menu').innerHTML=(zone==='ontology'?['工作概览','对象建模','动作定义','共享属性库','本体校验与发布']:['项目概览','数据连接','对象映射','动作绑定','函数编排','项目校验与发布']).map(x=>`<button ${x.includes('动作')?'class="sel"':''} data-menu="${x}">${x}</button>`).join('');document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>b.dataset.menu==='对象建模'?goObject(currentObject):b.dataset.menu==='对象映射'?nav('project'):b.dataset.menu.includes('动作')?nav(zone):toast('此原型仅演示动作库、对象关联和项目绑定'))}
function render(){chrome();if(screen==='objects')objectPage();else if(screen==='list')list();else if(zone==='ontology')edit();else binding()}
function list(){if(zone==='project'){projectList();return}app.innerHTML=`<div class="notice">动作库只维护名称、业务定义、业务效果。对象建模中选择支持哪些动作；本期不定义输入参数或提交条件。</div><div class="card"><div class="row between"><h2>动作库</h2><button class="primary" id="new">＋ 新建动作</button></div><input id="search" placeholder="搜索动作名称" aria-label="搜索动作"><table><thead><tr><th>动作</th><th>业务效果</th><th>关联对象</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>`;
const rows=()=>{document.getElementById('rows').innerHTML=Object.values(defs).filter(d=>d.name.includes(document.getElementById('search').value)).map(d=>`<tr><td><strong>${esc(d.name)}</strong><br><small>${esc(d.description)}</small></td><td style="max-width:400px">${esc(d.effect)}</td><td>${users(d.id).map(o=>`<button data-object="${o.id}">${esc(o.name)}</button>`).join(' ')||'暂未关联'}</td><td><button data-edit="${d.id}">编辑</button> <button data-delete="${d.id}">删除</button></td></tr>`).join('');document.querySelectorAll('[data-object]').forEach(el=>el.onclick=()=>goObject(el.dataset.object));document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>{selected=el.dataset.edit;draft=structuredClone(defs[selected]);dirty=false;screen='detail';render()});document.querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>{const id=el.dataset.delete;if(users(id).length){toast('请先到对象建模移除关联；不能直接删除正在使用的动作');return}if(confirm('删除此动作定义？')){delete defs[id];rows()}})};rows();document.getElementById('search').oninput=rows;document.getElementById('new').onclick=()=>{selected='action'+Date.now();draft={id:selected,name:'',description:'',effect:''};screen='detail';dirty=false;render()}}
function objectPage(){document.getElementById('heading').textContent='对象建模';app.innerHTML=`<div class="row" style="margin-bottom:16px">${objects.map(o=>`<button class="${o.id===currentObject?'active':''}" data-object="${o.id}">${o.name}</button>`).join('')}</div><div class="card"><h2>${objectName(currentObject)}</h2><div class="row"><button id="props">属性</button><button id="links">链接</button><button class="active">动作</button></div><div class="section row between"><h3>已关联动作</h3><button class="primary" id="addAction">＋ 添加动作</button></div><p class="hint">选择此类对象支持的动作，共享定义在动作库中维护。移除关联不会删除动作。</p><div id="picker" hidden class="preview"><input id="pickSearch" placeholder="搜索动作" aria-label="搜索可关联动作"><div id="choices" style="max-height:240px;overflow:auto"></div><div class="footer"><button class="primary" id="confirmPick">确认关联</button><button id="cancelPick">取消</button></div></div><table><thead><tr><th>动作</th><th>业务效果</th><th>操作</th></tr></thead><tbody>${relations[currentObject].map(id=>`<tr><td>${esc(defs[id].name)}</td><td>${esc(defs[id].effect)}</td><td><button data-view="${id}">查看定义</button> <button data-unlink="${id}">移除关联</button></td></tr>`).join('')||'<tr><td colspan="3">尚未关联动作，点击“添加动作”从动作库选择。</td></tr>'}</tbody></table><div class="footer"><button id="toProject">查看项目动作绑定 →</button></div></div>`;
document.querySelectorAll('[data-object]').forEach(el=>el.onclick=()=>goObject(el.dataset.object));['props','links'].forEach(id=>document.getElementById(id).onclick=()=>toast('本次原型仅展开动作页签；正式产品保留现有属性和链接页签'));
document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{selected=el.dataset.view;draft=structuredClone(defs[selected]);screen='detail';render()});document.querySelectorAll('[data-unlink]').forEach(el=>el.onclick=()=>{if(confirm('仅移除当前对象与该动作的关联？项目已有绑定会显示关联失效，保留配置。')){relations[currentObject]=relations[currentObject].filter(x=>x!==el.dataset.unlink);objectPage();toast('已移除关联，动作定义保留')}});
let chosen=new Set();const choices=()=>{document.getElementById('choices').innerHTML=Object.values(defs).filter(d=>d.name.includes(document.getElementById('pickSearch').value)).map(d=>`<label class="row" style="padding:10px"><input style="width:auto;margin:0" type="checkbox" data-pick="${d.id}" ${relations[currentObject].includes(d.id)?'checked disabled':chosen.has(d.id)?'checked':''}>${esc(d.name)} ${relations[currentObject].includes(d.id)?'（已关联）':''}</label>`).join('')||'<p>没有匹配动作，请先在动作库创建。</p>';document.querySelectorAll('[data-pick]').forEach(el=>el.onchange=()=>{el.checked?chosen.add(el.dataset.pick):chosen.delete(el.dataset.pick);dirty=chosen.size>0})};document.getElementById('addAction').onclick=()=>{document.getElementById('picker').hidden=false;choices()};document.getElementById('pickSearch').oninput=choices;document.getElementById('confirmPick').onclick=()=>{relations[currentObject]=[...new Set([...relations[currentObject],...chosen])];dirty=false;objectPage();toast('关联已保存到原型')};document.getElementById('cancelPick').onclick=()=>{dirty=false;objectPage()};document.getElementById('toProject').onclick=()=>nav('project')}
function projectList(){app.innerHTML=`<div class="notice">当前项目 · 创智园二期。本原型实时使用页面内定义；正式产品只读取项目固定引用的已发布本体版本。</div><div class="card"><h2>对象映射 · 动作绑定</h2><div class="row">${objects.map(o=>`<button class="${currentObject===o.id?'active':''}" data-project-object="${o.id}">${o.name}</button>`).join('')}</div><p class="hint">每个“对象类型＋动作”单独绑定实现，同一个动作在不同对象上的配置互不覆盖。</p><table><thead><tr><th>动作</th><th>状态</th><th>操作</th></tr></thead><tbody>${[...new Set([...relations[currentObject],...Object.keys(bindings).filter(k=>k.startsWith(currentObject+':')).map(k=>k.split(':')[1])])].map(id=>{const valid=relations[currentObject].includes(id);return `<tr><td>${esc(defs[id]?.name||id)}</td><td>${valid?(bindings[currentObject+':'+id]?'已配置 · 未执行验证':'待绑定'):'关联失效 · 历史配置保留'}</td><td><button data-bind="${id}" ${valid?'':'disabled'}>配置绑定</button></td></tr>`}).join('')||'<tr><td colspan="3">此对象没有关联动作；请先在本体对象建模中关联并发布。</td></tr>'}</tbody></table></div>`;document.querySelectorAll('[data-project-object]').forEach(el=>el.onclick=()=>{currentObject=el.dataset.projectObject;projectList()});document.querySelectorAll('[data-bind]').forEach(el=>el.onclick=()=>{selected=el.dataset.bind;dirty=false;screen='detail';render()})}
function error(d){if(!d.name.trim()||!d.description.trim()||!d.effect.trim())return '请填写动作名称、业务定义和业务效果。';return ''}
function edit(){app.innerHTML=`<button id="back">← 返回动作列表</button><div class="steps">本体定义 → 发布与引用 → 项目绑定</div><div class="cols"><section class="card"><h2>${draft.name?'编辑动作':'新建动作'}</h2><div class="grid"><label>动作名称 *<input id="name" value="${esc(draft.name)}" placeholder="例如：储能设备停止充放电"></label><label class="full">业务定义 *<textarea id="desc" placeholder="说明这个动作的用途">${esc(draft.description)}</textarea></label><label class="full">业务效果 *<textarea id="effect" rows="4" placeholder="执行后期望发生什么？例如：请求目标设备停止充放电，目标功率为 0。">${esc(draft.effect)}</textarea></label></div><p class="hint">用业务语言描述预期变化；不需要先选择修改属性或调整链接。描述本身不会执行指令。</p><div id="errors" class="error" role="alert"></div><div class="footer"><button class="primary" id="save">保存定义</button><button id="preview">预览动作定义</button><button id="cancel">取消</button></div><p class="hint">仅保存到当前原型页面，刷新恢复示例；不写入工作台。</p></section><section><div class="card"><h3>怎么填写？</h3><p><b>业务定义：</b>这个动作有什么用途。</p><p><b>关联对象：</b>在对象建模中选择动作；动作库不指定对象。</p><p><b>业务效果：</b>执行后期望发生什么。</p><p>本期不维护参数清单。修改名称、调整归属等操作所需信息，由项目实现配置。</p><button id="jump">查看关联对象 →</button></div><div class="card"><h3>停止充放电示例</h3><p>对象建模中：为储能设备关联“停止充放电”。</p><p>固定要求：目标功率为 0。</p><p>完成依据：设备反馈，不将请求受理视为已停止。</p></div></section></div>`;
const collect=()=>{draft.name=document.getElementById('name').value;draft.description=document.getElementById('desc').value;draft.effect=document.getElementById('effect').value};
['name','desc','effect'].forEach(id=>document.getElementById(id).oninput=()=>{collect();dirty=true});
document.getElementById('save').onclick=()=>{collect();const e=error(draft);document.getElementById('errors').textContent=e;if(e)return;defs[selected]=structuredClone(draft);dirty=false;toast('已保存到原型，工作台数据未改变')};document.getElementById('preview').onclick=()=>{collect();const e=error(draft);document.getElementById('errors').textContent=e;if(!e)preview()};document.getElementById('back').onclick=document.getElementById('cancel').onclick=()=>nav('ontology');document.getElementById('jump').onclick=()=>{if(dirty||!defs[selected]){toast('请先保存定义');return}goObject(users(selected)[0]?.id||currentObject)}}

function preview(){document.getElementById('modalbody').innerHTML=`<span class="tag">定义预览 · 不执行</span><h2 style="margin-top:16px">${esc(draft.name)}</h2><h3>业务定义</h3><p>${esc(draft.description)}</p><h3>业务效果</h3><div class="preview" style="white-space:pre-wrap">${esc(draft.effect)}</div><p class="hint">本期不定义输入参数，也不生成执行表单。具体执行方式由项目绑定实现。</p>`;modal.showModal()}
function binding(){const d=defs[selected],b=structuredClone(bindings[currentObject+':'+selected]||{method:'调用项目接口',path:'',flow:'',permission:'',mapping:''});app.innerHTML=`<button id="back">← 返回动作绑定列表</button><div class="steps">${esc(objectName(currentObject))} / ${esc(d.name)} / 项目实现</div><div class="card"><h2>绑定项目实现</h2><div class="preview"><strong>${esc(d.name)}</strong><p>${esc(d.effect)}</p><small>以上为本体定义，具体接口和参数转换在项目中配置。</small></div><div class="grid section"><label>实现方式 *<select id="method">${opts(['调用项目接口','绑定函数编排'],b.method)}</select></label><label>允许操作的项目角色 *<input id="permission" value="${esc(b.permission)}" placeholder="例如：设备运维人员"></label></div><div id="implementation"></div><label class="section">项目接口／函数参数映射（按需）<textarea id="mapping" placeholder="例如：storageId ← 当前操作设备的项目标识；power ← 固定值 0。无参数接口可留空。">${esc(b.mapping)}</textarea></label><p class="hint">本体不提供参数清单；在这里说明接口实际需要的参数及其来源：当前操作对象、项目配置、固定值或执行时补充填写的信息。原型仅保存说明，不生成执行表单。</p><p class="hint">由项目实现反馈执行结果。请求受理不代表业务效果已完成。</p><div id="binderr" class="error"></div><div class="footer"><button id="savebinding" class="primary">保存绑定</button><button id="backdef">查看本体定义</button></div><p class="hint">保存配置不代表已具备执行能力。</p></div>`;
const impl=()=>{document.getElementById('implementation').innerHTML=b.method==='调用项目接口'?`<label class="section">项目接口路径 *<input id="path" value="${esc(b.path)}" placeholder="填写实际项目接口路径"></label>`:`<label class="section">项目函数编排 *<input id="flow" value="${esc(b.flow)}" placeholder="填写项目编排名称（原型示意）"></label>`;const el=document.getElementById(b.method==='调用项目接口'?'path':'flow');el.oninput=()=>{b[el.id]=el.value;dirty=true}};impl();document.getElementById('method').onchange=e=>{b.method=e.target.value;dirty=true;impl()};['mapping','permission'].forEach(id=>document.getElementById(id).oninput=e=>{b[id]=e.target.value;dirty=true});document.getElementById('savebinding').onclick=()=>{if(!b.permission.trim()||!(b.method==='调用项目接口'?b.path:b.flow).trim()){document.getElementById('binderr').textContent='请填写实现和项目角色。';return}bindings[currentObject+':'+selected]=structuredClone(b);dirty=false;document.getElementById('binderr').textContent='';toast('绑定已保存到原型，未执行动作')};document.getElementById('back').onclick=()=>nav('project');document.getElementById('backdef').onclick=()=>{if(dirty&&!confirm('放弃未保存的绑定修改？'))return;dirty=false;zone='ontology';draft=structuredClone(d);render()}}
document.getElementById('onto').onclick=()=>nav('ontology');document.getElementById('proj').onclick=()=>nav('project');document.getElementById('closemodal').onclick=()=>modal.close();render();

</script></body></html>
