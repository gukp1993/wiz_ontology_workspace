<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const props=[['显示名称','文本','用于识别和展示该对象的业务名称。'],['额定容量','数值','规定条件下设备的标称储能容量。'],['额定功率','数值','设备在规定条件下的标称功率。'],['实时 SOC','数值','电池剩余电量百分比，取当前最新观测值。'],['SOC 采样序列','时间序列','电池剩余电量百分比随采样时间变化的记录。'],['额定电压','数值','对象在规定运行条件下的标称电压。']];
const initial=['储能系统','储能设备','储能簇','电池模组','电芯','储能变流器','充放电计划','光伏电站','光伏逆变器','电表','变压器','配电柜','温度传感器','告警记录','维护工单','运行事件','园区','计量点'];
let data=initial.map((name,i)=>({id:'o'+i,name,desc:i===1?'通过特定介质或装置储存能量，并在需要时释放能量的设备。用于统一描述设备的基础信息、运行状态与可执行操作。':name+'的业务对象类型定义，用于描述其基本信息与业务关系。',props:structuredClone(props),star:i<3,actions:i===1?['停止充放电','修改显示名称']:['修改显示名称']}));
// 专门演示大量类型的目录，不将对象实例伪装成对象类型。
for(let i=1;i<=46;i++)data.push({id:'demo'+i,name:'示例对象类型 '+String(i).padStart(2,'0'),desc:'仅用于演示大量对象类型的搜索与分页，不是具体设备实例。',props:[],star:false,actions:[]});
let selected='o1',tab='props',page=1,query='',starOnly=false,asc=true,mode='auto',detailOpen=false,propQuery='';const pageSize=12;
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').hidden=true,3000)}
function filtered(){return data.filter(o=>(!starOnly||o.star)&&(o.name+' '+o.desc).toLowerCase().includes(query.toLowerCase())).sort((a,b)=>(asc?1:-1)*a.name.localeCompare(b.name,'zh-CN',{numeric:true}))}
function stacked(){return mode==='stack'||window.innerWidth<1000}
function layout(){const s=stacked();$('shell').classList.toggle('stacked',s);$('shell').classList.toggle('detail-open',detailOpen);$('modehint').textContent=s?'单栏模式 · 选择对象进入详情，返回后保留搜索与页码':'并列模式 · 左侧定位对象，右侧维护详情；目录与内容分别滚动';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
function renderList(){const arr=filtered(),count=Math.max(1,Math.ceil(arr.length/pageSize));page=Math.max(1,Math.min(page,count));$('total').textContent=arr.length+' / '+data.length;$('pageinfo').textContent=arr.length?`${(page-1)*pageSize+1}–${Math.min(page*pageSize,arr.length)} 项`:'0 项';$('pages').textContent=page+' / '+count;$('prev').disabled=page<=1;$('next').disabled=page>=count;$('starFilter').classList.toggle('active',starOnly);$('all').classList.toggle('active',!starOnly);$('sort').textContent='名称 '+(asc?'↑':'↓');$('objectlist').innerHTML=arr.slice((page-1)*pageSize,page*pageSize).map(o=>`<button class="objectrow ${selected===o.id?'selected':''}" data-object="${o.id}" ${selected===o.id?'aria-current="true"':''}><span class="objecticon">◇</span><span class="objecttext"><strong>${esc(o.name)}</strong><small>${o.props.length} 个属性 · ${o.actions.length} 个动作 ${o.star?'· ★':''}</small></span><span class="arrow">›</span></button>`).join('')||'<div class="empty"><strong>没有匹配的对象</strong><p>试试更短的关键词，或清空筛选。</p></div>';document.querySelectorAll('[data-object]').forEach(b=>b.onclick=()=>select(b.dataset.object));}
function select(id){selected=id;detailOpen=true;propQuery='';renderList();renderDetail();$('detail').scrollTop=0;layout();if(stacked())$('back')?.focus()}
function renderDetail(){const o=data.find(o=>o.id===selected);if(!o){$('detail').innerHTML='<div class="empty"><strong>选择一个对象开始查看</strong><p>在左侧搜索或选择对象类型。</p></div>';return}const hidden=!filtered().some(x=>x.id===o.id);$('detail').innerHTML=`<div class="detailhead"><button class="back quiet" id="back">← 返回对象列表</button><div class="eyebrow">OBJECT TYPE <span class="pill" style="margin-left:8px">示例</span></div><div class="titleline"><h2>${esc(o.name)}</h2><div class="row"><button id="star" aria-label="${o.star?'取消收藏':'收藏对象'}">${o.star?'★':'☆'}</button><button id="switch">切换对象 ⌄</button><button id="edit">编辑定义</button></div></div><p class="description">${esc(o.desc)}</p><div class="metadata"><span>属性 ${o.props.length}</span><span>动作 ${o.actions.length}</span><span>当前本体 · 储能本体</span>${hidden?'<span style="color:#96723e">此对象不在当前筛选结果中</span>':''}</div></div><div class="tabs" role="tablist" aria-label="对象内容"><button role="tab" data-tab="props" aria-selected="${tab==='props'}" class="${tab==='props'?'active':''}">属性 <span>${o.props.length}</span></button><button role="tab" data-tab="links" aria-selected="${tab==='links'}" class="${tab==='links'?'active':''}">链接</button><button role="tab" data-tab="actions" aria-selected="${tab==='actions'}" class="${tab==='actions'?'active':''}">动作 <span>${o.actions.length}</span></button></div><div class="detailbody" role="tabpanel" id="panel"></div>`;$('back').onclick=()=>{detailOpen=false;layout();$('objectlist').querySelector(`[data-object="${selected}"]`)?.focus()};$('star').onclick=()=>{o.star=!o.star;renderList();renderDetail()};$('switch').onclick=switcher;$('edit').onclick=()=>editor(o);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;propQuery='';renderDetail()});panel(o)}

pe',['SQL','Python'],n.type)}</label><label>输入来源<input id="nInput" value="${esc(n.input)}"></label><label>输出名称<input id="nOutput" value="${esc(n.output)}"></label><label class="fullspan">代码<textarea class="codearea" id="nCode">${esc(n.code)}</textarea></label></div><div class="fullfoot"><button class="primary" id="nSave">保存节点</button><button id="nCancel">取消修改</button></div>`;$('nCancel').onclick=flowPage;$('nSave').onclick=()=>{if(!$('nName').value.trim()){toast('节点名称不能为空');return}Object.assign(n,{name:$('nName').value,type:$('nType').value,input:$('nInput').value,output:$('nOutput').value,code:$('nCode').value});toast('节点已保存到原型');flowPage()}}
function releasePage(isProject){const ctx=isProject?P():O(),versions=isProject?ctx.releases:ctx.versions;extra.innerHTML=`<div class="sim">本页仅演示校验与发布流程，不修改真实版本。示例校验不等同生产校验。</div><div class="fullcard"><h2>${isProject?'项目':'本体'}校验与发布</h2><p>先检查当前配置，再创建页面内的版本快照。</p><div class="row"><button class="primary" id="validate">运行模拟校验</button><button disabled id="publish">模拟发布版本</button></div><div id="validation" style="margin-top:20px"></div></div><div class="fullcard"><h3>已有版本</h3>${versions.length?versions.map(v=>`<div class="rule">${esc(v)} <span class="pill">原型快照</span></div>`).join(''):'<p>还没有发布版本</p>'}</div>`;$('validate').onclick=()=>{const errors=isProject?(!ctx.version?['请选择本体引用版本']:[]):(!ctx.objects.length?['尚未定义对象类型，请先创建对象']:[]);$('validation').innerHTML=errors.length?errors.map(e=>`<p class="error">${e}</p>`).join('')+`<button id="fix">去处理</button>`:'<div class="previewNote">基础示例检查通过，可以模拟发布。未验证真实业务数据和执行能力。</div>';$('publish').disabled=!!errors.length;if($('fix'))$('fix').onclick=()=>navigate(isProject?'p-upgrade':'objects')};$('publish').onclick=()=>{const v=isProject?'v'+(versions.length+1):(versions.length+1)+'.0.0';versions.push(v);if(!isProject)snapshots[ctx.id+'@'+v]=structuredClone(ctx.objects);releasePage(isProject);toast('已生成页面内示例版本')}}
function upgradePage(){const p=P(),published=ontologies.filter(o=>o.versions.length);extra.innerHTML=`<div class="fullcard"><h2>版本引用</h2><div class="previewNote">当前固定引用：${esc(source()?.name)} ${esc(p.version)}</div><div class="fullform" style="margin-top:18px"><label>本体${selectHTML('upOnt',published,p.ontology)}</label><label>目标版本<div id="upVers"></div></label></div><div class="fullfoot"><button class="primary" id="compare">比较版本与配置影响</button></div><div id="upResult"></div></div>`;const versions=()=>{$('upVers').innerHTML=selectHTML('upVer',ontologies.find(o=>o.id===$('upOnt').value).versions,'');$('upResult').innerHTML=''};versions();$('upOnt').onchange=versions;$('compare').onclick=()=>{const oid=$('upOnt').value,v=$('upVer').value,target=snapshots[oid+'@'+v]||[],before=projectObjects(),same=oid===p.ontology&&v===p.version;const added=target.filter(o=>!before.some(x=>x.id===o.id)),removed=before.filter(o=>!target.some(x=>x.id===o.id));$('upResult').innerHTML=`<div class="previewNote" style="margin-top:20px">${same?'已经是当前引用。':`新增 ${added.length} 个对象，移除 ${removed.length} 个对象。此处仅演示对象差异，不是完整兼容性分析。已有映射保留。`}</div>${same?'':'<div class="fullfoot"><button id="applyUpgrade" class="primary">确认切换项目引用（模拟）</button></div>'}`;if($('applyUpgrade'))$('applyUpgrade').onclick=()=>{p.ontology=oid;p.version=v;upgradePage();toast('项目引用已切换，未自动发布项目')}}}
const toolKeys=['contracts','interfaces','discover','knowledge','explorer','instances','learning','valuetypes'];
function toolsPage(){extra.innerHTML=`<div class="fullcard"><h2>更多工具</h2><p>保留辅助与历史入口，不把它们增加为本体建设必填步骤。</p><div class="toolgrid">${toolKeys.map(k=>`<button data-go="${k}"><strong>${titles[k]}</strong><p>查看${k==='contracts'||k==='valuetypes'?'已有定义':'示例内容'} →</p></button>`).join('')}<button data-go="binding"><strong>旧版映射入口</strong><p>跳转当前对象映射 →</p></button></div></div>`;links()}
function legacy(k){const examples={contracts:['查询储能簇 SOC','历史输入输出契约，保留已有定义。本期不恢复为基础建模步骤。'],interfaces:['可命名对象','描述对象对外提供的共同行为和属性，不是 HTTP 接口。'],learning:['储能图谱导入材料','旧图谱中的对象、属性及项目技术字段需区分；历史资料不会自动成为当前本体。'],valuetypes:['百分比范围','数值范围 0–100，仅演示历史约束定义，不恢复为必填流程。']},e=examples[k];extra.innerHTML=`<div class="fullcard"><h2>${titles[k]}</h2><p>历史／辅助功能的只读布局示例</p><table><thead><tr><th>名称</th><th>说明</th><th></th></tr></thead><tbody><tr><td>${e[0]}</td><td class="def">${e[1]}</td><td><button id="legacyDetail">查看详情</button></td></tr></tbody></table><div class="fullfoot"><button data-go="tools">返回更多工具</button></div></div>`;links();$('legacyDetail').onclick=()=>openDialog(`<h2>${e[0]}</h2><div class="previewNote">${e[1]}</div><p>本期只读示意，未读取真实历史数据。</p><div class="foot"><button data-close>关闭</button></div>`)}
function browsePage(){extra.innerHTML=`<div class="fullcard"><h2>本体浏览</h2><p>按资源分类浏览，点击进入维护。</p><div class="row"><button data-go="objects">对象类型 · ${O().objects.length}</button><button data-go="library">共享属性 · ${O().library.length}</button><button data-go="actions">动作 · ${O().actions.length}</button><button data-go="rules">业务规则 · ${O().rules.length}</button></div><div class="fullfoot"><button data-go="knowledge">在画布查看关系</button></div></div>`;links()}
function graphPage(){extra.innerHTML=`<div class="fullcard"><h2>本体画布</h2><p>关系示意，点击对象进入详情；正式产品复用现有图编辑器。</p><div class="flowtrack">${O().objects.slice(0,3).map((o,i)=>`${i?'<span>← 所属 ←</span>':''}<button class="flownode" data-graph="${o.id}">${esc(o.name)}</button>`).join('')||'<p>当前本体尚无对象</p>'}</div><div id="graphInfo" class="previewNote">对象类型为节点；属性在详情中展示，不强制画成节点。</div></div>`;document.querySelectorAll('[data-graph]').forEach(b=>b.onclick=()=>{navigate('objects');locate(b.dataset.graph)})}
function instancePage(calc){extra.innerHTML=`<div class="fullcard"><h2>${calc?'实例与计算预览':'对象数据浏览'}</h2><div class="sim">固定模拟实例，与真实数据库和设备无关。</div><table><thead><tr><th>实例</th><th>对象类型</th><th>额定容量</th><th>SOC</th><th></th></tr></thead><tbody><tr><td>示例设备 A</td><td>储能设备</td><td>100 kWh</td><td>60%</td><td><button id="instanceDetail">${calc?'计算剩余电量':'查看实例'}</button></td></tr></tbody></table><div id="instanceResult" style="margin-top:18px"></div></div>`;$('instanceDetail').onclick=()=>{$('instanceResult').innerHTML=calc?'<div class="previewNote">模拟计算：100 × 60% = 60 kWh。固定示例，不调用项目规则。</div>':'<div class="previewNote">实例：示例设备 A<br>来源：原型内存数据<br>所属系统：示例储能系统</div>'}}
$('spaceOntology').onclick=()=>changeArea('ontology');$('spaceProject').onclick=()=>changeArea('project');$('contextPicker').onclick=contextDialog;
// Update object-detail entry points so every primary control opens a page, not a dead menu.
const basePanel=panel;panel=function(o){basePanel(o);if($('addAction'))$('addAction').onclick=()=>{openDialog(`<h2>为 ${esc(o.name)} 关联动作</h2><p>选择动作库中的定义；不复制为私有定义。</p>${O().actions.map(a=>`<label class="row"><input type="checkbox" style="width:auto" data-pickaction="${a.id}" ${o.actions.includes(a.name)?'checked':''}>${esc(a.name)}</label>`).join('')||'<p>先到动作定义创建动作。</p>'}<div class="foot"><button data-close>取消</button><button id="associate" class="primary">保存关联</button></div>`);$('associate').onclick=()=>{o.actions=[...document.querySelectorAll('[data-pickaction]:checked')].map(el=>O().actions.find(a=>a.id===el.dataset.pickaction).name);$('dialog').close();renderDetail();renderList()}};if($('addProp'))$('addProp').onclick=()=>{openDialog('<h2>新建属性</h2><label>名称 *</label><input id="newPropName"><label>业务定义 *</label><textarea id="newPropDesc"></textarea><label>数据类型</label>'+selectHTML('newPropType',['文本','数值','是/否','日期','时间序列'],'文本')+'<div class="foot"><button data-close>取消</button><button class="primary" id="saveProp">保存</button></div>');$('saveProp').onclick=()=>{if(!$('newPropName').value.trim()||!$('newPropDesc').value.trim()){toast('请填写名称和定义');return}o.props.push([$('newPropName').value,$('newPropType').value,$('newPropDesc').value]);$('dialog').close();renderDetail();renderList()}};if($('copy'))$('copy').onclick=()=>{const candidates=O().objects.flatMap(x=>x.props.map(p=>({object:x.name,p}))).slice(0,30);openDialog(`<h2>从已有属性复制</h2><p>保存后独立维护，不复制项目取值配置。</p><div style="max-height:320px;overflow:auto">${candidates.map((x,i)=>`<button class="pickeritem" data-copy="${i}">${esc(x.p[0])}<small>${esc(x.object)}</small></button>`).join('')||'<p>暂无可复制属性</p>'}</div><div class="foot"><button data-close>取消</button></div>`);document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{o.props.push(structuredClone(candidates[Number(b.dataset.copy)].p));$('dialog').close();renderDetail();renderList();toast('已复制到当前示例对象，可独立维护')})};if($('addLink'))$('addLink').onclick=()=>{openDialog('<h2>新建链接 · 布局示意</h2><label>正向名称</label><input id="linkLabel" placeholder="所属系统"><label>终点类型</label>'+selectHTML('linkObject',O().objects.map(x=>({id:x.id,name:x.name})),O().objects[0]?.id)+'<p>此原型已有关系为固定示例。本弹窗展示录入布局，不写入图谱结构。</p><div class="foot"><button data-close>关闭</button></div>')}};
navigate('o-home');

</script></body></html>
