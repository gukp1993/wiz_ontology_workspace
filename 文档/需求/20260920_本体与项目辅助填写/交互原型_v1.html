<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本体与项目辅助填写 · 交互原型 v1（假数据，不连接模型）</title>
<style>
/* ============ 令牌：与当前工作台 style.css 对齐 ============ */
:root{
  --ink:#182c3e; --ink-2:#3d5063; --muted:#5b6d7e; --faint:#8394a5;
  --bg:#f6f8fa; --paper:#ffffff; --paper-2:#f4f7fa; --paper-3:#eef2f6;
  --line:#dce4eb; --line-2:#c9d5e0;
  --blue:#245cdf; --blue-deep:#1a49b0; --blue-ink:#234fa8; --blue-soft:#edf3ff; --blue-line:#b8cff8;
  --focus:#245cdf;
  --ok:#1f7a55; --ok-soft:#eefaf3; --ok-line:#cdebd8;
  --warn:#8a6116; --warn-soft:#fff8e8; --warn-line:#f0dfb2;
  --danger:#b03a3a; --danger-deep:#8f2f2f; --danger-soft:#fdf0f0; --danger-line:#f2cfcf;
  --backdrop:#10283d66;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --shadow-1:0 1px 2px rgba(24,44,62,.08);
  --shadow-2:0 16px 48px rgba(16,40,61,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;
  color:var(--ink); background:var(--bg);
}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h2{font-size:17px;font-weight:650;margin:0}
h3{font-size:15px;font-weight:650;margin:0}

/* ============ 演示条 ============ */
#demo-bar{
  position:fixed;top:0;left:0;right:0;height:38px;z-index:60;
  background:#2b2f3a;color:#e8ebf2;display:flex;align-items:center;gap:14px;
  padding:0 14px;font-size:12.5px;white-space:nowrap;overflow-x:auto;
}
#demo-bar .demo-tag{background:#8a6116;color:#fff;border-radius:var(--r-pill);padding:2px 10px;font-weight:600;flex:none}
#demo-bar label{display:flex;align-items:center;gap:5px;color:#c6cede;flex:none}
#demo-bar select{background:#3a3f4d;color:#e8ebf2;border:1px solid #4a5062;border-radius:var(--r-sm);padding:2px 6px;font-size:12.5px}
#demo-bar .demo-note{color:#9aa4b6;flex:none}

/* ============ 布局 ============ */
#rail{
  position:fixed;top:38px;bottom:0;left:0;width:224px;background:var(--paper);
  border-right:1px solid var(--line);padding:12px 10px;overflow-y:auto;z-index:40;
}
#topbar{
  position:fixed;top:38px;left:224px;right:0;height:56px;background:var(--paper);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
  padding:0 24px;z-index:30;
}
#main{margin:94px 0 0 244px;padding:20px 24px 40px}
#main.with-panel{margin-right:484px}
@media (max-width:1200px){ #main.with-panel{margin-right:24px} }

.space-switch{display:flex;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:12px}
.space-switch button{flex:1;padding:7px 0;border:0;background:var(--paper);color:var(--muted);font-weight:500}
.space-switch button.on{background:var(--blue);color:#fff}
.rail-asset{font-size:12.5px;color:var(--muted);padding:6px 10px;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:10px;word-break:break-all}
.rail-asset b{color:var(--ink-2);font-weight:600}
#rail .nav-btn{display:block;width:100%;text-align:left;padding:8px 10px;font-size:14px;font-weight:500;border:0;background:none;border-radius:var(--r-sm);color:var(--ink-2);margin-bottom:2px}
#rail .nav-btn:hover{background:var(--paper-2);color:var(--blue-ink)}
#rail .nav-btn.on{background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.rail-cap{font-size:11.5px;color:var(--faint);padding:10px 10px 4px;letter-spacing:.05em}

.crumb{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:8px;min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.crumb .sep{color:var(--line-2)}
.crumb .ver{background:var(--paper-3);border:1px solid var(--line);border-radius:var(--r-pill);padding:1px 9px;font-size:12px;color:var(--ink-2)}
.topbar-spacer{flex:1}

/* ============ 卡片与表单 ============ */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:20px;box-shadow:var(--shadow-1);margin-bottom:16px}
.page-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.page-head .ttl{min-width:0}
.page-head .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.page-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dirty-pill{font-size:12px;border-radius:var(--r-pill);padding:2px 10px;border:1px solid var(--warn-line);background:var(--warn-soft);color:var(--warn)}
.saved-pill{font-size:12px;border-radius:var(--r-pill);padding:2px 10px;border:1px solid var(--ok-line);background:var(--ok-soft);color:var(--ok)}

button.btn{padding:6px 13px;border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);font-size:14px;color:var(--ink-2)}
button.btn:hover{border-color:var(--blue-line);color:var(--blue-ink)}
button.btn:active{transform:translateY(1px)}
button.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.btn.primary:hover{background:var(--blue-deep);border-color:var(--blue-deep);color:#fff}
button.btn.ghost{border-color:transparent;background:transparent;color:var(--blue-ink);padding:4px 8px}
button.btn.small{padding:3px 9px;font-size:12.5px}
button.btn:disabled{opacity:.55;cursor:not-allowed}
button.btn.danger-ghost{border-color:var(--danger-line);color:var(--danger)}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:900px){.form-grid{grid-template-columns:1fr}}
.field{margin:14px 0}
.field.full{grid-column:1 / -1}
.field-label{display:block;font-size:13px;color:var(--muted);margin:0 0 5px}
.field-label .req{color:var(--danger);margin-left:2px}
.field-label .opt{color:var(--faint);margin-left:6px;font-size:12px}
.field input[type=text],.field select,.field textarea{
  width:100%;min-height:40px;padding:9px 11px;font-size:14px;
  border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;margin-top:0;
}
.field textarea{min-height:96px;line-height:1.8;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--blue-line)}
.field .hint{font-size:12px;color:var(--faint);margin-top:4px}
.field .err{font-size:12.5px;color:var(--danger);margin-top:4px}
.field .static-val{min-height:40px;padding:9px 11px;border:1px dashed var(--line-2);border-radius:var(--r-sm);background:var(--paper-2);color:var(--ink-2)}
.field .ro-val{padding:9px 11px;background:var(--paper-3);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--muted);font-size:13px}
details.fold{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
details.fold summary{cursor:pointer;color:var(--blue-ink);font-size:13px;user-select:none}

.desc-card{border:1px solid #ccd8e6;border-radius:7px;background:#fff;margin:14px 0}
.desc-card .desc-head{display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--paper-2)}
.desc-card .desc-head b{font-size:13px}
.desc-card .desc-head button{margin-left:auto;border:0;background:none;color:var(--blue-ink);font-size:12.5px}
.desc-card textarea{border:0;border-radius:0 0 7px 7px;min-height:140px;padding:12px 14px;font-size:13px;line-height:1.9;width:100%;resize:vertical}

/* 列表与表格 */
table.lst{width:100%;border-collapse:collapse}
table.lst th{height:40px;text-align:left;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);font-weight:500}
table.lst td{border-bottom:1px solid var(--line);padding:10px 8px;font-size:13.5px;vertical-align:top}
table.lst tr.cur td{background:var(--blue-soft)}
table.lst button.pick{border:0;background:none;color:var(--blue-ink);font-weight:600;padding:0}
.tag{display:inline-block;font-size:11.5px;border-radius:var(--r-pill);padding:1px 8px;border:1px solid var(--line);background:var(--paper-2);color:var(--muted);margin-left:6px;white-space:nowrap}
.tag.blue{border-color:var(--blue-line);background:var(--blue-soft);color:var(--blue-ink)}
.tag.ok{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ok)}
.tag.warn{border-color:var(--warn-line);background:var(--warn-soft);color:var(--warn)}
.tag.danger{border-color:var(--danger-line);background:var(--danger-soft);color:var(--danger)}
.split{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
@media (max-width:1000px){.split{grid-template-columns:1fr}}
.obj-list{list-style:none;margin:0;padding:0}
.obj-list li{padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.obj-list li:hover{background:var(--paper-2)}
.obj-list li.on{background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 4px}
.tabs button{border:0;background:none;padding:8px 14px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--blue-ink);font-weight:600;border-bottom-color:var(--blue)}
.note{font-size:12.5px;color:var(--muted);background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;margin:10px 0}
.note b{color:var(--ink-2)}

/* Key 模板编辑 */
.tpl-wrap{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:7px 8px;background:#fff;min-height:40px}
.tpl-seg{background:var(--paper-3);border-radius:4px;padding:4px 8px;font-size:13px;color:var(--ink-2);word-break:break-all}
.tpl-tok{display:inline-flex;align-items:center;gap:4px;background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:4px;padding:2px 4px;font-size:12.5px;color:var(--blue-ink)}
.tpl-tok select{border:1px solid var(--blue-line);border-radius:4px;background:#fff;font-size:12px;padding:2px 3px}
.tpl-add{display:flex;gap:6px;margin-top:6px;align-items:center}
.tpl-add input{flex:1;min-height:32px;padding:4px 8px;font-size:13px}

/* 参数表 */
table.params{width:100%;border-collapse:collapse}
table.params th{font-size:12px;color:var(--muted);text-align:left;border-bottom:1px solid var(--line);padding:6px 6px;font-weight:500}
table.params td{border-bottom:1px solid var(--line);padding:6px 6px;vertical-align:middle}
table.params select,table.params input{min-height:34px;padding:5px 8px;font-size:13px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;width:100%}

/* ============ 辅助面板 ============ */
#panel-backdrop{position:fixed;inset:38px 0 0 0;background:var(--backdrop);z-index:65;display:none}
#panel{
  position:fixed;top:38px;right:0;bottom:0;width:440px;max-width:94vw;z-index:70;
  background:var(--paper);border-left:1px solid var(--line);box-shadow:var(--shadow-2);
  display:none;flex-direction:column;
}
#panel.open{display:flex}
@media (min-width:1201px){ #panel{box-shadow:none} }
@media (max-width:1200px){ #panel{width:min(440px,94vw)} #panel-backdrop.on{display:block} }
.panel-head{flex:none;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-head .row1{display:flex;align-items:center;gap:8px}
.panel-head h3{flex:1;min-width:0}
.panel-head .close{border:0;background:none;font-size:18px;color:var(--muted);line-height:1;padding:2px 8px}
.panel-target{margin-top:6px;font-size:12.5px;color:var(--muted);background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 9px;word-break:break-all}
.panel-target b{color:var(--blue-ink)}
.panel-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px;flex:none}
.panel-tabs button{border:0;background:none;padding:9px 10px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.panel-tabs button.on{color:var(--blue-ink);font-weight:600;border-bottom-color:var(--blue)}
.panel-body{flex:1;overflow-y:auto;padding:12px 14px;overscroll-behavior:contain}
.panel-foot{flex:none;border-top:1px solid var(--line);padding:10px 14px;background:var(--paper-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-foot .foot-hint{font-size:12px;color:var(--muted);flex:1;min-width:120px}
.panel-foot .foot-btns{display:flex;gap:8px}

.ctx-details{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper-2);margin:8px 0;font-size:12.5px}
.ctx-details summary{padding:7px 10px;cursor:pointer;color:var(--ink-2);font-weight:500}
.ctx-details .ctx-body{padding:2px 12px 10px;color:var(--muted)}
.ctx-details .ctx-body p{margin:5px 0}
.ctx-line b{color:var(--ink-2);font-weight:600}

.intent-box{width:100%;min-height:88px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);font-size:13.5px;line-height:1.8;resize:vertical}
.ex-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ex-chips .ex-cap{width:100%;font-size:12px;color:var(--faint)}
.ex-chips button{border:1px dashed var(--blue-line);background:var(--blue-soft);color:var(--blue-ink);border-radius:var(--r-pill);padding:3px 10px;font-size:12.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}

.q-card{border:1px solid var(--warn-line);background:var(--warn-soft);border-radius:var(--r-sm);padding:10px 12px;margin:10px 0}
.q-card .q-t{font-size:13px;font-weight:600;color:var(--warn)}
.q-card .q-o{display:flex;flex-direction:column;gap:4px;margin-top:7px}
.q-card .q-o label{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--ink-2);cursor:pointer}

.sug-card{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin:10px 0;background:#fff}
.sug-card.blocked,.sug-card.pending{background:var(--paper-2)}
.sug-top{display:flex;gap:8px;align-items:flex-start}
.sug-top input[type=checkbox]{margin-top:4px;width:15px;height:15px;flex:none}
.sug-field{font-size:13.5px;font-weight:650;color:var(--ink);flex:1;min-width:0}
.sug-src{font-size:11px;border-radius:var(--r-pill);padding:1px 8px;border:1px solid var(--line);background:var(--paper-2);color:var(--muted);flex:none}
.sug-src.user{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ok)}
.sug-src.cat{border-color:var(--blue-line);background:var(--blue-soft);color:var(--blue-ink)}
.sug-src.sug{border-color:var(--warn-line);background:var(--warn-soft);color:var(--warn)}
.sug-diff{margin:7px 0 0;font-size:13px;display:grid;gap:4px}
.sug-diff .old{color:var(--faint);text-decoration:line-through;word-break:break-all}
.sug-diff .old.none{text-decoration:none;font-style:italic}
.sug-diff .new{color:var(--ink);background:var(--paper-2);border:1px solid var(--line);border-radius:4px;padding:4px 8px;word-break:break-all;white-space:pre-wrap}
.sug-reason{font-size:12.5px;color:var(--muted);margin-top:6px}
.sug-block{font-size:12.5px;color:var(--danger);margin-top:6px;background:var(--danger-soft);border:1px solid var(--danger-line);border-radius:4px;padding:4px 8px}
.sug-pend{font-size:12.5px;color:var(--warn);margin-top:6px;background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:4px;padding:4px 8px}
.stale-banner{border:1px solid var(--danger-line);background:var(--danger-soft);color:var(--danger);border-radius:var(--r-sm);padding:8px 10px;font-size:12.5px;margin:10px 0}
.gen-state{border:1px solid var(--blue-line);background:var(--blue-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;margin:10px 0;color:var(--blue-ink)}
.fail-state{border:1px solid var(--danger-line);background:var(--danger-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;margin:10px 0;color:var(--danger)}
.nomi-state{border:1px solid var(--warn-line);background:var(--warn-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;margin:10px 0;color:var(--warn)}
.panel-note{font-size:12px;color:var(--faint);margin:8px 0}
.filled-tip{font-size:12.5px;color:var(--ok);background:var(--ok-soft);border:1px solid var(--ok-line);border-radius:var(--r-sm);padding:6px 10px;margin:8px 0}

.issue-card{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:var(--r-sm);padding:9px 11px;margin:9px 0;font-size:13px;background:#fff}
.issue-card .i-f{font-weight:650}
.issue-card .i-d{color:var(--muted);font-size:12.5px;margin-top:3px}
.issue-card button{margin-top:6px}

.expl-pick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.expl-pick button{border:1px solid var(--line);background:var(--paper-2);border-radius:var(--r-pill);padding:4px 11px;font-size:12.5px;color:var(--ink-2)}
.expl-pick button.on{border-color:var(--blue-line);background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.expl-card{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;margin:10px 0;font-size:13px;background:#fff}
.expl-card h4{margin:0 0 6px;font-size:13.5px}
.expl-card p{margin:6px 0;color:var(--ink-2)}
.expl-card .cap{font-size:12px;color:var(--faint)}

/* ============ 弹窗与提示 ============ */
#modal-back{position:fixed;inset:0;background:var(--backdrop);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
#modal-back.on{display:flex}
.modal-card{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:24px 26px;width:min(560px,94vw);max-height:80vh;overflow-y:auto}
.modal-card h3{margin-bottom:10px}
.modal-card ul{margin:8px 0;padding-left:20px}
.modal-card .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:30px;background:#22303c;color:#fff;border-radius:var(--r-pill);padding:8px 18px;font-size:13px;z-index:120;display:none;max-width:80vw;box-shadow:var(--shadow-2)}
.sim-tag{font-size:11px;color:var(--faint);font-style:normal}
</style>
</head>
<body>
<div id="demo-bar" role="region" aria-label="演示控制">
  <span class="demo-tag">交互原型</span>
  <span class="demo-note">假数据 · 预置建议 · 不连接模型 · 刷新即重置</span>
  <label>模型演示：<select id="dm-model" aria-label="模型演示状态">
    <option value="ok">正常</option><option value="nomodel">无模型</option><option value="fail">请求失败</option><option value="slow">生成延迟</option>
  </select></label>
  <label>表目录演示：<select id="dm-catalog" aria-label="表目录演示状态">
    <option value="ok">正常</option><option value="missing">目录缺失</option>
  </select></label>
  <label>已有编排演示：<select id="dm-flow" aria-label="已有编排演示状态">
    <option value="ok">输出兼容</option><option value="text">输出改为文本</option>
  </select></label>
  <span class="demo-note">演示控制仅影响建议生成，不改动表单数据；本页所有“保存”均为内存演示保存。</span>
</div>
<nav id="rail" aria-label="主导航"></nav>
<header id="topbar"><div id="crumb" class="crumb"></div><div class="topbar-spacer"></div><div id="top-status"></div></header>
<main id="main"></main>
<div id="panel-backdrop"></div>
<aside id="panel" role="complementary" aria-label="辅助填写面板"></aside>
<div id="modal-back"><div class="modal-card" id="modal-card" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<script>
'use strict';
/* =====================================================================
   本体与项目辅助填写 · 交互原型 v1
   单文件离线原型：内存演示仓库 + 编辑缓冲区分离；刷新复位；无任何网络调用。
   ===================================================================== */

/* ---------------- 工具 ---------------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;}
function $(sel,root){return (root||document).querySelector(sel);}
function $$(sel,root){return Array.prototype.slice.call((root||document).querySelectorAll(sel));}
function trunc(s,n){s=String(s==null?'':s);return s.length>n?s.slice(0,n)+'…':s;}
let toastTimer=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.style.display='none';},2600);}

/* 引用令牌：{token} 拆分/合并（数组形如 ['str',{key,src}]） */
function tplParse(s){const out=[];const re=/\{([^{}]*)\}/g;let last=0,m;
  while((m=re.exec(s))){if(m.index>last)out.push(s.slice(last,m.index));
    out.push({key:m[1],src:''});last=re.lastIndex;}
  if(last<s.length)out.push(s.slice(last));return out;}
function tplSerialize(segs){return segs.map(function(s){return typeof s==='string'?s:'{'+s.key+'}';}).join('');}
function tplKeyPreview(segs){return segs.map(function(s){return typeof s==='string'?s:('‹'+ (s.src==='pk'?'1001':s.src==='attr:cluster_code'?s.src:'…') +'›');}).join('');}

/* ---------------- 表单渲染引擎 ---------------- */
function getByPath(o,p){return p.split('.').reduce(function(a,k){return a==null?a:a[k];},o);}
function setByPath(o,p,v){const ks=p.split('.');const last=ks.pop();
  ks.reduce(function(a,k){if(a[k]==null)a[k]={};return a[k];},o)[last]=v;}

/* field 描述：{k,label,type:text|textarea|select|static|ro,opts:[[v,l]],req,opt,ph,hint,full,show,display} */
function fieldHTML(f,buf){
  if(f.show&&!f.show(buf))return '';
  const v=getByPath(buf,f.k);
  const cls='field'+(f.full?' full':'');
  let lab='<label class="field-label" for="f_'+f.k+'">'+esc(f.label)+(f.req?'<span class="req">*</span>':'')+(f.opt?'<span class="opt">选填</span>':'')+'</label>';
  let inner='';
  if(f.type==='text')inner='<input type="text" id="f_'+f.k+'" data-k="'+f.k+'" value="'+esc(v==null?'':v)+'" placeholder="'+esc(f.ph||'')+'">';
  else if(f.type==='textarea')inner='<textarea id="f_'+f.k+'" data-k="'+f.k+'" rows="'+(f.rows||4)+'" placeholder="'+esc(f.ph||'')+'">'+esc(v==null?'':v)+'</textarea>';
  else if(f.type==='select'){
    let os=(typeof f.opts==='function'?f.opts(buf):f.opts).map(function(o){
      return '<option value="'+esc(o[0])+'"'+(String(v)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>';}).join('');
    inner='<select id="f_'+f.k+'" data-k="'+f.k+'"'+(f.disabled?' disabled':'')+'>'+os+'</select>';
  }
  else if(f.type==='static')inner='<div class="static-val">'+(f.display||esc(v))+'</div>';
  else inner='<div class="ro-val">'+(f.display||esc(v))+'</div>';
  return '<div class="'+cls+'" data-fld="'+f.k+'">'+lab+inner+(f.hint?'<div class="hint">'+f.hint+'</div>':'')+'<div class="err" data-err="'+f.k+'" hidden></div></div>';
}
function bindFormInputs(scope,buf,onSoft,onRerender){
  $$('[data-k]',scope).forEach(function(node){
    const k=node.dataset.k;
    const ev=node.tagName==='SELECT'?'change':'input';
    node.addEventListener(ev,function(){
      setByPath(buf,k,node.value);
      if(k==='dataType'&&node.value!=='timeSeries'&&('obsType' in buf))buf.obsType='';
      invalidateAdoption(curEditKey());
      if(node.tagName==='SELECT')onRerender(k);else onSoft(k);
    });
  });
}
function showErrors(scope,errs){
  errs.forEach(function(e){const n=$('[data-err="'+e.k+'"]',scope);if(n){n.textContent=e.msg;n.hidden=false;}});
}

  const v=getByPath(buf,r.k);if(!v||!String(v).trim())errs.push({k:r.k,msg:'请填写'+r.label+'。'});});return errs;}

/* 缓冲区 */
function extract(editKey){
  const m=editKey.split(':');const kind=m[0],id=m[1];
  if(kind==='o')return clone(findObj(id));
  if(kind==='p'){const p=findProp(id);return clone(p);}
  if(kind==='sh')return clone(findShared(id));
  if(kind==='lk')return clone(findLink(id));
  if(kind==='rule')return clone(findRule(id));
  if(kind==='act')return clone(findAction(id));
  if(kind==='pi')return clone(SAVED.prj.instanceSrcs[id]);
  if(kind==='ps'){const s=psOf(id);const b=clone(s);delete b.prop;delete b.kind;if(b.bind&&!b.bindv)b.bindv={};return b;}
  if(kind==='lm')return clone(SAVED.prj.linkMaps[id]);
  if(kind==='ab')return clone(SAVED.prj.actionBinds[id]);
  return {};
}
function bufOf(editKey){
  const cur=JSON.stringify(extract(editKey));
  if(!BUFFERS[editKey]||BUFFERS[editKey].__seed!==cur){
    const b=extract(editKey);b.__seed=cur;BUFFERS[editKey]=b;
  }
  return BUFFERS[editKey];
}
function isDirty(editKey){const b=BUFFERS[editKey];if(!b)return false;
  const c=clone(b);delete c.__seed;return JSON.stringify(c)!==b.__seed;}
function commitSave(editKey){
  const b=BUFFERS[editKey];const c=clone(b);delete c.__seed;delete c.__filledTip; /* 内部提示标志不入库 */
  if(c.dataType&&c.dataType!=='timeSeries')c.obsType=''; /* 非时间序列不残留观测值类型 */
  const m=editKey.split(':');const kind=m[0],id=m[1];
  if(kind==='o')Object.assign(findObj(id),c);
  else if(kind==='p')Object.assign(findProp(id),c);
  else if(kind==='sh')Object.assign(findShared(id),c);
  else if(kind==='lk')Object.assign(findLink(id),c);
  else if(kind==='rule')Object.assign(findRule(id),c);
  else if(kind==='act')Object.assign(findAction(id),c);
  else if(kind==='pi')Object.assign(SAVED.prj.instanceSrcs[id],c);
  else if(kind==='ps')Object.assign(psOf(id),c);
  else if(kind==='lm')Object.assign(SAVED.prj.linkMaps[id],c);
  else if(kind==='ab')Object.assign(SAVED.prj.actionBinds[id],c);
  delete BUFFERS[editKey];
  REQ++; /* 保存后旧建议基线失效 */
}
function curEditKey(){return editKeyOf(NAV);}
function editKeyOf(n){
  if(n.space==='ont'){
    if(n.page==='obj')return n.propId&&n.tab==='props'&&n.propFocus? 'p:'+n.propId : (n.linkId&&n.tab==='links'&&n.linkFocus? 'lk:'+n.linkId : 'o:'+n.objId);
    if(n.page==='shared')return 'sh:'+n.sharedId;
    if(n.page==='rules')return 'rule:'+n.ruleId;
    if(n.page==='actions')return 'act:'+n.actionId;
  }else{
    if(n.page==='mapping'){
      if(n.pTab==='instance')return 'pi:'+n.pObjId;
      if(n.pTab==='props')return 'ps:'+n.psId;
      if(n.pTab==='links')return 'lm:'+n.lmId;
      if(n.pTab==='actions')return 'ab:'+n.abId;
    }
  }
  return null;
}

function bindFormBtns(scope,ek,hooks){

  if(!sv)return true;
  if(/^（(空|未|待|无)/.test(sv))return true;
  var segs=sv.split('；');

/* =====================================================================
   辅助面板
   ===================================================================== */
function panelState(ek){
  if(!PANELS[ek])PANELS[ek]={tab:'fill',intent:'',answers:{},state:'idle',mode:null,result:null,baseline:null,
    undo:null,canUndo:false,undoReason:'',checked:{},notice:'',explains:null};
  return PANELS[ek];}
function openPanel(ek){
  if(!SCEN[ek]){toast('该表单本原型未提供辅助入口');return;}
  if(panelCur&&panelCur!==ek)REQ++;
  panelCur=ek;panelOpen=true;panelState(ek);render();
  const ta=$('#p-intent');if(ta&&panelState(ek).tab==='fill')ta.focus();}
function closePanel(){REQ++;const p=panelCur?PANELS[panelCur]:null;
  if(p&&p.state==='gen'){p.state='idle';p.notice='面板已关闭时取消了生成；迟到结果将被忽略。';}
  panelOpen=false;render();}
function discardPanelResult(ek,msg){
  const p=PANELS[ek];if(!p)return;
  if(p.result||p.state==='gen'){p.result=null;p.state='idle';p.notice=msg||'';}}
function invalidateAdoption(ek){
  const p=PANELS[ek];if(!p)return;
  if(p.undo&&p.canUndo){p.canUndo=false;p.undoReason='采纳后你已手动编辑表单：直接撤销会覆盖新修改。请在表单中手动修正，或重新生成建议后再采纳。';renderPanelIfOpen(ek);}}
function baselineOf(ek){
  const b=BUFFERS[ek]||extract(ek);const sc=SCEN[ek];
  if(sc.baseline)return sc.baseline(b);
  const o={};(sc.keys||Object.keys(b)).forEach(function(k){o[k]=b[k];});
  return JSON.stringify(o);}
function renderPanelIfOpen(ek){if(panelOpen&&panelCur===ek)renderPanel();}

let panelCur=null;

function isStale(ek){const p=PANELS[ek];return p&&p.result&&p.baseline&&p.baseline!==baselineOf(ek);}

function renderPanel(){
  const host=$('#panel');
  if(!panelOpen||!panelCur){host.classList.remove('open');$('#panel-backdrop').classList.remove('on');return;}
  const ek=panelCur;const sc=SCEN[ek];const p=panelState(ek);
  if(!sc){closePanel();return;}
  host.classList.add('open');
  if(window.innerWidth<=1200)$('#panel-backdrop').classList.add('on');else $('#panel-backdrop').classList.remove('on');
  const buf=BUFFERS[ek]||extract(ek);
  let h='<div class="panel-head"><div class="row1"><h3>辅助填写</h3>'
   +'<button class="close" id="p-close" aria-label="关闭辅助面板">✕</button></div>'
   +'<div class="panel-target">当前目标：<b>'+esc(sc.target)+'</b><br><span style="color:var(--faint)">切换页面/记录后面板跟随新目标，不沿用旧结果</span></div></div>';
  h+='<div class="panel-tabs" role="tablist">'
   +tabBtn('fill','帮我填写',p)+tabBtn('check','检查当前内容',p)+tabBtn('explain','解释怎么填',p)+'</div>';
  h+='<div class="panel-body" id="p-body">';
  if(p.notice)h+='<div class="gen-state" style="background:var(--paper-2);border-color:var(--line);color:var(--muted)">'+esc(p.notice)+'</div>';
  if(p.tab==='fill')h+=panelFillHTML(p,buf);
  else if(p.tab==='check')h+=panelCheckHTML(p,buf);
  else h+=panelExplainHTML(p,sc);
  h+='</div>';
  h+=panelFootHTML(p,ek);
  host.innerHTML=h;
  bindPanel(host,ek,p,buf);
}
function tabBtn(t,label,p){return '<button role="tab" data-ptab="'+t+'" class="'+(p.tab===t?'on':'')+'" aria-selected="'+(p.tab===t)+'">'+label+'</button>';}

function panelFillHTML(p,buf){
  const ek=panelCur;const sc=SCEN[ek];
  let h=ctxHTML(p,sc,buf);
  h+='<label class="field-label" for="p-intent">你想填什么／问题描述（可粘贴你的资料文字）</label>';
  h+='<textarea id="p-intent" class="intent-box" aria-label="意图描述" placeholder="例如：电池还剩多少电……">'+esc(p.intent)+'</textarea>';
  if(!p.intent.trim()){
    h+='<div class="ex-chips"><span class="ex-cap">空输入时提供本场景示例（点击带入；原型按预置场景返回示例，不假装理解任意文字）：</span>';
    (sc.examples||[]).forEach(function(x,i){h+='<button data-ex="'+i+'" title="'+esc(x)+'">'+esc(trunc(x,38))+'</button>';});
    h+='</div>';
  }
  if(p.state==='nomodel'){
    h+='<div class="nomi-state"><b>尚未配置模型</b><br>本原型不连接真实模型。正式实现中此处为配置引导。<div style="margin-top:8px"><button class="btn" id="goto-llm">前往模型设置（只读示意）→</button></div>你的输入已保留。</div>';
  }
  if(p.state==='gen'){
    h+='<div class="gen-state">生成中…（演示：根据场景返回预置示例，'+'"'+esc(DEMO.model==='slow'?'延迟约 3 秒':'瞬间返回')+'"）重复提交已禁用；可点“取消生成”。</div>';
  }
  if(p.state==='fail'){
    h+='<div class="fail-state"><b>请求失败（演示）</b>：你的文字与已有配置均已保留，未填入任何空值。<div style="margin-top:8px"><button class="btn" id="retry-gen">重试</button></div></div>';
  }
  if(p.result){h+=resultHTML(p,buf);}
  if(p.state==='empty'){
    h+='<div class="gen-state" style="background:var(--paper-2);border-color:var(--line);color:var(--muted)">本次没有产出有效建议（演示状态）。表单未做任何修改，可调整描述后重试。</div>';
  }
  return h;
}
function panelCheckHTML(p,buf){
  const sc=SCEN[panelCur];
  let h='<p class="panel-note">读取当前<b>未保存</b>表单进行检查；不修改数据、不会先静默保存。</p>';
  h+=ctxHTML(p,sc,buf);
  if(p.state==='gen')h+='<div class="gen-state">检查中…（演示）可点“取消生成”。</div>';
  if(p.state==='fail')h+='<div class="fail-state"><b>请求失败（演示）</b>：已有内容保留。<div style="margin-top:8px"><button class="btn" id="retry-gen">重试</button></div></div>';
  if(p.state==='nomodel')h+='<div class="nomi-state"><b>尚未配置模型</b><div style="margin-top:8px"><button class="btn" id="goto-llm">前往模型设置（只读示意）→</button></div></div>';
  if(p.result)h+=resultHTML(p,buf,true);
  return h;
}
function panelExplainHTML(p,sc){
  const exs=sc.explains||{};const ks=Object.keys(exs);
  let h='<p class="panel-note">解释只展示帮助信息，<b>不产生任何字段修改</b>。</p>';
  h+='<div class="expl-pick" role="tablist">';
  ks.forEach(function(k){h+='<button data-expl="'+k+'" class="'+(p.explains===k?'on':'')+'">'+esc(exs[k].what?explainLabel(sc,k):k)+'</button>';});
  h+='</div>';
  if(p.explains&&exs[p.explains]){
    const e=exs[p.explains];
    h+='<div class="expl-card"><h4>'+esc(explainLabel(sc,p.explains))+'</h4><p>'+esc(e.what)+'</p>'
     +'<p><b>需要你提供：</b>'+esc(e.need)+'</p>'
     +'<p class="cap">当前对象示例：'+esc(e.example||'（无）')+'</p></div>';
  }
  return h;
}
function explainLabel(sc,k){
  const map=({name:'名称',def:'业务定义',dataType:'数据类型',obsType:'观测值类型',fmt:'显示格式',card:'数量关系',fwd:'正向名称',content:'规则内容',effect:'预期效果',
    pk:'实例主键',mode:'实例来源方式',field:'取值字段',merge:'多行归并',tpl:'Key 模板',conv:'结果转换',flowId:'函数编排',bind:'输入参数绑定',
    startField:'起点关联字段',endField:'终点匹配字段',url:'接口地址',pStorageSrc:'storageId 来源'});
  return map[k]||k;}

function ctxHTML(p,sc,buf){
  const lines=sc.ctx?sc.ctx(buf):[];
  let h='<details class="ctx-details"><summary>本次参考内容（上下文摘要 · 只读）</summary><div class="ctx-body">';
  lines.forEach(function(l){h+='<p class="ctx-line"><b>'+esc(l[0])+'：</b>'+esc(l[1])+'</p>';});
  if(p.intent.trim())h+='<p class="ctx-line"><b>你输入的文字：</b>'+esc(trunc(p.intent,80))+'</p>';
  h+='<p style="margin-top:8px;color:var(--faint)">模型密钥、数据库密码、API 凭据不进入上下文；默认不发送业务记录样本。若接入远程模型，上述所选上下文将被发送。</p>';
  h+='</div></details>';
  return h;
}

function resultHTML(p,buf,checkMode){
  const r=p.result;let h='';
  if(isStale(panelCur)){
    h+='<div class="stale-banner"><b>建议已失效：</b>生成后你手动修改了表单。旧建议按整批失效处理，不会静默覆盖新内容。请点击“重新生成”。</div>';
  }
  if(checkMode&&r.issues&&r.issues.length){
    h+='<h3 style="margin:6px 0">发现的问题（'+r.issues.length+'）</h3>';
    r.issues.forEach(function(iss,i){
      h+='<div class="issue-card"><div class="i-f">'+esc(iss.f)+'</div><div class="i-d">'+esc(iss.d)+'</div>'
       +'<button class="btn small" data-locate="'+esc(iss.field)+'">定位到字段</button></div>';});
  }
  if(r.questions&&r.questions.length){
    r.questions.forEach(function(q){
      h+='<div class="q-card"><div class="q-t">需要你确认：</div>'+esc(q.q)+'<div class="q-o">';
      (q.opts||[]).forEach(function(o){
        const checked=p.answers[q.qid]===o[0]?'checked':'';
        h+='<label><input type="radio" name="'+q.qid+'" value="'+esc(o[0])+'" '+checked+'><span>'+esc(o[1])+'</span></label>';});
      h+='<label><input type="radio" name="'+q.qid+'" value="'+UN+'" '+(p.answers[q.qid]===UN?'checked':'')+'><span>暂不确定</span></label>';
      if(q.free){
        h+='<label style="margin-top:4px"><input type="radio" name="'+q.qid+'" value="__free__" '+(p.answers['__free_'+q.qid]?'checked':'')+'><span>直接填写：</span></label>';
        h+='<input type="text" data-free="'+q.qid+'" value="'+esc(p.answers[q.qid]===UN||p.answers['__free_'+q.qid]?p.answers[q.qid]||'':'')+'" placeholder="'+esc(q.ph||'')+'" aria-label="自由补充">';
      }
      h+='</div></div>';});
    h+='<p class="panel-note">回答后建议将基于已有上下文即时重算（演示，不重新请求模型）。“暂不确定”会让依赖项保持待补充。</p>';
  }
  if(r.notes&&r.notes.length){
    r.notes.forEach(function(n){h+='<div class="note">'+esc(n)+'</div>';});
  }
  if(r.suggestions&&r.suggestions.length){
    h+='<h3 style="margin:10px 0 2px">建议（逐项勾选）</h3>';
    r.suggestions.forEach(function(s,i){
      const disabled=s.blocked||s.pending||isStale(panelCur);
      const defv=p.checked[s.id]!==undefined?p.checked[s.id]:!!s.defChecked;
      h+='<div class="sug-card'+(s.blocked?' blocked':s.pending?' pending':'')+'">'
       +'<div class="sug-top"><input type="checkbox" data-sug="'+i+'" '+(defv&&!disabled?'checked':'')+(disabled?' disabled':'')+' aria-label="采纳建议：'+esc(s.label)+'">'
       +'<span class="sug-field">'+esc(s.label)+'</span><span class="sug-src '+(SRC_CLS[s.source]||'')+'">'+esc(s.source)+'</span></div>';
      h+='<div class="sug-diff">'+(!isPlaceholderOld(s.old)?'<div class="old">原值：'+esc(trunc(s.old,60))+'</div>':'<div class="old none">原值：'+esc(s.old||'（空）')+'</div>')
       +'<div class="new">建议：'+esc(trunc(s.neu,220))+'</div></div>';
      if(s.reason)h+='<div class="sug-reason">依据：'+esc(s.reason)+'</div>';
      if(s.blocked)h+='<div class="sug-block">禁止采纳：'+esc(s.blocked)+'</div>';
      if(s.pending)h+='<div class="sug-pend">待补充：'+esc(s.pending)+'</div>';
      if(s.fields&&s.fields.length&&s.fields[0]!=='tpl')h+='<button class="btn small" style="margin-top:6px" data-locate="'+esc(s.fields[0])+'">定位到字段</button>';
      h+='</div>';});
    h+='<p class="panel-note">空字段的有效建议默认选中；已有值的替换默认不选。采纳仅更新当前编辑缓冲区，不会自动保存。</p>';
  }
  if(p.mode==='fill'&&Object.keys(p.answers||{}).length)
    h+='<div style="margin-top:8px"><button class="btn small" id="reset-ans">清空补充回答并重新提问</button></div>';
  if(p.undoReason)h+='<div class="fail-state" style="background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)">'+esc(p.undoReason)+'</div>';
  if(BUFFERS[ek2filled()]&&BUFFERS[ek2filled()].__filledTip)h+='<div class="filled-tip">已填入表单，<b>尚未保存</b>。可继续编辑、撤销本次填入或用表单的“演示保存”。</div>';
  return h;
}
function ek2filled(){return panelCur;}

function panelFootHTML(p,ek){
  const r=p.result;let h='<div class="panel-foot">';
  h+='<span class="foot-hint">原型不自动保存、不发布、不执行任何请求</span><span class="foot-btns">';
  if(p.state==='gen'){
    h+='<button class="btn danger-ghost" id="cancel-gen">取消生成</button>';
  }else{
    if(p.tab==='fill')h+='<button class="btn primary" id="gen-btn">生成建议</button>';
    if(p.tab==='check')h+='<button class="btn primary" id="check-btn">'+(p.result?'重新检查':'检查当前内容')+'</button>';
    if(p.tab==='explain')h+='<span class="panel-note" style="margin:0">解释模式无采纳操作</span>';
  }
  if(r&&p.tab!=='explain'&&p.state!=='gen')h+='<button class="btn primary" id="adopt-btn" '+(isStale(ek)?'disabled':'')+'>填入所选建议</button>';
  if(r&&p.tab!=='explain'&&p.state!=='gen')h+='<button class="btn" id="regen-btn">重新生成</button>';
  if(p.undo)h+='<button class="btn" id="undo-btn" '+(p.canUndo&&!isStale(ek)?'':'disabled')+'>撤销上次填入</button>';
  h+='</span></div>';
  return h;
}

function bindPanel(host,ek,p,buf){
  $('#p-close',host).addEventListener('click',closePanel);
  const ra=$('#reset-ans',host);if(ra)ra.addEventListener('click',function(){p.answers={};recomputeAnswers(ek,p);toast('已清空补充回答，可重新选择。');});
  $$('[data-ptab]',host).forEach(function(b){b.addEventListener('click',function(){p.tab=b.dataset.ptab;renderPanel();});});
  const ta=$('#p-intent',host);
  if(ta)ta.addEventListener('input',function(){p.intent=ta.value;});
  $$('[data-ex]',host).forEach(function(b){b.addEventListener('click',function(){
    p.intent=SCEN[ek].examples[+b.dataset.ex];renderPanel();const t2=$('#p-intent');if(t2)t2.focus();});});
  const g=$('#gen-btn',host);if(g)g.addEventListener('click',function(){startGenerate('fill');});
  const c=$('#check-btn',host);if(c)c.addEventListener('click',function(){startGenerate('check');});
  const rg=$('#retry-gen',host);if(rg)rg.addEventListener('click',function(){startGenerate(p.mode||'fill');});
  const cg=$('#cancel-gen',host);if(cg)cg.addEventListener('click',function(){cancelGenerate();});
  const gl=$('#goto-llm',host);if(gl)gl.addEventListener('click',function(){
    llmReturn=clone(NAV);delete llmReturn.__seed;go({space:'prj',page:'llm'});});
  const ab=$('#adopt-btn',host);if(ab)ab.addEventListener('click',function(){adoptSelected();});
  const rb=$('#regen-btn',host);if(rb)rb.addEventListener('click',function(){startGenerate(p.mode||'fill');});
  const ub=$('#undo-btn',host);if(ub)ub.addEventListener('click',function(){undoAdopt();});
  $$('input[type=radio]',host).forEach(function(r){r.addEventListener('change',function(){
    if(r.value==='__free__'){p.answers['__free_'+r.name]=true;recomputeAnswers(ek,p);return;}
    p.answers[r.name]=r.value;delete p.answers['__free_'+r.name];recomputeAnswers(ek,p);});});
  $$('[data-free]',host).forEach(function(inp){inp.addEventListener('input',function(){
    p.answers[inp.dataset.free]=inp.value;p.answers['__free_'+inp.dataset.free]=true;});
    inp.addEventListener('change',function(){recomputeAnswers(ek,p);});});
  $$('[data-sug]',host).forEach(function(ch){ch.addEventListener('change',function(){
    p.checked[SCEN[ek]&&panelState(ek).result.suggestions[+ch.dataset.sug].id]=ch.checked;});});
  $$('[data-locate]',host).forEach(function(b){b.addEventListener('click',function(){locateField(b.dataset.locate);});});
  $$('[data-expl]',host).forEach(function(b){b.addEventListener('click',function(){p.explains=b.dataset.expl;renderPanel();});});
}
function recomputeAnswers(ek,p){
  if(!p.result)return;
  const sc=SCEN[ek];const buf=BUFFERS[ek]||extract(ek);
  if(p.mode==='check'){p.result=sc.check(buf,p.answers);}
  else{p.result=sc.fill(p.intent,p.answers,buf);}
  idResults(p.result);
  renderPanel();
}
function idResults(res){(res.suggestions||[]).forEach(function(s,i){if(!s.id)s.id='s'+i+'-'+Date.now()%100000;});}
function cancelGenerate(){
  REQ++;const p=panelState(panelCur);p.state='idle';p.notice='已取消生成；迟到结果将被忽略。';renderPanel();
}
function startGenerate(mode){
  const ek=panelCur;const p=panelState(ek);const sc=SCEN[ek];
  if(!sc){return;}
  p.mode=mode;p.notice='';
  if(mode==='fill'&&!p.intent.trim()){p.state='idle';p.notice='先输入描述，或点击示例带入。';renderPanel();return;}
  if(DEMO.model==='nomodel'){p.state='nomodel';renderPanel();return;}
  p.state='gen';renderPanel();
  const token=++REQ;
  const delay=DEMO.model==='slow'?3000:300;
  setTimeout(function(){
    if(REQ!==token)return; /* 已被取消/切目标，忽略迟到结果 */
    if(DEMO.model==='fail'){p.state='fail';renderPanel();return;}
    const buf=BUFFERS[ek]||bufOf(ek);
    let res;
    try{
      res=mode==='check'?sc.check(buf,p.answers):sc.fill(p.intent,p.answers,buf);
    }catch(e){res={noValid:true,notes:['生成异常（演示兜底）：未修改任何内容。']};}
    if(res.noValid){p.result=null;p.state='empty';renderPanel();return;}
    res.suggestions=res.suggestions||[];
    idResults(res);
    p.result=res;p.state='done';p.baseline=baselineOf(ek);
    p.checked={};
    renderPanel();
  },delay);
}
function adoptSelected(){
  const ek=panelCur;const p=panelState(ek);
  if(!p.result||isStale(ek))return;
  const buf=bufOf(ek);
  const items=(p.result.suggestions||[]).filter(function(s){
    const ck=p.checked[s.id]!==undefined?p.checked[s.id]:!!s.defChecked;
    return ck&&!s.blocked&&!s.pending&&s.apply;});
  if(!items.length){toast('没有可采纳的勾选项（被禁止/待补充项不可采纳）');return;}
  p.undo={buf:clone(buf),reason:''};p.canUndo=true;p.undoReason='';
  items.forEach(function(s){try{s.apply(buf);}catch(e){}});
  buf.__filledTip=true;
  p.baseline=baselineOf(ek); /* 采纳本身不算“手动修改”，仍可继续勾选 */
  p.notice='';
  render();
  toast('已填入 '+items.length+' 项建议到表单（尚未保存）');
}
function undoAdopt(){
  const ek=panelCur;const p=panelState(ek);
  if(!p.undo)return;
  if(!p.canUndo){toast(p.undoReason||'采纳后有手动编辑，不能直接撤销');return;}
  BUFFERS[ek]=p.undo.buf;BUFFERS[ek].__seed=BUFFERS[ek].__seed||p.undo.buf.__seed;
  p.undo=null;p.canUndo=false;p.result=null;p.state='idle';p.notice='已撤销上次填入，表单恢复采纳前状态。';
  render();toast('已撤销采纳内容（未保存状态）');
}
function locateField(k){
  const scope=document;
  let node=$('[data-k="'+k+'"]',scope)||$('[data-fld="'+k+'"]',scope)||$('[data-err="'+k+'"]',scope);
  if(!node&&k.indexOf('bind.')===0)node=$('[data-k="'+k+'"]',scope);
  if(!node&&k==='pStorageSrc')node=$('[data-k="pStorageSrc"]',scope);
  if(!node){toast('该字段在当前视图不可直接定位（'+esc(k)+'）');return;}
  const d=node.closest&&node.closest('details');if(d)d.open=true;
  node.scrollIntoView({behavior:'smooth',block:'center'});
  node.focus&&node.focus();
  node.style.boxShadow='0 0 0 3px var(--blue-line)';
  setTimeout(function(){node.style.boxShadow='';},1500);
}

/* ---------------- 全局交互 ---------------- */
['dm-model','dm-catalog','dm-flow'].forEach(function(id){
  $('#'+id).addEventListener('change',function(e){
    const m={'dm-model':'model','dm-catalog':'catalog','dm-flow':'flow'};
    DEMO[m[id]]=e.target.value;
    /* 切换演示状态使已有建议基线失效，并作废在途请求 */
    REQ++;
    Object.keys(PANELS).forEach(function(k){discardPanelResult(k,'演示状态已切换：旧建议作废，请重新生成。');});
    toast('演示控制已切换（不改动表单数据）');
    render();
  });});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if($('#modal-back').classList.contains('on'))hideModal();
    else if(panelOpen)closePanel();
  }});
$('#panel-backdrop').addEventListener('click',function(){closePanel();toast('面板已关闭；输入与未采纳建议保留，点“辅助填写”可再打开');});
window.addEventListener('resize',function(){if(panelOpen)renderPanel();});

/* 初始化 */
render();
</script>
</body>
