y:flex;align-items:flex-start;gap:22px;flex-wrap:wrap}.versionline strong{font-size:18px;font-weight:600}.versionline p{font-size:12px;color:var(--muted);margin-top:4px}.versionnote{padding:11px 14px;border:1px solid var(--line);background:var(--paper-2);border-radius:var(--r-sm);font-size:12px;margin-top:16px;color:var(--muted)}.versionnote.changed{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue-ink)}table{border-collapse:collapse;width:100%;font-size:13px;margin-top:18px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:500;background:var(--paper-2)}td:last-child{text-align:right}table small{display:block;color:var(--muted);font-size:11px}.table-scroll{overflow:auto}.callout{padding:12px 15px;background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:6px;color:var(--blue-ink);font-size:13px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:15px}.callout p{font-size:12px;color:var(--muted);margin-top:3px}.card.error{border-color:var(--warn-line)}.loading-line{height:12px;background:var(--paper-3);border-radius:4px;margin:12px 0;width:70%}.shade{position:fixed;inset:0;z-index:60;background:var(--backdrop);display:flex;justify-content:center;align-items:center;padding:24px}.modal{width:530px;max-height:90vh;overflow:auto;background:white;border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-2)}.modal-head{padding:20px 24px 15px;display:flex;align-items:center;justify-content:space-between}.modal-head h2{font-size:17px}.modal-head button{border:0;padding:0 6px;font-size:22px;color:var(--muted)}.modal-body{padding:0 24px 24px;font-size:13px}.modal-body p{color:var(--muted);line-height:24px}.modal-body p+p{margin-top:10px}.modal-foot{border-top:1px solid var(--line);padding:15px 24px;display:flex;justify-content:flex-end;gap:9px}label{display:block;color:var(--muted);font-size:13px;margin-top:1 <aside class="rail" id="rail"><div class="brand">◇ <span>本体工作台</span><small>ONTOLOGY WORKSPACE</small></div><div class="ws-tabs"><span class="on">本体</span><span>项目</span></div><button id="railToggle" class="rail-toggle">« 收起侧栏</button><div class="space"><div class="space-head"><span>当前本体</span><button class="text" data-boundary="新建本体">＋ 新建</button></div><select class="selected-ontology" id="ontologyName" aria-label="当前本体"><option value="空本体">空本体</option><option value="储能本体">储能本体</option></select></div><nav id="nav"></nav><div class="user"><span class="avatar">顾</span><span class="name">示例用户</span><button data-boundary="设置" aria-label="设置">⚙</button></div></aside><header class="topbar"><span id="crumb" class="crumb">空本体 / 抽象定义</span><h1>工作概览</h1><span class="saved" title="原型示例状态，不代表真实草稿">● 已保存</span></header><div class="shell"><main><div class="prototype"><span>原型预览</span><div class="demo-tabs"><button data-scene="empty" class="active">空本体</button><button data-scene="building">建设中</button><button data-scene="published">已发布</button></div><details class="more-scenes"><summary>更多状态</summary><div class="scene-menu"><button data-scene="changed">已发布 · 有草稿变更</button><button data-scene="assets">已有资产 · 尚无对象</button><button data-scene="unchecked">尚未校验</button><button data-scene="loading">信息读取中</button><button data-scene="error">信息读取失败</button></div></details><small>示例数据 · 不写入正式工作台</small></div><div id="content"></div></main></div><div id="modal"></div><div id="toast" class="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={home:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',object:'m12 2 9 5v10l-9 5-9-5V7zm-9 5 9 5 9-5M12 12v10',property:'M6 3h12v18l-6-4-6 4z',link:'m10 13 4-4m-7 6-2 2a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m8 0 2-2a4 4 0 0 0-6-6l-4 4a4 4 0 0 0 0 6',rule:'M5 3h10l4 4v14H5zm9 0v5h5M8 12h8M8 16h8',action:'m13 2-9 12h7l-1 8 10-13h-7z',release:'M5 22V3h14l-3 5 3 5H5',more:'M4 12h1m6 0h1m6 0h1'};
function icon(k){return `<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[k]||icons.object}"/></svg></span>`}
$('#nav').innerHTML=[['home','工作概览'],['object','对象建模'],['property','共享属性'],['rule','业务规则'],['action','动作定义'],['release','本体校验与发布'],['more','更多工具']].map(([k,n])=>`<button ${k==='home'?'id="homeNav" class="active"':`data-boundary="${n}"`} title="${n}">${icon(k)}<span>${n}</span></button>`).join('');
let activeOntology='空本体',scene='empty',counts=[0,0,0,0,0],issues=[],check='unchecked',published=false,changed=false,createdName='',restoreFocus=null;
const ontologySnapshots=new Map();
const storageObjects=[['储能簇','多个电池模组串联或并联组成的电池单元。'],['储能设备','由储能簇及相关部件组成的储能设备。'],['储能系统','用于描述项目内储能设备集合的业务对象。'],['充放电计划','描述储能在指定时段内的充放电安排。'],['测试对象','用于演示建模的示例对象。']];
const fixtures=[{id:'object',name:'储能簇',field:'业务定义',message:'未填写业务定义',path:'对象建模 / 储能簇 / 编辑定义'},{id:'property',name:'实时 SOC',field:'数据类型',message:'尚未选择数据类型',path:'共享属性 / 实时 SOC / 编辑'}];
function setScene(s){scene=s;activeOntology=s==='empty'?'空本体':'储能本体';createdName='';counts=s==='empty'?[0,0,0,0,0]:s==='assets'?[0,6,0,1,0]:s==='storage'?[5,6,4,1,1]:[3,6,2,1,0];published=['storage','published','changed','error','loading'].includes(s);changed=s==='changed';issues=['building','changed'].includes(s)?fixtures.map(x=>({...x})):[];check=['building','changed'].includes(s)?'issues':s==='published'?'passed':s==='error'?'error':s==='loading'?'loading':'unchecked';render()}
function name(){return activeOntology}
function render(){$('#ontologyName').value=name();$('#crumb').textContent=name()+' / 抽象定义';document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',b.dataset.scene===scene));document.querySelectorAll('.more-scenes').forEach(d=>d.open=false);$('#content').innerHTML=scene==='empty'?emptyView():fullView()}
function emptyView(){return `<section class="card welcome"><div class="welcome-icon">${icon('object')}</div><h2>开始构建你的本体</h2><p>从一个业务对象开始，例如储能簇、储能设备；也可以通过 Excel 批量导入已有内容。</p><div class="start-actions"><button class="primary" id="createFirst">＋ 创建第一个对象</button><button id="importExcel">从 Excel 导入</button><button class="text" id="download">下载 Excel 模板</button></div><div class="example"><span>对象填写示例</span><div><strong>储能簇</strong><p>多个电池模组串联或并联组成的电池单元。<br>创建后，可按需添加属性、链接，并关联业务规则和动作。</p></div></div></section><p class="footnote">完成建模并发布版本后，可供具体项目引用。项目中的表、字段和接口在项目映射中配置。</p>`}
function fullView(){return `<div class="pageintro"><div><h2>${name()}</h2><p>${published?'维护当前草稿；已发布版本和项目引用保持独立。':'先整理业务对象和定义，准备好后再校验发布。'}</p></div><div class="actions"><button id="importExcel">导入 Excel</button><button class="primary" ${counts[0]?'data-boundary="对象建模"':'id="createFirst"'}>${counts[0]?'继续建模':'创建第一个对象'}</button></div></div>${scene==='assets'?'<div class="callout"><div><strong>已有共享属性和业务规则，还没有对象类型</strong><p>可以继续整理资产，也可以创建对象后再引用，已有内容不会丢失。</p></div></div>':''}${assetCard()}${scene==='storage'?objectIndex():''}${checkCard()}${versionCard()}`}
function objectIndex(){return `<section class="card"><div class="panelhead"><h3>对象类型</h3><button class="text" data-boundary="对象建模">查看全部对象 →</button></div><p class="muted">从已有对象继续维护属性、链接、规则和动作。以下内容为原型示例。</p><div class="table-scroll"><table class="object-index"><thead><tr><th>对象</th><th>业务定义</th><th>操作</th></tr></thead><tbody>${storageObjects.map(([n,desc])=>`<tr><td class="object-name">${E(n)}</td><td>${E(desc)}</td><td><button class="text" data-object="${E(n)}">查看对象 →</button></td></tr>`).join('')}</tbody></table></div></section>`}
function switchOntology(target){if(target===activeOntology)return;closeModal();ontologySnapshots.set(activeOntology,{scene,counts:[...counts],issues:issues.map(x=>({...x})),check,published,changed,createdName});const prior=ontologySnapshots.get(target);if(prior){activeOntology=target;({scene,counts,issues,check,published,changed,createdName}=prior);render()}else setScene(target==='储能本体'?'storage':'empty')}
$('#ontologyName').addEventListener('change',e=>switchOntology(e.target.value));
function assetCard(){const items=[['对象类型','object','对象定义数'],['共享属性','property','共享库中的定义数'],['链接类型','link','正反方向共一份定义'],['业务规则','rule','业务规则定义数'],['动作定义','action','动作定义数']];return `<section class="card"><div class="panelhead"><h3>本体内容</h3><span class="muted">按定义统计，不是建设完成度</span></div><div class="asset-grid">${items.map(([n,k,h],i)=>`<button class="asset" data-asset="${k}" aria-label="${n} ${counts[i]} 项"><span class="asset-label">${icon(k)}${n}</span><strong>${counts[i]}</strong><small>${h}</small></button>`).join('')}</div><p class="note-line">对象内的属性在对象建模中维护。共享属性引用次数不计入共享定义数；链接、规则和动作按业务需要建设。</p></section>`}
function checkCard(){let tag={unchecked:['尚未校验',''],issues:[issues.length+' 项待处理','warn'],passed:['本次校验通过','ok'],stale:['校验结果已过期','info'],error:['校验失败','warn'],loading:['校验中','']}[check];let body='';if(check==='issues')body=`<div class="issues">${issues.map(x=>`<div class="issue"><span class="issue-marker"></span><div class="issue-copy"><strong>${x.name} · ${x.message}</strong><small>${x.path}</small></div><button class="text" data-fix="${x.id}">去填写 →</button></div>`).join('')}</div>`;else if(check==='loading')body='<div class="loading-line"></div><div class="loading-line" style="width:45%"></div><p class="muted">正在读取当前草稿的校验结果…</p>';else{const desc={unchecked:['尚未检查当前草稿','校验会检查定义与引用关系，不会保存或发布本体。'],stale:['内容已修改，请重新校验','之前的结果不再代表当前草稿。'],passed:['当前草稿未发现阻断问题','结果仅对应本次检查的草稿，不代表业务建模已经完整。'],error:['暂时无法完成校验','这是请求失败，不表示草稿存在错误或已经通过。']}[check];body=`<div class="neutral-state"><span class="state-icon">${check==='passed'?'✓':check==='error'?'!':'—'}</span><div><strong>${desc[0]}</strong><p>${desc[1]}</p></div>${check==='error'?'<button id="retryCheck">重试校验</button>':''}</div>`}return `<section class="card ${check==='error'?'error':''}"><div class="panelhead"><h3>${check==='issues'?'需要处理':'草稿校验'}</h3><div class="check-tools"><span class="pill ${tag[1]}">${tag[0]}</span>${!['loading','error'].includes(check)?'<button class="text" id="check">'+(check==='unchecked'?'开始校验':'重新校验')+'</button>':''}</div></div>${body}</section>`}
function versionCard(){if(scene==='loading')return '<section class="card"><h3>版本与引用</h3><div class="loading-line"></div><p class="muted">正在读取版本与引用项目，不展示未知数据的零值。</p></section>';if(scene==='error')return '<section class="card error"><div class="panelhead"><h3>版本与引用</h3><button id="retryVersions">重新加载</button></div><p class="muted">版本和引用项目暂时无法读取，请重试。</p></section>';if(!published)return `<section class="card"><div class="panelhead"><h3>版本与引用</h3><button class="text" data-boundary="本体校验与发布">校验与发布 →</button></div><p class="muted">尚未发布。发布版本后，项目才能固定引用这份本体定义。</p></section>`;return `<section class="card"><div class="panelhead"><h3>版本与引用</h3><button class="text" data-boundary="本体校验与发布">查看发布记录 →</button></div><div class="versionline"><div><span class="muted">最新发布版本</span><strong style="margin-left:10px">2.0.0</strong><p>发布于 2026-09-18 16:30 · 示例</p></div><span class="pill ${changed?'info':''}">${changed?'草稿有未发布变更':'草稿与最新发布一致'}</span></div>${changed?'<div class="versionnote changed">当前修改尚未发布，不影响项目正在引用的版本。 <button class="text inline-link" data-boundary="草稿与发布版本差异">查看变化 →</button></div>':''}<div class="table-scroll"><table><thead><tr><th>引用项目</th><th>实际引用版本</th><th>操作</th></tr></thead><tbody><tr><td>创智园二期</td><td>1.0.0</td><td><button class="text" data-project="创智园二期" data-version="1.0.0">查看项目 →</button></td></tr><tr><td>储能示范站</td><td>2.0.0</td><td><button class="text" data-project="储能示范站" data-version="2.0.0">查看项目 →</button></td></tr></tbody></table></div><p class="note-line">项目使用各自固定引用的版本。查看项目不会自动升级引用。</p></section>`}
function modal(title,body,foot='<button data-close>关闭</button>'){restoreFocus=document.activeElement;$('#modal').innerHTML=`<div class="shade"><section class="modal" role="dialog" aria-modal="true" aria-label="${E(title)}"><div class="modal-head"><h2>${title}</h2><button data-close aria-label="关闭">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot}</div></section></div>`;$('#modal input,#modal textarea,#modal [data-close]')?.focus()}
function closeModal(){$('#modal').innerHTML='';if(restoreFocus?.isConnected)restoreFocus.focus()}
function toast(s){$('#toast').textContent=s;clearTimeout(window.timer);window.timer=setTimeout(()=>$('#toast').textContent='',2400)}
function create(){modal('新建对象类型','<p>先写清名称和业务定义，属性与链接可以创建后再补充。</p><label>对象名称 <em>*</em><input id="objectName" placeholder="例如：储能簇"></label><label>业务定义 <em>*</em><textarea id="objectDefinition" placeholder="例如：多个电池模组串联或并联组成的电池单元。"></textarea></label><p id="formError" role="alert"></p><div class="hintbox">仅模拟创建，结果保留在本页；正式版应直接打开现有新建对象表单。</div>','<button data-close>取消</button><button class="primary" id="confirmCreate">创建对象</button>')}
function destination(title,detail){modal(title,`<p>${detail}</p><div class="hintbox">此处演示跳转目标，正式版复用已有页面和表单；原型不修改工作台。</div>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.scene){setScene(d.scene)}else if('close'in d){closeModal()}else if(d.boundary){destination(d.boundary,'进入「'+d.boundary+'」，保留当前本体上下文。')}else if(d.object){destination('对象建模 · '+d.object,'保持当前本体为「储能本体」，选中「'+d.object+'」，进入其属性、链接、动作和规则详情。')}else if(d.asset){const target={object:'对象建模',property:'共享属性',link:'对象建模 · 链接',rule:'业务规则',action:'动作定义'}[d.asset];destination(target,d.asset==='link'?'查看当前本体链接清单，并可按具体链接定位到对应对象；不新增独立链接维护模块。':'查看当前本体中的'+target+'。')}else if(d.project){destination('项目 · '+d.project,'选中「'+d.project+'」并进入项目概览；仍然引用本体版本 '+d.version+'，不自动升级。')}else if(d.fix){const x=issues.find(i=>i.id===d.fix);modal('填写 · '+x.name,`<p>${x.path}</p><label>${x.field} <em>*</em><input id="fixValue" placeholder="${x.id==='object'?'填写对象业务定义':'例如：数值'}"></label><p id="formError" role="alert"></p><div class="hintbox">仅模拟缺项填写；正式版应通过稳定 ID 定位到对应表单，不在概览复制编辑器。</div>`,`<button data-close>取消</button><button class="primary" data-confirm-fix="${x.id}">保存示例</button>`)}else if(d.confirmFix){if(!$('#fixValue').value.trim()){$('#formError').textContent='请填写内容。';return}issues=issues.filter(x=>x.id!==d.confirmFix);check='stale';if(published)changed=true;closeModal();render();toast('示例已修改，需要重新校验')}else switch(b.id){case'createFirst':create();break;case'confirmCreate':{const n=$('#objectName').value.trim(),v=$('#objectDefinition').value.trim();if(!n||!v){$('#formError').textContent='请填写对象名称和业务定义。';return}createdName=n;counts[0]+=1;scene='unchecked';check='unchecked';closeModal();render();toast('已创建示例对象「'+n+'」；可继续为其添加属性');break}case'importExcel':modal('从 Excel 导入','<p>正式版打开已有导入流程：选择文件、检查内容和重名策略、确认导入。</p><p>当前模板支持对象、属性、规则、动作定义；导入后关联关系仍按已有功能维护。</p><div class="hintbox">原型不读取文件、不上传、不写入本体。导入完成应刷新概览，旧校验结果失效。</div>','<button data-close>返回概览</button>');break;case'download':destination('下载 Excel 模板','正式版继续下载现有本体模型填写模板.xlsx。本原型不生成虚假模板或更改导入范围。');break;case'check':check=issues.length?'issues':'passed';render();toast('演示：已完成当前示例草稿校验');break;case'retryCheck':check='unchecked';render();toast('演示：已恢复校验入口，可重新校验');break;case'retryVersions':scene='published';published=true;render();toast('演示：版本与项目引用已加载');break;case'railToggle':$('#rail').classList.toggle('mini');break;case'homeNav':render();break}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();const m=$('#modal .modal');if(e.key==='Tab'&&m){const a=[...m.querySelectorAll('button,input,textarea')];if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});setScene('empty');
</script></body></html>
