<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>从物料自动构建本体 · 交互原型 v2</title>
<style>
/* ═══ 设计令牌：与 frontend/src/style.css 逐字一致（唯一取色入口） ═══ */
:root{
  --ink:#182c3e;--ink-2:#3d5063;
  --muted:#5b6d7e;
  --faint:#8394a5;
  --bg:#f6f8fa;--paper:#ffffff;--paper-2:#f4f7fa;--paper-3:#eef2f6;
  --line:#dce4eb;--line-2:#c9d5e0;--grid:#d9e2ea;
  --blue:#245cdf;--blue-deep:#1a49b0;--blue-ink:#234fa8;--blue-soft:#edf3ff;--blue-line:#b8cff8;
  --ok:#1f7a55;--ok-soft:#eefaf3;--ok-line:#cdebd8;--ok-bright:#47c4a3;
  --warn:#8a6116;--warn-soft:#fff8e8;--warn-line:#f0dfb2;
  --danger:#b03a3a;--danger-deep:#8f2f2f;--danger-soft:#fdf0f0;--danger-line:#f2cfcf;
  --focus:#245cdf;--backdrop:#10283d66;
  --r-sm:6px;--r-md:10px;--r-lg:14px;--r-pill:999px;
  --shadow-1:0 1px 2px rgba(24,44,62,.08);--shadow-2:0 16px 48px rgba(16,40,61,.18);
  --dur:.12s;--ease:cubic-bezier(.2,.6,.3,1)
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:var(--r-sm);padding:6px 13px;color:var(--ink)}
button:hover{border-color:var(--blue);color:var(--blue)}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:var(--blue);color:var(--paper);border-color:var(--blue)}
.primary:hover:not(:disabled){background:var(--blue-deep);color:var(--paper)}
.mini{padding:3px 9px;font-size:12px}
.danger-ghost{color:var(--danger);border-color:var(--danger-line)}
.danger-ghost:hover:not(:disabled){background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.row-link{border:0;background:none;padding:2px 6px;border-radius:4px;color:var(--blue);font-size:13px}
.row-link:hover{background:var(--blue-soft)}
.row-link.danger{color:var(--danger)}
.row-link.danger:hover{background:var(--danger-soft)}
input:not([type=checkbox]),select,textarea{display:block;width:100%;padding:9px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--paper);color:var(--ink);margin-top:5px}
textarea{min-height:78px;resize:vertical}
label{display:block;margin:14px 0;color:var(--muted);font-size:13px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;font-weight:650;margin:0 0 12px}
h3{font-size:15px;margin:0}
p{overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:13px}
.eyebrow{font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:650}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ═══ 壳层：224px 浅色侧栏 + 56px 顶栏（与 App.vue 一致） ═══ */
.rail{position:fixed;top:0;bottom:0;left:0;width:224px;background:var(--paper);border-right:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:10px;z-index:30}
.rail .brand{font-size:18px;font-weight:650;letter-spacing:.4px;padding:0 10px 2px;color:var(--ink)}
.rail .brand small{display:block;color:var(--faint);font-size:10px;letter-spacing:2px;font-weight:500;margin-top:3px}
.ws-tabs{display:flex;gap:2px;background:var(--paper-3);border:1px solid var(--line);border-radius:var(--r-md);padding:3px;margin:0}
.ws-tabs button{flex:1;min-width:0;border:0;background:none;border-radius:var(--r-sm);padding:6px 12px;color:var(--muted);font-weight:500;text-align:center}
.ws-tabs button.active{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line-2),var(--shadow-1);color:var(--ink);font-weight:650}
.ws-tabs button:not(.active):hover{color:var(--ink);background:var(--line)}
.space{padding:6px 0 8px;font-size:12px;color:var(--muted)}
.space-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 7px}
.space-head label{font-size:12px;color:var(--muted);margin:0}
.space-new{border:0;background:none;padding:2px 5px;border-radius:4px;color:var(--blue);font-size:12px;font-weight:500;line-height:1.5}
.space-new:hover{background:var(--blue-soft);color:var(--blue-deep)}
.space .fake-select{width:100%;min-height:38px;padding:8px 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--paper);color:var(--ink);text-align:left;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.space .fake-select:hover{border-color:var(--blue-line)}
.space .fake-select b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.space .fake-select i{font-style:normal;color:var(--faint)}
nav{overflow:auto;min-height:0;flex:1 1 0;scrollbar-width:thin}
nav button{display:flex;align-items:center;gap:9px;text-align:left;width:100%;background:none;color:var(--ink-2);border:0;border-radius:var(--r-sm);padding:8px 10px;margin:2px 0;font-size:14px;font-weight:500}
nav button:hover{background:var(--paper-2);color:var(--ink)}
nav button.active{background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.nav-ico{width:16px;height:16px;flex:none;opacity:.85}
nav button.active .nav-ico{opacity:1}
.rail-user{flex-shrink:0;display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.rail-user-trigger{display:flex;align-items:center;gap:9px;flex:1;min-width:0;background:none;border:0;border-radius:var(--r-sm);padding:6px 8px;color:var(--ink-2);text-align:left}
.rail-user-trigger:hover{background:var(--paper-2);color:var(--ink)}
.user-avatar{flex:none;width:28px;height:28px;border-radius:50%;background:var(--blue-soft);color:var(--blue-ink);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:650}
.user-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:500}
.rail-gear{flex:none;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;border-radius:var(--r-sm);color:var(--ink-2)}
.rail-gear:hover{background:var(--paper-2);color:var(--ink)}
.rail-hint{font-size:12px;color:var(--faint);padding:10px 11px 0;margin:0}
.topbar{position:fixed;top:0;left:224px;right:0;height:56px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px;z-index:40}
.topbar-crumb{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;overflow:hidden}
.crumb-path{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-title{font-size:15px;font-weight:650;color:var(--ink);margin:0;white-space:nowrap}
.topbar-status{display:flex;align-items:center;gap:8px;flex:none}
.save-pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--line);font-size:12px;white-space:nowrap;background:var(--paper);color:var(--muted)}
.save-pill.blue{color:var(--blue-ink);border-color:var(--blue-line);background:var(--blue-soft)}
.shell{margin-left:224px;margin-top:56px}
main{padding:0 24px 40px}

/* ═══ 原型说明条 ═══ */
.demo{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 24px;background:var(--warn-soft);border-bottom:1px solid var(--warn-line);color:var(--warn);font-size:12px;position:sticky;top:56px;z-index:35}
.demo .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo button{font-size:12px;padding:3px 10px;background:var(--paper)}
.demo .proto-ver{font-weight:650}

/* ═══ 通用组件（card/panelhead/table/pill/steps-bar） ═══ */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:20px;margin-bottom:16px}
.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;row-gap:8px}
.panelhead h2{margin:0}
.panelhead h2 .muted{font-weight:400;font-size:12px}
.tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.status-pill{display:inline-block;border:1px solid var(--blue-line);background:var(--blue-soft);color:var(--blue-ink);border-radius:var(--r-pill);padding:3px 11px;font-size:12px;white-space:nowrap}
.pill-ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.pill-warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.pill-error{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);overflow-wrap:anywhere;vertical-align:top}
th{color:var(--muted);font-weight:500;background:var(--paper-2);font-size:13px}
.tablewrap{overflow:auto}
tr.row-excluded td{background:var(--paper-2);color:var(--muted)}
.steps-bar{display:flex;align-items:center;gap:8px;margin:14px 0 18px;flex-wrap:wrap}
.steps-bar button{display:flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-pill);padding:5px 13px 5px 6px;font-size:13px;color:var(--muted)}
.steps-bar button i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--paper-2);font-size:12px;flex:none}
.steps-bar button.on{color:var(--blue-ink);border-color:var(--blue-line);background:var(--blue-soft);font-weight:600}
.steps-bar button.on i{border-color:var(--blue);background:var(--blue);color:var(--paper)}
.steps-bar button.done{color:var(--ok)}
.steps-bar button.done i{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ok)}
.steps-bar button:disabled{opacity:.45}
.bt-intro{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:16px 0 12px}
.bt-intro h1{font-size:22px;margin:0 0 4px}
.bt-intro p{margin:0}
.bt-intro-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bt-sub{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.bt-note{padding:11px 14px;border:1px solid var(--blue-line);background:var(--blue-soft);border-radius:var(--r-sm);font-size:13px;color:var(--ink-2);margin:12px 0}
.bt-note.warn{border-color:var(--warn-line);background:var(--warn-soft);color:var(--warn)}
.bt-note.bad{border-color:var(--danger-line);background:var(--danger-soft);color:var(--danger)}
.bt-note.ok{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ok)}
.bt-err-text{color:var(--danger)}
.inline-error{font-size:13px;color:var(--danger)}
.inline-success{font-size:13px;color:var(--ok)}
.inline-warning{font-size:13px;color:var(--warn)}
.empty-state{padding:44px 24px;text-align:center;color:var(--muted)}
.footer-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 18px;margin-top:16px}
.footer-bar .tools{flex-wrap:wrap}
.check-option{display:flex;align-items:flex-start;gap:9px;font-size:14px;margin:10px 0;color:var(--ink)}
.check-option input{display:inline-block;width:17px;min-width:17px;height:17px;margin:3px 0 0;accent-color:var(--blue)}
.ont-limits{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px 18px;margin:0}
.ont-limits dt{font-size:12px;color:var(--muted)}
.ont-limits dd{margin:2px 0 0;font-size:13px;overflow-wrap:anywhere}

/* 模拟/未实现 标注 */
.mark{display:inline-block;font-size:11px;font-weight:600;vertical-align:2px;color:#7754a1;background:#f3ecff;padding:1px 6px;border-radius:4px;margin-left:6px;white-space:nowrap}
.mark.todo{color:var(--muted);background:var(--paper-3)}
body.no-marks .mark{display:none}

/* 弹层 */
.modal-backdrop{position:fixed;inset:0;background:var(--backdrop);z-index:100;display:grid;place-items:center;padding:20px}
.modal-card{background:var(--paper);border-radius:var(--r-lg);padding:28px;width:min(620px,95vw);max-height:90vh;overflow:auto;box-shadow:var(--shadow-2)}
.modal-card.dialog-lg{width:min(880px,96vw)}
.modal-card h2{margin:0 0 10px}
.dialogtools{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;flex-wrap:wrap}
.dialogtools .left{margin-right:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:7px;z-index:200;max-width:85vw;font-size:13px;box-shadow:var(--shadow-2)}

/* 交互说明侧板 */
.help-fab{position:fixed;right:18px;bottom:18px;z-index:90;border-radius:var(--r-pill);padding:10px 16px;box-shadow:var(--shadow-2);background:var(--blue);border-color:var(--blue);color:var(--paper);font-weight:600}
.help-fab:hover{background:var(--blue-deep);color:var(--paper)}
.help-drawer{position:fixed;inset:0;background:var(--backdrop);z-index:110;display:flex;justify-content:flex-end}
.help-panel{width:460px;max-width:94vw;height:100%;background:var(--paper);box-shadow:var(--shadow-2);display:flex;flex-direction:column}
.help-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.help-head h2{margin:0;font-size:16px}
.help-head button{margin-left:auto}
.help-body{padding:18px 22px 30px;overflow-y:auto;flex:1;font-size:13px}
.help-body h3{font-size:14px;margin:18px 0 6px;color:var(--blue-ink)}
.help-body h3:first-child{margin-top:0}
.help-body li{margin:5px 0}
.help-body ul{padding-left:18px;margin:6px 0}
.help-body .tagline{color:var(--muted)}

/* ═══ A01 任务列表 ═══ */
.bt-steps{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:0;margin:14px 0}
.bt-steps li{padding:14px;background:var(--paper-2);border-radius:var(--r-sm)}
.bt-steps span{display:block;font-size:12px;color:var(--muted)}
.bt-steps strong{display:block;font-size:14px;margin:4px 0}
.bt-steps small{display:block;font-size:12px;color:var(--muted)}
.cascade-box{border:1px solid var(--danger-line);background:var(--danger-soft);border-radius:var(--r-sm);padding:12px 14px;font-size:13px;color:var(--danger);margin:12px 0}
.cascade-box b{display:block;margin-bottom:4px}
.cascade-list{margin:8px 0 0;padding:0;list-style:none}
.cascade-list li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--danger-line);padding:4px 0}
.cascade-list li:last-child{border-bottom:0}

/* ═══ A02 物料页 ═══ */
.bt-drop{border:1px dashed var(--line-2);background:var(--paper-2);border-radius:var(--r-md);text-align:center;padding:22px;margin:14px 0}
.bt-drop p{margin:6px 0}
.suffix-row{display:grid;grid-template-columns:minmax(240px,420px) minmax(0,1fr);gap:14px;align-items:end;margin:12px 0 4px}
.cnt-line{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.cnt-line b{font-weight:650}
.cnt-line .seg i{font-style:normal;color:var(--faint);margin:0 4px}
.bar{height:8px;background:var(--paper-3);border-radius:var(--r-pill);overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--blue);transition:width var(--dur) var(--ease)}
.bar.thin{height:5px;margin:4px 0 0}
.bar>i.striped{background-image:linear-gradient(45deg,rgba(255,255,255,.35) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.35) 50%,rgba(255,255,255,.35) 75%,transparent 75%,transparent);background-size:14px 14px;animation:bar-move .8s linear infinite}
@keyframes bar-move{to{background-position:14px 0}}
.up-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:16px 0 4px}
.url-row{display:flex;gap:10px;align-items:center;border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;flex-wrap:wrap}
.url-row input{margin:0;flex:1;min-width:220px}
.view-toggle{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.view-toggle button{border:0;border-radius:0;padding:6px 12px;font-size:13px;background:var(--paper)}
.view-toggle button.on{background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.group-row{cursor:pointer}
.group-row:hover td{background:var(--paper-2)}
.summary-pills{display:flex;gap:6px;flex-wrap:wrap}
.summary-pills .status-pill{padding:1px 9px;font-size:11px}
.blacklist-card{border:1px solid var(--warn-line)}
.blacklist-card>summary{cursor:pointer;padding:13px 18px;font-size:14px;font-weight:600;color:var(--warn);list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.blacklist-card>summary::before{content:'▸';transition:transform var(--dur)}
.blacklist-card[open]>summary::before{transform:rotate(90deg)}
.blacklist-body{padding:0 18px 16px;font-size:13px}
.reason-chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.reason-chips span{border:1px solid var(--warn-line);background:var(--warn-soft);color:var(--warn);border-radius:var(--r-pill);padding:2px 11px;font-size:12px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 2px;border-top:1px solid var(--line);margin-top:10px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.pager .tools{gap:6px}
.gap-detail{background:var(--paper-2);border-radius:var(--r-sm);padding:10px 12px;margin:8px 0;font-size:12px;color:var(--ink-2)}
.gap-detail b{display:block;margin-bottom:4px}
.gap-detail ul{margin:4px 0;padding-left:18px}

/* ═══ A03 范围页 ═══ */
.scope-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);gap:16px;align-items:start}
.chatbox{display:flex;flex-direction:column;min-height:520px}
.chatlog{overflow:auto;flex:1;min-height:240px;padding-right:8px}
.message{max-width:94%;padding:12px 15px;border:1px solid var(--line);border-radius:9px;margin:12px 0;background:var(--paper-2);white-space:pre-wrap;font-size:14px}
.message.you{margin-left:auto;background:var(--blue-soft);border-color:var(--blue-line)}
.message.err{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger)}
.message strong{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.message.err strong{color:var(--danger)}
.suggest{border:1px dashed var(--blue-line);background:var(--blue-soft);border-radius:var(--r-sm);padding:9px 11px;margin-top:9px;font-size:13px;white-space:normal}
.suggest p{margin:0 0 7px}
.choices{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.choices button{font-size:12px;white-space:normal;background:var(--paper)}
.composer{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.composer textarea{min-height:70px}
.composer-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.scope-form .status-pill{white-space:nowrap}
.scope-form textarea{min-height:62px}
.q-item{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin:8px 0;font-size:13px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.q-item.blocking{border-color:var(--danger-line);background:var(--danger-soft)}
.q-item.done{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ok)}
.q-item .tools{margin-left:auto}

/* ═══ A04 生成页 ═══ */
.progress-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(330px,.85fr);gap:16px;align-items:start}
.stagebar{display:flex;gap:4px;margin:4px 0 16px}
.stagebar span{flex:1;height:10px;border-radius:var(--r-pill);background:var(--paper-3);border:1px solid var(--line)}
.stagebar span.done{background:var(--blue);border-color:var(--blue)}
.stagebar span.current{background:linear-gradient(90deg,var(--blue-soft),var(--blue));border-color:var(--blue)}

function assignParseStates() {

function newRun() {
  return { state:'running', stage:0, prog:0, sec:[0,0,0,0,0], attempt:1, note:'',
    batches:Array.from({ length:25 }, (_, i) => ({ st:'pending', prog:0, reuse:false, faildone:false, err:'' })), error:'' };
}
function runActiveCount(r) { return r.batches.filter(b => b.st === 'running').length }
function tickRun(r, dt) {
  r.sec[r.stage] += dt;
  if (r.stage !== 2) {
    r.prog += dt / 2.4;
    if (r.prog >= 1) { r.prog = 0; r.stage += 1; if (r.stage > 4) { r.state = 'done'; r.note = '' } }
    return;
  }
  let active = runActiveCount(r);
  for (const b of r.batches) { if (active >= 4) break; if (b.st === 'pending') { b.st = 'running'; b.prog = 0; active++ } }
  for (let i = 0; i < r.batches.length; i++) {
    const b = r.batches[i];
    if (b.st !== 'running') continue;
    b.prog += dt * (b.reuse ? 12 : 0.85);
    if (b.prog < 1) continue;
    if (i === 6 && !b.faildone) {
      b.faildone = true; b.st = 'failed';
      b.err = 'LLM 输出被截断（finish_reason=length）：候选 JSON 未闭合。该批片段 #145–168（energy-backend/src/device）未产出候选。';
      r.state = 'failed';
      r.error = 'abstract 阶段第 7/25 批失败：LLM 输出被截断。其余已成功批次（含前序阶段）结果保留；可仅重试失败批次，或从 abstract 阶段整体重试。';
      return;
    }
    b.st = 'done'; b.reuse = false;
  }
  if (r.batches.every(b => b.st === 'done')) { r.prog = 0; r.stage = 3 }
}

function pageProgress() {
  const r = S.run;
  if (!r) return '<section class="card"><p class="muted">还没有生成运行。请先在「确定范围」页确认范围。</p></section>';
  const statePill = { running:['生成中',''], failed:['阶段失败','pill-error'], cancelled:['已取消','pill-warn'], done:['已完成','pill-ok'] }[r.state] || ['未知',''];
  const stageCls = i => {
    if (r.state === 'done' || i < r.stage) return 'done';
    if (i === r.stage) return r.state === 'failed' ? 'failed' : r.state === 'cancelled' ? 'cancel' : 'current';
    return '';
  };
  const segs = STAGES.map((_, i) => '<span class="' + stageCls(i) + '"></span>').join('');
  const rows = STAGES.map((st, i) => {
    const c = stageCls(i);
    const badge = c === 'done' ? '<span class="status-pill pill-ok">已完成</span>' : c === 'current' ? (r.state === 'failed' ? '<span class="status-pill pill-error">失败</span>' : r.state === 'cancelled' ? '<span class="status-pill pill-warn">已停止</span>' : '<span class="status-pill">处理中</span>') : c === 'failed' ? '<span class="status-pill pill-error">失败</span>' : '<span class="status-pill">待处理</span>';
    const dur = c === 'done' ? fmtSec(r.sec[i]) + '（演示加速）' : c === 'current' ? fmtSec(r.sec[i]) + ' …' : '—';
    return '<div class="stage-row ' + c + '"><span class="stage-circle">' + (c === 'done' ? '✓' : i + 1) + '</span>' +
    '<div class="stage-body"><strong>' + st.n + '</strong><p>' + st.d + '</p></div>' +
    '<span class="stage-badge" style="text-align:right">' + badge + '<small class="bt-sub">耗时 ' + dur + '</small></span></div>';
  }).join('');
  const batchCard = '<section class="card"><div class="panelhead"><h2>abstract 阶段批次 <span class="muted">25 批 · 并行度 4（模拟）</span></h2><span class="status-pill ' + (r.state === 'failed' ? 'pill-error' : r.batches.every(b => b.st === 'done') ? 'pill-ok' : '') + '">' + r.batches.filter(b => b.st === 'done').length + ' / 25 成功</span></div>' +
  '<div class="batch-legend"><span><i class="legend-done"></i>成功</span><span><i class="legend-run"></i>进行中</span><span><i class="legend-fail"></i>失败（点击看错误）</span><span><i class="legend-todo"></i>待跑</span></div>' +

  '<label class="check-option"><input id="save-ack" type="checkbox" ' + (S.saveAck ? 'checked' : '') + '><span>我已核对本次选定集合，了解生成结果仍需人工完善，暂缓项不会写入本体。</span></label>' +
  '<div class="tools" style="margin-top:14px"><button type="button" class="primary" data-action="create-onto" ' + (issues.length || !S.saveAck || !S.saveName.trim() ? 'disabled' : '') + '>创建新本体草稿</button></div>' +

/* ═══════════════ 动作 ═══════════════ */
function act(action, d) {
  switch (action) {
    case 'demo-toast': notify(d.msg || '演示入口'); return;
    case 'help': S.helpOpen = true; renderHelp(); return;
    case 'help-close': S.helpOpen = false; renderHelp(); return;
    case 'marks': S.marks = !S.marks; render(); return;
    case 'reset': modal({ body:'<h2>重新开始演示？</h2><p class="muted">清空页面内存中的模拟数据，不影响真实工作台。</p><div class="dialogtools"><button type="button" data-action="close">取消</button><button type="button" class="primary" data-action="reset-confirm">重新开始</button></div>' }); return;
    case 'reset-confirm': S = fresh(); closeModal(); render(); notify('已复位。'); return;
    case 'close': closeModal(); S.detail = null; return;
    case 'goto': {
      if (!canGo(d.page)) { notify(continueBlockReason() || '请按流程顺序操作。'); return }
      if (S.page === 'scope' && S.scopeDirty && d.page !== 'scope') { notify('范围摘要有未保存修改：请先「保存摘要」或继续编辑。'); return }
      if (S.page === 'review' && S.itemDirty && d.page !== 'review') { notify('候选有未保存编辑：请先保存或取消。'); return }
      if (d.page === 'scope' && !S.chat.length) S.chat.push({ role:'ai', text:'已读取 ' + S.mats.length + ' 份材料：识别出设备管理、运行监测、充放电计划、收益结算等模块（固定示例）。这次建模希望覆盖哪些业务？建议先明确主业务，再决定公共概念保留到什么程度。' });
      S.page = d.page; render();
      if (d.page === 'scope') { const el = $('#chatlog'); if (el) el.scrollTop = el.scrollHeight }
      return;
    }
    /* A01 */
    case 'new-task': modal({ body:'<h2>新建生成任务</h2><p class="muted">任务只组织材料与范围，尚未创建本体。</p><label>任务名称<input id="new-name" maxlength="80" placeholder="留空则自动命名为「未命名任务-日期」"></label><p class="bt-sub">原型内创建后同样进入固定演示上下文。</p><p class="inline-error" id="new-err"></p><div class="dialogtools"><button type="button" data-action="close">取消</button><button type="button" class="primary" data-action="create-task">创建并添加物料</button></div>' }); return;
    case 'create-task': {
      const name = ($('#new-name')?.value || '').trim() || '未命名任务-2026-09-21';
      S.tasks.unshift({ id:'t0', name, label:'添加物料', tone:'', mats:0, upd:'2026-09-21 09:30', del:{ m:0, f:0, r:0 }, demo:true });
      closeModal(); S.page = 'materials'; render(); notify('已创建任务「' + name + '」，接下来添加物料。'); return;
    }
    case 'del-task': {
      const t = S.tasks.find(x => x.id === d.id); if (!t) return;
      modal({ body:'<h2>删除生成任务</h2><p>将<b>物理删除</b>任务「' + esc(t.name) + '」及其全部关联数据：</p>' +
      '<div class="cascade-box"><b>级联删除范围（不可恢复）</b><ul class="cascade-list">' +
      '<li><span>任务与范围 / 候选记录</span><b>1 项</b></li><li><span>物料文件（含分片与哈希）</span><b>' + t.del.m + ' 份</b></li>' +
      '<li><span>解析证据片段</span><b>' + t.del.f.toLocaleString() + ' 条</b></li><li><span>生成运行记录（扫描 / 对话 / 生成）</span><b>' + t.del.r + ' 次</b></li></ul>' +
      '<p style="margin:10px 0 0">已创建的本体草稿不受影响，保留在工作台；但删除后原始证据不可用，无法再次追溯。</p></div>' +
      '<label>请输入任务名以确认删除<input id="del-name" placeholder="' + esc(t.name) + '" autocomplete="off"></label>' +
      '<p class="bt-sub">名称必须与「' + esc(t.name) + '」完全一致。</p>' +
      '<div class="dialogtools"><button type="button" data-action="close">取消</button><button type="button" class="danger-ghost" id="del-btn" data-action="del-confirm" data-id="' + t.id + '" disabled>删除任务</button></div>' });
      const inp = $('#del-name');
      inp.addEventListener('input', () => { $('#del-btn').disabled = inp.value.trim() !== t.name });
      return;
    }
    case 'del-confirm': {
      const t = S.tasks.find(x => x.id === d.id); if (!t) return;
      S.tasks = S.tasks.filter(x => x.id !== d.id);
      closeModal();
      S.notice = '已删除任务「' + t.name + '」：级联删除物料 ' + t.del.m + ' 份 · 解析证据 ' + t.del.f.toLocaleString() + ' 条 · 生成记录 ' + t.del.r + ' 次；已创建本体草稿保留。';
      render(); notify('任务已删除（模拟物理删除）。'); return;
    }
    case 'continue-task': S.page = 'materials'; render(); return;
    /* A02 */
    case 'pick-dir': S.picked = true; S.zipMode = null; S.bigAskSeen = false; S.up = { state:'idle', chunk:0, total:360, file:'', uploaded:0 }; render(); notify('已选择演示文件夹（' + DEMO_FILES.length + ' 个文件，模拟）。'); return;
    case 'pick-reset': S.picked = false; S.suffix = ''; S.zipMode = null; S.up = { state:'idle', chunk:0, total:360, file:'', uploaded:0 }; render(); return;
    case 'start-upload': {
      const st = pickStats();
      if (!st.keep) { notify('过滤后没有可上传的文件：请调整后缀过滤。'); return }
      if (st.keep > 20 && !S.zipMode) { openBigAsk(st); return }
      beginUpload(st);
      return;
    }
    case 'zip-mode': { S.zipMode = 'zip'; closeModal(); beginUpload(pickStats()); notify('已选择压缩为 zip 上传：整个目录打包为 1 个压缩包分片上传。'); return }
    case 'direct-mode': { S.zipMode = 'direct'; S.bigAskSeen = true; closeModal(); beginUpload(pickStats()); return }
    case 'why-zip': notify('压缩为 zip 后只有 1 个上传流，断点续传只针对单个文件，失败重传成本最低。'); return;
    case 'up-pause': if (S.up.state === 'running') { S.up.state = 'paused'; refreshUploadZone() } return;
    case 'up-fail': if (S.up.state === 'running') { S.up.state = 'failed'; refreshUploadZone(); notify('已模拟网络中断：停在当前分片。') } return;
    case 'up-resume': if (S.up.state === 'paused' || S.up.state === 'failed') { S.up.state = 'running'; refreshUploadZone() } return;
    case 'up-abandon': S.up = { state:'idle', chunk:0, total:360, file:'', uploaded:0 }; render(); return;
    case 'scan': {
      if (!S.mats.length) { ensureMats() }
      S.scan = { state:'running' }; render(); notify('已开始扫描材料：单份材料失败不会阻塞其余材料。');
      setTimeout(() => { if (!S.scan || S.scan.state !== 'running') return; assignParseStates(); S.page = 'materials'; render(); notify('扫描结束（模拟）：解析状态与覆盖缺口已更新。') }, 2200);
      return;
    }
    case 'rescan': S.scan = { state:'running' }; render(); setTimeout(() => { if (!S.scan || S.scan.state !== 'running') return; assignParseStates(); render(); notify('重新扫描完成。') }, 1800); return;
    case 'mat-view': S.matView = d.v; render(); return;
    case 'flat-page': S.flatPage = Number(d.p); render(); return;
    case 'group-detail': openGroupDetail(d.group, 0); return;
    case 'detail-page': if (S.detail) { S.detail.page = Number(d.p); openGroupDetail(S.detail.group, S.detail.page) } return;
    case 'mat-retry': {
      const m = S.mats.find(x => x.id === d.id); if (!m) return;
      m.st = 'running'; m.notes = []; if (S.detail) openGroupDetail(S.detail.group, S.detail.page);
      render(); notify('已重新提交解析：「' + m.path + '」');
      setTimeout(() => { if (!m) return; m.st = ['failed','partial','ocr_unconfigured'].includes(m.st) ? m.st : 'success'; if (S.detail) openGroupDetail(S.detail.group, S.detail.page); render() }, 1600);
      return;
    }
    case 'mat-toggle': {
      const m = S.mats.find(x => x.id === d.id); if (!m) return;
      m.excluded = !m.excluded; m.st = m.excluded ? 'excluded' : 'pending';
      if (S.detail) openGroupDetail(S.detail.group, S.detail.page);
      render(); notify((m.excluded ? '已排除「' : '已恢复「') + m.path + '」；材料清单已变化，此前的扫描与生成结果基线失效。');
      return;
    }
    case 'mat-issue': {
      const m = S.mats.find(x => x.id === d.id); if (!m) return;
      modal({ body:'<h2>解析问题 · ' + esc(m.path) + '</h2>' +
      (m.notes.length ? '<div class="gap-detail"><b>解析说明 / 未解析片段（不能当成空内容忽略）</b><ul>' + m.notes.map(n => '<li>' + esc(n) + '</li>').join('') + '</ul></div>' : '<p class="muted">服务端未报告解析缺口' + (m.st === 'success' ? '（该材料已完整解析）' : '') + '。</p>') +
      '<p class="bt-sub">当前状态：' + matLabel(m) + ' · 大小 ' + fmtBytes(m.size) + ' · 分组 ' + esc(m.group) + '</p>' +
      '<div class="dialogtools"><button type="button" data-action="close">关闭</button><button type="button" class="danger-ghost" data-action="mat-toggle2" data-id="' + m.id + '">' + (m.excluded ? '恢复该材料' : '排除该材料') + '</button><button type="button" class="primary" data-action="mat-retry2" data-id="' + m.id + '">重试解析</button></div>' });
      return;
    }
    case 'mat-toggle2': closeModal(); act('mat-toggle', d); return;
    case 'mat-retry2': closeModal(); act('mat-retry', d); return;
    case 'url-fetch': notify('从 URL 抓取：方案评估中，尚未确认实现。当前版本不支持该入口。'); return;
    /* A03 */
    case 'scope-choice': {
      const v = d.v; let you = '', ai = '', patch = null;
      if (v === 'energy' || v === 'all') {
        you = v === 'energy' ? '聚焦储能运行，不含收益结算。' : '覆盖全部业务模块。';
        patch = v === 'energy'
          ? { text:'纳入：储能设备管理、运行监测、充放电计划；排除：收益结算、光伏业务、技术基础设施。', apply:{ include:'储能设备管理、运行监测、充放电计划', exclude:'收益结算、光伏业务、技术基础设施' } }
          : { text:'纳入：设备管理、监测、计划、收益结算与光伏业务；排除：技术基础设施。', apply:{ include:'设备管理、监测、计划、收益结算与光伏业务', exclude:'技术基础设施' } };
        ai = '收到。建议如右下补丁所示。计划流程还涉及生成、审核和下发——本次需要完整业务流程，还是只描述计划内容与生成规则？'; S.round = 1;
      } else if (v === 'full' || v === 'limited') {
        you = v === 'full' ? '计划：生成、审核、下发全流程。' : '只描述计划内容与生成规则。';
        patch = { text:(v === 'full' ? '纳入追加：计划（生成、审核、下发全流程）。' : '纳入追加：计划（仅计划内容与生成规则）。'), apply:{ include:(S.scope.include || '') + '；计划：' + (v === 'full' ? '生成、审核、下发全流程' : '仅计划内容与生成规则') } };
        ai = '已记录。材料中的储能设备还关联园区和电表：建议保留必要关联定义，不扩展园区其他业务与电表计费规则。'; S.round = 2;
      } else {
        you = v === 'related' ? '保留园区、电表必要关联。' : '关联概念先暂缓。';
        patch = { text:'覆盖说明：' + (v === 'related' ? '园区、电表仅保留必要关联定义，不展开计费与园区其他业务。' : '关联概念暂缓；相关链接列为候选，不自动纳入。'), apply:{ coverage:(S.scope.coverage ? S.scope.coverage + ' ' : '') + (v === 'related' ? '园区、电表：仅保留必要关联定义，不展开计费与园区其他业务。' : '关联概念暂缓；相关链接列为候选，不自动纳入。') } };
        ai = '范围要点已齐。注意：设备 SOC 的汇总口径在文档与代码中不一致，可留到生成后的评审处理。请核对右侧摘要并保存。'; S.round = 3;
      }
      pushTurn(you, ai, patch);
      return;
    }
    case 'send-chat': {
      const t = ($('#chat-input')?.value || '').trim(); if (!t) return;
      if (S.llmDown) { S.chat.push({ role:'you', text:t }, { role:'err', text:'模型调用失败（模拟 503）：LLM 服务当前不可用。可点「重试」，或直接手工编辑右侧摘要并保存——手工路径不受影响。' }); render(); scrollChat(); return }
      S.chat.push({ role:'you', text:t }, { role:'ai', text:'已记录你的补充（模拟）：原型没有真实 LLM，不能自动理解并改写摘要；请把你的决定填入右侧对应字段并「保存摘要」。正式实现会针对该补充继续澄清，并给出建议补丁。' });
      S.scopeDirty = S.scopeDirty; render(); scrollChat(); return;
    }
    case 'llm-retry': {
      const lastErr = [...S.chat].reverse().find(m => m.role === 'err');
      if (S.llmDown) { S.chat.push({ role:'err', text:'重试仍失败（模拟 503）：LLM 服务不可用。请使用右侧手工编辑路径。' }) }
      else { S.chat.push({ role:'ai', text:'（重试成功，模拟）已恢复连接。请继续补充范围要点，或直接核对右侧摘要。' }) }
      void lastErr; render(); scrollChat(); return;
    }
    case 'llm-toggle': S.llmDown = !S.llmDown; render(); notify(S.llmDown ? '已模拟 LLM 服务失效：对话将返回失败，右侧手工编辑不受影响。' : 'LLM 服务已恢复（模拟）。'); return;
    case 'adopt': {
      const m = S.chat[Number(d.i)];
      if (m && m.patch) { Object.assign(S.scope, m.patch.apply); m.applied = true; S.scopeDirty = true; render(); notify('建议已填入右侧摘要（未保存）。') }
      return;
    }
    case 'scope-restart': S.round = 0; S.chat.push({ role:'ai', text:'可以重新选择业务范围；旧摘要保留供参考，新范围需重新保存确认。' }); render(); scrollChat(); return;
    case 'save-scope': {
      readScope(); S.scopeSaved = copy(S.scope); S.scopeDirty = false; render(); notify('范围摘要已保存（模拟）；尚未开始生成。'); return;
    }
    case 'resolve-q': {
      const q = S.questions[Number(d.i)]; if (!q) return;
      q.done = true; q.result = d.v === 'yes' ? '纳入并等待 OCR 配置' : '暂不纳入，按缺口处理';
      render(); notify('已处理未决问题：' + q.result + '。'); return;
    }
    case 'confirm-scope': {
      readScope();
      if (S.scopeDirty) { notify('范围摘要有未保存修改：请先「保存摘要」。'); return }
      if (!S.scopeSaved) { notify('请先保存范围摘要。'); return }
      const blocking = S.questions.find(q => q.blocking && !q.done);
      if (blocking) { notify('存在阻断性未决问题：请先在右侧处理。'); return }
      S.run = newRun(); S.page = 'progress'; render(); notify('已确认范围并启动生成（模拟）。'); return;
    }
    /* A04 */
    case 'run-cancel': if (S.run && S.run.state === 'running') { S.run.state = 'cancelled'; S.run.note = '已取消。'; render() } return;
    case 'run-resume': if (S.run && S.run.state === 'cancelled') { S.run.state = 'running'; render() } return;
    case 'retry-failed': {
      const r = S.run; if (!r || r.state !== 'failed') return;
      r.batches.forEach(b => { if (b.st === 'failed') { b.st = 'pending'; b.prog = 0 } });
      r.state = 'running'; r.error = ''; r.note = '重试失败批次：复用前序阶段与已成功批次结果，仅重跑失败批。';
      render(); notify('已提交重试失败批次（模拟）。'); return;
    }
    case 'retry-stage': {
      const r = S.run; if (!r || r.state !== 'failed') return;
      r.batches.forEach(b => { if (b.st === 'done') { b.st = 'pending'; b.prog = 0; b.reuse = true } if (b.st === 'failed') { b.st = 'pending'; b.prog = 0 } });
      r.state = 'running'; r.error = ''; r.note = '从 abstract 阶段重试：已成功批命中检查点将直接复用（演示）。';
      render(); notify('已从 abstract 阶段重试：成功批将快速复用（模拟）。'); return;
    }
    case 'batch-detail': {
      const r = S.run; if (!r) return;
      const b = r.batches[Number(d.i)];
      modal({ body:'<h2>第 ' + (Number(d.i) + 1) + ' / 25 批 · 失败</h2>' +
      '<div class="cascade-box"><b>错误详情</b>' + esc(b.err || 'LLM 输出被截断') + '</div>' +
      '<p class="bt-sub">尝试次数：' + (b.faildone ? 1 : 0) + ' 次 · 该批不阻塞其他批次；已成功批次结果保留。</p>' +
      '<p class="bt-sub">建议：重试失败批次（多数截断为偶发）；多次失败可更换模型配置或缩小分片后从 abstract 阶段重试。</p>' +
      '<div class="dialogtools"><button type="button" data-action="close">关闭</button><button type="button" class="primary" data-action="retry-failed">重试失败批次</button></div>' });
      return;
    }
    /* A05 */
    case 'select-c': {
      if (S.itemDirty) { notify('当前候选有未保存编辑：请先保存或取消。'); return }
      S.sel = d.id; render(); return;
    }
    case 'save-edit': {
      const i = S.cands.find(c => c.id === S.sel); if (!i) return;
      const name = $('#item-name')?.value ?? i.name, def = $('#item-def')?.value ?? i.definition;
      if (!name.trim() || !def.trim()) { notify('名称和业务定义必填，原内容未修改。'); return }
      i.name = name; i.definition = def; i.reviewed = true;
      const reason = $('#item-reason'); if (reason) i.reason = reason.value;
      const content = $('#item-content'); if (content) i.content = content.value;
      const effect = $('#item-effect'); if (effect) i.effect = effect.value;
      S.itemDirty = false; render(); notify('编辑已保存到模拟任务（未写正式本体）。'); return;
    }
    case 'cancel-edit': {
      const i = S.cands.find(c => c.id === S.sel); if (!i) return;
      if ($('#item-name')) $('#item-name').value = i.name;
      if ($('#item-def')) $('#item-def').value = i.definition;
      const r = $('#item-reason'); if (r) r.value = i.reason || '';
      S.itemDirty = false; render(); return;
    }
    case 'decide': {
      const i = S.cands.find(c => c.id === S.sel); if (!i) return;
      if (S.itemDirty) { notify('请先保存编辑，再调整纳入决定。'); return }
      if (d.v === 'include' && i.status !== 'supported' && !(i.reason || '').trim()) { notify('此项含推断或冲突：请先填写人工确认依据并保存，或继续暂缓。'); return }
      i.decision = d.v; i.reviewed = true; render();
      if (d.v !== 'include') {
        const n = S.cands.filter(j => j.deps.includes(i.id) && j.decision === 'include').length;
        if (n) notify('已保留原关联：' + n + ' 项已纳入定义依赖此项，保存前需要处理。');
      }
      return;
    }
    case 'merge-preview': {
      const from = S.cands.find(c => c.id === 'dup'), to = S.cands.find(c => c.id === 'cluster');
      modal({ body:'<h2>合并预览（保留项：储能簇）</h2><div class="tablewrap"><table><thead><tr><th>字段</th><th>保留值</th><th>被并入值</th><th>是否不同</th></tr></thead><tbody>' +
      '<tr><td>名称</td><td>储能簇</td><td>电池簇</td><td>不同</td></tr>' +
      '<tr><td>业务定义</td><td>' + esc(to.definition) + '</td><td>' + esc(from.definition) + '</td><td>相同</td></tr>' +
      '<tr><td>证据</td><td>' + to.evidence.length + ' 条</td><td>' + from.evidence.length + ' 条</td><td>合并保留</td></tr></tbody></table></div>' +
      '<p class="bt-sub">材料明确给出同义表述，这不是仅按名称相似度合并；正式实现必须比较字段与关联差异。合并后原候选保留记录、可撤销。</p>' +
      '<div class="dialogtools"><button type="button" data-action="close">取消</button><button type="button" class="primary" data-action="merge-confirm">确认合并</button></div>' });
      return;
    }
    case 'merge-confirm': {
      S.mergeBackup = copy(S.cands);
      const from = S.cands.find(c => c.id === 'dup'), to = S.cands.find(c => c.id === 'cluster');
      to.evidence.push(...copy(from.evidence));
      from.mergedInto = to.id; from.decision = 'exclude';
      S.cands.forEach(c => { c.deps = c.deps.map(x => x === from.id ? to.id : x) });
      S.merged = true; S.sel = 'cluster'; closeModal(); render(); notify('已合并「电池簇」→「储能簇」：双方证据保留，可撤销。'); return;
    }
    case 'undo-merge': modal({ body:'<h2>撤销合并？</h2><p class="muted">恢复合并前的候选、证据与关联；本次评审会话内对候选的其他修改会一并还原。</p><div class="dialogtools"><button type="button" data-action="close">取消</button><button type="button" class="primary" data-action="undo-merge-confirm">恢复合并前状态</button></div>' }); return;
    case 'undo-merge-confirm': if (S.mergeBackup) S.cands = copy(S.mergeBackup); S.merged = false; S.sel = 'dup'; S.itemDirty = false; closeModal(); render(); return;
    /* A06 */
    case 'create-onto': {
      const name = (($('#final-name')?.value ?? S.saveName) || '').trim();
      if (!name) { notify('本体名称不能为空。'); return }
      if (name === '储能本体') { S.saveError = '当前账号已有同名本体（模拟 409 DUPLICATE_NAME）：请修改名称；不会覆盖或合并已有本体。'; render(); return }
      S.saveError = ''; S.saveName = name;
      S.savedResult = { name, id:'ont-demo-0921-001', at:'2026-09-21 10:05' };
      render(); notify('新本体草稿已创建（模拟）。'); return;
    }
  }
  function beginUpload(st) {
    S.up = { state:'running', chunk:0, total:S.zipMode === 'zip' ? 96 : 360, file:S.zipMode === 'zip' ? 'energy-demo.zip（' + st.keep + ' 个文件的压缩包）' : 'energy-backend/…（共 ' + st.keep + ' 个文件，聚合进度）', uploaded:0 };
    render();
  }
  function openBigAsk(st) {
    modal({ body:'<h2>大文件夹上传建议</h2><p>当前过滤后待上传 <b>' + st.keep + '</b> 个文件（约 ' + fmtBytes(st.bytes) + '）。逐个文件分片上传耗时较长，中途失败需逐文件续传。</p>' +
    '<p class="bt-note">推荐先在本地压缩为 zip：只有 1 个上传流，断点续传只针对单个文件；服务端会自动展开并列出条目（上限 1 GB / 2000 条）。</p>' +
    '<div class="dialogtools" style="justify-content:stretch;flex-direction:column-reverse;gap:10px">' +
    '<button type="button" data-action="close">返回调整过滤条件</button>' +
    '<button type="button" data-action="direct-mode">仍要直接上传</button>' +
    '<button type="button" class="primary" data-action="zip-mode">压缩为 zip 上传（推荐）</button></div>' +
    '<p class="bt-sub" style="margin-top:10px"><button type="button" class="row-link" data-action="why-zip">为什么推荐压缩上传？</button></p>' });
  }
  function readScope() {
    S.scope.goal = $('#sc-goal')?.value ?? S.scope.goal;
    S.scope.include = $('#sc-include')?.value ?? S.scope.include;
    S.scope.exclude = $('#sc-exclude')?.value ?? S.scope.exclude;
    S.scope.coverage = $('#sc-coverage')?.value ?? S.scope.coverage;
  }
}
function pushTurn(you, ai, patch) {
  if (S.llmDown) { S.chat.push({ role:'you', text:you }, { role:'err', text:'模型调用失败（模拟 503）：LLM 服务当前不可用。可点「重试」，或直接手工编辑右侧摘要并保存——手工路径不受影响。' }); render(); scrollChat(); return }
  S.chat.push({ role:'you', text:you }, { role:'ai', text:ai, patch:patch, applied:false });
  render(); scrollChat();
}
function scrollChat() { const el = $('#chatlog'); if (el) el.scrollTop = el.scrollHeight }
function openGroupDetail(group, page) {
  const g = groupStats().find(x => x.name === group); if (!g) return;
  const size = 100, pages = Math.max(1, Math.ceil(g.files.length / size));
  page = Math.min(page, pages - 1);
  S.detail = { group, page };
  const slice = g.files.slice(page * size, page * size + size);
  modal({ lg:true, body:'<h2>分组明细 · ' + esc(g.name) + '</h2>' +
  '<p class="muted">' + g.files.length + ' 个文件 · ' + fmtBytes(g.bytes) + ' · ' + groupSummary(g) + '</p>' +
  '<div class="tablewrap" style="max-height:52vh;overflow:auto"><table><thead><tr><th>文件</th><th>大小</th><th>解析状态</th><th style="width:26%">操作</th></tr></thead><tbody>' +
  slice.map(m => matRowCells(m)).join('') + '</tbody></table></div>' +
  '<div class="pager"><span>第 ' + (page * size + 1) + '–' + Math.min(g.files.length, (page + 1) * size) + ' 项 · 共 ' + g.files.length + ' 项 · 每页 100 条</span><span class="tools">' +
  '<button type="button" class="mini" data-action="detail-page" data-p="' + (page - 1) + '" ' + (page === 0 ? 'disabled' : '') + '>上一页</button>' +
  '<button type="button" class="mini" data-action="detail-page" data-p="' + (page + 1) + '" ' + (page >= pages - 1 ? 'disabled' : '') + '>下一页</button></span></div>' +
  '<div class="dialogtools"><button type="button" data-action="close">关闭</button></div>' });
}
function refreshUploadZone() {
  const line = $('#up-line'), bar = $('#up-bar');
  const up = S.up; if (!line) { render(); return }
  if (bar) {
    bar.style.width = Math.min(100, Math.round(up.chunk / up.total * 100)) + '%';
    bar.className = up.state === 'running' ? 'striped' : '';
  }
  if (up.state === 'paused') line.innerHTML = '已暂停于第 <b>' + up.chunk + '</b> / ' + up.total + ' 片（已传分片均已校验保存）　<button type="button" class="mini primary" data-action="up-resume">继续上传（从第 ' + (up.chunk + 1) + ' 片）</button>';
  else if (up.state === 'failed') line.innerHTML = '<span class="bt-err-text">上传在第 ' + up.chunk + ' 片失败（模拟网络中断）：已传分片均已校验保存，可从断点继续，无需重传整包。</span>　<button type="button" class="mini primary" data-action="up-resume">失败后从断点继续（第 ' + (up.chunk + 1) + ' 片）</button>　<button type="button" class="mini" data-action="up-abandon">放弃</button>';
  else render();
}

/* ═══════════════ 演示时钟 ═══════════════ */
setInterval(() => {
  const dt = 0.25;
  /* A02 上传推进 */
  if (S.up && S.up.state === 'running') {
    S.up.chunk = Math.min(S.up.total, S.up.chunk + 16);
    const line = $('#up-line');
    if (line) {
      const bar = $('#up-bar');
      if (bar) { bar.style.width = Math.min(100, Math.round(S.up.chunk / S.up.total * 100)) + '%'; bar.className = 'striped' }
      line.innerHTML = '正在上传：' + esc(S.up.file) + ' · 已传 <b>' + S.up.chunk + '</b> / ' + S.up.total + ' 物';
    }
    if (S.up.chunk >= S.up.total) {
      S.up.state = 'done'; ensureMats(); render();
      notify('上传完成（模拟）：材料已登记，可点击「扫描物料」。');
    }
  }
  /* A04 生成推进 */
  if (S.run && S.run.state === 'running') {
    tickRun(S.run, dt);
    if (S.page === 'progress') {
      /* 运行中只替换阶段区与批次网格；「停止/取消」按钮所在区不动，避免点击丢失 */
      const html = pageProgress();
      const tmp = document.createElement('div'); tmp.innerHTML = html;
      const zone = tmp.querySelector('#stage-zone'), grid = tmp.querySelector('#batch-grid');
      const z = $('#stage-zone'), g = $('#batch-grid');
      if (z && zone) z.innerHTML = zone.innerHTML;
      if (g && grid) g.innerHTML = grid.innerHTML;
      if (S.run.state !== 'running') render();
    }
    if (S.run.state === 'done' && S.page === 'progress') notify('生成完成（模拟）：初稿已就绪，请评审。');
  }
  /* OCR / 兜底状态翻转 */
  if (S.scan && S.scan.flips && S.scan.flips.length) {
    const now = Date.now(); let changed = false;
    S.scan.flips = S.scan.flips.filter(f => {
      if (f.at <= now) { const m = S.mats.find(x => x.id === f.id); if (m) { m.st = f.to; changed = true } return false }
      return true;
    });
    if (changed && S.page === 'materials') render();
  }
}, 250);

/* ═══════════════ 事件绑定 ═══════════════ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (el && !el.disabled) act(el.dataset.action, el.dataset);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'suffix') { S.suffix = t.value; const st = pickStats(); const line = $('#cnt-line'); if (line) line.innerHTML = cntLineHtml(st); if (st.keep <= 20) S.bigAskSeen = false }
  if (t.id === 'url-input') S.urlDraft = t.value;
  if (t.id === 'search') {
    if (S.itemDirty) { notify('请先保存编辑。'); return }
    S.search = t.value; const pos = t.selectionStart; render(); const s = $('#search'); if (s) { s.focus(); s.setSelectionRange(pos, pos) }
  }
  if (t.id === 'item-name' || t.id === 'item-def' || t.id === 'item-reason' || t.id === 'item-content' || t.id === 'item-effect') {
    S.itemDirty = true; const st = $('#edit-state'); if (st) { st.textContent = '有未保存的编辑'; st.className = 'inline-warning' }
    const sb = document.querySelector('[data-action="save-edit"]'), cb = document.querySelector('[data-action="cancel-edit"]');
    if (sb) sb.disabled = false; if (cb) cb.disabled = false;
  }
  if (t.id === 'sc-goal' || t.id === 'sc-include' || t.id === 'sc-exclude' || t.id === 'sc-coverage') {
    S.scopeDirty = true; const p = $('#scope-pill'); if (p) { p.textContent = '未保存修改'; p.className = 'status-pill pill-warn' }
    const btn = document.querySelector('[data-action="confirm-scope"]'); if (btn) btn.disabled = true;
  }
  if (t.id === 'final-name') S.saveName = t.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'ack') { S.ack = t.checked; render() }
  if (t.id === 'f-type') { S.fType = t.value; render(); const s = $('#f-type'); if (s) s.focus() }
  if (t.id === 'f-dec') { S.fDec = t.value; render(); const s = $('#f-dec'); if (s) s.focus() }
  if (t.id === 'f-status') { S.fStatus = t.value; render(); const s = $('#f-status'); if (s) s.focus() }
  if (t.id === 'save-ack') { S.saveAck = t.checked; render() }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); if (S.helpOpen) { S.helpOpen = false; renderHelp() } }
  if (e.key === 'Enter' && e.target.id === 'chat-input') { e.preventDefault(); act('send-chat', {}) }
});
render();
</script>
