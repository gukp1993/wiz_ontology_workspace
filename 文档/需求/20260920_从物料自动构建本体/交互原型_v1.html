function canGo(p){if(p==='materials')return s.task&&!s.published;if(p==='scope')return s.scanned&&!s.published&&(!s.files.some(f=>f.status==='部分失败')||s.coverageAck);if(p==='generate')return s.confirmed&&!s.published;if(p==='review'||p==='save')return s.generated&&!s.published;return false}
function render(){const pages={tasks:tasks,materials:materialPage,scope:scopePage,generate:generatePage,review:reviewPage,save:savePage,complete:completePage,workspace:workspacePage};$('#app').innerHTML=shell(pages[s.page]());if(s.page==='scope'){const el=$('.chatlog');if(el)el.scrollTop=el.scrollHeight}}
function tasks(){return `<div class="row intro"><div><h1>从物料生成本体 ${mark('A01')}</h1><p class="muted">从已有系统中提取业务概念，先得到一份有依据的初稿，再由你裁剪。</p></div>${btn('＋ 新建生成任务','new-task','','primary')}</div>${!s.task?`<section class="card hero"><h2>让已有材料成为建模的起点</h2><p>代码、表结构、需求文档共同提供依据。不要求每种材料都齐全。</p><div class="metrics">${[['01','添加物料'],['02','对话确定范围'],['03','评审定义与依据'],['04','保存新本体']].map(([n,t])=>`<div class="metric"><small>${n}</small><h3>${t}</h3></div>`).join('')}</div><div class="notice">仅生成本体草稿，不生成项目映射，不覆盖已有本体，不自动发布。</div>${btn('使用混合业务示例体验','load-demo','','primary')}<p class="note">示例包含储能、光伏、收益结算与公共模块，全部为虚构材料。</p></section>`:`<section class="card"><div class="tablewrap"><table><thead><tr><th>任务</th><th>当前阶段</th><th>物料</th><th>操作</th></tr></thead><tbody><tr><td><strong>${esc(s.name)}</strong><small>本页模拟任务 · 当前账号</small></td><td>${badge(s.published?'已创建本体':s.generated?'待评审':s.scanned?'确定范围':'添加物料',s.published?'ok':'blue')}</td><td>${s.files.length} 份</td><td>${btn(s.published?'查看结果':'继续任务','continue')}</td></tr></tbody></table></div></section>`}<section class="card"><h2>本轮原型如何评审</h2><p>跟随步骤检查范围澄清、冲突处理、依赖保护和新建边界。页面上的A01～A06只用于说明方案，正式功能不显示。</p><a href="需求说明.md">查看配套需求说明 →</a></section>`}
function materialPage(){const fails=s.files.filter(f=>f.status==='部分失败').length;return `<div class="intro"><h1>添加物料 ${mark('A02')}</h1><p class="muted">材料可以覆盖多个业务。先扫描识别内容，再通过对话确定本次范围。</p></div><section class="card"><div class="row"><h2>物料清单</h2>${btn('载入混合业务示例','sample')}</div><div class="drop"><strong>前后端代码 · 数据库表结构 · 需求文档</strong><p class="muted">文件夹/ZIP、SQL、DOCX、PDF、XLSX、MD；旧版Office格式建议转换。</p><label class="primary" style="padding:8px 14px;border-radius:6px" for="files">选择文件</label><input id="files" type="file" multiple accept=".zip,.sql,.docx,.pdf,.xlsx,.md,.java,.py,.ts,.tsx,.js,.jsx,.vue,.json,.xml"><p class="note">原型只显示文件名，不读取内容。文件夹选择与真实解析待正式实现。</p></div>${s.files.length?`<div class="tablewrap"><table><thead><tr><th>物料</th><th>内容线索</th><th>状态</th><th>操作</th></tr></thead><tbody>${s.files.map(f=>`<tr><td><strong>${esc(f.name)}</strong><small>${esc(f.type)} · ${esc(f.where||'尚未解析')}</small></td><td>${esc(f.module||'待识别')}</td><td>${badge(f.status,f.status==='成功'?'ok':f.status==='部分失败'?'warn':'')}</td><td>${f.status==='部分失败'?btn('查看问题','file-detail',`data-id="${f.id}"`)+btn('重试','retry-file',`data-id="${f.id}"`,'quiet'):''}${btn(f.status==='已排除'?'恢复':'排除','toggle-file',`data-id="${f.id}"`,'quiet')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">先添加材料，或载入示例体验完整流程。</div>'}${s.scanned?`<div class="notice ${fails?'warn':''}">扫描结束（模拟）：识别储能、光伏、收益结算和公共模块。${fails?'设备协议有2页待OCR，内容覆盖不完整。':'当前示例可解析内容已就绪。'}</div>${fails?`<label class="check"><input type="checkbox" id="coverage" ${s.coverageAck?'checked':''}>我了解材料覆盖缺口，允许先用已解析部分继续。</label>`:''}<details><summary>默认排除与解析边界</summary><p>依赖目录、构建产物、凭据文件默认排除。材料不执行；没有识别出的技术栈不得宣称结构分析完整。</p></details>`:''}<div class="notice">扫描或对话如需远程模型，正式页面须显示供应商与材料发送范围。本原型没有任何网络请求。</div></section><div class="footer"><small>至少一份可用材料；失败不能当成空内容忽略。</small><div class="actions">${btn('扫描物料','scan',!s.files.some(f=>f.status!=='已排除')?'disabled':'')}${btn('继续确定范围 →','goto',`data-page="scope" ${!s.scanned||fails&&!s.coverageAck?'disabled':''}`,'primary')}</div></div>`}
function scopePage(){return `<div class="intro"><h1>一起确定建模范围 ${mark('A03')}</h1><p class="muted">不用一次说清楚。结合材料逐步确认，右侧摘要是本次生成的正式范围依据。</p></div><div class="grid2"><section class="card chatbox"><div class="row"><h2>范围讨论</h2>${badge('示例对话','blue')}</div><div class="chatlog">${s.chat.map(c=>`<div class="message ${c.role==='you'?'you':''}"><strong>${c.role==='you'?'你':'建模助手 · 模拟'}</strong>${esc(c.text)}</div>`).join('')}</div><div class="choices">${s.round===0?btn('储能运行，不含收益结算','scope-choice','data-v="energy"')+btn('覆盖全部业务模块','scope-choice','data-v="all"'):s.round===1?btn('计划包含生成、审核、下发','scope-choice','data-v="full"')+btn('只描述计划内容与生成规则','scope-choice','data-v="limited"'):s.round===2?btn('保留园区、电表的必要关联','scope-choice','data-v="related"')+btn('关联概念先暂缓','scope-choice','data-v="norelated"'):btn('重新讨论业务范围','restart-scope','','quiet')}</div><div class="composer"><textarea id="chat-input" aria-label="范围补充" placeholder="输入你的想法。原型只记录文字，不做真实语义理解；可用上方选项体验多轮澄清。"></textarea><div class="row"><small>每轮聚焦关键歧义，不要求回答所有细节。</small>${btn('发送','send-chat','','primary')}</div></div></section><section class="card scopebox"><div class="row"><h2>本次范围</h2>${badge(s.confirmed?'已确认':'待你确认',s.confirmed?'ok':'warn')}</div><label>建模目标</label><textarea id="scope-goal">${esc(s.scope.goal)}</textarea><label>纳入范围</label><textarea id="scope-include" placeholder="对话后填入，也可以直接编辑">${esc(s.scope.include)}</textarea><label>排除范围</label><textarea id="scope-exclude">${esc(s.scope.exclude)}</textarea><label>必要关联与深度</label><textarea id="scope-related">${esc(s.scope.related)}</textarea><div class="notice ${s.pending?'warn':''}">${s.pending?'有自由输入尚未体现在摘要中，请手工核对右侧内容。':'摘要可直接修改；修改后不会自动生成。'}</div>${btn('保存摘要并标记已核对','save-scope')}<details><summary>材料依据与未决问题</summary><p>示例：设备/监测/计划来自运行管理需求、页面和后端；收益结算与光伏为独立模块。</p><p>非阻断：设备SOC文档与代码口径可能不一致，留到候选评审。</p><p>覆盖：${s.files.some(f=>f.status==='部分失败')?'设备协议2页未解析，已确认缺口。':'当前已纳入示例物料可用。'}</p></details><p class="note">已扫描 ${s.files.length} 份材料 · 范围修订 ${s.revision}。此前生成结果${stale()?'已过期，仅供回看':'不受未提交输入影响'}。</p><div class="page-error">${esc(s.error)}</div></section></div><div class="footer"><small>确认后才开始抽象本体；非关键疑问可以留到评审。</small><div class="actions">${btn('返回物料','goto','data-page="materials"')}${btn(s.generated?'确认范围并重新生成':'确认范围并生成 →','confirm-scope','','primary')}</div></div>`}
function generatePage(){return `<div class="intro"><h1>构建本体初稿 ${mark('A04')}</h1><p class="muted">按确认范围分析证据。此阶段不会创建正式本体。</p></div><div class="grid2"><section class="card"><div class="row"><h2>处理阶段</h2>${badge(s.run==='running'?'生成中':s.run==='failed'?'阶段失败':s.run==='cancelled'?'已取消':s.run==='done'?'已完成':'未开始',s.run==='failed'?'bad':s.run==='done'?'ok':'blue')}</div>${stages.map((t,i)=>`<div class="stage ${i<s.stage?'done':i===s.stage?'current':''}"><span class="circle">${i<s.stage?'✓':i+1}</span><div><strong>${t}</strong><p class="muted">${['片段相关性与必要依赖，不按表名一一生成对象','对齐页面、代码、表结构与文档，保留来源位置','对象、属性、链接、规则、动作及关联','有冲突则保留双方，结构问题不能假通过','按现有协议分配引用并校验，不创建项目映射'][i]}</p></div><span class="right">${badge(i<s.stage?'已完成':i===s.stage&&s.run==='failed'?'失败':i===s.stage&&s.run==='running'?'处理中':'待处理')}</span></div>`).join('')}<div class="notice ${s.run==='failed'?'bad':''}">${s.run==='failed'?'模拟模型请求失败；已完成阶段保留，可重试当前阶段。':s.run==='cancelled'?'生成已取消，未创建本体。可继续模拟剩余阶段。':s.run==='done'?'初稿已就绪：1项口径冲突、2项推断待确认。请人工评审。':'原型使用“推进下一阶段”模拟进度，不代表实际耗时。'}</div><div class="actions">${s.run==='running'?btn('模拟：推进下一阶段','advance','','primary')+btn('模拟阶段失败','fail-stage')+btn('取消生成','cancel-run','','danger'):s.run==='failed'||s.run==='cancelled'?btn('继续 / 重试当前阶段','resume','','primary'):''}${s.run==='done'?btn('评审初稿 →','goto','data-page="review"','primary'):''}</div></section><section class="card"><h2>本次生成依据</h2><div class="scopeitem"><strong>目标</strong>${esc(s.scope.goal)}</div><div class="scopeitem"><strong>纳入</strong>${esc(s.scope.include)}</div><div class="scopeitem"><strong>排除</strong>${esc(s.scope.exclude||'未指定')}</div><div class="scopeitem"><strong>关联边界</strong>${esc(s.scope.related||'未指定')}</div><div class="scopeitem"><strong>基线</strong>范围修订 ${s.revision} · ${s.files.length}份演示物料</div><p class="note">原型生成固定储能样例。选择“全部业务”时仍仅演示此样例，正式产品不得忽略用户确认范围。</p><details><summary>运行与重试边界</summary><p>正式任务离开页面可继续；中断后不得假称运行中。原型刷新会复位，不演示后台任务或持久恢复。</p></details></section></div>`}
function reviewPage(){let i=get(s.selected)||s.items[0];const visible=s.items.filter(c=>!c.mergedInto&&(s.filter==='全部'||c.type===s.filter)&&(s.decisionFilter==='全部'||c.decision===s.decisionFilter)&&(c.name.includes(s.search)||c.definition.includes(s.search)));return `<div class="row intro"><div><h1>评审本体初稿 ${mark('A05')}</h1><p class="muted">拟纳入 ${selected().length} 项 · 暂缓 ${s.items.filter(i=>i.decision==='defer'&&!i.mergedInto).length} 项 · 已排除 ${s.items.filter(i=>i.decision==='exclude').length} 项。名称与定义可修改，依据始终保留。</p></div><div class="actions">${btn('修改生成范围','goto','data-page="scope"')}${btn('保存前检查 →','goto','data-page="save"','primary')}</div></div>${stale()?'<div class="notice warn">物料或范围已改变。当前结果已过期，请重新确认范围并生成；人工决定会保留。</div>':''}<div class="reviewgrid"><section class="card"><h2>候选定义</h2><input id="search" aria-label="搜索候选" placeholder="搜索名称或定义" value="${esc(s.search)}"><div class="row"><select id="type-filter" aria-label="类型筛选">${['全部',...types].map(t=>`<option ${s.filter===t?'selected':''}>${t}</option>`).join('')}</select><select id="decision-filter" aria-label="决定筛选">${[['全部','全部状态'],['include','拟纳入'],['defer','暂缓'],['exclude','已排除']].map(([v,n])=>`<option value="${v}" ${s.decisionFilter===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="list">${visible.map(c=>`<button class="candidate ${c.id===i.id?'on':''}" data-action="select-candidate" data-id="${c.id}"><small>${c.type}${c.owner?' · '+esc(get(c.owner)?.name):''}</small><strong>${esc(c.name)}</strong><div class="row">${badge(c.status,c.status==='有依据'?'ok':'warn')}<small>${names[c.decision]}</small></div></button>`).join('')||'<div class="empty">没有匹配项</div>'}</div>${s.merge?btn('撤销上次合并','undo-merge','','quiet'):''}</section><section class="card"><div class="row"><h2>${esc(i.name)}</h2>${badge(i.type,'blue')}</div><p class="muted">${i.deps.length?'关联：'+esc(depsNames(i)):'独立业务概念'} · ${i.reviewed?'已人工审阅':'待人工审阅'}</p><label>名称 *</label><input id="item-name" value="${esc(i.name)}"><label>业务定义 *</label><textarea id="item-definition" style="min-height:120px">${esc(i.definition)}</textarea>${i.type==='属性'?`<label>数据类型</label><select id="item-dtype">${['文本','数值','是／否','时间','数组','结构体','时间序列'].map(t=>`<option ${t===i.dtype?'selected':''}>${t}</option>`).join('')}</select><div id="observation">${i.dtype==='时间序列'?observation(i):''}</div><p class="note">本示例属性为对象私有；共享转换须先确认业务含义一致。单位不凭字段名推测。</p>`:''}${i.type==='链接'?`<div class="notice">${esc(get(i.source)?.name)} → ${esc(i.name)} → ${esc(get(i.target)?.name)}<br>${esc(i.cardinality)} · 原型展示已提取关系；正式产品复用现有链接编辑字段。</div>`:''}${i.type==='规则'?`<label>规则内容（选填）</label><textarea id="item-content">${esc(i.content||'')}</textarea>`:''}${i.type==='动作'?`<label>预期效果（选填）</label><textarea id="item-effect" placeholder="不确定时可以留空，不推断断电等未证实效果">${esc(i.effect||'')}</textarea>`:''}${i.status!=='有依据'?`<div class="notice warn">${i.status==='来源冲突'?'文档与代码存在不同口径。请选择采用的定义并记录理由，或暂缓。':'当前结论含推断。纳入前请补充人工确认依据，或暂缓。'}</div>${i.id==='rule'?btn('采用文档加权口径（示例）','resolve-rule'):''}<label>人工确认依据${i.status==='有依据'?'':'（纳入时必填）'}</label><textarea id="item-reason" placeholder="说明采用哪份依据，或者补充你的业务确认">${esc(i.reason||'')}</textarea>`:''}<div class="actions" style="margin-top:15px">${btn('保存编辑','save-item','','primary')}${btn('取消编辑','cancel-item')}${i.id==='duplicate'&&!i.mergedInto?btn('合并到储能簇','merge-preview'):''}</div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>本次决定：${names[i.decision]}</h3><div class="actions">${btn('纳入','decide','data-v="include"',i.decision==='include'?'primary':'')}${btn('暂缓','decide','data-v="defer"',i.decision==='defer'?'primary':'')}${btn('排除','decide','data-v="exclude"','danger')}</div><p class="note">排除可恢复。决定操作使用已保存字段；未保存编辑会提示先保存。排除对象不自动删除属性或链接。</p><div class="page-error">${esc(s.error)}</div></section><section class="card evidencecard"><h2>定义依据 ${mark('A05')}</h2><p class="muted">按字段定位原文；所有文件及位置均为虚构示例。</p><div class="scroll">${i.evidence.map(e=>`<article class="evidence"><h3>${esc(e.field)}</h3><small>${esc(e.file)}</small><small>${esc(e.loc)} · 材料快照：demo-1</small><pre>${esc(e.text)}</pre></article>`).join('')}<details><summary>事实、推断与人工修改</summary><p>${i.status==='有依据'?'当前字段有对应材料支持，仍需人工判断定义是否准确。':'此项有待确认内容，不以模型自评分替代证据。'}</p><p>人工编辑不会改写来源原文；修改后的结论与原证据是否一致需要重新核对。</p></details></div></section></div>`}
function observation(i){return `<label>观测值类型 *</label><select id="item-valueType">${['数值','文本','是／否','时间'].map(t=>`<option ${t===i.valueType?'selected':''}>${t}</option>`).join('')}</select>`}
function savePage(){const errors=issues(),counts=types.map(t=>[t,selected().filter(i=>i.type===t).length]);return `<div class="intro"><h1>保存为新本体 ${mark('A06')}</h1><p class="muted">只写入本次选定的定义。暂缓与排除项继续留在生成任务中。</p></div><div class="grid2"><section class="card"><h2>本次纳入</h2><div class="metrics">${counts.map(([t,n])=>`<div class="metric"><small>${t}</small><strong>${n}</strong></div>`).join('')}</div><div class="notice ${errors.length||stale()?'bad':''}">${stale()?'结果已过期，请重新确认范围并生成。':errors.length?`有 ${errors.length} 项阻断，不能创建本体。`:'当前演示选定集合通过结构检查；不代表业务内容已全部验证。'}</div>${errors.length?`<ul>${errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`:''}<div class="tablewrap"><table><thead><tr><th>定义</th><th>类型</th><th>人工审阅</th></tr></thead><tbody>${selected().map(i=>`<tr><td>${esc(i.name)}</td><td>${i.type}</td><td>${i.reviewed?'已审阅':'待继续完善'}</td></tr>`).join('')}</tbody></table></div><details><summary>未纳入项与材料缺口</summary><p>${s.items.filter(i=>i.decision!=='include'&&!i.mergedInto).map(i=>esc(i.name)+'（'+names[i.decision]+'）').join('、')||'无'}</p><p>${s.files.some(f=>f.status==='部分失败')?'设备协议2页未解析，已确认允许继续。':'示例可用材料已解析。'}</p></details>${btn('返回评审并处理','goto','data-page="review"')}</section><section class="card"><h2>新本体信息</h2><label>本体名称 *</label><input id="final-name" value="${esc(s.name)}"><p class="note">示例中“储能本体”为已存在名称，输入此名称可体验同名保护。正式产品按当前账号检查。</p><div class="notice">新建为未发布草稿；不修改任何已有本体，不生成项目映射。来源依据保留在本次任务。</div><label class="check"><input id="final-ack" type="checkbox" ${s.checkAck?'checked':''}>我已核对本次选定集合，了解生成结果仍需人工完善，暂缓项不会写入本体。</label><div class="page-error">${esc(s.error)}</div>${btn('创建新本体草稿','create-ontology',errors.length||stale()||!s.checkAck?'disabled':'','primary')}<p class="note">原型仅模拟创建；正式保存需服务端校验、原子写入和幂等保护。该任务只能交付一次。</p></section></div>`}
function completePage(){return `<section class="card" style="max-width:850px;margin:35px auto"><div class="success">✓</div><h1>新本体草稿已创建（模拟）</h1><p class="muted">${esc(s.published?.name)} · ${esc(s.published?.id)}</p><div class="notice">正式工作台没有新增任何数据。本页演示保存成功后的交接。</div><p>已选定 ${selected().length} 项定义；暂缓与排除项仍在任务中。接下来使用现有对象建模页面继续修改和裁剪。</p><div class="actions">${btn('进入对象建模（示意）','workspace','','primary')}${btn('返回生成任务','tasks')}</div><details><summary>查看本次生成摘要</summary><p>范围：${esc(s.scope.include)}</p><p>排除：${esc(s.scope.exclude)}</p><p>剩余候选不会自动同步到本体。再次创建需要新任务。</p></details></section>`}
function workspacePage(){return `<div class="row intro"><div><h1>${esc(s.published?.name)}</h1><p class="muted">对象建模 · 保存后的交接示意，非正式工作台</p></div>${btn('查看生成来源任务','complete')}</div><section class="card"><h2>从这里继续完善</h2><div class="tablewrap"><table><thead><tr><th>对象</th><th>业务定义</th><th>关联属性</th></tr></thead><tbody>${selected().filter(i=>i.type==='对象').map(i=>`<tr><td><strong>${esc(i.name)}</strong></td><td>${esc(i.definition)}</td><td>${selected().filter(p=>p.type==='属性'&&p.owner===i.id).map(p=>esc(p.name)).join('、')||'—'}</td></tr>`).join('')}</tbody></table></div><div class="notice">正式实现复用已有对象、属性、链接、规则与动作编辑页。本原型不重建这些页面。</div></section>`}
function readScope(){return {goal:$('#scope-goal')?.value??s.scope.goal,include:$('#scope-include')?.value??s.scope.include,exclude:$('#scope-exclude')?.value??s.scope.exclude,related:$('#scope-related')?.value??s.scope.related}}
function saveScope(){const n=readScope();if(JSON.stringify(n)!==JSON.stringify(s.scope)){s.scope=n;invalidate()}s.pending=false;s.error=''}
function readItem(){const i=copy(get(s.selected));if(!i)return null;i.name=$('#item-name')?.value??i.name;i.definition=$('#item-definition')?.value??i.definition;if(i.type==='属性'){i.dtype=$('#item-dtype')?.value??i.dtype;if(i.dtype==='时间序列')i.valueType=$('#item-valueType')?.value||'数值';else delete i.valueType}if(i.type==='规则')i.content=$('#item-content')?.value??i.content;if(i.type==='动作')i.effect=$('#item-effect')?.value??i.effect;if($('#item-reason'))i.reason=$('#item-reason').value;return i}
function dirtyItem(){return s.page==='review'&&JSON.stringify(readItem())!==JSON.stringify(get(s.selected))}
function dirtyScope(){return s.page==='scope'&&JSON.stringify(readScope())!==JSON.stringify(s.scope)}
function navigate(page){if(dirtyItem()||dirtyScope()){notify('有未保存编辑，请先保存或取消，再切换。');return}if(canGo(page)){s.page=page;s.error='';render()}}
function loadSample(){s.task=true;s.files=copy(materials);s.scanned=false;s.coverageAck=false;invalidate();s.page='materials'}
function completeRun(){s.stage=5;s.run='done';s.generated=true;s.resultRev=s.revision;if(!s.items.length)s.items=copy(seeds);else s.history.push({revision:s.resultRev,items:copy(s.items)});s.selected=s.items.find(i=>!i.mergedInto)?.id||'cluster';notify('初稿生成完成（固定样例），请评审定义与依据。')}
function act(action,data={}){
 if(action==='goto'){navigate(data.page);return}if(action==='select-candidate'){if(dirtyItem()){notify('请先保存或取消当前编辑。');return}s.selected=data.id;s.error='';render();return}
 if(action==='reset'){modal('重新开始演示？','<p>清空本页内存中的模拟任务，不影响真实工作台。</p>',btn('取消','close')+btn('重新开始','reset-confirm','','primary'));return}
 if(action==='reset-confirm'){s=fresh();mergeBackup=null;close();render();return}if(action==='close'){close();return}
 if(action==='marks'){if(dirtyItem()||dirtyScope()){notify('请先保存或取消编辑后切换标注。');return}s.marks=!s.marks;render();return}
 if(action==='demo'){modal('演示控制','<p>选择下一次扫描、发送、保存或创建动作的模拟结果。原型不会发送网络请求。</p><label>下一次操作</label><select id="sim-choice"><option value="success">成功</option><option value="error">请求失败</option><option value="conflict">修订冲突</option></select>',btn('取消','close')+btn('应用','apply-demo','','primary'));return}
 if(action==='apply-demo'){s.simulate=$('#sim-choice').value;close();notify('下一次操作模拟：'+s.simulate);return}
 if(action==='new-task'){modal('新建生成任务','<label>任务名称 *</label><input id="new-name" value="储能运行管理本体"><p class="note">只创建生成任务，尚未创建本体。示例任务只保留在当前页面。</p>',btn('取消','close')+btn('开始','create-task','','primary'));return}
 if(action==='create-task'){const name=$('#new-name').value.trim();if(!name){notify('请填写任务名称。');return}if(s.task){notify('原型仅支持一个任务，请先用“重新开始”复位。');return}s.task=true;s.name=name;s.page='materials';close();render();return}
 if(action==='load-demo'){loadSample();render();return}if(action==='sample'){if(s.generated){notify('已有结果，请用演示重置加载新示例，避免覆盖评审。');return}loadSample();render();return}
 if(action==='tasks'){if(dirtyItem()||dirtyScope()){notify('请先保存或取消编辑。');return}s.page='tasks';render();return}
 if(action==='continue'){s.page=s.published?'complete':s.generated?'review':s.scanned?'scope':'materials';render();return}
 if(action==='scan'){if(!s.files.some(f=>f.status!=='已排除')){notify('至少添加一份材料。');return}if(!gate('扫描'))return;s.files.forEach(f=>{if(f.status!=='已排除')f.status=f.id==='m5'?'部分失败':'成功'});s.scanned=true;s.coverageAck=false;invalidate();if(!s.chat.length)s.chat=[{role:'assistant',text:'我识别到设备管理、运行监测、充放电计划、收益结算与光伏模块（固定示例）。你希望本次覆盖哪些业务？建议先明确主业务，再保留必要公共概念。'}];render();return}
 if(action==='retry-file'){if(!gate('重试'))return;const f=s.files.find(f=>f.id===data.id);f.status='成功';invalidate();render();return}
 if(action==='toggle-file'){const f=s.files.find(f=>f.id===data.id);f.status=f.status==='已排除'?'待扫描':'已排除';s.scanned=false;invalidate();render();return}
 if(action==='file-detail'){modal('部分解析失败','<p>设备协议.pdf：第8、9页为扫描页，当前OCR服务不可用。</p><p>其他页可以继续提供证据。可重试、排除此材料，或明确接受覆盖缺口后继续。</p><p class="note">这是固定失败示例，没有读取真实文件。</p>',btn('关闭','close'));return}
 if(action==='save-scope'){if(!gate('保存摘要'))return;saveScope();render();notify('范围摘要已保存；尚未开始生成。');return}
 if(action==='scope-choice'){if(dirtyScope()){notify('请先保存右侧手工修改的范围摘要。');return}if(!gate('对话'))return;const v=data.v;let u,a;
 if(v==='energy'||v==='all'){s.scope.include=v==='energy'?'储能设备管理、运行监测、充放电计划':'材料中的设备管理、监测、计划、收益结算与光伏业务';s.scope.exclude=v==='energy'?'收益结算、光伏业务、技术基础设施':'技术基础设施';u=v==='energy'?'聚焦储能运行，不包含收益结算。':'覆盖全部业务模块。';a='计划流程涉及生成、审核和下发。本次需要完整业务流程，还是只描述计划与生成规则？';s.round=1}
 else if(v==='full'||v==='limited'){s.scope.include=s.scope.include.replace(/；计划范围：.*/,'')+'；计划范围：'+(v==='full'?'生成、审核、下发全流程':'计划内容与生成规则');u=v==='full'?'计划包含生成、审核和下发。':'只描述计划内容与生成规则。';a='材料中的储能设备关联园区和电表。建议保留必要关联定义，不扩展园区其他业务和电表计费规则。';s.round=2}
 else {s.scope.related=v==='related'?'园区、电表：仅保留目标业务必要定义与关系，不展开计费及园区其他业务':'关联概念暂缓；相关链接列为候选，不自动纳入';u=v==='related'?'保留必要关联，其他业务不展开。':'关联概念先暂缓。';a='范围摘要已更新。设备SOC有文档与代码口径冲突，可留到生成后的评审处理。请核对右侧摘要后确认。';s.round=3}
 s.chat.push({role:'you',text:u},{role:'assistant',text:a});invalidate();render();return}
 if(action==='send-chat'){if(dirtyScope()){notify('请先保存右侧手工修改，再继续对话。');return}const t=$('#chat-input').value.trim();if(!t)return;if(!gate('发送'))return;s.chat.push({role:'you',text:t},{role:'assistant',text:'已记录你的补充。原型没有真实LLM，不能自动理解并修改范围；请将你的决定填写到右侧摘要，再点击“保存摘要并标记已核对”。正式功能会针对该补充继续澄清。'});s.pending=true;invalidate();render();return}
 if(action==='restart-scope'){if(dirtyScope()){notify('请先保存右侧修改。');return}s.round=0;s.chat.push({role:'assistant',text:'可以重新选择业务范围，旧结果将保留供查看，但新范围需要重新确认。'});invalidate();render();return}
 if(action==='confirm-scope'){if(dirtyScope()){notify('请先保存右侧范围摘要。');return}if(!s.scope.goal.trim()||!s.scope.include.trim()||s.pending){s.error='请补充目标、纳入范围，并核对未处理的对话补充。';render();return}if(!gate('确认范围'))return;s.confirmed=true;s.resultRev=-1;s.run='running';s.stage=0;s.page='generate';s.error='';render();return}
 if(action==='advance'){if(s.run!=='running')return;s.stage++;if(s.stage>=5)completeRun();render();return}if(action==='fail-stage'){s.run='failed';render();return}if(action==='cancel-run'){s.run='cancelled';render();return}if(action==='resume'){s.run='running';render();return}
 if(action==='save-item'){const n=readItem();if(!n.name.trim()||!n.definition.trim()){notify('名称和业务定义必填，原内容未修改。');return}if(!gate('保存编辑'))return;n.reviewed=true;s.items[s.items.findIndex(i=>i.id===n.id)]=n;s.checkAck=false;s.error='';render();notify('编辑已保存在模拟任务，未写正式本体。');return}
 if(action==='cancel-item'){s.error='';render();return}
 if(action==='resolve-rule'){if($('#item-content'))$('#item-content').value='设备SOC＝Σ（簇SOC×簇额定容量）÷Σ（簇额定容量）。参与数据须统一比例和容量单位；其他边界按材料进一步确认。';$('#item-reason').value='人工选择需求文档的容量加权口径；现有代码差异作为实现待核对事项，不写入本体为确定事实。';notify('已填入示例选择，请审阅并保存编辑，再纳入。');return}
 if(action==='decide'){if(dirtyItem()){notify('请先保存编辑，再调整纳入决定。');return}const i=get(s.selected);if(data.v==='include'&&i.status!=='有依据'&&!i.reason?.trim()){notify('此项含推断或冲突，请填写人工确认依据并保存，或继续暂缓。');return}if(!gate('保存决定'))return;i.decision=data.v;i.reviewed=true;s.checkAck=false;render();const dependents=selected().filter(j=>j.deps.includes(i.id));if(data.v!=='include'&&dependents.length)notify('已保留原关联。'+dependents.length+'项已选定义依赖此项，保存前需要处理。');return}
 if(action==='merge-preview'){if(dirtyItem()){notify('请先保存或取消当前编辑。');return}modal('合并重复对象','<p>将“电池簇”合并到“储能簇”。保留储能簇的名称和定义，合并双方证据，原候选记录保留。</p><div class="notice">示例材料明确给出同义表述；这不是仅按名称相似度合并。正式实现必须比较字段和关联差异。</div>',btn('取消','close')+btn('确认合并','merge','','primary'));return}
 if(action==='merge'){if(!gate('合并'))return;mergeBackup=copy(s.items);const from=get('duplicate'),to=get('cluster');to.evidence.push(...copy(from.evidence));from.mergedInto=to.id;from.decision='exclude';s.items.forEach(i=>{i.deps=i.deps.map(id=>id===from.id?to.id:id)});s.merge=true;s.selected='cluster';s.checkAck=false;close();render();return}
 if(action==='undo-merge'){modal('撤销合并？','<p>恢复合并前的候选、证据和关联。本原型会一并还原合并之后对候选的修改；请确认没有需要保留的后续编辑。</p>',btn('取消','close')+btn('恢复合并前状态','undo-merge-confirm','','primary'));return}
 if(action==='undo-merge-confirm'){if(mergeBackup)s.items=copy(mergeBackup);s.merge=false;s.selected='duplicate';s.checkAck=false;close();render();return}
 if(action==='create-ontology'){if(s.published){s.page='complete';render();return}if(stale()||issues().length||!s.checkAck){notify('请先完成当前基线的检查和确认。');return}const name=$('#final-name').value.trim();if(!name){notify('本体名称不能为空。');return}if(name==='储能本体'){s.error='当前账号已有同名本体。请修改名称；不会覆盖现有内容。';$('#page .page-error').textContent=s.error;return}if(!gate('创建'))return;s.name=name;s.published={name,id:'demo-new-ontology-001'};s.page='complete';render();return}
 if(action==='workspace'){s.page='workspace';render();return}if(action==='complete'){s.page='complete';render();return}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)act(el.dataset.action,el.dataset)});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='files'){const added=Array.from(el.files||[]).map((f,i)=>({id:'u'+Date.now()+i,name:f.name,type:'用户文件（仅元信息）',status:'待扫描',module:'原型未读取',where:'正式解析待实现'}));s.task=true;s.files.push(...added);s.scanned=false;invalidate();render()}if(el.id==='coverage'){s.coverageAck=el.checked;render()}if(el.id==='type-filter'){if(dirtyItem()){notify('请先保存编辑。');el.value=s.filter;return}s.filter=el.value;render()}if(el.id==='decision-filter'){if(dirtyItem()){notify('请先保存编辑。');el.value=s.decisionFilter;return}s.decisionFilter=el.value;render()}if(el.id==='final-ack'){s.checkAck=el.checked;const b=$('[data-action="create-ontology"]');b.disabled=issues().length>0||stale()||!s.checkAck}if(el.id==='item-dtype')$('#observation').innerHTML=el.value==='时间序列'?observation({valueType:'数值'}):''});
document.addEventListener('input',e=>{if(e.target.id==='search'){if(dirtyItem()){notify('请先保存编辑。');return}s.search=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&$('#modal .dialog')){const els=Array.from($('#modal .dialog').querySelectorAll('button,input,select,textarea,a[href]')).filter(x=>!x.disabled);if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.__prototype={get state(){return s},act,issues,canGo,stale,completeRun,render,reset(){s=fresh();mergeBackup=null;render()}};
render();
