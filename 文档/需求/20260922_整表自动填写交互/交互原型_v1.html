<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自动填写 · 两页交互原型</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#24384c;background:#f5f7fa}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #d8e1ed;border-radius:6px;background:white;color:inherit;padding:8px 14px}button:hover{background:#f0f5ff}button:disabled{opacity:.48;cursor:not-allowed}.primary{background:#285bea;color:white;border-color:#285bea}.primary:hover{background:#174ad4}aside{position:fixed;width:218px;inset:0 auto 0 0;background:white;border-right:1px solid #dce4ee;padding:24px 16px}.brand{font-size:19px;font-weight:700}.caps{font-size:10px;letter-spacing:3px;color:#738aa4;margin:4px 0 32px}.nav{display:block;text-align:left;width:100%;border:none;margin:8px 0;padding:12px}.nav.active{background:#edf3ff;color:#245be7;font-weight:600}.aside-note{position:absolute;bottom:22px;color:#8491a1;font-size:12px;right:16px;left:16px}main{margin-left:218px}header{padding:16px 32px;background:#fff;border-bottom:1px solid #dce4ee;display:flex;justify-content:space-between;gap:16px}.muted{color:#75869b;font-size:13px}.wrap{max-width:1130px;padding:24px 32px 60px;margin:auto}.demo{display:flex;justify-content:space-between;align-items:center;color:#7d6531;background:#fff8e7;border:1px solid #eddfb8;padding:9px 14px;border-radius:6px;font-size:12px;margin-bottom:20px}.demo button{padding:3px 9px;background:transparent}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:25px;margin:0 0 4px}h2{font-size:16px;margin:0}.panel{background:white;border:1px solid #dce4ee;border-radius:9px;padding:24px;margin-bottom:18px}.assist{background:#fbfcff}.assist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.ai{color:#285bea;margin-right:7px}.examples{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.examples button{padding:4px 10px;font-size:12px;border-radius:20px}.prompt{width:100%;height:86px;resize:vertical;padding:11px 13px;border:1px solid #cbd7e8;border-radius:6px;color:#24384c;background:white}.actions{display:flex;align-items:center;gap:10px;justify-content:flex-end}.actions .muted{margin-right:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px}.field.full{grid-column:1/-1}.label{display:flex;align-items:center;gap:8px;margin-bottom:7px}.req{color:#d1494b}.field input,.field textarea,.field select{width:100%;padding:9px 11px;border:1px solid #cbd7e8;border-radius:6px;background:white;color:inherit}.field textarea{height:92px;resize:vertical}.field.changed input,.field.changed textarea,.field.changed select{border-color:#81a4ff;background:#f8faff}.badge{font-size:11px;color:#2c61da;background:#edf3ff;padding:1px 6px;border-radius:3px}.status{padding:11px 14px;border-radius:6px;background:#edf5ff;margin:15px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status button{padding:3px 9px}.question{background:#fff9ed;border:1px solid #f0dfbd;border-radius:6px;padding:15px;margin-top:16px}.question button{margin:8px 7px 0 0}.footer{display:flex;align-items:center;gap:10px;padding-top:22px;border-top:1px solid #edf0f4;margin-top:24px}.diff{margin-top:10px;padding:10px;background:#fff;border:1px solid #dce4ee;border-radius:5px}.diff p{margin:4px 0}.diff s{color:#8190a0}.help{font-size:12px;color:#7a8a9d;margin:6px 0 0}input:focus,textarea:focus,select:focus{outline:2px solid #b6caff;outline-offset:1px}.error{color:#ba3e34;background:#fff0ed}button:focus-visible{outline:2px solid #285bea;outline-offset:2px}@media(max-width:800px){aside{position:static;width:auto;border-bottom:1px solid #dce4ee;padding:12px 16px}.brand{font-size:16px}.caps,.aside-note{display:none}.nav{width:auto;display:inline-block;margin:8px 6px 0 0}main{margin-left:0}header{padding:12px 18px}.wrap{padding:18px}.grid{grid-template-columns:1fr}.panel{padding:18px}.actions{flex-wrap:wrap}.actions .muted{width:100%}}

[hidden]{display:none!important}.title-actions{display:flex;gap:12px;align-items:center}.assist{position:fixed;right:0;top:0;bottom:0;width:420px;margin:0;border-radius:0;border-left:1px solid #dce4ee;z-index:30;overflow:auto;box-shadow:-8px 0 28px #26395012;background:white;padding:24px}.assist-head{border-bottom:1px solid #e6ecf3;padding-bottom:16px}.assist .prompt{height:160px}.assist .actions{justify-content:flex-end}.assist .actions .muted{width:100%;margin-bottom:8px}.assist .examples{margin:14px 0 22px}.assist .examples button{text-align:left;border-radius:5px}.drawer-context{font-size:13px;color:#73849a;margin-bottom:18px}.drawer-open main{margin-right:420px}.drawer-open .wrap{padding-left:24px;padding-right:24px}.drawer-open .grid{grid-template-columns:1fr}#feedback:empty{display:none}#feedback{margin-bottom:18px}.shade{position:fixed;inset:0;background:#172c4655;z-index:25;display:none}.close{border:none;padding:4px 9px;font-size:20px}.drawer-open .title-actions .badge{display:none}
@media(max-width:1100px){.drawer-open main{margin-right:0}.drawer-open .shade{display:block}.assist{width:min(420px,100vw)}}
</style>
<aside><div class="brand">◇ 本体工作台</div><div class="caps">ONTOLOGY WORKSPACE</div><div class="muted">体验两个填写页面</div><button class="nav" data-page="property">本体 · 属性定义</button><button class="nav" data-page="mapping">项目 · 属性取值</button><div class="aside-note">输入要求，自动填写当前表单。<br>填完可以继续修改，保存前不生效。</div></aside>
<main><header><span id="crumb"></span><span id="saveState" class="muted"></span></header><div class="wrap"><div class="demo"><span>交互原型 · 预置示例，未连接模型；保存仅在内存中，刷新重置。</span><button id="reset">重置本页</button></div><div class="title"><div><h1 id="title"></h1><div id="subtitle" class="muted"></div></div><div class="title-actions"><span id="typeBadge" class="badge"></span><button id="openAssist" aria-controls="assistDrawer" aria-expanded="false">✦ 自动填写</button></div></div>
<div id="shade" class="shade" hidden></div><section id="assistDrawer" class="panel assist" aria-label="自动填写" hidden><div class="assist-head"><h2><span class="ai">✦</span>自动填写</h2><button id="fold" class="close" aria-label="关闭自动填写">×</button></div><div id="drawerContext" class="drawer-context"></div><p class="muted">说说你想填写什么，生成后将直接填入当前表单。你仍可以检查和修改。</p><div id="assistBody"><textarea id="intent" class="prompt" aria-label="填写要求" placeholder="描述你想填写的内容，也可以粘贴业务说明。"></textarea><div id="examples" class="examples"></div><div class="actions"><span class="muted">填写当前表单；未提及的已有内容保留。</span><button id="cancelGen" hidden>取消生成</button><button id="generate" class="primary">自动填写</button></div></div><div id="question"></div></section><div id="feedback" aria-live="polite"></div>
<section class="panel"><div id="form" class="grid"></div><div class="footer"><button id="save" class="primary">保存</button><button id="cancelEdit">取消修改</button><span class="muted">请检查填写内容，保存后才生效。</span></div></section></div></main>
<script>
const defs={property:{title:'新建属性',sub:'储能本体 / 储能簇',crumb:'本体 / 对象建模 / 储能簇',badge:'属性定义',fields:[['name','属性名称','text',1],['type','数据类型','select',1,['','数值','文本','时间序列']],['definition','业务定义','textarea',1],['observation','观测值类型','select',1,['','数值','文本']],['format','显示格式','text',0]],examples:['新增采样SOC，表示剩余电量占额定容量的百分比，记录历史变化，使用0～100。','把名称改成“储能簇SOC采样值”。']},mapping:{title:'配置 · 额定容量',sub:'创智园二期 / 储能簇 · 本体引用 2.0.0',crumb:'项目 / 对象映射 / 属性取值',badge:'数值',fields:[['connection','数据连接','select',1,['','创智园业务库','储能历史库']],['table','表 / 视图','select',1,['','m_storage_cluster_phase']],['value','取值字段','select',1,['','capacity','rated_power']],['match','匹配方式','select',1,['','当前实例 id = 表中 id']],['description','取值说明','textarea',0]],examples:['额定容量从m_storage_cluster_phase的capacity取值，用当前实例id匹配表里的id。','用创智园业务库，从m_storage_cluster_phase.capacity取值，按当前实例id匹配id。']}};
function initial(k){return Object.fromEntries(defs[k].fields.map(f=>[f[0],'']))}const states=Object.fromEntries(Object.keys(defs).map(k=>[k,{draft:initial(k),saved:initial(k),intent:'',changed:[],before:null,undo:false,details:false,notice:'',error:false,question:false,fold:true}]));let page='property',generation=0,busy=false;const $=id=>document.getElementById(id);const clone=x=>JSON.parse(JSON.stringify(x));const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function state(){return states[page]}function stop(){generation++;busy=false}function dirty(){return JSON.stringify(state().draft)!==JSON.stringify(state().saved)}
function fields(){const s=state();return defs[page].fields.filter(f=>f[0]!=='observation'||s.draft.type==='时间序列')}
function render(){const d=defs[page],s=state();$('crumb').textContent=d.crumb;$('title').textContent=d.title;$('subtitle').textContent=d.sub;$('typeBadge').textContent=d.badge;$('saveState').textContent=dirty()?'● 有未保存修改':'全部更改已保存';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('intent').value=s.intent;$('intent').disabled=busy;$('generate').disabled=busy||!s.intent.trim();$('generate').textContent=busy?'正在填写…':'自动填写';$('cancelGen').hidden=!busy;$('assistDrawer').hidden=s.fold;$('shade').hidden=s.fold;document.body.classList.toggle('drawer-open',!s.fold);$('openAssist').setAttribute('aria-expanded',String(!s.fold));$('drawerContext').textContent=d.sub+' · '+d.title;$('examples').innerHTML=d.examples.map((v,i)=>'<button data-example="'+i+'">'+(i===0?'试试：'+(page==='property'?'创建采样SOC':'一句话配置字段'):(page==='property'?'试试：只修改名称':'试试：连数据连接一起填写'))+'</button>').join('');
$('form').innerHTML=fields().map(([key,label,kind,req,opts])=>{const val=s.draft[key],ch=s.changed.includes(key);let control=kind==='select'?'<select id="f-'+key+'" data-field="'+key+'">'+opts.map(v=>'<option value="'+esc(v)+'"'+(v===val?' selected':'')+'>'+esc(v||'请选择')+'</option>').join('')+'</select>':kind==='textarea'?'<textarea id="f-'+key+'" data-field="'+key+'">'+esc(val)+'</textarea>':'<input id="f-'+key+'" data-field="'+key+'" value="'+esc(val)+'">';return '<div class="field '+(kind==='textarea'?'full ':'')+(ch?'changed':'')+'"><label class="label" for="f-'+key+'">'+label+(req?' <span class="req">*</span>':'')+(ch?' <span class="badge">已自动填写</span>':'')+'</label>'+control+(key==='format'?'<p class="help">原型用一句话展示格式要求，例如“百分比，0～100”。</p>':'')+'</div>'}).join('');
$('feedback').innerHTML=s.notice?'<div class="status '+(s.error?'error':'')+'"><span>'+esc(s.notice)+'</span>'+(s.before?'<button id="undo" '+(!s.undo?'disabled':'')+'>撤销本次填写</button><button id="details">'+(s.details?'收起修改':'查看修改')+'</button>':'')+'</div>':'';if(s.before&&s.details){$('feedback').innerHTML+='<div class="diff">'+defs[page].fields.filter(f=>s.changed.includes(f[0])).map(f=>'<p>'+esc(f[1])+'：<s>'+esc(s.before[f[0]]||'空')+'</s> → '+esc(s.draft[f[0]]||'空')+'</p>').join('')+'</div>'}
$('question').innerHTML=s.question?'<div class="question"><strong>使用哪个数据连接？</strong><div class="muted">两个示例连接都有这张表。其余信息已填入，连接尚未确定。</div><button data-answer="创智园业务库">创智园业务库</button><button data-answer="储能历史库">储能历史库</button><button data-answer="">暂不确定</button></div>':'';
$('save').disabled=busy;}
function apply(values){const s=state();s.before=clone(s.draft);s.changed=Object.keys(values).filter(k=>values[k]!==s.draft[k]);Object.assign(s.draft,values);s.undo=s.changed.length>0;s.details=false;s.error=false;s.notice=s.changed.length?'已填写 '+s.changed.length+' 项，尚未保存。':'内容已一致，无需修改。';if(!s.changed.length)s.before=null;}
function generate(){const s=state(),text=s.intent.trim();if(!text||busy)return;stop();const ticket=generation;busy=true;s.question=false;s.notice='正在理解要求并填写当前表单…';s.error=false;render();setTimeout(()=>{if(ticket!==generation)return;busy=false;if(page==='property'){if(/名称.*[“"].+[”"]/.test(text)){const name=(text.match(/[“"]([^”"]+)[”"]/)||[])[1];apply({name})}else if(/soc/i.test(text)&&/历史|采样/.test(text)&&/额定容量/.test(text)&&/0.?100/.test(text)){const vals={name:'采样SOC',definition:'电池剩余电量占额定容量的百分比，按采样时间记录其历史变化。',type:'时间序列',observation:'数值',format:'百分比，0～100'};if(s.draft.name)delete vals.name;apply(vals)}else{s.notice='此离线原型仅演示上方两个示例；请点击示例体验。没有修改表单。';s.error=false}}else if(/capacity/.test(text)&&/m_storage_cluster_phase/.test(text)&&/id/i.test(text)){const conn=text.includes('创智园业务库')?'创智园业务库':text.includes('储能历史库')?'储能历史库':'';const vals={table:'m_storage_cluster_phase',value:'capacity',match:'当前实例 id = 表中 id',description:'读取储能簇来源表的 capacity 字段，以当前实例 id 匹配表中 id，取得额定容量。'};if(conn)vals.connection=conn;apply(vals);s.question=!conn&&!s.draft.connection}else{s.notice='此原型支持上方字段绑定示例；请点击示例体验。没有修改表单。';s.error=false}if(s.notice.startsWith('已填写 ')&&!s.question&&!s.error)s.fold=true;render();if(s.fold)$('openAssist').focus()},850)}
$('generate').onclick=generate;$('cancelGen').onclick=()=>{stop();state().notice='已取消填写，表单未改变。';render()};$('intent').oninput=e=>{state().intent=e.target.value;$('generate').disabled=!e.target.value.trim()};function closeAssist(){if(busy){stop();state().notice='已关闭自动填写，本次生成已取消。'}state().fold=true;render();$('openAssist').focus()}$('fold').onclick=closeAssist;$('shade').onclick=closeAssist;$('openAssist').onclick=()=>{state().fold=false;render();$('intent').focus()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!state().fold)closeAssist()});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{if(b.dataset.page===page)return;if(busy)state().notice='已切换页面，上一页生成已取消。';stop();state().fold=true;page=b.dataset.page;state().fold=true;render()});$('examples').onclick=e=>{const b=e.target.closest('[data-example]');if(b&&!busy){state().intent=defs[page].examples[Number(b.dataset.example)];render();$('intent').focus()}};
$('form').addEventListener('input',e=>{const k=e.target.dataset.field;if(!k)return;const s=state();if(busy){stop();s.notice='你已修改表单，本次生成已取消。'}s.draft[k]=e.target.value;if(s.before&&s.undo){s.undo=false;s.notice='已保留你的手动修改，本次自动填写不可直接撤销。'}if(k==='type'&&s.draft.type!=='时间序列')s.draft.observation='';if(k==='type'||e.target.tagName==='SELECT')render();else{$('saveState').textContent='● 有未保存修改';const u=$('undo');if(u)u.disabled=true;const msg=$('feedback').querySelector('.status span');if(msg)msg.textContent=s.notice}});
$('feedback').onclick=e=>{const s=state();if(e.target.id==='undo'&&s.undo){s.draft=clone(s.before);s.before=null;s.changed=[];s.undo=false;s.question=false;s.notice='已撤销本次填写。';render()}if(e.target.id==='details'){s.details=!s.details;render()}};
$('question').onclick=e=>{const b=e.target.closest('[data-answer]');if(!b)return;const s=state();if(!b.dataset.answer){s.question=false;s.fold=true;s.notice='连接尚未确定，可以稍后手动选择；保存前需要补齐。';render();$('f-connection').focus();return}if(!s.before){s.before=clone(s.draft);s.undo=true}s.draft.connection=b.dataset.answer;if(!s.changed.includes('connection'))s.changed.push('connection');s.question=false;s.fold=true;s.notice='已填写 '+s.changed.length+' 项，尚未保存。';render();$('openAssist').focus()};
$('save').onclick=()=>{const s=state();const missing=fields().filter(f=>f[3]&&!s.draft[f[0]].trim());if(missing.length){s.notice='请补充：'+missing.map(f=>f[1]).join('、')+'。';s.error=true;render();$('f-'+missing[0][0]).focus();return}s.saved=clone(s.draft);s.before=null;s.changed=[];s.undo=false;s.question=false;s.notice='已保存（仅本次原型内存，刷新后重置）。';s.error=false;render()};$('cancelEdit').onclick=()=>{stop();const s=state();s.draft=clone(s.saved);s.before=null;s.changed=[];s.undo=false;s.question=false;s.notice='已恢复到上次保存的内容。';s.error=false;render()};$('reset').onclick=()=>{stop();states[page]={draft:initial(page),saved:initial(page),intent:'',changed:[],before:null,undo:false,details:false,notice:'',error:false,question:false,fold:true};render()};render();
</script></html>
