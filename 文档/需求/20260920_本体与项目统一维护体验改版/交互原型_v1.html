document.getElementById('app').innerHTML=`<aside class="rail"><div class="brand">◇ 本体工作台<small>ONTOLOGY WORKSPACE</small></div><div class="spaces">${btn('本体','space','data-v="ontology"',ontology?'active':'')}${btn('项目','space','data-v="project"',!ontology?'active':'')}</div><section><div class="label">${ontology?'当前本体':'当前项目'}</div><p><strong>${ontology?'储能本体':'创智园二期'}</strong></p><small class="muted">${ontology?'维护业务定义':'固定引用储能本体 '+s.reference}</small></section><nav>${nav.map(([id,n])=>btn(n,ontology?'o-page':'page',`data-v="${id}"`,!s.overview&&(ontology?s.ontoPage:s.page)===id?'active':'')).join('')}</nav>${ontology?btn('更多工具','o-page','data-v="tools"','text'):''}<div class="user"><span class="avatar">演</span>演示用户 <span style="margin-left:auto">⚙</span></div></aside><header class="top"><span class="muted">${ontology?'储能本体 / 本体建设':'创智园二期 / 项目映射'}</span><strong>${title}</strong><span class="status">原型 · 内存示例</span></header><div class="shell"><div class="demo"><strong>统一改版 v1 · 待评审</strong><span>全部模拟，无网络，无真实写入</span>${btn('改动总览','overview')}${btn(s.annotations?'隐藏标注':'显示标注','annotations')}${btn('重置示例','reset')}<a href="需求说明.md">需求说明</a>${!ontology&&!s.overview?'<label>下次提交 <select id="outcome"><option value="success">成功</option><option value="error">服务失败</option><option value="conflict">并发冲突</option></select></label>':''}</div><main>${s.overview?overview():`${ontology?ontologyReview():reviewPanel()}${s.notice?`<div class="notice" role="status">${esc(s.notice)}</div>`:''}${ontology?ontologyPage():s.editor?editor():page()}`}<div class="links"><a href="需求说明.md">完整需求与验收场景</a><span>不包含开发计划与执行指令；标注不是正式产品界面。</span></div></main></div>`;
if(document.getElementById('outcome'))document.getElementById('outcome').value=s.outcome;
if(s.ontoModal)ontologyModal();else renderModal();
}
function page(){return {home:home,connections:connections,binding:binding,flows:flows,validation:validation,reference:reference}[s.page]()}
function checkCaption(){return s.reportError?'检查失败，当前结果未知':s.checked===s.revision?'配置检查基线 r'+s.checked+' · 2026-09-20 14:20（示例）':'配置已变化，上次检查 r'+s.checked+' 已过期'}
function home(){return `<div class="head"><div><h1>创智园二期</h1><p class="muted">维护项目如何识别对象、获取属性和完成业务操作。</p></div>${btn('管理引用版本 '+mark('P07'),'page','data-v="reference"')}</div><section class="card"><div class="row"><div><span class="section-label">本体引用</span><p><strong>储能本体 ${s.reference}</strong></p></div><div>${flag('项目草稿')} ${flag('尚未执行验证')}</div></div><div class="metrics">${[['启用对象',s.objects.length],['具体配置属性',s.props.filter(p=>p.kind).length],['仅填写说明',s.props.filter(p=>!p.kind&&p.note).length]].map(([l,n])=>`<div class="metric"><span class="muted">${l}</span><strong>${n}</strong></div>`).join('')}</div><p class="muted">没有配置的本体属性不自动算作必须完成项。登记实例也可以先于数据连接配置。</p></section><section class="card"><div class="head"><h2>需要处理 ${mark('P01')}</h2>${btn('检查当前配置','check','','primary')}</div><div class="notice ${s.checked===s.revision&&!s.reportError?'':'warning'}">${esc(checkCaption())}</div>${s.reportError?'<p>无法确认问题数量，请重试检查。</p>':issues().map(i=>issueRow(i)).join('')||'<p>当前未发现阻断；不代表业务数据验证通过。</p>'}<div class="check-scope">统计与检查只代表当前项目配置。${btn('查看完整检查清单','page','data-v="validation"','text')}</div></section><section class="card"><div class="row"><h2>项目参数</h2>${btn('查看参数','params','','text')}</div><p class="muted">projectCode = demo-energy · 保留原有维护方式，不新增菜单。</p></section>`}
function flag(t,c=''){return `<span class="badge ${c}">${esc(t)}</span>`}
function issueRow(i){return `<div class="issue row align-top"><div><strong>${esc(obj(i.owner)?.name)} / ${esc(i.name)}</strong><p class="muted">${esc(i.reason)}</p>${flag('阻断','bad')}</div>${btn('去处理','edit-property',`data-id="${i.key}" data-from="validation"`,'text')}</div>`}
function connections(){return `<div class="head"><div><h1>数据连接</h1><p class="muted">连接配置、连通性与字段目录是三个不同事实。</p></div></div><div class="card"><div class="head"><div><h2>${esc(s.connectionName)} ${mark('P04')}</h2><p class="muted">MySQL · ${esc(s.connectionHost)} · 示例资源</p></div>${btn('修改连接','connection-edit')}</div><div class="grid"><div class="ref-box"><p class="muted">凭据</p><strong>已配置（不回显）</strong><p class="muted">本原型不含密钥。保存连接不冒称已保存新密码。</p></div><div class="ref-box"><p class="muted">连通性</p><strong>${esc(s.test)}</strong><p class="muted">${esc(s.testAt||'没有本次连接的测试记录')}</p>${btn('测试连接','test-connection')}</div></div><div class="row" style="margin-top:20px"><div><strong>表结构目录</strong><p class="muted">${s.catalogFresh?'已刷新（示例）：capacity 字段不再存在':'上次缓存：包含 capacity 字段 · 2026-09-19（示例）'}</p></div>${btn('刷新表结构','refresh-catalog')}</div>${s.catalogFresh?`<div class="notice warning">发现字段变化，旧属性配置已保留。${btn('查看额定容量映射','edit-property','data-id="capacity"','text')}</div>`:''}<div class="check-scope">${btn('查看使用位置','connection-refs','','text')}${btn('删除连接','delete-connection','','text danger')}</div></div><div class="card"><h2>实时数据缓存</h2><p class="muted">Redis · 凭据已配置 · 连通性尚未测试。原有编辑器继续复用，本原型重点演示MySQL目录影响。</p></div>`}
function binding(){const o=obj();return `<div class="head"><div><h1>对象映射</h1><p class="muted">对象与属性来自当前引用的储能本体 ${s.reference}，不随本体草稿变化。</p></div>${btn('查看引用变化','page','data-v="reference"','text')}</div><div class="workspace"><aside class="objectnav"><h3>对象类型 · ${s.objects.length}</h3>${s.objects.map(x=>btn(`${esc(x.name)}<small>${issues().filter(i=>i.owner===x.id).length} 项需修正</small>`,'object',`data-id="${x.id}"`,x.id===o.id?'active':'')).join('')}</aside><section class="detail"><div class="head"><div><h2>${esc(o.name)}</h2><p class="muted">${esc(o.description)}</p></div>${flag('已启用映射')}</div><div class="tabs">${[['object','对象'],['properties','属性'],['links','链接'],['actions','动作']].map(([id,n])=>btn(n,'tab',`data-v="${id}"`,s.tab===id?'selected':'')).join('')}</div>${s.tab==='object'?objectPanel():s.tab==='properties'?propertyList():s.tab==='links'?linkPanel():actionPanel()}</section></div>`}
function objectPanel(){const o=obj();return `<div class="row"><h3>说明</h3>${btn('编辑对象来源 '+mark('P03'),'edit-source')}</div><p class="long">${esc(o.note||'暂无说明')}</p><div class="ref-box"><strong>${o.source==='registered'?'项目登记实例':'数据库记录'}</strong><p>${esc(o.source==='registered'?'system-01 · 创智园储能系统':o.table+' · 实例主键 id')}</p><span class="muted">${o.source==='registered'?'登记对象身份，不会自动生成容量汇总规则。':'主键识别当前对象实例；属性可以使用其他来源。'}</span></div>`}
function propertyList(){const rows=s.props.filter(p=>p.owner===s.object).filter(p=>s.filter==='全部'||(s.filter==='需修正'?!!problem(p):s.filter==='仅说明'?!!p.note&&!p.kind:!p.kind&&!p.note));return `<div class="toolbar"><span class="muted">说明和具体配置独立保存 ${mark('P02')}</span><div>${['全部','需修正','仅说明','未配置'].map(f=>btn(f,'filter',`data-v="${f}"`,s.filter===f?'active':'')).join('')}</div></div><div class="tablewrap"><table><thead><tr><th>属性</th><th>说明与配置摘要</th><th>操作</th></tr></thead><tbody>${rows.map(p=>{const st=status(p);return `<tr><td><strong>${esc(p.name)}</strong><p class="muted">${p.type}</p>${flag(st[0],st[1])}</td><td><p>${esc(p.note||'暂无说明')}</p><small class="muted">${esc(source(p))}</small>${problem(p)?`<small class="danger">${esc(problem(p))}</small>`:''}</td><td>${btn('编辑','edit-property',`data-id="${p.id}"`,'text')}</td></tr>`}).join('')||'<tr><td colspan="3">没有符合筛选条件的属性。</td></tr>'}</tbody></table></div><div class="check-scope">${esc(checkCaption())}<br>配置检查通过不代表实际取值成功；说明未填写不代表来源未配置。</div>`}
function linkPanel(){return `<table><thead><tr><th>链接</th><th>说明与配置摘要</th><th>操作</th></tr></thead><tbody><tr><td><strong>储能簇 → 所属于 → 储能设备</strong><p class="muted">多对一</p></td><td>${esc(s.link.note)}<small class="muted">m_storage_cluster_phase.${s.link.field} = m_storage_phase.${s.link.targetField}</small></td><td>${btn('编辑','edit-link','','text')}</td></tr></tbody></table><p class="muted">两端查看同一份链接映射，不维护两份说明。本原型用同一示例展示关系编辑。</p>`}
function actionPanel(){if(s.object!=='device')return `<div class="empty-small">此对象示例没有关联动作。${btn('查看设备动作','object','data-id="device"','text')}</div>`;return `<table><thead><tr><th>动作</th><th>说明与配置摘要</th><th>操作</th></tr></thead><tbody><tr><td><strong>停止充放电</strong>${flag('仅配置，不发送请求')}</td><td>${esc(s.action.note)}<small class="muted">POST ${esc(s.action.url)}</small></td><td>${btn('编辑','edit-action','','text')}</td></tr></tbody></table>`}
function editor(){const e=s.editor,f=s.form;const kind=e.kind;let title=kind==='property'?prop(e.id).name:kind==='source'?obj().name:kind==='link'?'所属设备关系':'停止充放电';let body='';if(kind==='property'){const p=prop(e.id);body=`<label class="field"><span>取值方式</span><select id="fKind">${[['','不配置具体来源'],['field','数据库字段'],['redis','Redis 值'],['flow','函数编排']].map(([v,n])=>`<option value="${v}" ${f.kind===v?'selected':''}>${n}</option>`).join('')}</select></label>${f.kind==='field'?`<div class="grid"><label class="field"><span>来源表</span><input id="fTable" value="${esc(f.table||'m_storage_cluster_phase')}"></label><label class="field"><span>字段</span><input id="fField" value="${esc(f.field||'')}" placeholder="例如 capacity"></label></div><p class="muted">正式版沿用连接、表、字段联动下拉；本原型仅用输入框示意。</p>`:f.kind==='redis'?`<label class="field"><span>Redis Key 模板</span><input id="fField" value="${esc(f.field||'')}" placeholder="m_storage_cluster_phase-{id}-soc"></label><p class="muted">{id} ← 当前实例 ID；结果转换沿用现有配置。</p>`:f.kind==='flow'?`<h3>编排绑定 ${mark('P05')}</h3><div class="grid"><label class="field"><span>函数编排</span><select id="fFlow"><option value="sample" ${(f.flow||'sample')==='sample'?'selected':''}>SOC 采样查询 → series</option><option value="socFlow" ${f.flow==='socFlow'?'selected':''}>设备 SOC 汇总 → soc</option></select></label><label class="field"><span>${f.flow==='socFlow'?'storageId':'model_id'} ←</span><select id="fInput"><option value="">请选择输入来源</option><option value="instanceId" ${f.input==='instanceId'?'selected':''}>当前实例 ID</option></select></label></div>${f.flow!=='socFlow'?'<p class="muted">其他示例输入：model_name = m_storage_cluster_phase；attr_name = soc；起止时间由调用方提供。正式表单按编排实际声明展示。</p>':''}${btn('查看编排声明与返回路径','flow-detail',`data-flow="${f.flow||'sample'}"`,'text')}`:'<p class="muted">仅保留说明；不代表该说明已被解析或可以执行。</p>'}<div class="check-scope">仅检查配置结构；不新增取值执行，不能据此承诺真实SOC结果。</div>`}
if(kind==='source')body=`<label class="field"><span>实例来源</span><select id="fSource"><option value="database" ${f.source==='database'?'selected':''}>数据库记录</option><option value="registered" ${f.source==='registered'?'selected':''}>项目登记实例</option></select></label><label class="field"><span>来源表（数据库记录）</span><input id="fTable" value="${esc(f.table)}"></label><p class="muted">项目登记实例不要求表。示例登记 system-01；正式版沿用现有登记列表。</p><div class="notice warning">修改来源前展示字段绑定、链接和动作输入的影响。确认后保留旧配置为待修正，不自动匹配同名字段。</div>`;
if(kind==='link')body=`<div class="grid"><label class="field"><span>起点字段</span><input id="fField" value="${esc(f.field)}"></label><label class="field"><span>终点匹配字段</span><input id="fTargetField" value="${esc(f.targetField)}"></label></div><p class="muted">正式版沿用现有连接、表、字段目录联动。两端说明与条件为同一份配置。</p>`;
if(kind==='action')body=`<label class="field"><span>接口路径</span><input id="fUrl" value="${esc(f.url)}"></label><div class="ref-box">POST · storageId ← 当前设备实例ID<br><small class="muted">请求参数及凭据表单沿用现有配置，不增加执行按钮。</small></div>`;
return `<section class="card editor">${btn(e.from==='validation'?'← 返回检查清单':'← 返回对象映射','cancel-editor','','text nav-back')}<div class="head"><div><h1>配置 · ${esc(title)}</h1><p class="muted">${esc(obj().name)} · 引用本体 ${s.reference}</p></div>${mark(kind==='source'?'P03':'P02')}</div>${s.formError?`<div class="form-error">${esc(s.formError)}</div>`:''}<details><summary>查看本体定义（只读）</summary><p>${esc(kind==='property'?prop(e.id).name+' · '+prop(e.id).type:obj().description)}</p></details><details open style="margin-top:20px"><summary>说明</summary><label class="field"><textarea aria-label="说明" id="fNote" placeholder="说明这个项目如何识别、取值或完成操作；可只填写说明。">${esc(f.note)}</textarea></label></details><details class="detail-summary" ${e.open?'open':''}><summary>${kind==='source'?'数据来源':kind==='action'?'接口配置':kind==='link'?'关联条件':'取值配置'}</summary><div style="padding-top:18px">${body}</div></details><div class="foot-save">${btn('取消','cancel-editor')}${btn('保存','save-editor','','primary')}</div></section>`}
function flows(){return `<div class="head"><div><h1>函数编排 ${mark('P05')}</h1><p class="muted">账号下的独立资产；当前项目筛选不改变编排归属。</p></div></div><div class="card"><div class="toolbar"><div>${['当前项目引用','全部编排'].map(f=>btn(f,'flow-filter',`data-v="${f}"`,s.flowFilter===f?'active':'')).join('')}</div><span class="muted">编辑和测试继续使用已有页面</span></div><table><thead><tr><th>编排</th><th>输入 → 输出</th><th>当前项目引用</th><th>操作</th></tr></thead><tbody>${[['sample','SOC 采样查询','model_id + 表名/属性 + 时间范围 → series'],['socFlow','设备 SOC 汇总','storageId → soc'],...(s.flowFilter==='全部编排'?[['spare','计划查询示例','日期 → 计划列表']]:[])].map(([id,name,sig])=>`<tr><td><strong>${name}</strong><small class="muted">${s.flowChanged?'修订已变化，相关检查需更新':'当前草稿修订 · 示例'}</small></td><td>${sig}</td><td>${s.props.filter(p=>p.flow===id&&p.kind==='flow').length} 处</td><td>${btn('查看声明与引用','flow-detail',`data-flow="${id}"`,'text')}</td></tr>`).join('')}</tbody></table></div><div class="notice warning">项目发布目前不能据此承诺编排内容永久固定。依赖冻结需另行确认；本版只明确边界，不创建新的编排发布体系。</div>`}
function validation(){const list=issues();const fresh=s.checked===s.revision&&!s.reportError;return `<div class="head"><div><h1>项目校验与发布 ${mark('P06')}</h1><p class="muted">项目配置检查，不是本体发布或业务执行验证。</p></div>${btn('重新检查','check','','primary')}</div><section class="card"><div class="head"><h2>检查结果</h2>${flag(fresh?list.length+' 项阻断':'结果待更新',fresh&&list.length?'bad':'wait')}</div><div class="notice ${fresh?'':'warning'}">${esc(checkCaption())}</div>${s.reportError?'<p>检查请求未完成，不能判断配置是否有效。</p>':`${list.map(issueRow).join('')||'<p>本示例当前配置未发现阻断。</p>'}<details><summary>仅有说明 / 尚未配置 · ${s.props.filter(p=>!p.kind).length}</summary>${s.props.filter(p=>!p.kind).map(p=>`<div class="row"><p>${esc(obj(p.owner).name)} / ${esc(p.name)} ${flag(p.note?'仅填写说明':'尚未配置')}</p>${btn('去配置','edit-property',`data-id="${p.id}" data-from="validation"`,'text')}</div>`).join('')}<p class="muted">未配置项不全部算阻断。已启用对象身份与已配置项合法性仍按现有规则检查。</p></details>`}<div class="check-scope">同一问题只显示一次。修复后会返回此清单并重新检查，不以列表行变绿代替服务端校验。</div></section><section class="card"><h2>发布项目配置</h2><p>引用储能本体 ${s.reference} · 已启用 ${s.objects.length} 个对象</p><div class="notice warning">编排依赖尚未冻结：项目快照保存引用，不能据此保证编排内容以后不变。发布不会执行查询、调用动作或更新本体。</div>${btn('查看发布范围','publish-preview',!fresh||list.length?'disabled':'','primary')}<p class="muted">${!fresh?'请先取得当前配置的检查结果。':list.length?'请先处理阻断问题。':'可发布项目配置；仅说明部分不代表可以执行。'}</p><p>已发布：${s.published.join('、')}（示例）</p></section>`}
function reference(){return `<div class="head"><div><h1>管理引用版本 ${mark('P07')}</h1><p class="muted">更新项目草稿引用，不发布项目，也不修改本体。</p></div></div><section class="card"><div class="grid"><div class="ref-box"><span class="muted">当前固定引用</span><h2>储能本体 ${s.reference}</h2></div><label class="field"><span>目标已发布版本</span><select id="targetVersion">${['1.0.0','2.0.0','3.0.0'].map(v=>`<option ${v===s.target?'selected':''}>${v}</option>`).join('')}</select></label></div>${btn('比较映射影响','compare-ref','','primary')}<p class="muted">本体未发布草稿不参与本次目标比较；不按中文名称自动匹配。</p>${s.refPreview?`<div class="notice warning">${s.reference} → ${s.target} · 比较基线 r${s.refRevision}</div>${s.target===s.reference?'<p>当前已经引用此版本，无需切换。</p>':`<table><thead><tr><th>配置位置</th><th>影响</th><th>切换后的处理</th></tr></thead><tbody><tr><td>储能簇 / 额定容量</td><td>定义ID不变，类型相容</td><td>保留已有配置</td></tr><tr><td>储能簇 / SOC 采样序列</td><td>${s.target==='3.0.0'?'目标版本已移除此属性':'定义存在，核对当前输入绑定'}</td><td>${s.target==='3.0.0'?'保留旧配置，标为失效待处理':'保留配置，不自动修复缺失输入'}</td></tr></tbody></table><label class="check"><input id="refAck" type="checkbox"><span>我已查看影响。切换后旧配置保留，仍需检查和处理问题。</span></label>${btn('确认更新项目引用','apply-ref','','primary')}`}`:''}</section>`}
function readForm(){if(!s.editor)return;const get=id=>document.getElementById(id)?.value;const f=s.form;f.note=get('fNote')??f.note;const k=s.editor.kind;if(k==='property'){f.kind=get('fKind')??f.kind;f.field=get('fField')??f.field;f.table=get('fTable')??f.table;f.flow=get('fFlow')??f.flow;f.input=get('fInput')??f.input;f.output=f.flow==='sample'?'series':'soc'}if(k==='source'){f.source=get('fSource')??f.source;f.table=get('fTable')??f.table}if(k==='link'){f.field=get('fField')??f.field;f.targetField=get('fTargetField')??f.targetField}if(k==='action')f.url=get('fUrl')??f.url}

if(m.kind==='clear'){title='清除具体配置？';body='<p>保留说明，清除该属性的具体取值来源。清除后不再显示已配置。</p>';foot=btn('返回编辑','close')+btn('确认清除并保存','commit-form','','danger primary')}
if(m.kind==='connection-edit'){title='修改连接';body=`<label class="field"><span>连接名称</span><input id="connName" value="${esc(s.connectionName)}"></label><label class="field"><span>主机（示例）</span><input id="connHost" value="${esc(s.connectionHost)}"></label><div class="notice warning">技术地址改变会使连通结果过期，相关配置需重新检查。密码管理继续沿用原有只写流程。</div>`;foot+=btn('保存示例配置','save-connection','','primary')}
if(m.kind==='connection-refs'){title='连接使用位置';body=`${mark('P04')}<p>${esc(s.connectionName)} · 示例依赖</p><ul><li>储能簇 → 数据库实例来源</li><li>储能簇 → 额定容量 → capacity</li><li>SOC采样编排 → 业务目录查询步骤</li></ul><p class="muted">正式版按稳定引用及资源作用域查询；查询失败不能当无依赖。</p>`}
if(m.kind==='delete-connection'){title='不能删除此连接';body='<div class="notice warning">连接仍被对象来源、属性和编排步骤引用。请先处理对应配置。</div>';foot+=btn('查看使用位置','connection-refs','','primary')}
if(m.kind==='publish'){title='发布范围确认';body=`${mark('P06')}<p>项目：创智园二期<br>引用：储能本体 ${s.reference}<br>配置基线：r${s.revision}</p><div class="notice warning">仅发布项目配置。${s.props.filter(p=>!p.kind&&p.note).length} 项只有说明；编排依赖未冻结，不承诺整套实现固定或可执行。</div><p>不会调用数据库、Redis、设备接口或LLM；不会发布本体。</p>`;foot+=btn('模拟发布项目配置','publish-confirm','','primary')}
if(m.kind==='params'){title='项目参数（保留现有功能）';body='<p>projectCode = demo-energy</p><p class="muted">本版不重做参数编辑器。正式问题定位可进入概览的参数区域。</p>'}
if(m.kind==='leave'){title='放弃未保存的编辑？';body='<p>返回后保持原先已保存配置不变。</p>';foot=btn('继续编辑','close')+btn('放弃并返回','discard-editor','','danger primary')}
if(m.error)body=`<div class="form-error">${esc(m.error)}</div>`+body;root.innerHTML=`<dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle">${title}</h2>${btn('✕','close','aria-label="关闭"')}</div><div class="dialog-body">${body}</div><div class="dialog-foot">${foot}</div></dialog>`;const d=document.getElementById('dialog');if(d.showModal)d.showModal();d.addEventListener('cancel',e=>{e.preventDefault();s.modal=null;renderModal()})}
function gate(){if(s.outcome==='success')return true;const outcome=s.outcome;s.outcome='success';const text=outcome==='conflict'?'并发冲突：原配置未被本次模拟覆盖，请重新读取并核对。':'服务失败：本次模拟没有写入，输入保留，可重试。';if(s.modal){s.modal.error=text;renderModal()}else{s.formError=text;s.notice=text;render()}return false}
function commitForm(){if(!gate())return;const e=s.editor;if(e.kind==='property')Object.assign(prop(e.id),s.form);if(e.kind==='source'){Object.assign(obj(),s.form);if(obj().source==='registered')obj().table=''}if(e.kind==='link')Object.assign(s.link,s.form);if(e.kind==='action')Object.assign(s.action,s.form);const from=e.from;s.editor=null;s.form=null;s.modal=null;changed('配置已保存，相关检查已过期');s.page=from==='validation'?'validation':'binding';if(from==='validation'){s.checked=s.revision;s.notice+='；已重新检查，仍有 '+issues().length+' 项阻断。'}render()}
function dispatch(a,data={}){
if(a==='reset'){location.reload();return}if(a==='annotations'){readForm();s.annotations=!s.annotations;render();return}if(a==='close'){s.modal=null;renderModal();return}

if(a==='object'){s.object=data.id;s.filter='全部';s.page='binding';render();return}if(a==='tab'){s.tab=data.v;render();return}if(a==='filter'){s.filter=data.v;render();return}
if(a==='edit-property'){const p=prop(data.id);s.page='binding';s.object=p.owner;s.tab='properties';s.editor={kind:'property',id:p.id,from:data.from||'',open:true};s.form=clone(p);s.formError='';s.notice='';render();return}
if(['edit-source','edit-link','edit-action'].includes(a)){const kind=a==='edit-source'?'source':a==='edit-link'?'link':'action';s.editor={kind,open:true};s.form=clone(kind==='source'?obj():kind==='link'?s.link:s.action);s.formError='';render();return}
if(a==='cancel-editor'){readForm();show('leave');return}if(a==='discard-editor'){const from=s.editor.from;s.editor=null;s.form=null;s.modal=null;s.page=from==='validation'?'validation':'binding';s.formError='';render();return}
if(a==='save-editor'){readForm();s.formError='';if(s.editor.kind==='source'&&(s.form.table!==obj().table||s.form.source!==obj().source)){show('source-impact');return}if(s.editor.kind==='property'&&prop(s.editor.id).kind&&!s.form.kind){show('clear');return}commitForm();return}
if(a==='commit-form'||a==='commit-source'){commitForm();return}
if(a==='flow-detail'){readForm();show('flow',{flow:data.flow||s.form?.flow});return}
if(a==='flow-return'){s.flowChanged=true;s.modal=null;changed('编排修订已变化，请核对输入/输出并重新检查');if(s.editor){s.editor.open=true;render()}else render();return}
if(a==='flow-filter'){s.flowFilter=data.v;render();return}
if(['connection-edit','connection-refs','delete-connection','params'].includes(a)){show(a);return}
if(a==='save-connection'){const n=document.getElementById('connName').value.trim(),h=document.getElementById('connHost').value.trim();if(!n||!h){s.modal.error='名称和主机不能为空。';renderModal();return}if(!gate())return;const technical=h!==s.connectionHost;s.connectionName=n;s.connectionHost=h;if(technical){s.test='检查已过期';s.testAt='旧地址的测试结果不可复用';changed('连接技术配置已变化')}else s.notice='仅修改连接显示名，连通性结果保持（演示）。';s.modal=null;render();return}
if(a==='test-connection'){if(!gate())return;s.test='连接可达（模拟）';s.testAt='本次操作时间 · 仅连通性，不代表取值成功';s.notice='连通性演示完成；字段目录与属性取值状态不随之变绿。';render();return}
if(a==='refresh-catalog'){if(!gate())return;s.catalogFields=['id','rated_power','storage_id'];s.catalogFresh=true;changed('目录已更新，发现字段capacity缺失；旧绑定保留');render();return}
if(a==='check'){if(s.outcome!=='success'){s.reportError='无法完成配置检查，请重试。';s.outcome='success';render();return}s.checked=s.revision;s.reportError='';s.notice='配置检查完成：'+issues().length+' 项阻断。未执行真实查询或动作。';render();return}
if(a==='compare-ref'){if(!gate())return;s.refPreview=true;s.refRevision=s.revision;render();return}
if(a==='apply-ref'){if(!document.getElementById('refAck').checked){s.notice='请先确认已查看影响。';render();return}if(s.refRevision!==s.revision){s.refPreview=false;s.notice='配置已变化，请重新比较。';render();return}if(!gate())return;s.reference=s.target;prop('series').retired=s.target==='3.0.0';changed('已更新项目草稿引用，旧配置保留；尚未发布');s.page='validation';render();return}
if(a==='publish-preview'){if(s.checked!==s.revision||s.reportError||issues().length){s.notice='请先完成当前基线检查并处理阻断。';render();return}show('publish',{revision:s.revision});return}
if(a==='publish-confirm'){if(s.checked!==s.revision||s.modal.revision!==s.revision||issues().length){s.modal.error='检查结果已失效，请重新检查。';renderModal();return}if(!gate())return;s.published.push('v'+(s.published.length+1));s.modal=null;s.notice='项目配置发布完成（模拟），本体与设备未被操作，编排依赖未冻结。';render();return}
}

function overview(){return `<div class="head"><div><h1>本体与项目 · 维护体验改版</h1><p class="muted">先看改动，再进入具体页面。编号与需求说明逐项对应。</p></div>${flag('仅需求与原型')}</div><div class="scope-grid"><section class="card"><h2>本体：定义修改安全、编辑连贯</h2><p>O01 / O02 已有实施交接，本次原型用于统一语义和验收；O03 / O04 为局部体验建议。</p>${btn('体验共享修改','jump','data-id="O01"','primary')}</section><section class="card"><h2>项目：配置看得懂、问题找得到</h2><p>保留现有菜单和编排编辑器，优先完善状态与定位，再审视来源、连接、引用变更。</p>${btn('体验配置修复','jump','data-id="P06"','primary')}</section></div><section class="card" style="margin-top:18px"><h2>页面改动清单</h2><div class="tablewrap"><table class="changes"><thead><tr><th>编号 / 功能</th><th>页面</th><th>改了什么</th><th>状态 / 入口</th></tr></thead><tbody>${changes.map(c=>`<tr><td><strong>${c[0]} · ${c[1]}</strong></td><td>${c[2]}</td><td>${c[3]}</td><td><span class="stage ${c[4].startsWith('已')?'impl':''}">${c[4]}</span><br>${btn('查看页面','jump',`data-id="${c[0]}"`,'text')}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><h2>继续延期 / 本轮不做</h2><p>管理本体、本体校验与发布改版及派生概览功能继续延期；本体对象级校验仅保留建议，不进入本次范围。</p><p>不新增值类型或图谱主菜单，不全面改抽屉，不做健康度分数，不恢复生成口径/MCP规范，不重做编排节点与测试，不新增业务执行。</p><p class="muted">项目发布依赖冻结尚未建设，本版如实说明；完整方案需要另行确认。</p></section><section class="card"><h2>建议体验路线</h2><p>① 共享属性 → 编辑定义 → 改数据类型 → 看影响 → 取消或确认。</p><p>② 业务规则 → 删除 → 定位引用 → 移除关联 → 返回规则库再删除。</p><p>③ 项目检查 → SOC采样序列 → 绑定当前实例ID → 查看编排 → 模拟返回 → 保存并重查。</p><p>④ 数据连接 → 刷新表结构 → 查看缺失字段；或管理引用版本 → 比较 → 确认切换。</p></section>`}
function ontologyReview(){if(!s.annotations)return '';let ids={home:['O03'],objects:['O02','O03','O04'],shared:['O01','O02','O03'],rules:['O02','O03','O04'],actions:['O02','O03','O04'],tools:['O04'],release:[]}[s.ontoPage];return `<section class="review-panel"><strong>本页改动 · ${ontologyTitle()}</strong><ul>${ids.map(id=>{let c=changes.find(x=>x[0]===id);return `<li>${mark(id)} ${c[3]} <span class="stage">${c[4]}</span></li>`}).join('')||'<li>本模块改版继续延期。这里不模拟新增发布或恢复能力。</li>'}</ul><small>标注仅用于评审，可在顶部隐藏。示例操作不代表正式功能验收。</small></section>`}
function ontologyPage(){if(s.ontoEdit)return ontologyEditor();switch(s.ontoPage){case 'objects':return ontologyObjects();case 'shared':return ontologyLibrary('shared');case 'rules':return ontologyLibrary('rules');case 'actions':return ontologyLibrary('actions');case 'tools':return `<section class="card"><h1>更多工具</h1><p class="muted">已有辅助能力保留，主流程入口不重复陈列。</p>${point('O04','移除重复的动作定义和旧版映射菜单项；旧地址仍兼容跳转。不新增值类型主菜单。')}<table><thead><tr><th>已有辅助工具</th><th>用途</th></tr></thead><tbody><tr><td>值类型管理</td><td>高级定义维护；创建普通属性无需先进入此处</td></tr><tr><td>历史接口定义</td><td>兼容已有定义，不重新加入基础建模步骤</td></tr><tr><td>实例与历史预览</td><td>沿用现有能力与适用范围</td></tr></tbody></table><p class="muted">本页只演示入口收敛，不重新实现辅助工具。</p></section>`;case 'release':return `<section class="card"><h1>本体校验与发布</h1><div class="notice warning">本模块改版继续延期</div><p>正式工作台原有校验与发布继续使用。本原型不新增版本恢复、比较、发布确认或对象级校验。</p>${btn('回对象建模','o-page','data-v="objects"','primary')}</section>`;default:return `<section class="card"><h1>储能本体</h1><p>已有工作概览保持；不增加健康分数或延期功能的入口。</p>${btn('进入对象建模','o-page','data-v="objects"','primary')} ${btn('查看统一改动清单','overview')}</section>`}}
function ontologyObjects(){const o=oo(s.ontoObject);const list=s.ontoObjects.filter(x=>x.name.includes(s.ontoSearch));let content='';if(s.ontoView==='graph'){content=`<div class="graph">${btn('<strong>储能簇</strong><small>双击语义以按钮示意 · 编辑</small>','o-graph-edit','data-id="cluster"','node')}<div class="edge">→</div>${btn('<strong>储能设备</strong><small>编辑后返回同一视图</small>','o-graph-edit','data-id="device"','node')}<div class="muted">示意关系：所属设备</div></div><p class="muted">图谱仅演示返回路径，正式版继续使用现有画布；不新增或恢复工具栏按钮。</p>`;}else{if(s.ontoTab==='properties'){const ref=s.refs.includes(o.id);const priv=s.privateCopies[o.id];content=`<div class="toolbar"><span>定义属性含义与数据类型</span>${btn('从属性库添加','o-picker')}</div>${point('O04','引用与复制展示后续维护差异；私有属性仍是一等能力，不默认全部共享。')}<table><thead><tr><th>属性</th><th>含义 / 类型</th><th>操作</th></tr></thead><tbody>${ref||priv?`<tr><td><strong>${esc(ref?s.shared.name:priv.name)}</strong><br>${flag(ref?'共享引用':'私有')}</td><td>${esc(ref?s.shared.type:priv.type)}<details><summary>展开业务定义</summary><p>${esc(ref?s.shared.description:priv.description)}</p></details></td><td>${btn(ref?'查看共享定义':'编辑','o-property',`data-id="${o.id}"`,'text')} ${btn('移除属性','o-remove-property',`data-id="${o.id}"`,'text danger')}</td></tr>`:'<tr><td colspan="3">示例额定容量尚未关联，可从属性库添加。</td></tr>'}</tbody></table><p class="muted">本原型只展示额定容量以演示引用语义；不是完整本体属性清单。</p>`}if(s.ontoTab==='links')content=`<table><thead><tr><th>链接</th><th>数量关系</th><th>操作</th></tr></thead><tbody><tr><td>储能簇 → 所属设备 → 储能设备<details><summary>理解反向阅读</summary><p>一个设备可以包含多个储能簇；从设备读取为“包含储能簇”。链接两端共用同一份定义。</p></details></td><td>多对一</td><td>${btn('查看说明','o-link-info','','text')}</td></tr></tbody></table>`;if(s.ontoTab==='rules')content=`<table><thead><tr><th>规则</th><th>业务定义</th><th>操作</th></tr></thead><tbody>${s.ruleRefs.includes(o.id)&&!s.ruleDeleted?`<tr><td><strong>储能SOC口径</strong></td><td>剩余电量占额定容量的比例</td><td>${btn('查看','o-rule-view','','text')} ${btn('移除关联','o-remove-rule',`data-id="${o.id}"`,'text danger')}</td></tr>`:'<tr><td colspan="3">此对象没有关联示例规则。</td></tr>'}</tbody></table><p class="muted">移除关联只影响当前对象，规则库定义与其他对象不变。</p>`;if(s.ontoTab==='actions')content=`<table><thead><tr><th>动作</th><th>业务效果</th><th>操作</th></tr></thead><tbody>${s.ontoActions[o.id]?`<tr><td>停止充放电</td><td>目标功率为0<details><summary>展开完整说明</summary><p>请求业务系统使当前设备停止充电或放电。这里定义业务含义，项目中配置实际接口；本页不会控制设备。</p></details></td><td>${btn('查看定义','o-action-view','','text')}</td></tr>`:'<tr><td colspan="3">无关联动作；储能设备有“停止充放电”示例。</td></tr>'}</tbody></table>`;content=`<div class="workspace"><aside class="objectnav"><strong>对象类型</strong><input id="ontoSearch" aria-label="搜索对象" placeholder="搜索对象…" value="${esc(s.ontoSearch)}">${list.map(x=>btn(esc(x.name),'o-object',`data-id="${x.id}"`,s.ontoObject===x.id?'active':'')).join('')||'<p>没有搜索结果</p>'}</aside><div class="detail"><div class="head ont-head"><div><h2>${esc(o.name)}</h2><p class="muted summary-text">${esc(o.description)}</p></div>${btn('编辑定义','o-edit-object')}</div>${!list.some(x=>x.id===o.id)?`<div class="notice warning">正在查看的对象不在搜索结果中。${btn('清除搜索','o-clear-search','','text')}</div>`:''}<div class="tabs">${[['properties','属性'],['links','链接'],['actions','动作'],['rules','规则']].map(([k,n])=>btn(n,'o-tab',`data-v="${k}"`,s.ontoTab===k?'selected':'')).join('')}</div>${content}${s.ontoReturn?btn('← 返回业务规则库','o-return-library','','text'):''}</div></div>`;}return `<div class="head"><h1>对象建模</h1><div>${btn('对象列表','o-view','data-v="list"',s.ontoView==='list'?'active':'')}${btn('本体图谱','o-view','data-v="graph"',s.ontoView==='graph'?'active':'')}</div></div>${content}`}
function ontologyLibrary(kind){if(kind==='shared')return `<section class="card"><div class="head"><div><h1>共享属性</h1><p class="muted">引用同一定义的对象会同步生效；如需独立维护，可转为私有。</p></div></div><table><thead><tr><th>名称</th><th>类型</th><th>引用对象</th><th>操作</th></tr></thead><tbody><tr><td>${esc(s.shared.name)}</td><td>${esc(s.shared.type)}</td><td>${s.refs.map(id=>oo(id).name).join('、')||'无'}</td><td>${btn('编辑定义','o-edit-shared','','text')} ${btn('查看引用','o-shared-refs','','text')}</td></tr></tbody></table>${point('O01','改数据类型或业务定义时确认影响；仅改名称不弹高影响确认。取消保留表单输入。')}</section>`;if(kind==='rules')return `<section class="card"><h1>业务规则</h1><p class="muted">定义业务约束与口径，具体项目实现放在项目映射。</p><table><thead><tr><th>规则</th><th>引用情况</th><th>操作</th></tr></thead><tbody>${s.ruleDeleted?'<tr><td colspan="3">示例规则已删除。刷新或重置可还原原型。</td></tr>':`<tr><td><strong>储能SOC口径</strong><details><summary>展开内容</summary><p>SOC表示剩余电量占额定容量的百分比。汇总时按容量加权，不直接平均各簇SOC。</p></details></td><td>${s.ruleRefs.map(id=>oo(id).name).join('、')||'无引用'}</td><td>${btn('查看','o-rule-view','','text')}${btn('删除定义','o-delete-rule','','text danger')}</td></tr>`}</tbody></table>${point('O02','有引用时阻断并提供定位；没有引用时确认删除。正式版仍复核其他合法依赖。')}</section>`;return `<section class="card"><h1>动作定义</h1><p class="muted">维护业务行为；不在本体定义技术接口参数。</p><table><thead><tr><th>动作</th><th>业务效果</th><th>引用对象</th><th>操作</th></tr></thead><tbody><tr><td>停止充放电</td><td>目标功率为0</td><td>储能设备</td><td>${btn('查看','o-action-view','','text')}</td></tr></tbody></table>${point('O04','完整定义可就地阅读；高频操作明确可见，不依赖悬浮才能发现。')}</section>`}
function ontologyEditor(){const e=s.ontoEdit,f=e.form;return `<section class="card">${btn('← 返回原位置','o-cancel-edit','','text')}<h1>${e.kind==='shared'?'编辑共享属性':e.kind==='private'?'编辑私有属性':'编辑对象定义'}</h1><p class="muted">${e.kind==='shared'?'共享库 · '+s.refs.length+' 个对象引用':oo(s.ontoObject).name} · ${e.origin.page==='objects'?(e.origin.view==='graph'?'来自本体图谱':'来自对象列表'):'来自资产库'}</p>${point('O03','沿用独立编辑页；保存或取消后恢复原对象、页签、搜索与视图。')}<label class="field"><span>名称 *</span><input id="oName" value="${esc(f.name)}"></label><label class="field"><span>业务定义 *</span><textarea id="oDescription">${esc(f.description)}</textarea></label>${e.kind!=='object'?`<label class="field"><span>数据类型 *</span><select id="oType">${['数值','文本','时间序列（数值）'].map(t=>`<option ${t===f.type?'selected':''}>${t}</option>`).join('')}</select></label>`:''}${s.ontoError?`<div class="notice error">${esc(s.ontoError)}</div>`:''}<div class="foot-save">${btn('取消','o-cancel-edit')}${btn('保存定义','o-save-edit','','primary')}</div></section>`}
function captureOnt(){if(!s.ontoEdit)return;for(const [id,k] of [['oName','name'],['oDescription','description'],['oType','type']]){const el=document.getElementById(id);if(el)s.ontoEdit.form[k]=el.value}}
function beginOnt(kind){const f=kind==='shared'?s.shared:kind==='private'?s.privateCopies[s.ontoObject]:oo(s.ontoObject);s.ontoEdit={kind,form:clone(f),baseline:JSON.stringify(f),refs:s.refs.join(','),origin:{page:s.ontoPage,object:s.ontoObject,tab:s.ontoTab,view:s.ontoView,search:s.ontoSearch}};s.ontoError='';render()}
function endOnt(){const o=s.ontoEdit.origin;Object.assign(s,{ontoPage:o.page,ontoObject:o.object,ontoTab:o.tab,ontoView:o.view,ontoSearch:o.search,ontoEdit:null,ontoModal:null,ontoError:''});render()}
function saveOnt(){const e=s.ontoEdit;if(e.kind==='shared')s.shared=clone(e.form);if(e.kind==='private')s.privateCopies[s.ontoObject]=clone(e.form);if(e.kind==='object')Object.assign(oo(s.ontoObject),e.form);s.notice='定义已保存到原型内存；已返回原位置。已发布本体和项目固定引用不变。';endOnt()}
function om(kind){s.ontoModal={kind};ontologyModal()}
function ontologyModal(){const m=s.ontoModal;if(!m){document.getElementById('modal').innerHTML='';return}let title='',body='',foot=btn('关闭','o-close');if(m.kind==='impact'){title='确认共享修改影响';const f=s.ontoEdit.form;body=`${mark('O01')}<table><thead><tr><th>字段</th><th>原值</th><th>新值</th></tr></thead><tbody>${['type','description'].filter(k=>s.shared[k]!==f[k]).map(k=>`<tr><td>${k==='type'?'数据类型':'业务定义'}</td><td>${esc(s.shared[k])}</td><td>${esc(f[k])}</td></tr>`).join('')}</tbody></table><h3>受影响的当前草稿引用</h3><ul>${s.refs.map(id=>`<li>${oo(id).name} → ${esc(s.shared.name)}</li>`).join('')||'<li>当前没有对象引用</li>'}</ul><p>不会直接修改已发布版本或切换项目引用。</p><label><input id="impactAck" type="checkbox"> 我已查看前后变化与受影响对象</label>`;foot=btn('返回编辑','o-close')+btn('确认并保存','o-confirm-impact','','primary')}
if(m.kind==='rule-delete'){title=s.ruleRefs.length?'无法删除规则定义':'删除规则定义？';body=s.ruleRefs.length?`<p>以下对象仍引用“储能SOC口径”，请先处理关联。</p>${s.ruleRefs.map(id=>`<div class="row"><p>${oo(id).name} → 业务规则关联</p>${btn('去处理','o-locate-rule',`data-id="${id}"`,'text')}</div>`).join('')}`:'<p>当前示例没有引用。确认只删除此规则定义。</p>';if(!s.ruleRefs.length)foot+=btn('确认删除','o-confirm-delete','','danger primary')}
if(m.kind==='rule-view'){title='储能SOC口径';body='<p>SOC表示剩余电量占额定容量的百分比。设备汇总先计算各簇剩余电量，再除以汇总容量；不能直接平均SOC。</p><p class="muted">本体描述口径；数据库、Redis及计算实现属于项目。</p>';foot+=btn('到业务规则库','o-open-rules','','primary')}
if(m.kind==='action-view'){title='停止充放电';body='<p><strong>业务定义：</strong>请求当前设备停止充电或放电。</p><p><strong>业务效果：</strong>目标功率为0。</p><p>项目A可以绑定stopCharge，项目B可以绑定setStoragePower。这里只展示定义，不发送任何请求。</p>'}
if(m.kind==='link-info'){title='一份链接，两个阅读方向';body='<p>储能簇 → 所属设备 → 储能设备</p><p>储能设备 → 包含储能簇 → 储能簇</p><p>多对一：多个储能簇可属于同一个设备。删除链接会删除这份定义的两个阅读方向。</p>'}
if(m.kind==='shared-refs'||m.kind==='property'){title=m.kind==='property'?'共享引用属性':'共享属性使用位置';body=`<h3>${esc(s.shared.name)} · ${esc(s.shared.type)}</h3><p>${esc(s.shared.description)}</p><ul>${s.refs.map(id=>`<li>${oo(id).name} → ${esc(s.shared.name)}</li>`).join('')}</ul><p>编辑共享定义会影响这些对象；转为私有仅解除当前对象的共享关系，保留属性与内容。</p>`;foot+=btn('编辑共享定义','o-edit-shared','','primary');if(m.kind==='property')foot+=btn('当前对象转为私有','o-detach')}
if(m.kind==='picker'){title='从共享属性库添加';body=`<h3>${esc(s.shared.name)}</h3><p>${esc(s.shared.description)}</p><div class="ref-box"><strong>引用共享</strong><p>跟随共享定义更新，适合保持同一口径。</p>${btn('引用共享','o-add-ref','','primary')}</div><div class="ref-box" style="margin-top:12px"><strong>复制为私有</strong><p>复制当前内容，后续独立维护。</p>${btn('复制为私有','o-add-copy')}</div><p class="muted">此示例为一个额定容量位置；正式版沿用已有重名/重复引用检查。</p>`}
if(m.kind==='remove-property'){title='移除当前对象属性？';body=`<p>只移除${oo(s.ontoObject).name}的额定容量属性。共享库定义与其他对象保持不变。</p><p class="muted">示例没有属性下游依赖；正式版有依赖时应阻断。</p>`;foot+=btn('确认移除','o-confirm-remove','','danger primary')}
if(m.kind==='remove-rule'){title='移除规则关联？';body=`<p>只解除${oo(s.ontoObject).name}与“储能SOC口径”的关系，规则定义保留。</p>`;foot+=btn('确认移除关联','o-confirm-remove-rule','','danger primary')}
if(m.kind==='leave'){title='放弃本次编辑？';body='<p>未提交内容将丢弃，已保存定义保持不变。</p>';foot=btn('继续编辑','o-close')+btn('放弃并返回','o-discard','','danger primary')}
if(m.error)body=`<div class="notice error">${esc(m.error)}</div>`+body;document.getElementById('modal').innerHTML=`<dialog id="dialog" aria-labelledby="odTitle"><div class="dialog-head"><h2 id="odTitle">${title}</h2>${btn('✕','o-close','aria-label="关闭"')}</div><div class="dialog-body">${body}</div><div class="dialog-foot">${foot}</div></dialog>`;const d=document.getElementById('dialog');d.showModal?.();d.addEventListener('cancel',e=>{e.preventDefault();s.ontoModal=null;ontologyModal()})}
const projectDispatch=dispatch;
dispatch=function(a,data={}){
if(['space','overview','jump','o-page'].includes(a)&&(s.editor||s.ontoEdit)){if(s.ontoEdit){captureOnt();om('leave')}else{readForm();show('leave')}return}
if(a==='overview'){s.overview=true;render();return}
if(a==='space'){s.space=data.v;s.overview=false;s.notice='';render();return}
if(a==='jump'){const c=changes.find(x=>x[0]===data.id);s.overview=false;s.space=data.id.startsWith('O')?'ontology':'project';if(s.space==='ontology')s.ontoPage=c[5];else {s.page=c[5];s.editor=null;if(data.id==='P03')s.tab='object';else if(data.id==='P02')s.tab='properties'}s.notice='';render();return}
if(a==='annotations'){captureOnt();readForm();s.annotations=!s.annotations;render();return}
if(a==='o-page'){s.ontoPage=data.v;s.overview=false;s.notice='';render();return}
if(a==='o-close'){s.ontoModal=null;ontologyModal();return}
if(a==='o-object'){s.ontoObject=data.id;render();return}if(a==='o-tab'){s.ontoTab=data.v;render();return}if(a==='o-view'){s.ontoView=data.v;render();return}
if(a==='o-clear-search'){s.ontoSearch='';render();return}
if(a==='o-graph-edit'){s.ontoObject=data.id;beginOnt('object');return}
if(a==='o-edit-object'){beginOnt('object');return}
if(a==='o-edit-shared'){s.ontoModal=null;beginOnt('shared');return}
if(a==='o-property'){if(s.refs.includes(s.ontoObject))om('property');else beginOnt('private');return}
if(a==='o-shared-refs'){om('shared-refs');return}
if(a==='o-save-edit'){captureOnt();const e=s.ontoEdit,f=e.form;if(!f.name.trim()||!f.description.trim()){s.ontoError='请填写名称和业务定义。';render();return}if(e.kind==='shared'&&(f.type!==s.shared.type||f.description!==s.shared.description)){om('impact');return}saveOnt();return}
if(a==='o-confirm-impact'){if(!document.getElementById('impactAck')?.checked){s.ontoModal.error='请先查看影响并勾选确认。';ontologyModal();return}if(s.ontoEdit.baseline!==JSON.stringify(s.shared)||s.ontoEdit.refs!==s.refs.join(',')){s.ontoModal.error='定义或引用已变化，请返回编辑并重新核对。';ontologyModal();return}saveOnt();return}
if(a==='o-cancel-edit'){captureOnt();if(JSON.stringify(s.ontoEdit.form)===s.ontoEdit.baseline)endOnt();else om('leave');return}
if(a==='o-discard'){endOnt();return}
if(a==='o-delete-rule'){om('rule-delete');return}
if(a==='o-confirm-delete'){if(s.ruleRefs.length){om('rule-delete');return}s.ruleDeleted=true;s.ontoModal=null;s.notice='无引用的示例规则已删除（仅内存）。';render();return}
if(a==='o-locate-rule'){s.ontoModal=null;s.ontoPage='objects';s.ontoView='list';s.ontoObject=data.id;s.ontoTab='rules';s.ontoReturn='rules';render();return}
if(a==='o-return-library'){s.ontoPage='rules';s.ontoReturn=null;render();return}
if(a==='o-open-rules'){s.ontoModal=null;s.ontoPage='rules';render();return}
if(['o-rule-view','o-action-view','o-link-info','o-picker','o-remove-property','o-remove-rule'].includes(a)){om(a.slice(2));return}
if(a==='o-confirm-remove'){s.refs=s.refs.filter(id=>id!==s.ontoObject);delete s.privateCopies[s.ontoObject];s.ontoModal=null;render();return}
if(a==='o-confirm-remove-rule'){s.ruleRefs=s.ruleRefs.filter(id=>id!==s.ontoObject);s.ontoModal=null;render();return}
if(a==='o-detach'){s.privateCopies[s.ontoObject]=clone(s.shared);s.refs=s.refs.filter(id=>id!==s.ontoObject);s.ontoModal=null;s.notice='已转为私有：内容保留；正式版同时保持对象属性稳定ID。';render();return}
if(a==='o-add-ref'||a==='o-add-copy'){if(s.refs.includes(s.ontoObject)||s.privateCopies[s.ontoObject]){s.ontoModal.error='当前对象已有此示例属性。请先查看现有定义，不能覆盖。';ontologyModal();return}if(a==='o-add-ref')s.refs.push(s.ontoObject);else s.privateCopies[s.ontoObject]=clone(s.shared);s.ontoModal=null;render();return}
if(a==='page')s.overview=false;
projectDispatch(a,data);
};
document.addEventListener('change',e=>{if(e.target.id==='ontoSearch'){s.ontoSearch=e.target.value;render()}});
window.__prototype={s,dispatch,issues,status,doc:cloneState,render,changes,beginOnt};render();

</script></body></html>
