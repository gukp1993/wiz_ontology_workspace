const s={annotations:true,page:'home',tab:'draft',asset:'energy',filter:'使用中',search:'',object:'device',view:'list',outcome:'success',revision:1,modal:null,notice:'',left:'2.0.0',right:'draft',diffFilter:'全部',checkpoints:[],origin:null,assets:[{id:'energy',name:'储能本体',archived:false,refs:2,doc:clone(seed),versions:[{version:'1.0.0',date:'2026-09-16 10:00',note:'首次发布储能定义',kind:'初始',doc:clone(old)},{version:'2.0.0',date:'2026-09-19 15:30',note:'补充储能系统与容量加权口径',kind:'破坏性',doc:clone(seed)}]},{id:'trial',name:'试建本体',archived:false,refs:0,doc:blank(),versions:[]},{id:'old',name:'旧版设备模型',archived:true,refs:1,doc:clone(old),versions:[{version:'1.0.0',date:'2026-09-12 09:00',note:'历史模型',kind:'初始',doc:clone(old)}]}]};

const REVIEW={
 '01':['新增','管理本体入口','选择器下增加入口，集中管理，不增加左侧主菜单。'],

 '03':['新增','归档 / 恢复使用','收起不再维护的本体；归档后建模只读，已有项目引用保留。'],
 '04':['新增','受限删除','仅可删除无内容、无发布、无引用的空本体；不开放强制删除。'],
 '05':['调整','发布页分区','改为“当前草稿 / 版本记录”两页签，原有发布能力保留。'],
 '06':['新增','查看历史内容','查看选中版本的完整定义，只读，不混用当前草稿。'],

function mark(id){if(!s.annotations||!REVIEW[id])return '';const r=REVIEW[id];return `<span class="review-tag ${r[0]==='调整'?'adjust':''}" title="${esc(r[1]+'：'+r[2])}">${r[0]} · ${id}</span>`}
function buttonReview(action,extra){if(action==='page'&&extra.includes('manage'))return '01';if(['rename','save-name'].includes(action))return s.modal?.kind==='new'?null:'02';if(['archive','confirm-archive'].includes(action))return '03';if(['delete-asset','confirm-delete-asset'].includes(action))return '04';if(['versions','release-tab'].includes(action))return '05';if(action==='inspect')return '06';if(['compare-default','compare-one'].includes(action))return '07';if(['restore','confirm-restore'].includes(action))return '08';if(['checkpoint','restore-checkpoint'].includes(action))return '09';if(['publish','confirm-publish'].includes(action))return '10';if(['edit','save-shared','confirm-shared'].includes(action))return '11';if(action==='delete-def')return extra.includes('rules')?'12':'13';if(['delete-object','unlink','confirm-remove'].includes(action))return '13';return null}

function reviewPanel(){if(!s.annotations)return '';const ids={home:['14','01'],manage:['01','02','03','04'],objects:['13','11'],shared:['11','13'],rules:['12','13'],actions:['13'],release:s.tab==='draft'?['05','10']:['05','06','07','08','09']}[s.page]||[];const retained={home:'保留：现有统计、对象入口和工作概览整体布局。',manage:'本页是新增的集中管理页；新建本体能力本身沿用现有。',objects:s.view==='graph'?'保留：最新精简工具栏和详情跳转现有编辑器；不恢复已移除按钮。':'保留：对象列表、属性表格和原有表单，不新增本体业务字段。',shared:'保留：共享属性列表与编辑器；新增的是高影响修改的确认环节。',rules:'保留：规则名称、业务定义、正文和输出字段；本期不调整必填规则。',actions:'保留：动作字段与关联方式，不增加输入参数或提交条件。',release:'保留：现有草稿保存、结构校验、发布版本规则；不自动修改项目引用。'}[s.page];return `<section class="review-panel" aria-label="本页改动标注"><div class="head"><span class="review-title">本页改动 · ${title()}${s.page==='release'?' / '+(s.tab==='draft'?'当前草稿':'版本记录'):''}</span><span class="review-legend">紫色＝新增　黄色＝调整　编号对应页面控件</span></div><ul class="review-items">${ids.map(id=>`<li>${mark(id)}<p><strong>${esc(REVIEW[id][1])}</strong> — ${esc(REVIEW[id][2])}</p></li>`).join('')}</ul><div class="review-note">${esc(retained)}<br>标注仅用于评审，不属于正式页面。未标注的控件为既有能力或演示辅助。</div><details><summary>按页面查看全部改动</summary><div class="review-nav">${[['home','概览 · 小调整'],['manage','管理本体 · 新页面'],['objects','对象建模 · 操作调整'],['shared','共享属性 · 保存确认'],['rules','业务规则 · 安全删除'],['actions','动作定义 · 保护提示'],['release','校验与发布 · 主要改版']].map(([v,label])=>btn(label,'page',`data-v="${v}"`)).join('')}</div></details></section>`}
function modalReview(kind){if(!s.annotations)return '';const id={rename:'02',archive:'03','delete-asset':'04',inspect:'06',restore:'08',checkpoint:'09',publish:'10',edit:'11',impact:'11',blocked:'13',unlink:'13','delete-def':s.modal?.category==='rules'?'12':'13'}[kind];return id?`<div class="review-modal">${mark(id)} <strong>${esc(REVIEW[id][1])}</strong><br>${esc(REVIEW[id][2])}${kind==='edit'?'<br>先修改业务定义或数据类型，再点保存，即可体验新增确认环节。':''}</div>`:''}

tById('outcome').value=s.outcome;renderModal()}
function page(){if(s.page==='manage')return manage();if(s.page==='release')return release();if(s.page==='objects')return objects();if(['shared','rules','actions'].includes(s.page))return library();return home()}
function home(){const a=asset(),d=doc();return `<div class="head"><div><h1>${esc(a.name)}</h1><p class="muted">维护业务定义；草稿、发布版本和项目引用相互独立。</p></div>${btn('管理本体','page','data-v="manage"')}</div>${!d.objects.length?`<section class="card empty"><h2>从第一个业务对象开始</h2><p class="muted">本原型聚焦维护与版本操作。可切换到“储能本体”体验完整流程。</p>${btn('切换储能本体','choose','data-id="energy"','primary')}</section>`:`<section class="card"><div class="head"><h2>本体内容</h2>${btn('进入对象建模 →','page','data-v="objects"','primary')}</div><div class="metrics">${[['对象',d.objects.length],['共享属性',d.props.length],['链接',d.links.length],['规则',d.rules.length],['动作',d.actions.length]].map(([l,n])=>`<div class="metric"><span class="muted">${l}</span><strong>${n}</strong></div>`).join('')}</div></section>`}<section class="card"><div class="head"><h2>版本与引用</h2>${btn('查看版本记录 →','versions','','text')}</div><div class="grid"><div><p class="muted">最新发布版本</p><h1>${latest()?.version||'尚未发布'}</h1><p>${asset().origin?'草稿恢复自 '+esc(asset().origin)+'，尚未发布':changes(latest()?.doc||blank(),d).length?'草稿有未发布变更':'草稿与最新发布内容一致'}</p></div><div><p class="muted">引用项目</p><h1>${a.refs} 个</h1><p class="muted">恢复和修改草稿不会切换项目引用。</p></div></div>${btn('比较草稿与最新版本','compare-default','','text')}</section><section class="card"><h2>建议体验顺序</h2><p class="muted">① 在共享属性修改 SOC 业务定义并查看影响 → ② 比较草稿 → ③ 查看 1.0.0 → ④ 恢复为草稿 → ⑤ 查看恢复前内容。</p></section>`}
function manage(){const rows=s.assets.filter(a=>(s.filter==='全部'||(s.filter==='已归档')===a.archived)&&a.name.includes(s.search));return `<div class="head"><div><h1>管理本体</h1><p class="muted">归档用于收起不再维护的本体，已发布版本与项目引用保留。</p></div>${btn('+ 新建本体','new','','primary')}</div><div class="card"><div class="toolbar"><input id="searchAssets" placeholder="搜索本体名称" aria-label="搜索本体名称" value="${esc(s.search)}"><div class="actions">${['使用中','已归档','全部'].map(f=>btn(f,'filter',`data-v="${f}"`,s.filter===f?'active':'')).join('')}</div></div><div class="tablewrap"><table><thead><tr><th>本体</th><th>状态</th><th>最新版本</th><th>引用项目</th><th>操作</th></tr></thead><tbody>${rows.map(a=>`<tr><td><strong>${esc(a.name)}</strong></td><td>${flag(a.archived?'已归档':'使用中',a.archived?'':'green')}</td><td>${a.versions.at(-1)?.version||'未发布'}</td><td>${a.refs}</td><td>${btn('打开','choose',`data-id="${a.id}"`,'text')}${btn('改名','rename',`data-id="${a.id}"`,'text')}${btn(a.archived?'恢复使用':'归档','archive',`data-id="${a.id}"`,'text')}${btn('删除','delete-asset',`data-id="${a.id}"`,'text danger')}</td></tr>`).join('')||'<tr><td colspan="5">没有符合条件的本体。</td></tr>'}</tbody></table></div><p class="muted">删除仅适用于：无发布版本、无项目引用、无模型内容的空本体。其他本体请归档。</p></div>`}
function objects(){const d=doc();if(!d.objects.length)return home();let o=d.objects.find(x=>x.id===s.object)||d.objects[0];s.object=o.id;return `<div class="head"><h1>对象建模</h1><div class="actions">${btn('对象列表','view','data-v="list"',s.view==='list'?'active':'')}${btn('本体图谱','view','data-v="graph"',s.view==='graph'?'active':'')}</div></div>${s.view==='graph'?`<div class="card"><div class="head"><h2>储能对象与共享定义</h2><span class="muted">点击节点打开相同编辑器 · 操作规则与列表一致</span></div><div class="graph">${d.objects.map(x=>`<button class="node" data-a="object" data-id="${x.id}"><small>对象</small><strong>${esc(x.name)}</strong></button><div class="edge">→</div><button class="node" data-a="edit" data-id="${x.refs[0]||'capacity'}"><small>共享属性</small><strong>额定容量</strong></button>`).join('')}</div><p class="muted">此图仅示意本次共享操作入口；正式版保留已有缩放、布局、筛选与批量操作能力。</p></div>`:`<div class="workspace"><aside class="objectnav"><h3>对象类型 · ${d.objects.length}</h3>${d.objects.map(x=>btn(`${esc(x.name)}<small>${x.refs.length} 个属性</small>`,'object',`data-id="${x.id}"`,o.id===x.id?'active':'')).join('')}</aside><section class="detail"><div class="head"><div><h2>${esc(o.name)}</h2><p class="muted">${esc(o.description)}</p></div>${btn('删除对象','delete-object',`data-id="${o.id}"`,'danger')}</div><div class="tabs"><button class="selected">属性 · ${o.refs.length}</button><span class="muted">链接、规则与动作继续沿用现有页签</span></div><div class="tablewrap"><table><thead><tr><th>属性</th><th>数据类型</th><th>复用方式</th><th>操作</th></tr></thead><tbody>${o.refs.map(id=>{const p=d.props.find(x=>x.id===id);return `<tr><td><strong>${esc(p?.name||id)}</strong></td><td>${esc(p?.type)}</td><td>${flag('共享','blue')}</td><td>${btn('编辑共享定义','edit',`data-id="${id}"`,'text')}${btn('移除对象属性','unlink',`data-id="${id}" data-owner="${o.id}"`,'text danger')}</td></tr>`}).join('')}</tbody></table></div><p class="muted">“移除对象属性”不删除共享定义；“转为私有”保留对象属性，解除共享。正式版两种操作明确区分。</p></section></div>`}`}
function library(){const d=doc(),shared=s.page==='shared',rows=d[shared?'props':s.page];return `<div class="head"><div><h1>${title()}</h1><p class="muted">${shared?'共享定义修改前，查看具体字段和引用对象的影响。':'列表和图谱遵守同一套删除保护规则。'}</p></div></div><section class="card"><div class="tablewrap"><table><thead><tr><th>名称</th><th>业务定义</th><th>引用对象</th><th>操作</th></tr></thead><tbody>${rows.map(p=>{const refs=shared?d.objects.filter(o=>o.refs.includes(p.id)).map(o=>o.id):p.owners;return `<tr><td><strong>${esc(p.name)}</strong>${shared?`<p class="muted">${esc(p.type)}</p>`:''}</td><td>${esc(p.description)}</td><td>${btn(refs.length+' 个对象','refs',`data-id="${p.id}" data-kind="${shared?'props':s.page}"`,'text')}</td><td>${shared?btn('编辑','edit',`data-id="${p.id}"`,'text'):btn('查看','definition',`data-id="${p.id}" data-kind="${s.page}"`,'text')}${btn('删除定义','delete-def',`data-id="${p.id}" data-kind="${shared?'props':s.page}"`,'text danger')}</td></tr>`}).join('')||'<tr><td colspan="4">暂无定义。基础新增表单继续复用现有功能。</td></tr>'}</tbody></table></div></section>`}
function flatten(d){const out={};for(const k of ['objects','props','links','rules','actions'])for(const x of d[k]||[])out[k+':'+x.id]=x;return out}
function changes(a,b){const aa=flatten(a),bb=flatten(b),rows=[];for(const id of [...new Set([...Object.keys(aa),...Object.keys(bb)])]){const x=aa[id],y=bb[id];if(!x||!y){rows.push({id,name:(y||x).name,field:'定义',old:x?'存在':'—',new:y?'存在':'—',kind:x?'删除':'新增',risk:x?'破坏性':'兼容'});continue}for(const k of new Set([...Object.keys(x),...Object.keys(y)])){if(k==='id'||JSON.stringify(x[k])===JSON.stringify(y[k]))continue;const structural=['type','from','to','cardinality','refs','owners'].includes(k);rows.push({id,name:y.name,field:({name:'名称',description:'业务定义',type:'数据类型',refs:'属性引用',owners:'对象关联',from:'起点',to:'终点',cardinality:'数量关系'})[k]||k,old:Array.isArray(x[k])?x[k].join('、'):x[k]??'—',new:Array.isArray(y[k])?y[k].join('、'):y[k]??'—',kind:'修改',risk:structural?'破坏性':k==='name'?'兼容':'待确认'})}}return rows}
function getDoc(v){return v==='draft'?doc():asset().versions.find(x=>x.version===v)?.doc||blank()}
function diffTable(rows){return `<div class="tablewrap"><table><thead><tr><th>定义 / 字段</th><th>变更前</th><th>变更后</th><th>影响</th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${esc(r.name)}</strong><p class="muted">${r.kind} · ${r.field}</p></td><td class="diff-text">${esc(r.old)}</td><td class="diff-text">${esc(r.new)}</td><td>${flag(r.risk,r.risk==='破坏性'?'red':r.risk==='待确认'?'blue':'green')}</td></tr>`).join('')||'<tr><td colspan="4">所选内容无差异。</td></tr>'}</tbody></table></div>`}
function release(){const a=asset();return `<div class="head"><div><h1>校验与发布</h1><p class="muted">检查当前草稿；查看、比较和恢复历史版本。</p></div></div><div class="tabs">${btn('当前草稿','release-tab','data-v="draft"',s.tab==='draft'?'selected':'')}${btn('版本记录','release-tab','data-v="versions"',s.tab==='versions'?'selected':'')}</div>${s.tab==='versions'?`<div class="card"><div class="head"><h2>已发布版本</h2>${btn('比较版本','compare-default','','primary')}</div><div class="tablewrap"><table><thead><tr><th>版本</th><th>发布时间</th><th>变更说明</th><th>操作</th></tr></thead><tbody>${a.versions.slice().reverse().map(v=>`<tr><td><strong>${v.version}</strong><p>${flag(v.kind,v.kind==='破坏性'?'red':'')}</p></td><td>${v.date}</td><td>${esc(v.note)}${v.origin?`<p class="muted">由 ${esc(v.origin)} 恢复后发布</p>`:''}</td><td>${btn('查看','inspect',`data-version="${v.version}"`,'text')}${btn('比较','compare-one',`data-version="${v.version}"`,'text')}${btn('恢复为草稿','restore',`data-version="${v.version}" ${a.archived?'disabled':''}`,'text')}</td></tr>`).join('')||'<tr><td colspan="4">尚未发布。</td></tr>'}</tbody></table></div><p class="muted">恢复只替换当前草稿。已发布版本保持不可变，项目不会自动切换引用。</p>${s.checkpoints.length?`<details open><summary>恢复前检查点 · ${s.checkpoints.length} ${mark('09')}</summary>${s.checkpoints.filter(c=>c.asset===a.id).map(c=>`<div class="row"><p>${esc(c.label)}</p>${btn('查看恢复前内容','checkpoint',`data-id="${c.id}"`,'text')}</div>`).join('')}</details>`:''}</div>${compare()}`:`<div class="card"><div class="head"><h2>当前草稿</h2>${flag(asset().origin?'恢复后待发布':'编辑草稿','blue')}</div>${asset().origin?`<div class="notice">草稿由 ${esc(asset().origin)} 恢复，尚未发布。${btn('查看版本记录','versions','','text')}</div>`:''}<div class="notice good">原型样例：定义结构校验通过。结构校验不代表业务口径已验证。</div><p class="muted">正式版会以服务器权威草稿重新校验；下面仅模拟变更确认与发布流程。</p>${btn('检查变更并发布','publish',''+(a.archived?'disabled':''),'primary')}${btn('比较草稿与最新版本','compare-default','','text')}</div>`}`}
function compare(){const options=['draft',...asset().versions.map(v=>v.version)];if(!options.includes(s.left))s.left=options.at(-1);if(!options.includes(s.right))s.right='draft';const rows=changes(getDoc(s.left),getDoc(s.right));return `<section class="card"><div class="head"><h2>版本比较 ${mark('07')}</h2><span class="muted">${rows.length} 项变化</span></div><div class="compare-controls">${[['left','变更前'],['right','变更后']].map(([k,l])=>`<label>${l}<select id="${k}">${options.map(v=>`<option ${s[k]===v?'selected':''} value="${v}">${v==='draft'?'当前草稿':v+' · 已发布'}</option>`).join('')}</select></label>`).join('<span>→</span>')}</div><div class="row start" style="margin:18px 0">${['全部','新增','删除','修改','待确认'].map(f=>btn(f,'diff-filter',`data-v="${f}"`,s.diffFilter===f?'active':'')).join('')}</div>${diffTable(rows.filter(r=>s.diffFilter==='全部'||r.kind===s.diffFilter||r.risk===s.diffFilter))}<p class="muted">业务定义改变需人工确认；结构性破坏不能手动改为兼容。正式版涵盖所有字段与未知扩展。</p></section>`}
function snapshotDetail(d,k,x){const names=ids=>(ids||[]).map(id=>d.objects.find(o=>o.id===id)?.name||id).join('、');if(k==='objects')return '属性：'+(x.refs.map(id=>d.props.find(p=>p.id===id)?.name||id).join('、')||'无');if(k==='links')return names([x.from])+' → '+names([x.to])+' · '+x.cardinality;if(k==='props')return '引用对象：'+names(d.objects.filter(o=>o.refs.includes(x.id)).map(o=>o.id));return '关联对象：'+names(x.owners)}
function show(kind,data={}){s.modal={kind,...data};renderModal()}
function dialog(title,body,foot){return `<dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle">${title}</h2>${btn('✕','close','aria-label="关闭"')}</div><div class="dialog-body">${body}</div><div class="dialog-foot">${foot}</div></dialog>`}
function owners(id,kind='props'){return kind==='props'?doc().objects.filter(x=>x.refs.includes(id)):doc().objects.filter(x=>doc()[kind].find(p=>p.id===id)?.owners.includes(x.id))}
function ownerRows(rows){return rows.map(o=>`<div class="row"><p><strong>${esc(o.name)}</strong><br><span class="muted">当前草稿中的定义关联</span></p>${btn('去对象查看','locate',`data-id="${o.id}"`,'text')}</div>`).join('')||'<p class="muted">没有对象引用。</p>'}
function renderModal(){const m=s.modal,root=document.getElementById('modal');if(!m){root.innerHTML='';return}let h='',b='',f=btn('取消','close');if(m.error)b=`<div class="notice error">${esc(m.error)}</div>`;const a=s.assets.find(x=>x.id===m.id)||asset();
if(m.kind==='new'||m.kind==='rename'){h=m.kind==='new'?'新建本体':'修改本体名称';b+=`<label class="field"><span>本体名称 *</span><input id="nameInput" maxlength="80" value="${esc(m.value??(m.kind==='new'?'':a.name))}" autofocus></label><p class="muted">${m.kind==='new'?'创建空白本体。':'稳定 ID 和项目引用保持不变，历史版本名称不回写。'}</p>`;f+=btn('保存','save-name','','primary')}
if(m.kind==='archive'){h=a.archived?'恢复使用':'归档本体';b+=`<h3>${esc(a.name)}</h3><p>${a.versions.length} 个发布版本 · ${a.refs} 个项目引用</p><div class="notice warning">${a.archived?'恢复后可以继续编辑当前草稿，内容与项目引用不变。':'归档后本体建模只读；已有项目仍可使用已发布版本。可在管理本体中恢复使用。'}</div>`;f+=btn(a.archived?'恢复使用':'确认归档','confirm-archive','','primary')}
if(m.kind==='delete-asset'){const blocked=a.versions.length||a.refs||Object.values(a.doc).some(x=>x.length);h=blocked?'暂不能删除本体':'删除空本体';b+=`<h3>${esc(a.name)}</h3>${blocked?`<div class="notice warning">${a.versions.length?'已有发布版本；':''}${a.refs?'已有项目引用；':''}${Object.values(a.doc).some(x=>x.length)?'包含模型内容。':''}</div><p>请归档保留历史，不提供强制删除。</p>`:`<p>删除后不能通过普通撤销恢复。请输入本体名称确认。</p><input id="deleteName" aria-label="输入本体名称">`}`;f+=blocked?btn(a.archived?'关闭':'改为归档',a.archived?'close':'archive',`data-id="${a.id}"`,'primary'):btn('确认删除','confirm-delete-asset','','danger primary')}
if(m.kind==='edit'){const p=doc().props.find(x=>x.id===m.id);h='编辑共享属性';b+=`<div class="notice">当前被 ${owners(p.id).length} 个对象引用。仅影响当前本体草稿，已发布版本不变。</div><label class="field"><span>名称 *</span><input id="propName" value="${esc(m.form?.name??p.name)}"></label><label class="field"><span>业务定义 *</span><textarea id="propDesc">${esc(m.form?.description??p.description)}</textarea></label><label class="field"><span>数据类型 *</span><select id="propType">${['数值','文本','时间序列（数值）'].map(t=>`<option ${(m.form?.type??p.type)===t?'selected':''}>${t}</option>`).join('')}</select></label><details><summary>查看引用对象</summary>${ownerRows(owners(p.id))}</details>`;f+=btn('保存','save-shared','','primary')}
if(m.kind==='impact'){h='确认共享修改影响';b+=`<p>修改 <strong>${esc(m.form.name)}</strong> 将更新下列对象的共享定义。</p>${diffTable(changes({props:[m.before]},{props:[m.form]}))}${ownerRows(owners(m.id))}<label class="check"><input type="checkbox" id="ack"><span>我已查看字段变化与受影响对象。此次保存不修改已发布版本。</span></label>`;f=btn('返回编辑','back-edit')+btn('确认并保存','confirm-shared','','primary')}
if(m.kind==='refs'||m.kind==='blocked'){h=m.kind==='blocked'?'暂不能删除':'引用对象';b+=m.reason?`<div class="notice warning">${esc(m.reason)}</div>`:'';b+=ownerRows(m.rows||owners(m.id,m.category));b+='<p class="muted">先处理依赖后再重试。此规则对列表、图谱和批量操作一致。</p>';f=btn('知道了','close','','primary')}
if(m.kind==='definition'){h='定义详情';b+=`<h3>${esc(m.item.name)}</h3><p>${esc(m.item.description)}</p>${ownerRows(owners(m.item.id,m.category))}`;f=btn('关闭','close')}
if(m.kind==='delete-def'||m.kind==='unlink'){h=m.kind==='unlink'?'移除对象属性':'删除定义';b+=`<p>${m.kind==='unlink'?'移除当前对象的共享引用属性，共享库定义与其他对象属性不变。不会自动转为私有。':'此定义没有对象引用，确认从当前草稿删除？'}</p><p class="muted">正式版还会检查历史契约等全部当前依赖。</p>`;f+=btn('确认移除','confirm-remove','','danger primary')}
if(m.kind==='inspect'||m.kind==='checkpoint'){const v=m.kind==='inspect'?asset().versions.find(v=>v.version===m.version):s.checkpoints.find(c=>c.id===m.id);h=m.kind==='inspect'?`查看版本 ${v.version}`:'恢复前内容';b+=`<div class="version-banner">只读 · ${m.kind==='inspect'?'已发布内容，不随当前草稿变化':esc(v.label)}</div>${['objects','props','links','rules','actions'].map((k,i)=>`<details ${i<2?'open':''}><summary>${['对象','共享属性','链接','业务规则','动作'][i]} · ${v.doc[k].length}</summary>${v.doc[k].map(x=>`<p><strong>${esc(x.name)}</strong>${x.type?' · '+esc(x.type):''}<br><span class="muted">${esc(x.description||'')}<br>${esc(snapshotDetail(v.doc,k,x))}</span></p>`).join('')||'<p class="muted">无内容</p>'}</details>`).join('')}`;f=btn('关闭','close')+btn('恢复为草稿',m.kind==='inspect'?'restore':'restore-checkpoint',m.kind==='inspect'?`data-version="${m.version}"`:`data-id="${m.id}"`,'primary')}
if(m.kind==='restore'){h='恢复为当前草稿';const rows=changes(doc(),m.target);b+=`<p>恢复来源：<strong>${esc(m.label)}</strong></p><div class="notice warning">当前草稿将被替换，并保留为恢复前检查点。已发布版本和项目引用不变。</div>${diffTable(rows)}<label class="check"><input type="checkbox" id="ack"><span>我已查看差异，确认将此内容恢复为草稿。恢复后尚未发布。</span></label>`;f+=btn('确认恢复','confirm-restore','','primary')}
if(m.kind==='publish'){h='检查变更并发布';const rows=changes(latest()?.doc||blank(),doc());b+=`${diffTable(rows)}<label class="field"><span>变更说明 *</span><textarea id="publishNote" placeholder="说明本次修改或恢复的原因"></textarea></label>${rows.some(r=>r.risk==='待确认')?`<label class="field"><span>业务定义变化判断</span><select id="judgement"><option value="">请选择</option><option value="compatible">仅澄清文字，业务含义不变</option><option value="breaking">业务含义改变</option></select></label><label class="field"><span>判断理由 *</span><input id="judgeReason"></label>`:''}<label class="check"><input type="checkbox" id="ack"><span>已核对变更。结构性破坏不能改为兼容，发布不切换项目引用。</span></label>`;f+=btn('模拟发布','confirm-publish','','primary')}
if(m.kind==='unknown'){h='提交结果待确认';b+=`<div class="notice warning">请求已发出，但尚未取得最终结果。不能断言操作失败，也不能重复创建恢复操作。</div><p class="muted">演示：本次操作实际尚未写入内存。点击查询结果确认后重试。</p>`;f=btn('查询本次结果','resolve','','primary')}
root.innerHTML=dialog(h,modalReview(m.kind)+b,f);const el=document.getElementById('dialog');if(el.showModal)el.showModal();el.addEventListener('cancel',e=>{e.preventDefault();s.modal=null;renderModal()})}
function message(t){s.notice=t;render()}
function mutate(fn,success){if(asset().archived&&!['confirm-archive','save-name','confirm-delete-asset'].includes(s.currentAction)){s.modal.error='此本体已归档，请恢复使用后再修改。';renderModal();return false}if(s.outcome==='conflict'){s.outcome='success';s.modal.error='并发冲突：草稿已更新。请关闭本窗口，重新查看差异后提交。';s.modal.stale=true;renderModal();return false}if(s.outcome==='error'){s.outcome='success';s.modal.error='服务失败：本次模拟未写入，原内容保留。可以重试。';renderModal();return false}if(s.outcome==='unknown'){s.outcome='success';show('unknown');return false}if(s.modal?.stale){s.modal.error='本次确认已失效，请关闭后重新发起。';renderModal();return false}fn();s.revision++;s.modal=null;message(success);return true}
function dispatch(action,data={}){s.currentAction=action;const m=s.modal;
if(action==='toggle-review'){s.annotations=!s.annotations;render();return}
if(action==='reset'){location.reload();return}
if(action==='close'){s.modal=null;renderModal();return}
if(action==='page'){s.page=data.v;s.notice='';render();return}
if(action==='filter'){s.filter=data.v;render();return}
if(action==='diff-filter'){s.diffFilter=data.v;render();return}
if(action==='choose'){s.asset=data.id;s.page='home';s.notice='';render();return}
if(action==='new'){show('new');return}if(action==='rename'){show('rename',{id:data.id});return}
if(action==='save-name'){const value=document.getElementById('nameInput').value.trim();if(!value||s.assets.some(a=>a.name===value&&a.id!==m.id)){m.error='请填写名称，且不能与现有本体重名。';m.value=value;renderModal();return}mutate(()=>{if(m.kind==='new')s.assets.push({id:'new'+s.revision,name:value,archived:false,refs:0,doc:blank(),versions:[]});else s.assets.find(a=>a.id===m.id).name=value},'本体名称已保存（演示）。');return}
if(action==='archive'){show('archive',{id:data.id});return}
if(action==='confirm-archive'){const a=s.assets.find(x=>x.id===m.id);mutate(()=>a.archived=!a.archived,'本体状态已更新；发布版本和项目引用不变（演示）。');return}
if(action==='delete-asset'){show('delete-asset',{id:data.id});return}
if(action==='confirm-delete-asset'){const a=s.assets.find(x=>x.id===m.id);if(document.getElementById('deleteName').value!==a.name){m.error='名称不一致，请重新输入。';renderModal();return}mutate(()=>{s.assets=s.assets.filter(x=>x.id!==a.id);if(s.asset===a.id)s.asset=s.assets[0].id},'空本体已删除（演示）。');return}
if(action==='object'||action==='locate'){s.modal=null;s.object=data.id;s.page='objects';s.view='list';render();return}
if(action==='view'){s.view=data.v;render();return}
if(action==='edit'){if(asset().archived){message('已归档本体只读，请恢复使用后编辑。');return}show('edit',{id:data.id});return}
if(action==='save-shared'){const before=doc().props.find(x=>x.id===m.id),form={...before,name:document.getElementById('propName').value.trim(),description:document.getElementById('propDesc').value.trim(),type:document.getElementById('propType').value};if(!form.name||!form.description){m.error='名称和业务定义不能为空。';m.form=form;renderModal();return}if(JSON.stringify(form)===JSON.stringify(before)){s.modal=null;message('内容未变化，无需保存。');return}if(form.description!==before.description||form.type!==before.type){show('impact',{id:m.id,before:clone(before),form,revision:s.revision});return}mutate(()=>Object.assign(before,form),'共享定义已保存（演示），已发布版本不变。');return}
if(action==='back-edit'){show('edit',{id:m.id,form:m.form});return}
if(action==='confirm-shared'){if(!document.getElementById('ack').checked){m.error='请先确认已查看影响。';renderModal();return}mutate(()=>Object.assign(doc().props.find(x=>x.id===m.id),m.form),'共享定义已保存，当前引用对象同步更新；已发布版本不变（演示）。');return}
if(action==='refs'){show('refs',{id:data.id,category:data.kind});return}
if(action==='definition'){show('definition',{category:data.kind,item:doc()[data.kind].find(x=>x.id===data.id)});return}
if(action==='delete-object'){const o=doc().objects.find(x=>x.id===data.id);show('blocked',{reason:'对象仍有属性、链接或规则依赖。请先移除相应依赖，不提供强制删除。',rows:[o]});return}
if(action==='delete-def'){const rows=owners(data.id,data.kind);show(rows.length?'blocked':'delete-def',{id:data.id,category:data.kind,rows,reason:rows.length?'此定义仍被下列对象引用。先移除关联，定义才能删除。':''});return}
if(action==='unlink'){show('unlink',{id:data.id,owner:data.owner});return}
if(action==='confirm-remove'){mutate(()=>{if(m.kind==='unlink'){const o=doc().objects.find(x=>x.id===m.owner);o.refs=o.refs.filter(id=>id!==m.id)}else doc()[m.category]=doc()[m.category].filter(x=>x.id!==m.id)},'已从当前草稿移除（演示），已发布版本不变。');return}
if(action==='versions'){s.page='release';s.tab='versions';render();return}
if(action==='release-tab'){s.tab=data.v;render();return}
if(action==='compare-default'||action==='compare-one'){s.page='release';s.tab='versions';s.left=data.version||latest()?.version||'draft';s.right='draft';render();return}
if(action==='inspect'){show('inspect',{version:data.version});return}
if(action==='checkpoint'){show('checkpoint',{id:data.id});return}
if(action==='restore'||action==='restore-checkpoint'){if(asset().archived){s.modal=null;message('此本体已归档。请先恢复使用，再恢复版本内容。');return}const v=action==='restore'?asset().versions.find(x=>x.version===data.version):s.checkpoints.find(x=>x.id===data.id);show('restore',{label:action==='restore'?v.version:v.label,target:clone(v.doc),revision:s.revision});return}
if(action==='confirm-restore'){if(!document.getElementById('ack').checked){m.error='请确认已查看恢复影响。';renderModal();return}mutate(()=>{s.checkpoints.push({id:'cp'+s.revision,asset:s.asset,label:'恢复前草稿 · 检查点 '+s.revision,doc:clone(doc())});asset().doc=clone(m.target);asset().origin=m.label;s.tab='draft';s.page='release'},'已恢复为草稿，尚未发布。恢复前内容已保留为检查点（演示）。');return}
if(action==='publish'){if(asset().archived){message('已归档本体不能发布。');return}show('publish');return}
if(action==='confirm-publish'){const note=document.getElementById('publishNote').value.trim(),j=document.getElementById('judgement'),reason=document.getElementById('judgeReason');if(!note||!document.getElementById('ack').checked||(j&&(!j.value||!reason.value.trim()))){m.error='请填写变更说明、待确认项判断及理由，并确认已核对变更。';renderModal();return}const rows=changes(latest()?.doc||blank(),doc());mutate(()=>{const breaking=rows.some(r=>r.risk==='破坏性')||j?.value==='breaking';const nums=(latest()?.version||'0.0.0').split('.').map(Number);const version=!latest()?'1.0.0':breaking?`${nums[0]+1}.0.0`:`${nums[0]}.${nums[1]+1}.0`;asset().versions.push({version,date:'2026-09-20 · 演示',note,kind:breaking?'破坏性':'兼容',doc:clone(doc()),origin:asset().origin});asset().origin=null;s.tab='versions'},'新版本已生成（演示）；项目引用未切换。');return}
if(action==='resolve'){s.modal=null;message('已查询：本次模拟未提交。请重新发起操作。');return}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)dispatch(b.dataset.a,b.dataset)});
document.addEventListener('change',e=>{if(e.target.id==='assetSelect')dispatch('choose',{id:e.target.value});if(e.target.id==='outcome')s.outcome=e.target.value;if(['left','right'].includes(e.target.id)){s[e.target.id]=e.target.value;render()}if(e.target.id==='searchAssets'){s.search=e.target.value;render()}});
window.__prototype={s,dispatch,changes,asset,doc,render};render();
</script></body></html>
