<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>配置迁移 · 交互原型 v1</title><style>
:root{--blue:#2858e8;--ink:#203449;--muted:#667c94;--border:#dce4ee;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer;background:white;border:1px solid var(--border);border-radius:6px;padding:8px 14px;color:var(--ink)}button:hover{border-color:#a0b5ee;background:#f3f6ff}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.primary{background:var(--blue);color:white;border-color:var(--blue)}.primary:hover{background:#214dcf;color:white}.text{border:0;background:transparent;color:var(--blue);padding:4px 0}aside{position:fixed;inset:0 auto 0 0;width:210px;background:white;border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:12px}aside h2{font-size:19px;margin:20px 10px 4px}aside small{padding:0 10px;color:var(--muted)}aside .selected{background:#edf2ff;border:0;color:var(--blue);font-weight:600;text-align:left}aside .user{margin-top:auto;padding:15px 8px;border-top:1px solid var(--border)}main{margin-left:210px}.demo{padding:8px 28px;background:#fff8e8;border-bottom:1px solid #f0dfb6;font-size:12px;color:#856227;display:flex;justify-content:space-between;gap:10px}.demo a{color:inherit}header{background:white;border-bottom:1px solid var(--border);padding:20px 30px;display:flex;align-items:center;gap:20px}h1{font-size:23px;margin:0}header small{color:var(--muted)}.content{padding:24px 30px;max-width:1400px}.tabs{display:flex;gap:25px;margin-bottom:20px;border-bottom:1px solid var(--border)}.tabs button{border:0;border-radius:0;background:none;padding:9px 2px 13px}.tabs .active{color:var(--blue);font-weight:600;border-bottom:2px solid var(--blue)}.card{background:white;border:1px solid var(--border);border-radius:9px;padding:22px;margin-bottom:16px}.card h2{font-size:17px;margin:0 0 7px}.muted{color:var(--muted)}p{margin:6px 0 15px}.row{display:flex;align-items:center;gap:12px}.spread{justify-content:space-between}.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}input[type=text],select{width:100%;border:1px solid #cfdced;padding:9px 11px;border-radius:6px;background:white;color:var(--ink)}input[type=checkbox]{accent-color:var(--blue);width:16px;height:16px;vertical-align:middle}label.check{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf1f6}.check span{flex:1}.check small{display:block;color:var(--muted)}.note{padding:12px 15px;background:#eef3ff;border:1px solid #d5e1ff;border-radius:6px;margin:12px 0}.warn{background:#fff8eb;border-color:#f0d9aa;color:#896022}.err{background:#fff1f1;border-color:#efc2c2;color:#a33131}.ok{background:#ecf9f2;border-color:#bde6d0;color:#21704a}.tag{font-size:12px;white-space:nowrap;padding:3px 9px;border-radius:12px;background:#eef3ff;color:var(--blue)}table{width:100%;border-collapse:collapse;white-space:normal}th{background:#f6f8fb;text-align:left;color:var(--muted);font-weight:600}th,td{padding:12px 13px;border-bottom:1px solid var(--border);vertical-align:middle}td small{display:block;color:var(--muted)}.scroll{overflow:auto;max-height:390px}.scroll table{min-width:650px}.scroll th{position:sticky;top:0;z-index:1}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.drop{padding:35px 20px;text-align:center;border:1px dashed #aac0e6;border-radius:7px;background:#fafcff;margin:16px 0}.drop strong{display:block;font-size:17px}.drop button{margin:12px 0}.steps{display:flex;gap:20px;margin:0 0 18px;color:var(--muted)}.steps .here{color:var(--blue);font-weight:600}.count{font-size:28px;font-weight:650}.stats{display:flex;gap:45px;margin:18px 0}.stats small{display:block;color:var(--muted)}details{margin-top:16px}summary{cursor:pointer;color:var(--muted)}.foot{font-size:12px;color:var(--muted);margin-top:10px}.modal-mask{position:fixed;inset:0;background:#20344955;display:grid;place-items:center;padding:20px;z-index:20}.modal{background:white;border-radius:10px;max-width:560px;width:100%;padding:25px}.modal h2{margin-top:0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#23374a;color:white;border-radius:6px;padding:12px 22px;z-index:30}a{color:var(--blue)}.sim{margin-top:24px;padding:12px;background:#faf7f1;border:1px dashed #d8cbb0;border-radius:6px;font-size:12px;color:#806435}.sim button{font-size:12px;padding:5px 8px;margin:4px}.bad-input{border-color:#cd4545!important}@media(max-width:1100px){aside{width:180px}main{margin-left:180px}.content{padding:20px}.grid{grid-template-columns:minmax(0,1fr)}.side-summary{display:none}.stats{gap:25px}}@media(max-width:700px){aside{display:none}main{margin:0}header{padding:15px}.content{padding:12px}.demo{padding:8px 12px}.row{flex-wrap:wrap}.stats{gap:20px}.scroll{max-height:330px}}
</style></head><body>
<aside><button id="back">← 返回工作区</button><h2>设置</h2><small>基础设置</small><button class="text" id="models">模型设置</button><small>数据管理</small><button class="selected">⇄ 配置迁移</button><div class="user">◉ 演示用户 <span class="muted">⚙</span></div></aside>
<main><div class="demo"><span>交互原型 v1 · 内存演示，不读取配置库，不解析真实 ZIP，不执行导入</span><span><a href="需求说明.md">需求</a> · <a href="开发计划.md">计划</a> · <a href="执行指令.md">指令</a></span></div><header><div><small>设置 / 数据管理</small><h1>配置迁移</h1></div><span class="tag" style="margin-left:auto">本地工作台间交接</span></header><div class="content"><div class="tabs"><button id="exportTab" class="active">导出配置</button><button id="importTab">导入配置</button></div><div id="page"></div></div></main><div id="modal"></div><div id="toast" hidden class="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab='export',stage='select',ontology='storage',chosen=new Set(['p1','p2']),extra=false,search='',exportSnapshot=null,importStage='file',fileLabel='',sampleKind='normal',rows=[],receipt=null,receipts=new Map(),requestId='',busy=false,failNext=false,loseNext=false,repeatCount=0,awaiting=false;
let existing={model:new Set(['储能本体']),project:new Set(['创智园一期','创智园二期']),flow:new Set(['储能SOC计算']),provider:new Set(['通用推理模型'])};
const rootRows=[{key:'m1',kind:'model',type:'本体',name:'储能本体',note:'当前草稿 + 1.0.0 / 2.0.0'}, {key:'p1',kind:'project',type:'项目',name:'创智园一期',note:'草稿 + v1；引用本体 1.0.0'}, {key:'p2',kind:'project',type:'项目',name:'创智园二期',note:'草稿 + v1 / v2；引用本体 2.0.0'}, {key:'f1',kind:'flow',type:'编排',name:'储能SOC计算',note:'两个项目共用本次新副本'}, {key:'llm1',kind:'provider',type:'模型配置',name:'通用推理模型',note:'元数据；API Key 待补充'}];
function notify(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3000)}
let restoreFocus=null;function modal(title,body){restoreFocus=document.activeElement;$('#modal').innerHTML=`<div class="modal-mask"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${body}<div class="actions"><button id="closeModal" class="primary">知道了</button></div></section></div>`;$('#closeModal').onclick=closeModal;$('#closeModal').focus()}
function closeModal(){$('#modal').innerHTML='';restoreFocus?.focus()}
function suggest(name,kind,reserved){const used=reserved||existing[kind];if(!used.has(name.toLocaleLowerCase()))return name;let i=1,s;do{s=name+(i===1?'（导入）':`（导入${i}）`);i++}while(used.has(s.toLocaleLowerCase()));return s}
function resetImport(){importStage='file';fileLabel='';rows=[];receipt=null;requestId='';busy=false;awaiting=false;failNext=false;loseNext=false}
function prepare(kind='normal'){sampleKind=kind;fileLabel=kind==='empty'?'空本体_配置包.zip':'储能本体_配置包_20260919.zip';receipt=null;requestId='';busy=false;awaiting=false;let list=kind==='empty'?[{key:'m0',kind:'model',type:'本体',name:'空本体',note:'空草稿，无发布版本'}]:rootRows;const used=Object.fromEntries(Object.entries(existing).map(([k,v])=>[k,new Set(v)]));rows=list.map(r=>{let newName=suggest(r.name,r.kind,used[r.kind]);used[r.kind].add(newName.toLocaleLowerCase());return {...r,newName}});importStage=kind==='broken'?'blocked':'preview';render()}
function exportList(){if(ontology==='empty')return[{kind:'model',name:'空本体',note:'空草稿，无发布版本'}];let list=[rootRows[0],...rootRows.filter(r=>chosen.has(r.key))];if(chosen.size){list.push(rootRows[3],rootRows[4])}if(extra)list.push({kind:'flow',name:'额定功率合计',note:'手动选择的未绑定编排'});return list}
function render(){ $('#exportTab').classList.toggle('active',tab==='export');$('#importTab').classList.toggle('active',tab==='import');$('#page').innerHTML=tab==='export'?renderExport():renderImport();bind();}
function renderExport(){if(stage==='preview')return `<div class="steps"><span>1 选择内容</span><span class="here">2 预览并下载</span></div><section class="card"><div class="row spread"><h2>确认导出内容</h2><button id="backExport">返回选择</button></div><p class="muted">以下内容会一起交接，接收者可继续编辑。快照时间：${exportSnapshot.time}（演示）。</p><div class="note">草稿和已发布版本分别保留；项目仍引用原本体版本。未包含未选项目和自动保存历史。</div><div class="scroll"><table><thead><tr><th>类型</th><th>名称</th><th>包含原因与版本</th></tr></thead><tbody>${exportSnapshot.rows.map(r=>`<tr><td>${({model:'本体',project:'项目',flow:'编排',provider:'模型配置'})[r.kind]}</td><td><strong>${esc(r.name)}</strong></td><td>${esc(r.note)}</td></tr>`).join('')}</tbody></table></div><div class="note warn">不包含连接密码、API Key、账号及业务数据。请检查SQL、代码或说明中自行填写的敏感内容。接收者导入后补充凭据。</div><div class="actions"><button id="refreshPreview">重新生成预览</button><button class="primary" id="download">下载配置包</button></div><div class="foot">原型不生成真实 ZIP；点击下载展示正式交付范围。</div></section>`;
return `<div class="grid"><section class="card"><h2>导出本体与项目配置</h2><p class="muted">把建设成果交给另一台工作台，继续编辑。</p><label>本体<select id="ontology"><option value="storage" ${ontology==='storage'?'selected':''}>储能本体</option><option value="empty" ${ontology==='empty'?'selected':''}>空本体（未发布）</option></select></label><div style="margin-top:22px" class="row spread"><strong>一起导出的项目</strong><span class="muted">${ontology==='storage'?chosen.size:0} 个已选</span></div>${ontology==='empty'?'<div class="note">该本体暂无关联项目，可以只导出本体。</div>':`<input type="text" id="search" aria-label="搜索项目" value="${esc(search)}" placeholder="搜索项目名称" style="margin-top:10px">${[{id:'p1',n:'创智园一期',v:'1.0.0 · 草稿与已发布 v1'},{id:'p2',n:'创智园二期',v:'2.0.0 · 草稿与已发布 v1、v2'},{id:'p3',n:'示例园区',v:'2.0.0 · 未选择，不导出'}].filter(p=>p.n.includes(search)).map(p=>`<label class="check"><input type="checkbox" data-project="${p.id}" ${chosen.has(p.id)?'checked':''}><span>${p.n}<small>引用储能本体 ${p.v}</small></span></label>`).join('')||'<p class="muted">没有匹配的项目</p>'}<details><summary>额外编排（可选）</summary><p class="muted">项目已引用的编排会自动带入，这里添加尚未绑定的编排。</p><label class="check"><input id="extra" type="checkbox" ${extra?'checked':''}><span>额定功率合计<small>尚未绑定项目 · 纯计算配置</small></span></label></details>`}<div class="actions"><button class="primary" id="previewExport">查看导出内容</button></div></section><section class="card side-summary"><h2>自动一起带走</h2><p class="muted">完整本体定义<br>项目映射与说明<br>当前草稿及已发布版本<br>引用的规则与编排<br>连接与模型配置元数据</p><div class="note">不需要逐项找齐依赖。</div><p class="foot">不会导出密码、登录信息、业务库记录、运行结果和目录缓存。</p></section></div>`}
function nameErrors(){const errors=[];const seen={};for(const r of rows){let n=r.newName.trim(),k=n.toLocaleLowerCase();if(!n)errors.push(r.key+':请输入名称');else if(n.length>60)errors.push(r.key+':演示名称最多60字');else if(existing[r.kind].has(k)||(seen[r.kind]||new Set()).has(k))errors.push(r.key+':名称已存在，请修改');(seen[r.kind]||=new Set()).add(k)}return errors}
function renderImport(){if(importStage==='file')return `<section class="card"><h2>导入配置包</h2><p class="muted">每次导入都创建新的本体和项目，不覆盖已有内容。</p><div class="drop"><strong>选择工作台导出的 ZIP 文件</strong><span class="muted">正式版支持配置包，最大 20 MiB</span><br><button id="chooseFile">选择文件</button><input id="file" type="file" accept=".zip" hidden><p class="muted" id="fileHint">原型不解析真实文件，请使用下方示例体验。</p></div><div class="note">本功能用于完整配置交接。Excel填写模板请到本体工作概览使用“导入 Excel”。</div><div class="sim">原型体验：<button id="sample">使用储能示例包</button><button id="emptySample">使用空本体包</button><button id="brokenSample">模拟缺少依赖</button></div></section>`;
if(importStage==='blocked')return `<section class="card"><h2>配置包暂时无法导入</h2><p class="muted">${esc(fileLabel)}</p><div class="note err"><strong>创智园一期 → 本体版本引用</strong><br>需要“储能本体 1.0.0”，但文件中没有这个版本。请重新导出包含依赖的完整配置包。</div><p>本次尚未创建任何本体、项目或编排。</p><div class="actions"><button id="changeFile">更换文件</button><button disabled class="primary">确认导入</button></div></section>`;
if(importStage==='success')return `<section class="card"><span class="tag">演示导入完成</span><h2 style="margin-top:12px">新的配置已创建</h2><p class="muted">仅模拟创建于本页内存，实际工作台没有变化。本次回执：${esc(receipt.id)}</p><div class="note ok">已按包内关系连接新本体、项目和编排。已有内容未被覆盖。</div><div class="scroll"><table><thead><tr><th>类型</th><th>本次新名称 / 演示ID</th><th>操作</th></tr></thead><tbody>${receipt.rows.map(r=>`<tr><td>${r.type}</td><td><strong>${esc(r.newName)}</strong><small>${r.newId}</small></td><td><button class="text" data-open="${r.key}">${r.kind==='model'?'打开本体':r.kind==='project'?'打开项目':r.kind==='flow'?'查看编排':'模型设置'}</button></td></tr>`).join('')}</tbody></table></div>${sampleKind==='empty'?'':`<details open><summary>待补配置 · 4 项</summary><div class="note warn">两个项目的数据库连接密码、接口凭据、模型 API Key 需要补充。不会自动测试连接。</div><button id="followup">查看待补位置</button></details>`}<div class="actions"><button id="receiptAgain">再次查询本次结果</button><button id="newFile">导入其他文件</button><button class="primary" id="again">再次导入此文件</button></div></section>`;
return `<div class="steps"><span>1 选择文件</span><span class="here">2 预览与命名</span><span>3 导入结果</span></div><section class="card"><div class="row spread"><div><h2>确认本次新建内容</h2><span class="muted">${esc(fileLabel)} · ${rows.length} 项配置（演示）</span></div><button id="changeFile" ${busy||awaiting?'disabled':''}>更换文件</button></div><div class="note">全部创建为新的副本。同名自动添加后缀，你可以在下面修改名称。</div><div class="scroll"><table><thead><tr><th style="width:12%">类型</th><th style="width:28%">原名称</th><th style="width:35%">导入后名称</th><th>关系与版本</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.type}</td><td>${esc(r.name)}</td><td><input type="text" data-name="${r.key}" aria-label="${esc(r.name)}导入后名称" value="${esc(r.newName)}" ${busy||awaiting?'disabled':''}><small data-error="${r.key}">${r.name!==r.newName?'同名已添加后缀':''}</small></td><td><small>${esc(r.note)}</small></td></tr>`).join('')}</tbody></table></div>${sampleKind==='empty'?'<div class="note">空本体可以迁移，导入后继续创建对象。</div>':'<div class="note warn">配置可编辑；连接与模型凭据需补充。两个项目仍分别引用新本体的 1.0.0 / 2.0.0，不会改用当前草稿。</div>'}<div id="runMessage" aria-live="polite">${awaiting?'<div class="note warn">请求结果尚未确认。请查询本次结果，不要重新发起导入。 <button id="query">查询本次结果</button></div>':''}</div><div class="actions"><button id="cancel" ${busy||awaiting?'disabled':''}>取消</button><button id="confirm" class="primary" ${busy||awaiting?'disabled':''}>${busy?'正在导入…':'确认导入'}</button></div><div class="sim">仅原型测试：<label><input type="checkbox" id="fail" ${failNext?'checked':''}> 下一次模拟写入失败（全部回滚）</label>　<label><input type="checkbox" id="lose" ${loseNext?'checked':''}> 模拟成功但响应丢失</label></div></section>`}
function exportPreview(){let list=exportList();if(chosen.has('p3')&&ontology==='storage')list.splice(1,0,{kind:'project',name:'示例园区',note:'手动选择；草稿，无发布'});exportSnapshot={time:new Date().toLocaleTimeString('zh-CN'),rows:list};stage='preview';render()}
function validateNames(){let errors=nameErrors();for(const r of rows){const msg=errors.find(e=>e.startsWith(r.key+':'));const input=$(`[data-name="${r.key}"]`);if(input)input.classList.toggle('bad-input',!!msg);const label=$(`[data-error="${r.key}"]`);if(label)label.textContent=msg?msg.split(':')[1]:r.name!==r.newName?'将创建新副本':''}if($('#confirm'))$('#confirm').disabled=!!errors.length||busy||awaiting;return !errors.length}
async function perform(){if(busy||awaiting||!validateNames())return;requestId||='req-'+Math.random().toString(36).slice(2,10);if(receipts.has(requestId)){receipt=receipts.get(requestId);importStage='success';render();return}busy=true;render();await new Promise(r=>setTimeout(r,220));busy=false;if(failNext){failNext=false;render();$('#runMessage').innerHTML='<div class="note err">模拟写入失败：全部回滚，没有创建任何配置。可重试本次导入。</div>';return}repeatCount++;receipt={id:requestId,rows:rows.map((r,i)=>({...r,newId:`demo-${repeatCount}-${r.kind}-${i}`}))};receipt.rows.forEach(r=>existing[r.kind].add(r.newName.trim().toLocaleLowerCase()));receipts.set(requestId,receipt);if(loseNext){loseNext=false;awaiting=true;render();return}importStage='success';render()}
function bind(){if(tab==='export'){if($('#ontology'))$('#ontology').onchange=e=>{ontology=e.target.value;search='';render()};if($('#search'))$('#search').oninput=e=>{search=e.target.value;let pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};document.querySelectorAll('[data-project]').forEach(x=>x.onchange=()=>{x.checked?chosen.add(x.dataset.project):chosen.delete(x.dataset.project);render()});if($('#extra'))$('#extra').onchange=e=>{extra=e.target.checked};if($('#previewExport'))$('#previewExport').onclick=exportPreview;if($('#backExport'))$('#backExport').onclick=()=>{stage='select';render()};if($('#refreshPreview'))$('#refreshPreview').onclick=exportPreview;if($('#download'))$('#download').onclick=()=>modal('配置包下载 · 演示',`<p>正式版会下载 <strong>${ontology==='empty'?'空本体':'储能本体'}_配置包.zip</strong>，包含上述冻结快照及依赖。</p><p>本原型不生成虚假 ZIP，也不读取你的工作台数据。</p><button id="toImport" class="primary">体验导入示例包</button>`);return}
if($('#chooseFile'))$('#chooseFile').onclick=()=>$('#file').click();if($('#file'))$('#file').onchange=e=>{$('#fileHint').textContent=e.target.files?.[0]?`已选择 ${e.target.files[0].name}；原型不读取或校验此文件，请使用示例包。`:'未选择文件'};
for(const [id,k]of [['sample','normal'],['emptySample','empty'],['brokenSample','broken']])if($('#'+id))$('#'+id).onclick=()=>prepare(k);
for(const id of ['changeFile','cancel','newFile'])if($('#'+id))$('#'+id).onclick=()=>{resetImport();render()};
document.querySelectorAll('[data-name]').forEach(x=>x.oninput=()=>{rows.find(r=>r.key===x.dataset.name).newName=x.value;validateNames()});if($('#confirm'))$('#confirm').onclick=perform;if($('#fail'))$('#fail').onchange=e=>failNext=e.target.checked;if($('#lose'))$('#lose').onchange=e=>loseNext=e.target.checked;
if($('#query'))$('#query').onclick=()=>{receipt=receipts.get(requestId);awaiting=false;importStage='success';render()};
if($('#again'))$('#again').onclick=()=>prepare(sampleKind);if($('#receiptAgain'))$('#receiptAgain').onclick=()=>{receipt=receipts.get(requestId);notify('返回同一本次回执，没有再次创建配置')};
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{let r=receipt.rows.find(r=>r.key===b.dataset.open);modal('打开新配置 · 演示',`<p>正式版定位到新${r.type}：<strong>${esc(r.newName)}</strong></p><p>按新ID ${r.newId} 跳转，不通过名称定位已有资产。</p><p>本页未创建真实资产。</p>`)});if($('#followup'))$('#followup').onclick=()=>modal('待补配置 · 演示','<p>创智园一期 / 数据连接 / 业务库密码</p><p>创智园二期 / 数据连接 / 业务库密码</p><p>创智园二期 / 接口凭据 / 调度接口</p><p>设置 / 模型设置 / 通用推理模型 API Key</p><p class="muted">正式版逐项定位；完成补填后再由用户主动测试连接。</p>');}
document.addEventListener('click',e=>{if(e.target.id==='toImport'){closeModal();tab='import';prepare(ontology==='empty'?'empty':'normal')}});
$('#exportTab').onclick=()=>{if(busy)return;tab='export';render()};$('#importTab').onclick=()=>{if(busy)return;tab='import';render()};$('#back').onclick=()=>modal('返回工作区','<p>正式版返回进入设置前的本体或项目页面，保持原选择。此原型仅演示配置迁移。</p>');$('#models').onclick=()=>modal('模型设置','<p>沿用现有设置菜单，不在迁移原型展开。</p>');document.addEventListener('keydown',e=>{if(!$('#modal').innerHTML)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){let a=[...$('#modal').querySelectorAll('button,a,input')],i=a.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&i===a.length-1){e.preventDefault();a[0].focus()}}});render();
</script></body></html>
