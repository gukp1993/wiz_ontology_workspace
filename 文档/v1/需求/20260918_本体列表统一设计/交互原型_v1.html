<body>
<div class="demo"><strong>列表统一设计 · v1</strong><span class="explain">可切换菜单、搜索、排序、翻页和查看详情 · 演示数据</span><div class="switch" aria-label="原型演示状态"><button data-demo="normal" class="active">常规</button><button data-demo="many">大量数据</button><button data-demo="empty">空列表</button><button data-demo="error">加载失败</button></div><button id="specBtn">设计规范</button></div>
<div class="shell"><nav class="nav" aria-label="本体导航"><div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2 22 12 12 22 2 12Z"/><path d="m7 12 5-5 5 5-5 5Z"/></svg>本体工作台</div><div class="workspace-switch">储能本体 <span style="float:right;color:#9ab4cd">⌄</span></div><small>建模</small><button data-nav="objects" class="active">▦　对象建模</button><small>资产</small><button data-nav="shared">▤　共享属性</button><button data-nav="rules">≡　业务规则</button><button data-nav="actions">ϟ　动作定义</button><div class="nav-footer"><span class="avatar">业</span>业务专家</div></nav><main class="area"><header class="top"><div><div class="crumb">储能本体 / 本体建设</div><h1 id="pageTitle">对象建模</h1></div><span class="subtle-label"><span class="dot"></span>设计预览 · 不写入工作台</span></header><div class="content"><div class="panel has-selection" id="panel"></div></div></main></div>
<div id="popover"></div><div id="layer"></div><div id="confirmLayer"></div><div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const searchIcon='<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="m12 12 5 5"/></svg>';
const objects=[{id:'cluster',name:'储能簇',desc:'多个电池模组串联或并联组成的电池单元。',star:true},{id:'device',name:'储能设备',desc:'由电池、变流及管理单元组成，具备充放电能力的设备。',star:false},{id:'system',name:'储能系统',desc:'由一组储能设备组成的业务系统。',star:false},{id:'plan',name:'充放电计划',desc:'描述目标对象在指定时段内的充放电安排。',star:false},{id:'test',name:'测试对象',desc:'用于演示对象定义及引用关系。',star:false}];
const properties=[
{id:'power',name:'额定功率',desc:'设备在规定条件下能够持续运行的额定有功功率。',type:'数值',shared:true,refs:['cluster','device','system']},
{id:'capacity',name:'额定容量',desc:'在规定条件下标定的电池储能容量。',type:'数值',shared:true,refs:['cluster','device','system']},
{id:'title',name:'显示名称',desc:'便于识别对象实例的业务名称。',type:'文本',shared:true,refs:['cluster','device','system']},
{id:'series',name:'采样 SOC',desc:'电池剩余电量百分比随采样时间形成的观测序列。',type:'时间序列',valueType:'数值',shared:true,refs:['cluster','device']},
{id:'soc',name:'实时 SOC',desc:'电池剩余电量百分比，以最新可获得的观测值表示。',type:'数值',shared:true,refs:['cluster','device']},
{id:'code',name:'簇编号',desc:'业务中识别储能簇的编码。',type:'文本',shared:false,refs:['cluster']}];
const links=[{id:'belongs',name:'所属设备',reverse:'包含储能簇',from:'cluster',to:'device',card:'多对一',desc:'储能簇归属于某台储能设备。'},{id:'sys',name:'所属系统',reverse:'包含储能设备',from:'device',to:'system',card:'多对一',desc:'储能设备归属于某个储能系统。'},{id:'target',name:'计划作用于',reverse:'关联计划',from:'plan',to:'device',card:'多对一',desc:'充放电计划指定执行对象。'}];
const actions=[{id:'stop',name:'停止充放电',desc:'请求目标对象停止当前的充电或放电。',effect:'目标充放电功率为 0，以设备反馈确认完成。',refs:['device','cluster']},{id:'rename',name:'修改显示名称',desc:'更新对象实例的业务显示名称。',effect:'对象使用新的名称展示，身份保持不变。',refs:['cluster','device','system']},{id:'move',name:'变更所属设备',desc:'调整储能簇与储能设备之间的归属关系。',effect:'原归属解除，建立新的归属关系。',refs:['cluster']}];
const rules=[{id:'weighted',name:'储能 SOC 计算规则',desc:'依据各储能簇的容量和 SOC 计算设备整体 SOC。',content:'按额定容量加权计算各储能簇的 SOC；参与计算的数据应采用一致的时间口径。',output:'设备整体 SOC 百分比。',refs:['device']},{id:'valid',name:'SOC 数据有效性规则',desc:'规定 SOC 观测值参与业务判断的有效条件。',content:'SOC 的业务范围为 0% 至 100%；缺失或超出范围时标记异常，由项目规则决定后续处理。',output:'有效性判断及异常原因。',refs:['cluster','device']},{id:'limit',name:'充放电功率边界规则',desc:'约束计划功率不超出设备允许范围。',content:'计划功率应在设备当前允许的充电和放电功率范围内。',output:'计划是否满足功率限制。',refs:['device','plan']}];
let state={page:'objects',tab:'props',object:'cluster',objectQ:'',star:false,objSort:1,q:'',filter:'全部',sort:1,pageNo:1,demo:'normal'},selected=null,returnFocus=null,menuOwner=null;
const titles={objects:'对象建模',shared:'共享属性',rules:'业务规则',actions:'动作定义'},tabNames={props:'属性',links:'链接',actions:'动作',rules:'规则'},byObject=id=>objects.find(o=>o.id===id)||{name:id,desc:''};
function kind(){return state.page==='objects'?state.tab:state.page==='shared'?'props':state.page}
function actualRows(k=kind(),page=state.page,obj=state.object){if(k==='props')return properties.filter(p=>page==='shared'?p.shared:p.refs.includes(obj));if(k==='links')return links.filter(x=>x.from===obj||x.to===obj);return (k==='actions'?actions:rules).filter(x=>page==='objects'?x.refs.includes(obj):true)}
function allRows(){let rows=actualRows();if(state.demo==='empty')return [];if(state.demo==='many'&&rows.length)rows=Array.from({length:63},(_,i)=>({...rows[i%rows.length],id:rows[i%rows.length].id+'~'+i,name:rows[i%rows.length].name+(i<rows.length?'':' · 示例 '+(i+1)),base:rows[i%rows.length]}));return rows}
function visibleRows(){return allRows().filter(r=>(r.name+' '+r.desc+' '+(r.reverse||'')+' '+(r.from?byObject(r.from).name+' '+byObject(r.to).name:'')).toLowerCase().includes(state.q.trim().toLowerCase())).filter(r=>state.filter==='全部'||state.filter==='共享'&&r.shared||state.filter==='私有'&&!r.shared||r.type===state.filter||(state.filter==='有引用'&&r.refs?.length)||(state.filter==='无引用'&&!r.refs?.length)).sort((a,b)=>state.sort*a.name.localeCompare(b.name,'zh-CN'))}
function row(id){return allRows().find(r=>r.id===id)}
function objectRows(){let source=objects;if(state.demo==='many')source=Array.from({length:105},(_,i)=>i<objects.length?objects[i]:{id:'demo'+i,name:'示例对象 '+String(i+1).padStart(3,'0'),desc:'大量列表场景',star:false});return source.filter(o=>(o.name+o.desc).includes(state.objectQ)&&(!state.star||o.star)).sort((a,b)=>state.objSort*a.name.localeCompare(b.name,'zh-CN'))}
function resetList(){state.q='';state.filter='全部';state.pageNo=1;selected=null;$('#popover').innerHTML=''}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.page));$('#pageTitle').textContent=titles[state.page];$('#panel').innerHTML=state.page==='objects'?objectLayout():'<div class="library"><div class="list-block" id="listBlock"></div></div>';if(state.page==='objects')renderObjects();renderList()}
function objectLayout(){let o=byObject(state.object);return `<aside class="objects" aria-label="对象类型"><div class="objects-head"><h3>对象类型 <small id="objCount"></small></h3><input id="objectSearch" type="search" aria-label="搜索对象类型" placeholder="搜索对象名称或定义" value="${esc(state.objectQ)}"><div class="obj-filters"><button data-obj-filter="all" class="${!state.star?'active':''}">全部</button><button data-obj-filter="star" class="${state.star?'active':''}">已收藏</button><button class="sort" data-obj-sort>名称 ${state.objSort>0?'↑':'↓'}</button></div></div><div class="obj-items" id="objItems"></div><div class="obj-bottom"><span>独立滚动 · 按名称查找</span><button class="text" data-form="object" data-new="true">＋ 新建</button></div></aside><section class="details"><div class="object-head"><button class="text mobile-back" id="backObjects">← 对象列表</button><div class="object-heading"><h2>${esc(o.name)}</h2><button data-star>${o.star?'★ 已收藏':'☆ 收藏'}</button><button data-form="object">编辑定义</button></div><p class="definition">${esc(o.desc)}</p></div><div class="tabs" role="tablist" aria-label="对象详情">${Object.entries(tabNames).map(([k,n])=>`<button data-tab="${k}" role="tab" aria-selected="${state.tab===k}" class="${state.tab===k?'active':''}">${n}<span>${actualRows(k,'objects').length}</span></button>`).join('')}</div><div class="list-block" id="listBlock"></div></section>`}
function renderObjects(){const rows=objectRows();$('#objCount').textContent=rows.length+' 项';$('#objItems').innerHTML=rows.length?rows.map(o=>`<button class="obj-row ${o.id===state.object?'active':''}" data-object="${o.id}" ${o.id===state.object?'aria-current="true"':''}><span class="obj-text"><b title="${esc(o.name)}">${esc(o.name)}</b><small>${actualRows('props','objects',o.id).length} 属性 · ${actualRows('links','objects',o.id).length} 链接</small></span><span class="arrow">›</span></button>`).join(''):'<div class="empty"><h3>没有匹配对象</h3><button data-clear-objects>清空筛选</button></div>'}
function columns(){let k=kind(),library=state.page!=='objects';if(k==='props')return [['名称','42%'],['数据类型','20%'],[library?'引用情况':'复用方式','20%'],['操作','18%']];if(k==='links')return [['链接名称','29%'],['起点对象','20%'],['终点对象','20%'],['数量关系','15%'],['操作','16%']];if(k==='actions')return [['名称',library?'32%':'43%'],['业务效果',library?'33%':'39%'],...(library?[['关联对象','18%']]:[]),['操作',library?'17%':'18%']];return [['名称',library?'37%':'45%'],['业务定义',library?'29%':'37%'],...(library?[['引用对象','17%']]:[]),['操作',library?'17%':'18%']]}
function renderList(){let k=kind(),library=state.page!=='objects',name=tabNames[k],rows=visibleRows(),pages=Math.max(1,Math.ceil(rows.length/20));state.pageNo=Math.min(state.pageNo,pages);const filters=k==='props'?(library?['全部','文本','数值','是/否','日期','时间序列']:['全部','共享','私有']):library?['全部','有引用','无引用']:[];const desc=library?{shared:'跨对象复用同一份属性定义。',actions:'维护通用动作，执行方式在项目中绑定。',rules:'维护业务规则，由对象引用。'}[state.page]:'';
$('#listBlock').innerHTML=`${library?`<div class="list-heading"><div><h2>${titles[state.page]}库</h2><p>${desc}</p></div><div class="actions">${state.page==='shared'?'<button data-tools>更多操作 ⌄</button>':''}<button class="primary" data-form="${k}">＋ 新建${state.page==='shared'?'共享属性':name}</button></div></div>`:''}<div class="list-tools"><div class="search">${searchIcon}<input id="listSearch" type="search" aria-label="搜索${name}" placeholder="搜索${name}名称或定义" value="${esc(state.q)}"></div>${filters.length?`<details><summary>${state.filter==='全部'?(k==='props'?(library?'数据类型':'复用方式'):'引用情况'):state.filter} ⌄</summary><div class="filter-options">${filters.map(f=>`<button data-filter="${f}">${f}</button>`).join('')}</div></details>`:''}<span class="total">${rows.length} 项</span>${!library?`<div class="actions">${k==='props'?'<button data-picker="props">从属性库添加</button>':''}<button class="primary" ${k==='props'||k==='links'?`data-form="${k}"`:`data-picker="${k}"`}>＋ ${k==='actions'||k==='rules'?'添加':'新建'}${name}</button></div>`:''}</div><div class="table-scroll" id="tableScroll">${state.demo==='error'?`<div class="empty"><div class="empty-icon">!</div><h3>列表暂时无法加载</h3><p>请重试，已有内容不会被清空。</p><button data-retry>重新加载</button></div>`:rows.length?`<table aria-label="${library?titles[state.page]:name}列表"><colgroup>${columns().map(c=>`<col style="width:${c[1]}">`).join('')}</colgroup><thead><tr>${columns().map((c,i)=>`<th ${i===0?`aria-sort="${state.sort>0?'ascending':'descending'}"`:''}>${i===0?`<button data-sort>${c[0]} ${state.sort>0?'↑':'↓'}</button>`:c[0]}</th>`).join('')}</tr></thead><tbody>${rows.slice((state.pageNo-1)*20,state.pageNo*20).map(rowHTML).join('')}</tbody></table>`:`<div class="empty"><div class="empty-icon">≡</div><h3>${state.q||state.filter!=='全部'?'没有匹配的'+name:'尚未'+(library?'创建':'添加')+name}</h3><p>${state.q||state.filter!=='全部'?'调整关键词或筛选条件再试试。':'使用右上角入口'+(k==='actions'||k==='rules'&&!library?'选择已有定义。':'添加第一项。')}</p>${state.q||state.filter!=='全部'?'<button data-clear>清空筛选</button>':''}</div>`}</div><div class="pager"><span>${rows.length?'第 '+((state.pageNo-1)*20+1)+'–'+Math.min(state.pageNo*20,rows.length)+' 项，共 '+rows.length+' 项':'共 0 项'}</span><div class="actions"><span>每页 20 项</span><button data-page="-1" ${state.pageNo===1?'disabled':''} aria-label="上一页">‹</button><span>${state.pageNo} / ${pages}</span><button data-page="1" ${state.pageNo===pages?'disabled':''} aria-label="下一页">›</button></div></div>${!library?`<p class="context-help">${{props:'此处维护业务含义；数据来源在项目映射中配置。',links:'一行是一份链接定义；正反向名称在同一行展示，不重复建两条链接。',actions:'移除关联仅影响当前对象，动作定义仍保留。',rules:'移除引用仅影响当前对象，规则正文在业务规则库中维护。'}[k]}</p>`:''}`;
}
function rowHTML(r){const k=kind(),lib=state.page!=='objects',id=esc(r.id);let cells=`<td><button class="name-link" data-detail="${id}">${esc(r.name)}</button>${k==='rules'?'':`<span class="secondary" title="${esc(k==='links'?'反向：'+r.reverse:r.desc)}">${esc(k==='links'?'反向：'+r.reverse:r.desc)}</span>`}</td>`;if(k==='props')cells+=`<td><span class="type">${r.type}</span>${r.valueType?`<span class="secondary">观测值：${r.valueType}</span>`:''}</td><td>${lib?`<button class="text" data-refs="${id}">${r.refs.length} 处引用</button>`:r.shared?`<button class="badge badge-btn" data-shared="${id}">共享引用 ↗</button>`:'<span class="badge">私有属性</span>'}</td>`;else if(k==='links')cells+=`<td>${byObject(r.from).name}</td><td>${byObject(r.to).name}</td><td>${r.card}</td>`;else{cells+=`<td><span class="clip" title="${esc(k==='actions'?r.effect:r.desc)}">${esc(k==='actions'?r.effect:r.desc)}</span></td>`;if(lib)cells+=`<td><button class="text" data-refs="${id}">${r.refs.length} 个对象</button></td>`}const canEdit=lib||k==='props'||k==='links',hasMore=!(lib&&k==='rules');return `<tr data-id="${id}" class="${selected===r.id?'selected':''}">${cells}<td class="row-ops"><button class="text" ${canEdit?`data-edit="${id}"`:`data-detail="${id}"`}>${canEdit?'编辑':'查看'}</button>${hasMore?`<button class="icon" data-more="${id}" aria-label="更多操作：${esc(r.name)}" aria-haspopup="menu">⋯</button>`:''}</td></tr>`}
function showToast(text){$('#toast').textContent=text;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').textContent='',2800)}
function showDrawer(title,body,footer=''){returnFocus=document.activeElement;$('#popover').innerHTML='';$('#layer').innerHTML=`<div class="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="drawer-head"><div><small>定义详情</small><h2>${esc(title)}</h2></div><button class="icon" data-close aria-label="关闭详情">×</button></div><div class="drawer-body">${body}</div><div class="drawer-footer"><button data-close>关闭</button>${footer}</div></section></div>`;$('#layer [data-close]').focus()}
function field(label,value){return `<div class="field"><label>${label}</label><p>${esc(value||'—')}</p></div>`}
function detail(r){if(!r)return;selected=r.id;renderList();let k=kind();showDrawer(r.name,field('业务定义',r.desc)+(k==='props'?field('数据类型',r.type+(r.valueType?' · 观测值为'+r.valueType:''))+field('复用方式',r.shared?'共享引用':'对象私有'):k==='links'?field('正向关系',byObject(r.from).name+' → '+r.name+' → '+byObject(r.to).name)+field('反向名称',r.reverse)+field('数量关系',r.card):k==='actions'?field('业务效果',r.effect):field('规则内容',r.content)+field('输出结果',r.output)),(state.page!=='objects'||k==='props'||k==='links')?`<button class="primary" data-edit="${esc(r.id)}">编辑定义</button>`:`<button class="primary" data-library="${k}" data-focus="${esc(r.id)}">到${k==='actions'?'动作定义':'业务规则'}维护</button>`)}
function refs(r){selected=r.id;showDrawer(r.name+' · 引用位置',`<p class="muted">点击对象可定位到对应页签。</p><div class="ref-list">${r.refs.length?r.refs.map(id=>`<button class="ref-row" data-go-object="${id}" data-go-tab="${kind()}" data-focus="${esc(r.id)}"><span><strong>${byObject(id).name}</strong><small class="secondary">${r.name}</small></span>→</button>`).join(''):'<p class="muted">暂无引用。</p>'}</div>`)}
function closeDrawer(){const target=returnFocus;$('#layer').innerHTML='';selected=null;renderList();if(target?.isConnected)target.focus();else $('#listSearch')?.focus()}
function formBoundary(k,r){showDrawer(r?'编辑 · '+r.name:'新建'+(k==='object'?'对象':tabNames[k]),`<div class="prototype-note">本原型聚焦列表规范。正式版此入口继续打开现有编辑表单，保留原字段、保存与取消逻辑。</div><div style="margin-top:24px">${field('操作对象',r?.name||(k==='object'?'对象类型':tabNames[k]))}${field('进入方式','从当前列表进入；取消或保存后返回原搜索、筛选和页码。')}</div>`)}
function picker(k){const available=(k==='props'?properties.filter(p=>p.shared):k==='actions'?actions:rules).filter(r=>!r.refs.includes(state.object));showDrawer('添加'+tabNames[k],`<p class="muted">已添加的定义不重复出现。此处演示选择并确认，修改仅保留在本页面。</p>${available.length?available.map(r=>`<label class="ref-row"><input type="checkbox" value="${r.id}" name="pick"><span>${r.name}</span></label>`).join(''):'<div class="empty"><h3>没有可添加的定义</h3><p>可到对应资产库维护。</p></div>'}`,available.length?`<button class="primary" data-pick-confirm="${k}">确认添加</button>`:'')}
function confirmRemoval(r){const k=kind(),lib=state.page!=='objects';let title=lib?'删除定义':k==='props'?(r.shared?'移除共享属性引用':'删除属性'):k==='links'?'删除链接':k==='actions'?'移除动作关联':'移除规则引用';let msg=lib?(k==='props'?`当前有 ${r.refs.length} 处引用。沿用现有规则：删除共享定义时，引用转为完整的私有属性，不丢失定义内容。`:`此动作被 ${r.refs.length} 个对象引用。请先移除关联，才能删除动作定义。`):k==='links'?'删除这份链接定义将影响两端对象；正式版仍执行既有引用检查。':'只影响当前对象；共享库中的原定义及其他对象不受影响。';$('#popover').innerHTML='';$('#confirmLayer').innerHTML=`<div class="modal-wrap"><section class="modal" role="dialog" aria-modal="true" aria-label="${title}"><h2>${title}「${esc(r.name)}」？</h2><p>${msg}</p><div class="actions"><button data-cancel-confirm>取消</button>${lib||k==='links'?'<button data-cancel-confirm class="primary">知道了</button>':`<button class="danger" data-confirm-remove="${esc(r.id)}">确认${k==='props'&&!r.shared?'删除':'移除'}</button>`}</div></section></div>`;$('#confirmLayer button').focus()}
function menu(r,target){menuOwner=target;$('#popover').innerHTML='';let k=kind(),lib=state.page!=='objects';const options=[...(lib&&k==='props'?[['ref','引用到对象'],['copy','复制为私有']]:[]),['remove',lib?'删除定义':k==='links'?'删除链接':k==='props'?(r.shared?'移除引用':'删除属性'):k==='actions'?'移除关联':'移除引用']];const b=target.getBoundingClientRect();$('#popover').innerHTML=`<div class="menu" role="menu" style="left:${Math.max(8,Math.min(innerWidth-194,b.right-185))}px;top:${Math.max(8,Math.min(innerHeight-options.length*35-20,b.bottom+4))}px">${options.map(([op,label])=>`<button role="menuitem" class="${op==='remove'?'danger':''}" data-menu-action="${op}" data-for="${esc(r.id)}">${label}</button>`).join('')}</div>`;$('#popover button')?.focus()}
function specs(){showDrawer('列表设计规范',field('两种容器','对象选择：紧凑导航列表。\n所有业务清单：标准数据表格。')+field('统一尺寸','导航行 58px；表头 40px；表格行最小 64px。\n正文 13–14px；辅助说明 12px；按钮高度 34px。')+field('颜色职责','蓝色用于当前选中和可执行入口。\n类型、复用方式用中性标签。\n红色仅出现在危险操作与真实错误。')+field('统一行为','名称打开只读详情；编辑进入原有表单。\n危险和低频操作收进“⋯”。\n每页 20 项，搜索覆盖全部记录。')+field('不改业务语义','共享引用、私有副本、移除关联、删除定义继续区分。\n业务规则库不新增删除功能。')+field('边界','表单布局及画布不在本次改造范围。\n原型数据可局部模拟关联；刷新恢复。'))}
document.addEventListener('input',e=>{if(e.target.id==='objectSearch'){state.objectQ=e.target.value;renderObjects()}if(e.target.id==='listSearch'){const pos=e.target.selectionStart;state.q=e.target.value;state.pageNo=1;renderList();$('#listSearch').focus();try{$('#listSearch').setSelectionRange(pos,pos)}catch{}}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(e.target.classList.contains('overlay'))closeDrawer();if(!e.target.closest('.menu'))$('#popover').innerHTML='';return}const d=b.dataset;
if(d.nav){state.page=d.nav;resetList();render()}
else if(d.tab){state.tab=d.tab;resetList();render()}
else if(d.object){state.object=d.object;resetList();render();$('#panel').classList.add('has-selection')}
else if(d.objFilter){state.star=d.objFilter==='star';render()}
else if('objSort'in d){state.objSort*=-1;render()}
else if('clearObjects'in d){state.objectQ='';state.star=false;render()}
else if('star'in d){let o=objects.find(x=>x.id===state.object);if(o)o.star=!o.star;render()}
else if(d.demo){state.demo=d.demo;resetList();document.querySelectorAll('[data-demo]').forEach(x=>x.classList.toggle('active',x===b));render()}
else if(d.filter){state.filter=d.filter;state.pageNo=1;renderList()}
else if('clear'in d){resetList();renderList()}
else if('sort'in d){state.sort*=-1;renderList()}
else if(d.page){state.pageNo+=Number(d.page);renderList()}
else if(d.detail)detail(row(d.detail));else if(d.refs)refs(row(d.refs));
else if(d.shared){let r=row(d.shared);showDrawer('共享定义 · '+r.name,field('业务定义',r.desc)+field('使用方式','对象引用此定义，名称与类型由共享库统一维护。'),`<button class="primary" data-library="shared" data-focus="${esc(r.id)}">到共享属性库维护</button>`)}
else if(d.more)menu(row(d.more),b);
else if(d.menuAction){let r=row(d.for);if(d.menuAction==='remove')confirmRemoval(r);else showDrawer(d.menuAction==='copy'?'复制为私有':'引用到对象',field('共享属性',r.name)+field('操作说明',d.menuAction==='copy'?'为目标对象创建独立副本，后续修改互不影响。正式版复用现有选择与保存流程。':'对象引用同一个共享定义，修改定义会影响所有引用。正式版复用现有选择与保存流程。'))}
else if(d.edit)formBoundary(kind(),row(d.edit));else if(d.form)formBoundary(d.form,d.form==='object'&&!d.new?byObject(state.object):null);
else if(d.picker)picker(d.picker);else if(d.pickConfirm){const pool=d.pickConfirm==='props'?properties:d.pickConfirm==='actions'?actions:rules;document.querySelectorAll('input[name=pick]:checked').forEach(x=>pool.find(r=>r.id===x.value).refs.push(state.object));closeDrawer();render();showToast('已添加到当前对象（仅原型演示）')}
else if('close'in d)closeDrawer();else if('cancelConfirm'in d){$('#confirmLayer').innerHTML='';$('#listSearch')?.focus()}
else if(d.confirmRemove){let r=row(d.confirmRemove);r=r.base||r;r.refs=r.refs.filter(id=>id!==state.object);$('#confirmLayer').innerHTML='';render();showToast('已移除；其他对象和原定义保留（仅原型演示）')}
else if(d.library){$('#layer').innerHTML='';state.page=d.library;state.q='';state.filter='全部';state.pageNo=1;selected=d.focus.split('~')[0];render();const r=row(selected);if(r)detail(r)}
else if(d.goObject){const focus=d.focus.split('~')[0];$('#layer').innerHTML='';state.page='objects';state.object=d.goObject;state.tab=d.goTab;resetList();selected=focus;render();$('#panel').classList.add('has-selection');document.querySelector('tr.selected')?.scrollIntoView?.({block:'nearest'})}
else if('retry'in d){state.demo='normal';document.querySelectorAll('[data-demo]').forEach(x=>x.classList.toggle('active',x.dataset.demo==='normal'));render()}
else if('tools'in d)showDrawer('更多操作',field('保留现有能力','粘贴多行属性、批量复用对象属性继续沿用现有流程。本次只将入口集中在列表工具栏，不新增导入协议。'));
else if(b.id==='specBtn')specs();else if(b.id==='backObjects')$('#panel').classList.remove('has-selection');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#confirmLayer').innerHTML){$('#confirmLayer').innerHTML='';$('#listSearch')?.focus()}else if($('#popover').innerHTML){$('#popover').innerHTML='';menuOwner?.focus()}else if($('#layer').innerHTML)closeDrawer();return}const dialog=$('#confirmLayer [role=dialog]')||$('#layer [role=dialog]');if(e.key==='Tab'&&dialog){const a=[...dialog.querySelectorAll('button:not([disabled]),input,a[href]')];if(a.length&&(e.shiftKey&&document.activeElement===a[0]||!e.shiftKey&&document.activeElement===a.at(-1))){e.preventDefault();(e.shiftKey?a.at(-1):a[0]).focus()}}const menuEl=$('#popover [role=menu]');if(menuEl&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const a=[...menuEl.querySelectorAll('button')],i=a.indexOf(document.activeElement);a[e.key==='Home'?0:e.key==='End'?a.length-1:(i+(e.key==='ArrowDown'?1:a.length-1))%a.length]?.focus()}});
render();
</script></body></html>
