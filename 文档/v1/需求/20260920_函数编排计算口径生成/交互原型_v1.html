n:0}h2{font-size:17px;margin:0 0 8px}h3{font-size:14px;margin:18px 0 8px}p{margin:8px 0}.muted{color:var(--muted);font-size:12px}.pill{border-radius:20px;padding:3px 10px;font-size:12px;background:#eef8f2;color:#257653}.pill.warn{background:#fff4db;color:#8a641a}.pill.bad{background:#fff0f0;color:#a72c2c}.notice{background:#edf3ff;border:1px solid #cbdcff;border-radius:6px;padding:11px 14px;color:#34577f}.notice.warn{background:#fff9e9;border-color:#ebd396;color:#806016}.notice.bad{background:#fff2f2;border-color:#efbaba;color:#a42c2c}.card{background:white;border:1px solid var(--line);border-radius:9px;padding:22px}.canvas{flex:1;min-height:270px;background:radial-gradient(#d9e2ec 1px,transparent 1px);background-size:20px 20px;display:flex;align-items:center;justify-content:center;gap:14px;overflow:auto}.node{width:200px;min-width:180px;background:white;border:1px solid #cbd6e2;border-radius:9px;padding:15px;box-shadow:0 2px 7px #20334c09}.node strong{display:block;margin:7px 0}.arrow{color:#8394a6}.results{flex:1;min-height:0;display:flex;flex-direction:column;padding:0;overflow:hidden}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);padding:0 20px;flex-shrink:0}.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;padding:13px 15px}.tabs button.on{border-bottom-color:var(--blue);color:var(--blue)}.body{overflow:auto;flex:1;padding:24px 28px}.toolbar{padding:10px 18px;border-bottom:1px solid var(--line);background:#fafbfd}.body article{max-width:960px;margin:auto}.foot{padding:10px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f5f7fa;font-weight:500;color:#607387}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fa;border:1px solid var(--line);border-radius:6px;padding:15px;font:12px/1.7 ui-monospace,SFMono-Regular,monospace}details{margin:12px 0;border:1px solid var(--line);border-radius:7px;padding:12px 15px}summary{cursor:pointer;font-weight:600}.empty{margin:auto;max-width:600px;text-align:center;padding:30px}.link{border:0;background:none;color:var(--blue);padding:0}.issue{margin:8px 0}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#243b51;color:white;padding:10px 20px;border-radius:8px;z-index:5}dialog{border:1px solid var(--line);border-radius:10px;max-width:560px;width:90%;padding:24px}dialog::backdrop{background:#152b4555}textarea{width:100%;min-height:150px;border:1px solid #b8c8d8;padding:10px;border-radius:6px}.hidden{display:none!important}@media(max-width:1050px){aside{width:170px}main{margin-left:170px}.page{padding:16px}.node{min-width:155px;width:155px}.canvas{gap:8px}.body{padding:16px}}@media(max-width:760px){aside{display:none}main{margin:0}.canvas{justify-content:flex-start}.top{padding:12px}.proto{padding:8px 12px}.body{padding:12px}}
</style></head><body><aside><h2>◇ 本体工作台</h2><small>ONTOLOGY WORKSPACE</small><div class="space"><span>本体</span><b>项目</b></div><div class="muted">当前项目</div><div class="card" style="padding:9px;margin:8px 0 16px">创智园二期 ▾</div><nav><div>项目概览</div><div>数据连接</div><div>对象映射</div><div class="active">函数编排</div><div>项目校验与发布</div></nav><div class="user">◉ 演示用户　 ⚙</div></aside><main><header class="top"><span>项目 / 函数编排</span><span class="muted">交互原型 · 不连接工作台</span></header><div class="proto"><b>已暂缓 · 方案 v1</b><span>生成说明与结构化规则，保留节点原实现；不生成完整 Python 脚本。</span><label>演示场景 <select id="scenario"><option value="complete">完整口径（含 LLM 求值节点）</option><option value="missing">缺少业务说明</option><option value="broken">步骤引用失效</option><option value="sensitive">节点存在敏感内容</option><option value="saveFail">保存失败</option></select></label></div><section class="page" id="page"></section></main><div id="toast" class="toast hidden" role="status" aria-live="polite"></div><dialog id="edit"><h2>补充编排说明</h2><p class="muted">原型仅修改内存示例；正式版回到现有编排说明字段。</p><textarea id="description" aria-label="编排说明"></textarea><div class="row" style="justify-content:flex-end;margin-top:16px"><button id="cancelEdit">取消</button><button class="primary" id="saveEdit">保存示例</button></div></dialog><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={page:'editor',tab:'summary',scenario:'complete',revision:1,artifact:null,busy:false,issue:'',description:'设备 SOC 表示剩余电量百分比。按所属有效储能簇容量加权：Σ(簇 SOC × 容量) / Σ(簇容量)。本示例 SOC 为 0～100，容量均为 kWh；缺少数据或总容量为零时报错。',project:false};
const steps=[{id:'query_clusters',name:'查询所属储能簇',kind:'sql',description:'查询当前设备下有效储能簇及容量',dependsOn:[],inputs:[{id:'node-storage-id',name:'storage_id',binding:{from:'flowInput',inputId:'storage_id'}}],outputs:[{id:'clusters',type:{type:'list',elementType:{type:'object',fields:[{id:'id',type:'number'},{id:'capacity',type:'number'}]}}}],implementation:{resource:'device_db',dialect:'mysql',template:'SELECT id, capacity FROM m_storage_cluster_phase\nWHERE storage_id = :storage_id AND del_flag = 0',resultMode:'rows'}},{id:'read_soc',name:'逐簇读取 SOC',kind:'redis',description:'按前序簇列表逐行读取，保留簇ID与容量',dependsOn:['query_clusters'],inputs:[{id:'cluster_rows',binding:{from:'nodeOutput',nodeId:'query_clusters',outputId:'clusters'}}],outputs:[{id:'soc_rows',type:{type:'list',elementType:{type:'object',fields:[{id:'id',type:'number'},{id:'capacity',type:'number'},{id:'soc',type:'text'}]}}}],implementation:{resource:'realtime_redis',command:'GET',rowMode:true,keyTemplate:'m_storage_cluster_phase-{id}-soc',rowFields:['id','capacity'],nullBehavior:'由下游代码检查'}},{id:'calculate',name:'计算设备 SOC',kind:'python',description:'检查数据后按容量加权。本节点在当前工作台由 LLM 求值。',dependsOn:['read_soc'],inputs:[{id:'rows',binding:{from:'nodeOutput',nodeId:'read_soc',outputId:'soc_rows'}}],outputs:[{id:'soc',type:{type:'number'}}],implementation:{language:'python',executionMode:'llmEvaluation',code:'def main(inputs):\n    rows = inputs["rows"]\n    if not rows:\n        raise ValueError("没有储能簇")\n    weighted, total = 0.0, 0.0\n    for row in rows:\n        if row["soc"] is None or row["capacity"] is None:\n            raise ValueError("缺少 SOC 或容量")\n        soc, capacity = float(row["soc"]), float(row["capacity"])\n        if not 0 <= soc <= 100 or not 0 < capacity < float("inf"):\n            raise ValueError("SOC 或容量无效")\n        weighted += soc * capacity\n        total += capacity\n    return {"soc": weighted / total}'}}];
function artifact(){return{format:'flow-calculation-rule',schemaVersion:1,rule:{id:'demo-device-soc',name:'储能设备 SOC 计算',description:state.description,sourceRevision:'demo-r'+state.revision},context:state.project?{projectId:'demo-project',projectRevision:'demo-project-r1',ontologyVersion:'3.0.0'}:null,inputs:[{id:'storage_id',name:'storage_id',label:'储能设备ID',type:{type:'number'},description:'储能设备实例ID，不是设备名称'}],outputs:[{id:'soc',name:'soc',type:{type:'number'},description:'当前示例为0～100的SOC百分比；口径以编排说明为准'}],resources:[{id:'device_db',kind:'sql',dialect:'mysql',purpose:'查询储能簇及容量'},{id:'realtime_redis',kind:'redis',purpose:'读取实时SOC'}],steps:structuredClone(steps),outputBindings:[{outputId:'soc',from:{nodeId:'calculate',outputId:'soc'}}],execution:{mode:'definitionOnly',standaloneScriptAvailable:false,requiredCapabilities:['sql.query','redis.read','llm.evaluate'],effects:'unknown'},checks:{status:state.description?'generated':'generatedWithWarnings',warnings:state.description?[]:[{code:'DESCRIPTION_MISSING',field:'rule.description',message:'未声明业务口径，请补充说明；本原型不自动推断公式口径。'}],runtimeValidation:'notPerformed'},provenance:{generatorVersion:'prototype-v1',generatedAt:new Date().toISOString(),sourceDigest:'demo-only-not-a-real-hash',contentDigest:'demo-only-not-a-real-hash'}}}
function markdown(a){return '# '+a.rule.name+'\n\n> 来源 '+a.rule.sourceRevision+'；原型示例，未执行验证。不含完整可执行脚本。\n\n## 业务说明\n'+(a.rule.description||'未声明业务口径，待补充。')+'\n\n## 输入\n'+a.inputs.map(i=>'- '+i.name+'：'+i.description).join('\n')+'\n\n## 逻辑数据来源\n'+a.resources.map(r=>'- '+r.id+'：'+r.purpose).join('\n')+'\n\n## 处理步骤\n'+a.steps.map((s,i)=>'### '+(i+1)+'. '+s.name+'\n'+s.description+'\n\n依赖：'+(s.dependsOn.join(', ')||'编排输入')+'\n\n```json\n'+JSON.stringify(s,null,2)+'\n```').join('\n\n')+'\n\n## 输出\n'+a.outputs.map(o=>'- '+o.name+'：'+o.description).join('\n')+'\n\n## 最终绑定\n```json\n'+JSON.stringify(a.outputBindings,null,2)+'\n```\n\n## 完整性\n'+(a.checks.warnings.map(w=>'- '+w.message).join('\n')||'未发现本示例结构问题。')+'\n\n## 执行声明\nPython节点保留原代码，但当前语义为LLM求值。生成不代表执行，不带连接或凭据。\n'}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3200)}
function openEdit(){ $('description').value=state.description;$('edit').showModal() }
function downloads(text,name,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已发起下载：'+name)}
function resultText(){const a=state.artifact;return state.tab==='summary'?markdown(a):JSON.stringify(state.tab==='steps'?a.steps:a,null,2)}
async function copy(){try{await navigator.clipboard.writeText(resultText());toast('已复制'+({summary:'口径说明',steps:'步骤JSON',json:'规范JSON'}[state.tab]))}catch{toast('浏览器未允许复制，请选择正文后手动复制')}}
function generate(){state.page='result';state.busy=true;state.issue='';render();setTimeout(()=>{state.busy=false;if(state.scenario==='saveFail')state.issue='编排保存失败：本次未生成。请返回设计重试保存。';else if(state.scenario==='broken')state.issue='步骤「计算设备 SOC」引用了不存在的输出 soc_rows_old。请修复输入绑定。';else if(state.scenario==='sensitive')state.issue='步骤「查询所属储能簇」检测到疑似硬编码连接凭据。本次阻止导出，未展示敏感原文。';else state.artifact=artifact();render()},450)}
function render(){if(state.page==='editor'){$('page').innerHTML=`<div class="row spread"><div><h1>储能设备 SOC 计算</h1><span class="muted">3 个处理节点 · 示例修订 demo-r${state.revision}</span></div><div class="row"><button id="check">检查配置</button><button id="generate">生成计算口径</button><button class="primary" id="test">测试调试</button></div></div><div class="card"><label class="muted"><input id="projectContext" type="checkbox" ${state.project?'checked':''}> 包含当前项目适用信息（演示）</label><div class="row spread"><strong>编排说明</strong><button class="link" id="editDesc">编辑</button></div><p>${esc(state.description||'未填写说明')}</p></div><div class="canvas card">${steps.map((s,i)=>`${i?'<span class="arrow">→</span>':''}<div class="node"><span class="muted">${s.kind==='python'?'Python · LLM 求值':s.kind.toUpperCase()}</span><strong>${esc(s.name)}</strong><span class="muted">${esc(s.description)}</span></div>`).join('')}</div><p class="muted">本原型只演示生成流程；画布、检查与测试为背景展示。生成不会连接数据库、Redis 或模型。</p>`;$('projectContext').onchange=e=>{state.project=e.target.checked;state.artifact=null};$('generate').onclick=generate;$('editDesc').onclick=openEdit;$('check').onclick=()=>toast('背景演示：本页只验证计算口径生成交互');$('test').onclick=()=>toast('原型不会执行编排');return}
const a=state.artifact,old=a&&a.rule.sourceRevision!=='demo-r'+state.revision;
$('page').innerHTML=`<div class="row spread"><div><button class="link" id="back">← 返回编排</button><h1>计算口径 · 储能设备 SOC</h1></div><div class="row"><span class="pill ${state.issue?'bad':old||a?.checks.warnings.length?'warn':''}">${state.busy?'生成中':state.issue?'生成阻断':old?'原配置已变化':a?.checks.warnings.length?'已生成 · 待补充':'已生成'}</span><button id="mutate">模拟原配置变化</button><button class="primary" id="regenerate" ${state.busy?'disabled':''}>重新生成</button></div></div><div class="notice">此内容用于解释计算口径，未查询数据、未执行编排；本期不生成完整可执行脚本。</div>${old?'<div class="notice warn">当前展示旧修订 '+esc(a.rule.sourceRevision)+'，源编排已变化。下载仍为本页旧快照，请按需重新生成。</div>':''}${state.issue?'<div class="notice bad">'+esc(state.issue)+' <button class="link" id="fix">去处理 →</button></div>':''}${a?.checks.warnings.length&&!state.issue?'<div class="notice warn">业务说明未填写，已保留待补充标记。 <button class="link" id="supplement">去补充 →</button></div>':''}<div class="card results"><div class="tabs" role="tablist">${[['summary','口径说明'],['steps','处理步骤'],['json','规范内容']].map(([id,label])=>`<button role="tab" aria-selected="${state.tab===id}" data-tab="${id}" class="${state.tab===id?'on':''}">${label}</button>`).join('')}</div><div class="row spread toolbar"><span class="muted">${a?'来源 '+esc(a.rule.sourceRevision)+' · '+esc(a.provenance.generatedAt):'读取已保存的编排后生成'}${state.issue&&a?' · 上次结果保留，非本次成功':''}</span><div class="row"><button id="copy" ${!a||state.busy||state.issue?'disabled':''}>复制</button><button id="md" ${!a||state.busy||state.issue?'disabled':''}>下载说明 .md</button><button id="json" ${!a||state.busy||state.issue?'disabled':''}>下载规范 .json</button></div></div><div class="body" id="body"></div><div class="foot">口径格式 flow-calculation-rule v1 · 无独立 Python 脚本 · 说明与结构化内容来自同一快照</div></div>`;
$('back').onclick=()=>{state.page='editor';render()};$('regenerate').onclick=generate;$('mutate').onclick=()=>{state.revision++;render()};if($('fix'))$('fix').onclick=()=>{state.page='editor';render();toast('正式版定位到具体问题节点；原型可在顶部切换演示场景')};if($('supplement'))$('supplement').onclick=openEdit;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});$('copy').onclick=copy;$('md').onclick=()=>downloads(markdown(a),'储能设备SOC_'+a.rule.sourceRevision+'.md','text/markdown;charset=utf-8');$('json').onclick=()=>downloads(JSON.stringify(a,null,2),'储能设备SOC_'+a.rule.sourceRevision+'.json','application/json');
if(state.busy){$('body').innerHTML='<div class="empty"><h2>正在生成计算口径…</h2><p>演示：保存当前编排 → 校验依赖 → 转换规范 → 整理说明</p></div>';return}if(state.issue){$('body').innerHTML='<div class="empty"><h2>本次未生成可导出内容</h2><p>请处理上方问题后重新生成。</p></div>';return}if(!a)return;
if(state.tab==='json'){$('body').innerHTML='<pre>'+esc(JSON.stringify(a,null,2))+'</pre>';return}if(state.tab==='steps'){$('body').innerHTML='<article><p class="muted">实现原文完整保留。Python 节点当前为 LLM 求值，不等于完整可执行 Python 脚本。</p>'+a.steps.map((s,i)=>'<details open><summary>'+ (i+1)+'. '+esc(s.name)+' · '+esc(s.kind)+'</summary><p>'+esc(s.description)+'</p><p class="muted">依赖：'+esc(s.dependsOn.join(' → ')||'编排输入')+'</p><pre>'+esc(JSON.stringify(s,null,2))+'</pre></details>').join('')+'</article>';return}
$('body').innerHTML='<article><h2>'+esc(a.rule.name)+'</h2><p class="muted">'+(a.context?'当前项目适用信息已包含':'通用计算口径 · 未指定项目或对象绑定')+'</p><h3>业务含义与计算口径</h3><p>'+esc(a.rule.description||'未声明，请回到编排补充说明。')+'</p><h3>输入参数</h3><table><thead><tr><th>参数</th><th>类型</th><th>含义</th></tr></thead><tbody><tr><td>storage_id</td><td>数值</td><td>储能设备实例ID，不是设备名称</td></tr></tbody></table><h3>数据来源</h3><p>device_db：设备业务库（MySQL）；realtime_redis：实时 Redis。仅逻辑引用，无连接信息。</p><h3>处理步骤</h3>'+a.steps.map((s,i)=>'<p><b>'+ (i+1)+'. '+esc(s.name)+'</b><br>'+esc(s.description)+'</p>').join('')+'<h3>输出</h3><p>soc · 数值；'+esc(a.outputs[0].description)+'</p><h3>限制与验证</h3><p>异常处理按原说明与代码保留，未独立推断。第三步为 LLM 求值，需要消费方支持；本产物未执行验证。</p><details><summary>查看最终输出绑定</summary><pre>'+esc(JSON.stringify(a.outputBindings,null,2))+'</pre></details><details><summary>查看包含的完整节点实现</summary>'+a.steps.map(s=>'<h3>'+esc(s.name)+'</h3><pre>'+esc(JSON.stringify(s.implementation,null,2))+'</pre>').join('')+'</details></article>';
}
$('scenario').onchange=e=>{state.scenario=e.target.value;state.revision++;state.description=state.scenario==='missing'?'':'设备 SOC 表示剩余电量百分比。按所属有效储能簇容量加权：Σ(簇 SOC × 容量) / Σ(簇容量)。本示例 SOC 为 0～100，容量均为 kWh；缺少数据或总容量为零时报错。';state.issue='';if(state.page==='result')generate();else render()};$('cancelEdit').onclick=()=>$('edit').close();$('saveEdit').onclick=()=>{state.description=$('description').value.trim();state.revision++;if(state.scenario==='missing')state.scenario='complete';$('scenario').value=state.scenario;$('edit').close();render();toast('已更新内存示例；请重新生成口径')};render();
</script></body></html>
