<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let page='list',editing=null,draft=null,dirty=false,tab='props',menu='',modalKind='',checkCase='normal',focusBefore=null,pending=null,nlOpen=true;const clone=x=>JSON.parse(JSON.stringify(x));

function strictSummary(p){return p.method==='redis'?'Redis · '+(p.key||'未填写 Key'):p.method==='flow'?'编排 · '+(p.flow||'未选择'):p.method==='object'?p.table+' · '+p.pk:p.table+'.'+(p.field||'待选字段')}
function select(key,label,value,options){return `<div class="field"><label>${label}</label><div class="select"><button data-select="${key}" aria-haspopup="listbox" aria-expanded="false"><span>${esc(value||'请选择')}</span><span>⌄</span></button><div class="choices" id="choices-${key}" role="listbox" hidden>${options.map(x=>`<button role="option" aria-selected="${value===x}" class="${value===x?'chosen':''}" data-option="${key}" data-value="${esc(x)}">${esc(x)}</button>`).join('')}</div></div></div>`}
function strictFields(){let p=draft;if(!p.strict)return `<div class="emptyconfig"><p class="sub">可直接在下方描述取值规则，也可以补充确定的字段或编排。</p><button id="addStrict">＋ 添加结构化配置</button></div>`;let m=p.method;let html='<div class="card-content"><p class="sub">已明确的连接、字段和流程作为确定依据；自然语言补充剩余处理。</p><div class="formgrid">';if(editing!=='object')html+=select('method','取值方式',{'field':'数据库字段','redis':'Redis 读取','flow':'函数编排'}[m],editing==='sample'?['函数编排']:['数据库字段','Redis 读取','函数编排']);if(m==='flow'){html+=select('flow','函数编排',p.flow||(editing==='sample'?'查询采样 SOC 序列':'读取储能簇实时 SOC'),[editing==='sample'?'查询采样 SOC 序列':'读取储能簇实时 SOC'])+select('output','使用输出',p.output||(editing==='sample'?'series · 时间序列':'soc · 数值'),[editing==='sample'?'series · 时间序列':'soc · 数值']);html+='</div><p class="sub" style="margin-top:12px">实例编号输入 ← 当前实例 ID。'+(editing==='sample'?'时间范围输入 ← 本次查询时间范围；输出为时间与数值组成的序列。':'输出为数值。')+'</p>'}else{html+=select('connection','数据连接',p.connection,m==='redis'?[redis]:[db]);if(m==='redis')html+=`<div class="field"><label>Key 模板</label><input class="code" data-input="key" value="${esc(p.key||'')}" placeholder="例如 m_storage_cluster_phase-{id}-soc"></div>`;else{html+=select('table','表 / 视图',p.table,['m_storage_cluster_phase','m_storage_cluster_extra']);html+=select(editing==='object'?'pk':'field',editing==='object'?'实例主键':'取值字段',editing==='object'?p.pk:p.field,p.table==='m_storage_cluster_phase'?['id','name','rated_power','capacity','del_flag']:['cluster_id','rated_voltage','remark']);}html+='</div><p class="sub" style="margin-top:12px">'+(m==='redis'?'模板参数 {id} ← 当前实例 ID。':editing==='object'?'一条有效记录对应一个实例。跨表补充信息不改变实例身份。':'定位当前实例：来源表 id = 当前实例 ID（示例）。')+'</p>'}return html+'</div>'}
function editor(){let p=draft,obj=editing==='object';return `<div class="body"><button class="text back" id="back">← 返回${obj?'实例识别':'属性清单'}</button><div class="edithead"><div><h2>${obj?'配置对象来源':'配置 · '+p.name}</h2><p>${p.desc}</p></div><div id="modeBadge">${badge(p)}</div></div><div class="context"><span>当前对象 <strong>储能簇</strong></span><span>预期输出 <strong>${p.type}</strong></span><span>${obj?'身份信息由当前配置定义':'当前实例由对象来源识别，无需重复定义输入参数'}</span></div><details id="naturalPanel" class="card nl" ${nlOpen?'open':''}><summary class="card-head"><span class="number">01</span><h3>自然语言${obj?'来源':'取值'}说明</h3><span class="hint">普通模式</span><span class="fold right"><span class="fold-open">收起 ▴</span><span class="fold-closed">展开 ▾</span></span></summary><div class="card-content"><p class="sub">${obj?'描述哪些数据表示这个对象、如何识别实例，以及多张表之间的关系。':'可以描述完整取值流程，也可以补充下方配置之后的处理规则。不必新建规则或拆分节点。'}</p><div class="connection-line"><span class="muted">${p.strict?'已配置连接：'+esc(p.connection)+' · ':''}说明可使用：</span>${p.connections.length?p.connections.map(c=>`<span class="pill">${esc(c)}</span>`).join(''):'<span class="hint">'+(p.strict?'沿用结构化连接':'尚未选择数据连接')+'</span>'}<button id="connections">${p.connections.length?'管理连接':'＋ 添加连接'}</button></div><div class="context-tools"><span>插入上下文</span>${(obj?['当前对象']:['当前实例 ID','结构化配置结果',...(editing==='sample'?['本次查询时间范围']:[])]).map(t=>`<button data-insert="${t}" ${t==='结构化配置结果'&&!p.strict?'disabled':''}>${t}</button>`).join('')}</div><div class="textarea-wrap"><textarea id="description" aria-label="自然语言说明" placeholder="例如：额定功率读取当前储能簇记录的 rated_power 字段。复杂流程可以按第一步、第二步描述。">${esc(p.nl)}</textarea><div class="textfoot"><span>保留原文交给大模型理解，不强制转换成编排</span><span id="charCount">${p.nl.length} 字</span></div></div><details class="example"><summary>填写提示与示例</summary><p>${obj?'例如：储能簇来自 m_storage_cluster_phase，每条记录表示一个储能簇，id 唯一标识实例。仅取 del_flag = 0 的记录。':'说明从哪里取、如何关联当前实例、如何处理、最终返回什么。表名和字段名请写准确；信息不足时应提示缺失，不应猜测。'}</p></details></div></details><section class="card"><div class="card-head"><span class="number">02</span><h3>结构化配置</h3><span class="hint">严格模式</span>${p.strict?'<button class="text danger right" id="removeStrict">移除配置</button>':''}</div>${strictFields()}</section><div class="route" id="route">${route()}</div><div class="savebar"><button class="primary" id="save">保存配置</button><button id="cancel">取消</button><span class="spacer"></span><button id="review">查看理解示例</button><small>仅保存在本页 · 不执行查询或计算</small></div></div>`}
function route(){const p=draft;return `<div class="route-title">取值依据 · 根据当前填写内容展示</div><div class="route-line"><span>当前${editing==='object'?'对象':'实例'}</span><i>→</i>${p.strict?'<span>按结构化配置取值</span><i>→</i>':''}${p.nl.trim()?'<span>按自然语言说明'+(p.strict?'补充处理':'组织取值')+'</span><i>→</i>':''}<span>${p.strict||p.nl.trim()?'返回'+p.type:'尚未配置取值依据'}</span></div><p>结构化约定不能被描述静默覆盖；发现冲突或缺失时，先说明问题。此处仅展示流程，不代表已执行。</p>`}
function openEditor(id){editing=id;draft=clone(saved[id]);dirty=false;nlOpen=true;page='edit';render()}
function closeEditor(){page='list';editing=null;draft=null;dirty=false;render()}
function askLeave(fn){if(!dirty){fn();return}pending=fn;showModal('放弃本次修改？','<p class="muted">尚未保存的修改将丢弃，原配置保持不变。</p>','<button data-close>继续编辑</button><button class="danger" id="discard">放弃修改</button>')}
function showModal(title,body,foot='<button data-close>关闭</button>'){focusBefore=document.activeElement;$('#modal').innerHTML=`<div class="modalbg"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><h2>${title}</h2><button data-close aria-label="关闭">×</button></div><div class="modalbody">${body}</div><div class="modalfoot">${foot}</div></section></div>`;$('#modal [data-close]')?.focus()}
function closeModal(){const f=focusBefore;$('#modal').innerHTML='';modalKind='';if(f?.isConnected)f.focus()}
function review(which='normal'){checkCase=which;modalKind='review';let body=`<div class="callout">预设理解示例，不是大模型对当前文本的实际检查。你修改的描述不会被发送给任何服务。</div><div class="segments">${[['normal','组合使用'],['conflict','配置冲突'],['missing','信息不全']].map(([v,l])=>`<button data-case="${v}" class="${which===v?'active':''}">${l}</button>`).join('')}</div>`;if(which==='normal')body+=`<div class="section"><b>示例：实时 SOC</b><p>① 按已配置的 Redis 连接与 Key 读取当前实例的值。<br>② 按自然语言说明检查是否缺失、是否超出 0–100。<br>③ 返回数值或异常原因，不以历史采样替代实时值。</p></div><div class="section"><b>仍需在真实执行时确认</b><p>连接是否可用、返回值是否匹配数据类型，以及实际数据质量。保存说明并不代表验证通过。</p></div>`;if(which==='conflict')body+=`<div class="callout bad"><b>取值来源不一致</b><br>结构化配置指定 Redis 实时值；说明却要求忽略 Redis，返回历史采样表最新一条。</div><div class="section"><p>请修改说明，或明确修改结构化配置。系统不能自行选择其中一套来源。该冲突未解决前不能标为可执行。</p></div>`;if(which==='missing')body+=`<div class="callout warn"><b>无法确定采样记录属于哪个储能簇</b><br>说明只写了“查询采样表里的 SOC”，未提供记录与当前实例的关联方式。</div><div class="section"><p>请补充定位条件，例如：s_attr_scada.model_id = 当前实例 ID。时序取值还应说明时间字段、值字段与查询时间范围。</p></div>`;showModal('系统如何使用这些配置',body,'<button class="primary" data-close>返回编辑</button>')}
function optionsClose(){document.querySelectorAll('.choices').forEach(n=>n.hidden=true);document.querySelectorAll('[data-select]').forEach(n=>n.setAttribute('aria-expanded','false'));menu=''}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(!e.target.closest('.select'))optionsClose();return}const d=b.dataset;if(d.edit)openEditor(d.edit);else if(d.tab){tab=d.tab;render()}else if(d.select){let id=d.select,was=menu===id;optionsClose();if(!was){menu=id;$('#choices-'+id).hidden=false;b.setAttribute('aria-expanded','true');$('#choices-'+id+' button')?.focus()}}else if(d.option){let k=d.option,v=d.value;if(k==='method'){v={'数据库字段':'field','Redis 读取':'redis','函数编排':'flow'}[v];draft.method=v;draft.connection=v==='redis'?redis:db;if(v==='redis'&&!draft.key)draft.key='m_storage_cluster_phase-{id}-soc';if(v==='flow'){draft.flow=editing==='sample'?'查询采样 SOC 序列':'读取储能簇实时 SOC';draft.output=editing==='sample'?'series · 时间序列':'soc · 数值'}}else draft[k]=v;if(k==='table'){draft.field='';draft.pk=''}dirty=true;render()}else if(d.insert){const t=$('#description'),start=t.selectionStart,end=t.selectionEnd;t.setRangeText(d.insert,start,end,'end');draft.nl=t.value;dirty=true;updateText();t.focus()}else if(d.close!==undefined)closeModal();else if(d.case)review(d.case);else switch(b.id){case'cluster':askLeave(()=>{tab='props';closeEditor()});break;case'back':case'cancel':askLeave(closeEditor);break;case'addStrict':draft.strict=true;if(editing==='sample'){draft.method='flow';draft.flow='查询采样 SOC 序列';draft.output='series · 时间序列'}dirty=true;render();break;case'removeStrict':showModal('移除结构化配置？','<p class="muted">只移除当前配置中的结构化部分，自然语言说明仍然保留。说明若引用了结构化结果，需要同步调整。</p>','<button data-close>取消</button><button class="danger" id="confirmRemove">移除</button>');break;case'confirmRemove':draft.strict=false;dirty=true;closeModal();render();break;case'discard':closeModal();pending?.();pending=null;break;case'connections':modalKind='connections';showModal('说明可使用的数据连接','<p class="muted">只能选择当前项目已配置的连接，可选择多个；不会把连接密码放进描述。</p>'+[db,redis].map(c=>`<label class="checkrow"><input type="checkbox" name="conn" value="${c}" ${draft.connections.includes(c)?'checked':''}><span>${c}<small>${c===db?'MySQL · 业务与采样数据':'Redis · 最新观测值'}</small></span></label>`).join(''),'<button data-close>取消</button><button class="primary" id="saveConnections">确认</button>');break;case'saveConnections':draft.connections=[...document.querySelectorAll('input[name=conn]:checked')].map(x=>x.value);dirty=true;closeModal();render();break;case'review':review();break;case'save':{let issues=[];if(!draft.strict&&!draft.nl.trim())issues.push('请添加结构化配置或填写自然语言说明。');if(draft.strict&&draft.method==='field'&&!draft.field)issues.push('请选择取值字段。');if(draft.strict&&draft.method==='object'&&!draft.pk)issues.push('请选择实例主键。');if(draft.strict&&draft.method==='redis'&&!draft.key?.trim())issues.push('请填写 Redis Key 模板。');if(issues.length){showModal('请补充配置',`<div class="callout warn">${issues.join('<br>')}</div>`);break}saved[editing]=clone(draft);closeEditor();toast('已保存在本页示例中；未调用数据库或大模型');break}case'about':showModal('设计说明','<div class="section"><b>两块内容，同一份配置</b><p>自然语言说明在前，可展开或收起；结构化配置在后，无互斥模式开关。额定功率演示仅结构化、采样 SOC 演示仅自然语言、实时 SOC 演示组合使用。</p></div><div class="section"><b>本原型可操作范围</b><p>切换实例识别和属性取值、编辑文本、选择连接、添加或移除结构化部分、保存与取消、查看预设冲突提示。所有变更仅存内存，刷新恢复。</p></div><div class="section"><b>正式能力尚未实施</b><p>真实数据库读取、大模型理解、语义冲突识别与执行追踪需独立实现和验收；本页不会执行。</p></div>');break;}});
function updateText(){$('#charCount').textContent=draft.nl.length+' 字';$('#modeBadge').innerHTML=badge(draft);$('#route').innerHTML=route()}
document.addEventListener('input',e=>{if(e.target.id==='description'){draft.nl=e.target.value;dirty=true;updateText()}if(e.target.dataset.input){draft[e.target.dataset.input]=e.target.value;dirty=true}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal').innerHTML)closeModal();else{optionsClose();document.querySelector('[data-select]')?.focus()}}const modal=$('#modal .modal');if(e.key==='Tab'&&modal){let a=[...modal.querySelectorAll('button,input')];if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}if(menu&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();let a=[...$('#choices-'+menu).querySelectorAll('button')],i=a.indexOf(document.activeElement);a[e.key==='Home'?0:e.key==='End'?a.length-1:(i+(e.key==='ArrowDown'?1:a.length-1))%a.length]?.focus()}});
document.addEventListener('toggle',e=>{if(e.target.id==='naturalPanel')nlOpen=e.target.open},true);
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});render();
</script></body></html>
