const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),copy=x=>JSON.parse(JSON.stringify(x));
const DB='创智园业务库',REDIS='创智园实时 Redis';
const objs={cluster:{name:'储能簇',definition:'多个电池模组串联或并联组成的电池单元。',table:'m_storage_cluster_phase'},device:{name:'储能设备',definition:'具备充电、放电能力的储能设备。',table:'m_storage_phase'}};
const common={configured:false,connection:DB};
let data={cluster:{object:{...common,name:'储能簇',definition:objs.cluster.definition,note:'储能簇来自 m_storage_cluster_phase 表，每条记录对应一个储能簇。id 是实例的唯一编号，name 是显示名称。仅使用 del_flag 为 0 的记录。',configured:true,table:'m_storage_cluster_phase',pk:'id'},props:[{...common,id:'power',name:'额定功率',definition:'设备在规定条件下能够持续运行的额定有功功率。',type:'数值',note:'额定功率读取当前储能簇记录的 rated_power 字段。',configured:true,method:'数据库字段',table:'m_storage_cluster_phase',field:'rated_power'},{...common,id:'soc',name:'实时 SOC',definition:'电池剩余电量百分比，取最新可获得的观测值。',type:'数值',connection:REDIS,note:'从 Redis 读取 m_storage_cluster_phase-{id}-soc，{id} 为当前储能簇的实例编号。返回数值作为实时 SOC。\n如果没有数据，说明暂无实时值；如果超出 0–100，报告异常，不自动截断，也不用历史采样值替代。',configured:true,method:'Redis',key:'m_storage_cluster_phase-{id}-soc'},{...common,id:'sample',name:'采样 SOC',definition:'电池剩余电量百分比随时间形成的采样序列。',type:'时间序列 · 数值',method:'函数编排',note:'1. 查询 s_attr_scada，model_name 为 m_storage_cluster_phase，attr_name 为 soc，model_id 为当前实例 ID，取得 scada_table 和 scada_id。\n2. 查询 scada_table 指定的表，用 id = scada_id 找到记录，取得 sample_table_name 和 sample_field_name。\n3. 查询 sample_table_name 指定的表，读取 record_time 和 sample_field_name 指定的字段，只取本次查询时间范围内的数据，按时间升序返回。\n4. 返回时间和 SOC 值组成的序列。定位不到或定位出多条配置记录时，说明具体原因，不自行选择第一条。'}],links:[{...common,id:'belongs',name:'所属设备',definition:'储能簇归属于一台储能设备，多个储能簇可以归属于同一设备。',meta:'储能簇 → 储能设备 · 多对一',note:'储能簇记录中的 storage_id 对应储能设备记录的 id。通过这个关联找到当前储能簇所属的设备。',configured:true,fromTable:'m_storage_cluster_phase',fromField:'storage_id',toTable:'m_storage_phase',toField:'id'}],actions:[{...common,id:'stop',name:'停止充放电',definition:'请求目标对象停止当前的充电或放电。',meta:'作用于储能簇',note:'将当前储能簇的目标功率设置为 0，请求停止充电或放电。\n本项目目前只提供设备级控制接口，不能仅凭所属设备 ID 就执行，否则会影响同设备下的其他储能簇。需要确认支持簇级控制的接口后再绑定。',configured:false,url:'',http:'POST'}]},device:{object:{...common,name:'储能设备',definition:objs.device.definition,note:'储能设备来自 m_storage_phase 表，以 id 唯一识别实例，name 作为显示名称。',configured:true,table:'m_storage_phase',pk:'id'},props:[{...common,id:'power',name:'额定功率',type:'数值',definition:'设备在规定条件下能够持续运行的额定有功功率。',note:'读取当前储能设备记录的 rated_power 字段。',configured:true,method:'数据库字段',table:'m_storage_phase',field:'rated_power'}],links:[{...common,id:'belongs',sharedLink:true,name:'包含储能簇',definition:'所属设备链接的反向阅读方向。',meta:'储能设备 ← 储能簇 · 一对多',note:'',configured:false}],actions:[{...common,id:'stop',name:'停止充放电',definition:'请求目标对象停止当前的充电或放电。',meta:'作用于储能设备',note:'调用本项目的设备功率设置接口。storageId 使用当前储能设备实例 ID，power 固定为 0。接口受理仅表示请求已提交，是否停止以设备反馈为准。',configured:true,http:'POST',url:'/示例/storage/setPower'}]}};
let object='cluster',tab='object',editing=null,draft=null,base='',descriptionOpen=true,configOpen=false,search='',pending=null,restoreFocus=null;
const tabLabels={object:'对象',props:'属性',links:'链接',actions:'动作'};
function target(){if(!editing)return null;return editing.tab==='object'?data[editing.object].object:data[editing.object][editing.tab].find(x=>x.id===editing.id)}
function isDirty(){return !!draft&&JSON.stringify(draft)!==base}
function getLink(row){return row.sharedLink?data.cluster.links[0]:row}
function summary(x,t){if(!x.configured)return '未填写';if(t==='object')return x.table+' · '+x.pk;if(t==='links')return x.fromTable+'.'+x.fromField+' = '+x.toTable+'.'+x.toField;if(t==='actions')return x.http+' '+x.url;return x.method==='Redis'?'Redis · '+(x.key||'待填写 Key'):x.method==='函数编排'?(x.flow||'待选择编排'):x.table+'.'+(x.field||'待选字段')}
function render(){document.querySelectorAll('[data-object]').forEach(b=>b.classList.toggle('active',b.dataset.object===object));$('#panel').innerHTML=editing?editor():overview()}
function overview(){return `<div class="heading"><div><h2>${objs[object].name}</h2><p>配置这个对象在当前项目中的来源与行为。</p></div></div><div class="tabs">${Object.entries(tabLabels).map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${v}${k==='object'?'':`<small>${data[object][k].length}</small>`}</button>`).join('')}</div><div class="body">${tab==='object'?objectView():listView()}</div>`}
function objectView(){const x=data[object].object;return `<div class="edit-title"><h3>来源说明</h3><button data-edit="object">编辑</button></div><p style="white-space:pre-wrap;line-height:1.9;font-size:13px;margin-bottom:25px">${E(x.note||'暂无说明')}</p><details class="config"><summary><span class="chevron">›</span><h3>数据来源</h3><small>${E(summary(x,'object'))}</small></summary><div class="config-content"><p class="fieldhint">${x.configured?E(x.connection+' / '+x.table+' / 实例主键 '+x.pk):'可按需补充数据库表与实例主键。'}</p><button class="text" data-edit="object">编辑来源</button></div></details><p class="list-note">这里的说明用于当前项目；本体中的对象定义保持独立。</p>`}
function listView(){const all=data[object][tab],rows=all.filter(x=>(x.name+getLink(x).note).toLowerCase().includes(search.toLowerCase()));return `<div class="toolbar"><div class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索${tabLabels[tab]}名称或说明" aria-label="搜索${tabLabels[tab]}" value="${E(search)}"></div><small>${rows.length} 项</small></div><div class="scroll"><table><thead><tr><th>${tabLabels[tab]}</th><th>项目说明</th><th>操作</th></tr></thead><tbody>${rows.map(x=>{const r=getLink(x);return `<tr><td><button class="rowname" data-edit="${x.id}">${x.name}</button><small>${E(x.type||x.meta||'')}</small></td><td><span class="excerpt">${E(r.note||'暂无说明')}</span>${r.configured?`<small>${E(summary(r,tab))}</small>`:''}</td><td><button class="text" data-edit="${x.id}">编辑</button></td></tr>`}).join('')}</tbody></table>${rows.length?'':'<div class="empty">没有匹配内容。<br><button class="text" id="clearSearch">清空搜索</button></div>'}</div><p class="list-note">${tab==='links'?'两端对象共用一份链接说明和关联配置。':tab==='actions'?'在这里描述项目如何完成动作；填写和保存不会执行设备操作。':'属性来自当前项目引用的本体版本，可直接填写取值说明。'}</p>`}
function configTitle(){return {object:'数据来源',props:'取值配置',links:'关联条件',actions:'接口配置'}[editing.tab]}
function prompt(){return {object:'说明对象来自哪里，什么标识能唯一确定一个实例。',props:'说明这个属性从哪里取、怎么算；需要多步处理时可以分步写。',links:'说明两个对象如何关联，例如通过哪些字段找到对方。',actions:'说明这个项目如何完成动作、使用什么接口，以及如何确认结果。'}[editing.tab]}
function editor(){const x=draft,t=editing.tab;return `<div class="body"><button class="text back" id="back">← 返回${tabLabels[t]}${t==='object'?'概览':'列表'}</button><div class="edit-title"><div><h2>${E(x.name)}</h2><p>${t==='object'?'对象来源':E(x.type||x.meta||'')}${t==='props'?' · '+objs[object].name:''}</p></div><details class="definition"><summary>查看本体定义</summary><p>${E(x.definition)}</p></details></div>${x.sharedLink?'<p class="alert">这是同一链接的反向入口。保存后，储能簇侧的说明与配置也会更新。</p>':''}<details id="descriptionPanel" class="description" ${descriptionOpen?'open':''}><summary class="desc-head"><span>说明</span><span class="fold"><span class="when-open">收起 ▴</span><span class="when-closed">展开 ▾</span></span></summary><div class="textarea"><textarea id="note" aria-label="项目说明" placeholder="${prompt()}">${E(x.note)}</textarea></div></details><details id="configPanel" class="config" ${configOpen?'open':''}><summary><span class="chevron">›</span><h3>${configTitle()}</h3><small>${E(x.configured?summary(x,t):'需要时补充')}</small></summary><div class="config-content">${x.configured?fields():`<p class="fieldhint">${{object:'需要明确表和实例主键时，可在这里补充。',props:'已有字段映射或函数编排，可以在这里选择。',links:'可选择两端对象已经配置的来源表及关联字段。',actions:'已有明确的业务接口，可以在这里填写调用信息。'}[t]}</p><button id="addConfig">＋ ${configTitle()}</button>`}</div></details><div class="savebar"><button class="primary" id="save">保存</button><button id="cancel">取消</button><small>保存当前项目配置，不执行查询或动作</small></div></div>`}
function select(k,label,value,opts){return `<div class="field"><label>${label}</label><div class="select"><button data-select="${k}" aria-haspopup="listbox" aria-expanded="false"><span>${E(value||'请选择')}</span><span>⌄</span></button><div id="options-${k}" class="options" role="listbox" hidden>${opts.map(v=>`<button role="option" aria-selected="${v===value}" class="${v===value?'selected':''}" data-option="${k}" data-value="${E(v)}">${E(v)}</button>`).join('')}</div></div></div>`}
function input(k,label,v,ph=''){return `<div class="field"><label>${label}</label><input data-input="${k}" aria-label="${label}" value="${E(v)}" placeholder="${E(ph)}"></div>`}
function fields(){const x=draft,t=editing.tab;let h='<div class="formgrid">';if(t==='object'){h+=select('connection','数据连接',x.connection,[DB])+select('table','表 / 视图',x.table,[objs[object].table])+select('pk','实例主键',x.pk,['id'])}else if(t==='props'){const seq=x.type.startsWith('时间序列');h+=select('method','取值方式',x.method,seq?['函数编排']:['数据库字段','Redis','函数编排']);if(x.method==='Redis')h+=select('connection','数据连接',x.connection,[REDIS])+input('key','Key 模板',x.key,'例如 m_storage_cluster_phase-{id}-soc');else if(x.method==='函数编排')h+=select('flow','函数编排',x.flow||'',[seq?'查询采样 SOC 序列':'查询实时 SOC'])+`<div class="field"><label>输出</label><p>${seq?'series · 时间序列（数值）':'soc · 数值'}</p></div>`;else h+=select('connection','数据连接',x.connection,[DB])+select('table','表 / 视图',x.table,[objs[object].table])+select('field','取值字段',x.field,['rated_power','capacity','id','name'])}else if(t==='links'){h+=select('fromTable','起点表 · 储能簇',x.fromTable,['m_storage_cluster_phase'])+select('toTable','终点表 · 储能设备',x.toTable,['m_storage_phase'])+select('fromField','起点关联字段',x.fromField,['storage_id','id'])+select('toField','终点匹配字段',x.toField,['id','name'])}else{h+=select('http','请求方式',x.http,['POST','PUT'])+input('url','接口地址',x.url,'填写业务系统提供的接口地址')}h+='</div>';if(t==='props')h+=`<div class="readonly">${x.method==='Redis'?'模板 {id} 绑定当前实例 ID。':x.method==='函数编排'?'实例输入使用当前实例 ID；时间序列编排同时接收本次查询时间范围。':'读取当前对象实例对应记录的字段。'}</div>`;if(t==='actions')h+=`<div class="readonly">${object==='device'?'参数示例：storageId ← 当前储能设备实例 ID；power ← 固定值 0。':'需由业务系统提供支持当前储能簇的接口和参数，不能直接套用设备级参数。'}<br>仅展示配置示例，不发送请求；正式版继续使用现有参数和凭据配置表单。</div>`;return h+`<div class="config-foot"><small>已有配置与上方说明共同保留；如有矛盾，需要明确后再执行。</small><button class="text danger" id="removeConfig">移除配置</button></div>`}
function openEditor(id){editing={object,tab,id};let r=target();if(r.sharedLink){draft={...copy(data.cluster.links[0]),sharedLink:true,name:r.name,definition:r.definition,meta:r.meta}}else draft=copy(r);base=JSON.stringify(draft);descriptionOpen=true;configOpen=false;render()}
function finish(){editing=null;draft=null;base='';render()}
function dirtyGuard(fn){if(!isDirty()){fn();return}pending=fn;modal('放弃本次修改？','<p>尚未保存的说明和配置将丢弃，已保存内容保持不变。</p>','<button data-close>继续编辑</button><button id="discard" class="danger">放弃修改</button>')}
function modal(title,body,footer='<button data-close>关闭</button>'){restoreFocus=document.activeElement;$('#modal').innerHTML=`<div class="shade"><section class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="modal-head"><h2>${title}</h2><button data-close aria-label="关闭">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${footer}</div></section></div>`;$('#modal [data-close]')?.focus()}
function closeModal(){$('#modal').innerHTML='';if(restoreFocus?.isConnected)restoreFocus.focus()}
function toast(s){$('#toast').textContent=s;clearTimeout(window.timer);window.timer=setTimeout(()=>$('#toast').textContent='',2600)}
function closeOptions(){document.querySelectorAll('.options').forEach(el=>el.hidden=true);document.querySelectorAll('[data-select]').forEach(el=>el.setAttribute('aria-expanded','false'))}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(!e.target.closest('.select'))closeOptions();return}const d=b.dataset;if(d.object)dirtyGuard(()=>{object=d.object;search='';finish()});else if(d.tab){tab=d.tab;search='';render()}else if(d.edit)openEditor(d.edit);else if(d.select){let p=$('#options-'+d.select),was=p.hidden;closeOptions();p.hidden=!was;b.setAttribute('aria-expanded',String(was));if(was)p.querySelector('button')?.focus()}else if(d.option){let k=d.option,v=d.value;draft[k]=v;if(k==='method'){draft.connection=v==='Redis'?REDIS:DB;draft.key=draft.key||objs[object].table+'-{id}-soc';draft.table=objs[object].table;draft.flow=''}if(['table','fromTable','toTable'].includes(k)){if(k==='table'){draft.pk='';draft.field=''}else draft[k==='fromTable'?'fromField':'toField']=''}render()}else if('close'in d)closeModal();else switch(b.id){case'back':case'cancel':dirtyGuard(finish);break;case'discard':closeModal();pending?.();pending=null;break;case'addConfig':draft.configured=true;configOpen=true;if(editing.tab==='props'){draft.method=draft.type.startsWith('时间序列')?'函数编排':'数据库字段';draft.table=objs[object].table;draft.flow=''}render();break;case'removeConfig':modal('移除这部分配置？','<p>上方说明会保留。如果说明依赖这些配置，请一并调整。</p>','<button data-close>取消</button><button class="danger" id="confirmRemove">移除</button>');break;case'confirmRemove':draft.configured=false;closeModal();render();break;case'save':{let issues=[];if(draft.configured){if(editing.tab==='object'&&!draft.pk)issues.push('请选择实例主键。');if(editing.tab==='props'&&draft.method==='数据库字段'&&!draft.field)issues.push('请选择取值字段。');if(editing.tab==='props'&&draft.method==='Redis'&&!draft.key?.trim())issues.push('请填写 Key 模板。');if(editing.tab==='props'&&draft.method==='函数编排'&&!draft.flow)issues.push('请选择函数编排。');if(editing.tab==='links'&&(!draft.fromField||!draft.toField))issues.push('请选择两端关联字段。');if(editing.tab==='actions'&&!draft.url?.trim())issues.push('请填写接口地址，或移除尚未完成的接口配置。')}if(issues.length){modal('还有内容需要补充',issues.map(s=>`<p>${s}</p>`).join(''));return}if(draft.sharedLink){data.cluster.links[0]={...copy(draft),sharedLink:undefined,name:'所属设备',definition:data.cluster.links[0].definition,meta:'储能簇 → 储能设备 · 多对一'}}else if(editing.tab==='object')data[object].object=copy(draft);else{const arr=data[object][editing.tab];arr[arr.findIndex(x=>x.id===editing.id)]=copy(draft)}finish();toast('已保存在本页示例中');break}case'clearSearch':search='';render();break;case'about':modal('这一版的设计','<p>围绕对象、属性、链接和动作维护项目说明。填写说明后，可按需要展开下方的数据来源、取值配置、关联条件或接口配置。</p><p>不要求选择模式，不展示组合标签，不用规则流程图打断填写。本体定义仍可只读查看。</p><p>原型仅模拟编辑、选择、保存和取消。不会调用大模型、读取数据库或执行设备动作。真实解释与执行能力需要单独实现。</p>');break}});
document.addEventListener('input',e=>{if(e.target.id==='note'){draft.note=e.target.value}else if(e.target.dataset.input)draft[e.target.dataset.input]=e.target.value;else if(e.target.id==='search'){search=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();try{$('#search').setSelectionRange(pos,pos)}catch{}}});
document.addEventListener('toggle',e=>{if(e.target.id==='descriptionPanel')descriptionOpen=e.target.open;if(e.target.id==='configPanel')configOpen=e.target.open},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal').innerHTML)closeModal();else closeOptions()}let dlg=$('#modal .modal');if(e.key==='Tab'&&dlg){const a=[...dlg.querySelectorAll('button,input')];if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}const list=document.querySelector('.options:not([hidden])');if(list&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();let a=[...list.querySelectorAll('button')],i=a.indexOf(document.activeElement);a[e.key==='Home'?0:e.key==='End'?a.length-1:(i+(e.key==='ArrowDown'?1:a.length-1))%a.length]?.focus()}});
window.addEventListener('beforeunload',e=>{if(isDirty()){e.preventDefault();e.returnValue=''}});render();
</script></body></html>
