<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>函数编排 · 审阅修正原型</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#193047;background:#f5f7fb}button,input,select,textarea{font:inherit;color:inherit}button,select,input,textarea{border:1px solid #d6e0ec;border-radius:6px;background:white;padding:8px 12px}button{cursor:pointer}button:hover{background:#eef3ff}button:disabled{opacity:.5;cursor:wait}.primary{background:#285de8;color:white;border-color:#285de8}.primary:hover{background:#214fc8}.layout{display:flex;height:100vh}.nav{width:210px;flex-shrink:0;background:white;border-right:1px solid #dae3ef;padding:20px}.nav h3{margin:0 0 25px}.nav p{padding:9px;border-radius:6px}.nav .active{background:#edf3ff;color:#2154d9;font-weight:600}.muted,small{color:#667e95}.main{flex:1;min-width:0;display:flex;flex-direction:column}.bar{background:white;padding:15px 24px;border-bottom:1px solid #dbe4ef;display:flex;align-items:center;gap:18px}.notice{padding:6px 24px;background:#fff8e8;color:#826020;font-size:12px}.workspace{padding:20px;flex:1;min-height:0;display:flex;flex-direction:column}.head{padding:16px 20px;background:white;display:flex;gap:16px;align-items:center;border-bottom:1px solid #e1e7f0;flex-wrap:wrap}.head h2{font-size:18px;margin:0}.push{margin-left:auto}.card{background:white;border:1px solid #dce4ee;border-radius:8px}.design{flex:1;position:relative;min-height:0;display:flex;flex-direction:column}.canvas{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;background-image:radial-gradient(#d9e1ec 1px,transparent 1px);background-size:20px 20px}.node{width:122px;background:white;padding:16px;border:1px solid #ccd9eb;border-radius:8px;box-shadow:0 3px 8px #1a30510a}.node strong{display:block}.node small{display:block;margin:6px 0}.foot{padding:14px 20px;border-top:1px solid #dbe4ef}.test{display:flex;flex:1;min-height:0;background:white}.left{width:310px;overflow:auto;flex-shrink:0;padding:20px;background:#f8faff;border-right:1px solid #dce4ef}.right{flex:1;min-width:0;display:flex;flex-direction:column;padding:20px}.rightbody{overflow:auto;min-height:0;flex:1;margin-top:12px}.field{display:block;margin:14px 0}.field>input,.field>select,.field>textarea{display:block;width:100%;margin-top:6px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.chip{padding:4px 10px;background:#edf3ff;border-radius:5px;color:#315ed8}.error{color:#ba3434;background:#fff3f3;padding:10px;border-radius:5px}.hint{color:#5e7791;background:#f0f4fa;padding:10px}.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;background:#e9f7ee;color:#247948}.warning{background:#fff3d9;color:#956719}.checks{display:flex;gap:15px;flex-wrap:wrap;padding:10px 0}.tabs{display:flex;gap:10px;border-bottom:1px solid #dce4ef;padding-bottom:9px}.tabs .selected{color:#275de4;border-color:#275de4}.value{font-size:34px;font-weight:600;margin:20px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f6fa;border-radius:6px;padding:18px}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #dce4ef;padding:10px;text-align:left}th{background:#f4f7fb}h3{margin:0 0 10px;font-size:15px}[hidden]{display:none!important}#resultTitle{display:flex;align-items:center;gap:10px;margin-bottom:10px}.examples{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;margin-bottom:12px}.examples select{padding:4px}.empty{border:1px dashed #dce4ef;padding:25px;color:#6a7b8f}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #3b70fa;outline-offset:2px}@media(max-width:1100px){.nav{width:170px}.left{width:260px}.workspace{padding:12px}}@media(max-width:800px){.nav{display:none}.left{width:245px}.head{padding:12px}.right{padding:14px}}@media(max-width:560px){.test{overflow:auto;display:block}.left{width:100%;border-right:0}.rightbody{min-height:250px}.workspace{overflow:auto}.canvas{padding:15px}}
</style>
<body><div class="layout"><aside class="nav"><h3>◇ 本体工作台</h3><p class="muted">本体　　<strong>项目</strong></p><small>当前项目</small><p id="navProject">审阅项目甲</p><p>项目概览</p><p>数据连接</p><p>对象映射</p><p class="active">函数编排</p><p>项目校验与发布</p></aside><main class="main"><div class="bar"><span>函数编排 / 审阅修正</span><span class="push muted">交互方案 v1</span></div><div class="notice">原型：仅模拟界面与内存状态；不调用接口、不执行代码、不保存工作台配置。下方“演示”控件不会加入正式产品。</div><div class="workspace"><section class="design card" id="design"><header class="head"><h2>储能计算示例</h2><label class="push">运行项目 <select id="project"><option>审阅项目甲</option><option>审阅项目乙</option></select></label><button id="check">检查配置</button><button class="primary" id="open">▷ 测试编排</button></header><div class="canvas" id="canvas"></div><div class="foot muted" id="designStatus">配置问题　·　示例配置有效</div></section><section id="testing" hidden style="display:flex;flex-direction:column;flex:1;min-height:0" class="card"><header class="head"><button id="back">← 返回编排</button><h2>储能计算示例 <span class="badge">测试调试</span></h2><span class="push muted" id="currentProject"></span></header><div class="test"><aside class="left"><h3>测试范围</h3><div class="examples">演示图结构 <select id="graph"><option value="chain">A→B→C→D→E</option><option value="diamond">双路径 A→B/C→D</option><option value="parallel">并列 A、B</option></select></div><select id="scope" style="width:100%"><option value="all">整条编排</option><option value="segment">连续片段</option><option value="single">单节点 · B</option></select><div id="range"><label class="field">起点 <select id="start"></select></label><label class="field">终点 <select id="end"></select></label><div id="multiselect" hidden><p class="hint">存在多条路径，请勾选本次节点。可继续增减选择。</p><div class="checks" id="checks"></div></div></div><p class="error" id="problem" hidden></p><div class="chips" id="path"></div><p class="muted" id="outside"></p><h3>测试输入</h3><label class="field"><span id="inputLabel"></span><input id="input" type="number" value="8"></label><p class="muted" id="inputNote"></p><button id="run" class="primary">▷ 运行测试</button><p class="muted" id="waitNote"></p></aside><section class="right"><div id="resultTitle"><h3 id="rtitle">测试结果</h3><span id="status" class="badge" hidden></span></div><div class="muted" id="meta">选择范围、填写输入后运行。</div><p id="fresh" class="hint" hidden></p><div id="resultNodes" class="chips"></div><div class="tabs" id="tabs" hidden><button data-tab="output" class="selected">输出</button><button data-tab="input">本节点输入</button><button data-tab="log">执行记录</button></div><div class="rightbody"><div class="examples" id="resultExamples" hidden>演示结果类型 <select id="resultType"><option value="scalar">标量</option><option value="numbers">数值列表</option><option value="rows">对象列表</option><option value="empty">空列表</option><option value="mixed">混合列表</option></select><button id="toggleJson">查看 JSON</button></div><div id="result" class="empty">尚无测试结果。结果始终在右侧展示。</div></div></section></div></section></div></main></div>
<script>
const $=id=>document.getElementById(id);let state={project:'审阅项目甲',graph:'chain',scope:'all',start:'B',end:'D',selected:[],input:'8',provided:true,result:null,running:false,tab:'output',node:'',json:false},cache={};let count=0;
const nodes=()=>state.graph==='chain'?['A','B','C','D','E']:state.graph==='diamond'?['A','B','C','D']:['A','B'];
const edges=()=>state.graph==='chain'?[['A','B'],['B','C'],['C','D'],['D','E']]:state.graph==='diamond'?[['A','B'],['A','C'],['B','D'],['C','D']]:[];
function range(){if(state.scope==='all')return {ids:nodes()};if(state.scope==='single')return {ids:['B']};if(state.graph==='diamond'&&state.start==='A'&&state.end==='D'){let ids=nodes().filter(x=>state.selected.includes(x));if(!ids.length)return {ids,error:'请至少选择一个节点'};let seen=new Set([ids[0]]);for(let i=0;i<ids.length;i++)edges().forEach(([a,b])=>{if(ids.includes(a)&&ids.includes(b)&&(seen.has(a)||seen.has(b))){seen.add(a);seen.add(b)}});return {ids,error:seen.size<ids.length?'所选节点不连通，请调整选择':''};}let ns=nodes(),a=ns.indexOf(state.start),b=ns.indexOf(state.end);if(a>b||a<0||b<0||state.graph==='parallel'&&a!==b)return {ids:[],error:'起点到终点没有沿依赖方向的路径'};return {ids:ns.slice(a,b+1)}}
function signature(){return JSON.stringify([state.graph,state.scope,range().ids,state.input,state.provided])}
function render(){let p=range(),multiple=state.graph==='diamond'&&state.start==='A'&&state.end==='D';$('currentProject').textContent='当前项目：'+state.project;$('navProject').textContent=state.project;$('graph').value=state.graph;$('scope').value=state.scope;$('start').value=state.start;$('end').value=state.end;$('input').value=state.input;$('range').hidden=state.scope!=='segment';$('multiselect').hidden=!multiple;$('problem').hidden=!p.error;$('problem').textContent=p.error||'';$('path').replaceChildren(...p.ids.map(x=>{let e=document.createElement('span');e.className='chip';e.textContent=x;return e}));$('outside').textContent='本次不执行：'+(nodes().filter(x=>!p.ids.includes(x)).join('、')||'无');$('inputLabel').textContent=p.ids.includes('A')?'入口参数 · X · 数值':'边界输入 · '+(p.ids[0]||'未选择')+' · X · 数值';$('inputNote').textContent=multiple?'原型使用同一个演示值补齐各边界；正式版逐项列出所需输入。':'范围内自动传递；测试输入不会修改节点绑定。';$('run').disabled=state.running||!!p.error||!p.ids.length||!state.provided;$('run').textContent=state.running?'执行中…':'▷ 运行测试';$('waitNote').textContent=state.running?'等待本次响应，可返回设计；不会重复发起。':'';document.querySelectorAll('#checks input').forEach(x=>x.checked=state.selected.includes(x.value));renderResult()}
function options(){for(const id of ['start','end']){$(id).replaceChildren(...nodes().map(n=>{let e=document.createElement('option');e.value=n;e.textContent=n;return e}))}$('checks').replaceChildren(...nodes().map(n=>{let l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.value=n;i.onchange=()=>{state.selected=i.checked?[...state.selected,n]:state.selected.filter(x=>x!==n);render()};l.append(i,' '+n);return l}))}
function showTest(){ $('design').hidden=true;$('testing').hidden=false;options();render()}
function renderResult(){let r=state.result;$('status').hidden=!r;$('tabs').hidden=!r||r.pending;$('resultExamples').hidden=!r||r.pending; $('resultNodes').replaceChildren();$('fresh').hidden=true;if(!r){$('rtitle').textContent='测试结果';$('meta').textContent='选择范围、填写输入后运行。';$('result').textContent='尚无测试结果。结果始终在右侧展示。';return}$('rtitle').textContent=r.scopeLabel+'结果';$('status').textContent=r.pending?'执行中':'本次测试成功';$('meta').textContent=r.project+' · '+r.ids.join(' → ')+' · 提交于 '+r.time;let stale=r.project!==state.project?'旧项目结果，当前项目尚未测试':r.sig!==signature()?'尚未按当前范围和输入运行':'';$('fresh').hidden=!stale;$('fresh').textContent=stale;if(r.pending){$('result').textContent='正在执行，请等待响应（原型模拟2秒）。';return}r.ids.forEach(n=>{let b=document.createElement('button');b.textContent=n+' ✓';b.className=n===state.node?'selected':'';b.onclick=()=>{state.node=n;renderResult()};$('resultNodes').append(b)});let box=$('result');box.className='';box.replaceChildren();if(state.tab==='log'){box.textContent=r.ids.join(' → ')+' 已完成。范围外节点没有执行。';return}let v=state.tab==='input'?{x:r.values[state.node]?.input}:r.values[state.node]?.output;if(state.tab==='output'){let type=$('resultType').value;if(type==='numbers')v=[0,10,30];if(type==='rows')v=[{id:1,value:10},{id:2,value:30}];if(type==='empty')v=[];if(type==='mixed')v=[0,{soc:20},['a','b']]}if(Array.isArray(v)&&!v.length){box.textContent='空列表（0 项）';let pre=document.createElement('pre');pre.textContent='[]';box.append(pre)}else if(Array.isArray(v)&&!state.json&&v.every(x=>typeof x!=='object'||x===null)){let table=document.createElement('table');table.innerHTML='<thead><tr><th>序号</th><th>值</th></tr></thead>';let tb=document.createElement('tbody');v.forEach((x,i)=>{let row=document.createElement('tr');[i+1,x].forEach(y=>{let td=document.createElement('td');td.textContent=String(y);row.append(td)});tb.append(row)});table.append(tb);box.append(table)}else if(Array.isArray(v)&&!state.json&&v.every(x=>x&&typeof x==='object'&&!Array.isArray(x))){let keys=[...new Set(v.flatMap(x=>Object.keys(x)))],table=document.createElement('table'),head=document.createElement('tr');keys.forEach(k=>{let th=document.createElement('th');th.textContent=k;head.append(th)});table.append(head);v.forEach(x=>{let row=document.createElement('tr');keys.forEach(k=>{let td=document.createElement('td');td.textContent=typeof x[k]==='object'?JSON.stringify(x[k]):String(x[k]??'—');row.append(td)});table.append(row)});box.append(table)}else{if(typeof v==='number'&&!state.json){let big=document.createElement('div');big.className='value';big.textContent=v;box.append(big)}let pre=document.createElement('pre');pre.textContent=JSON.stringify(v,null,2);box.append(pre)}}
$('open').onclick=showTest;$('back').onclick=()=>{$('testing').hidden=true;$('design').hidden=false;$('designStatus').textContent=state.running?'测试执行中；重新进入可继续查看':'测试范围、输入和结果保留在本次工作区';};$('check').onclick=()=>{$('designStatus').textContent='示例配置有效；并列节点也允许整条测试。'};
$('project').onchange=e=>{cache[state.project]={graph:state.graph,scope:state.scope,start:state.start,end:state.end,selected:[...state.selected],input:state.input,provided:state.provided};state.project=e.target.value;Object.assign(state,cache[state.project]||{graph:'chain',scope:'all',start:'B',end:'D',selected:[],input:'',provided:false});options();render()};
$('graph').onchange=e=>{state.graph=e.target.value;state.start=state.graph==='chain'?'B':'A';state.end=state.graph==='parallel'?'B':'D';state.selected=[];options();render()};$('scope').onchange=e=>{state.scope=e.target.value;render()};for(const id of ['start','end'])$(id).onchange=e=>{state[id]=e.target.value;state.selected=[];render()};$('input').oninput=e=>{state.input=e.target.value;state.provided=state.input!=='';render()};
$('run').onclick=()=>{if(state.running)return;let p=range();if(p.error||!state.provided)return;state.running=true;const gen=++count,snap={project:state.project,graph:state.graph,ids:[...p.ids],sig:signature(),scopeLabel:state.scope==='all'?'整条编排':state.scope==='segment'?'连续片段':'单节点',time:new Date().toLocaleTimeString(),pending:true,values:{}};let vals={},seed=Number(state.input);snap.ids.forEach(n=>{let incoming=edges().filter(([a,b])=>b===n&&snap.ids.includes(a)).map(([a])=>vals[a]?.output),x=incoming[0]??seed;let output=n==='A'?x:n==='B'?x+2:n==='C'?x*3:n==='D'?(state.graph==='diamond'?incoming.reduce((a,b)=>a+b,0):x/2):x*100;vals[n]={input:x,output}});snap.values=vals;state.result=snap;state.node=snap.ids[0];render();setTimeout(()=>{if(gen!==count)return;snap.pending=false;state.running=false;render()},2000)};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('selected',x===b));renderResult()});$('resultType').onchange=renderResult;$('toggleJson').onclick=()=>{state.json=!state.json;$('toggleJson').textContent=state.json?'查看预览':'查看 JSON';renderResult()};
['A','B','C','D','E'].forEach(n=>{let box=document.createElement('div');box.className='node';box.innerHTML='<strong>'+n+'</strong><small>计算节点</small>';let b=document.createElement('button');b.textContent='测试此节点';b.onclick=()=>{state.scope='single';if(n!=='B'){alert('修正原型的节点快捷入口仅模拟 B；正式版保留所有节点。');return}showTest()};if(n==='B')box.append(b);$('canvas').append(box)});options();render();
</script></body></html>
