<div class="shell" id="shell"><aside class="nav"><h2>◇ 本体工作台</h2><p>本体　 /　 项目</p><small>当前本体</small><p style="background:#233e58">储能本体　⌄</p><p>工作概览</p><p class="active">对象建模</p><p>共享属性</p><p>业务规则</p><p>动作定义</p><p>本体校验与发布</p><footer>◉ admin　 ⚙</footer></aside><main class="main"><header class="top"><span>储能本体 / 抽象定义　 <b>对象建模</b></span><small>● 已保存</small></header><div class="demo">交互原型 v1 · 模拟数据，不连接工作台。可试搜索、框选拖动、布局撤销、邻域、面板收起与最大化。无真实定义编辑与持久化。</div><div class="tabs"><span>对象列表</span><span class="active">本体图谱</span></div><section class="work"><div class="tools"><div class="searchbox"><input id="q" placeholder="搜索名称、别名…" aria-label="搜索节点"><div class="results hidden" id="results"></div></div><button id="selectTool" class="on" onclick="setTool('select')" title="拖空白框选">选择</button><button id="panTool" onclick="setTool('pan')" title="拖空白平移">移动</button><select id="layout" aria-label="整理布局方式"><option value="types">按类型排列</option><option value="groups">按关联聚集</option></select><button onclick="arrange()">整理布局</button><button id="undo" onclick="undo()" title="撤销布局" disabled>↶</button><button id="redo" onclick="redo()" title="重做布局" disabled>↷</button><div class="spacer"></div><button id="filterBtn" class="on" onclick="panel('filters')">筛选</button><button id="detailBtn" onclick="panel('inspector')">详情</button><button id="maxBtn" onclick="maximum()">最大化</button><button onclick="help()" aria-label="操作帮助">?</button></div><div class="scope" id="scope" hidden><b id="scopeTitle"></b><select id="depth" onchange="scopeChange()" aria-label="关联范围"><option value="1">1跳</option><option value="2">2跳</option><option value="99">全部可达</option></select><select id="direction" onchange="scopeChange()" aria-label="关联方向"><option value="both">相关（双向）</option><option value="in">流入</option><option value="out">流出</option></select><select id="localLayout" onchange="scopeChange()" aria-label="邻域布局"><option value="original">原位置</option><option value="circle">环形展开</option></select><button onclick="exitScope()">退出关联查 <script>
const $=id=>document.getElementById(id),colors={对象:['#ebf3ff','#5484c8'],共享属性:['#fff0f8','#ce77a4'],私有属性:['#fff5e8','#d1a062'],规则:['#edf8f1','#70a986'],动作:['#f4effe','#9b83c3']};
const rows=[['system','储能系统','对象','由业务范围内的储能设备组成的逻辑集合。'],['device','储能设备','对象','用于充放电的储能设备，包含储能簇。'],['cluster','储能簇','对象','储能设备的组成单元，按簇粒度管理。'],['load','负荷','对象','用电负荷。'],['capacity','额定容量','共享属性','额定可存储电量。'],['soc','SOC实时值','共享属性','电池剩余电量百分比，表示当前最新观测值。'],['series','SOC采样值','共享属性','电池剩余电量百分比，随时标记录的序列。'],['power','实时功率','共享属性','当前充放电功率。'],['alias','设备编号','私有属性','储能设备在本体中的业务编号。'],['socRule','SOC计算规则','规则','剩余电量 / 额定容量 × 100。按统一统计范围与观测时刻计算；缺失不能视为0。'],['limit','储能运行边界','规则','规定SOC上下限、功率范围及运行约束。'],['stop','停止充放电','动作','将目标功率设为0，停止当前充放电。示例，不触发设备控制。']];
const nodes=rows.map((r,i)=>({id:r[0],name:r[1],kind:r[2],desc:r[3],x:0,y:0}));const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));const pairs=[['system','device','包含'],['device','cluster','包含'],['load','device','接入'],['device','capacity','引用共享属性'],['cluster','capacity','引用共享属性'],['device','soc','引用共享属性'],['cluster','soc','引用共享属性'],['cluster','series','引用共享属性'],['device','power','引用共享属性'],['device','alias','私有属性'],['device','socRule','关联规则'],['cluster','limit','关联规则'],['device','stop','关联动作']];const edges=pairs.map((x,i)=>({id:'e'+i,source:x[0],target:x[1],label:x[2]}));let visibleKinds=new Set(Object.keys(colors)),visibleRels=new Set(pairs.map(x=>x[2])),selected=new Set(),edgeId='',tool='select',z=1,tx=0,ty=0,undoStack=[],redoStack=[],scopeCenter='',scopeBackup=null,drag=null,space=false,toastTimer,detailClosed=false;
function initial(){let counts={};nodes.forEach(n=>{let col=n.kind==='对象'?0:n.kind.includes('属性')?1:2;let k=counts[col]||0;counts[col]=k+1;n.x=120+col*320;n.y=90+k*105})}initial();const base=nodes.map(n=>({x:n.x,y:n.y}));
function msg(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3000)}
function snap(){return {positions:nodes.map(n=>({x:n.x,y:n.y})),z,tx,ty}}function restore(s){s.positions.forEach((p,i)=>Object.assign(nodes[i],p));({z,tx,ty}=s);render()}function remember(s=snap()){undoStack.push(s);if(undoStack.length>30)undoStack.shift();redoStack=[];buttons()}function buttons(){$('undo').disabled=!undoStack.length;$('redo').disabled=!redoStack.length}function undo(){if(!undoStack.length)return;redoStack.push(snap());restore(undoStack.pop());buttons()}function redo(){if(!redoStack.length)return;undoStack.push(snap());restore(redoStack.pop());buttons()}
function allowed(){let set=new Set(nodes.filter(n=>visibleKinds.has(n.kind)).map(n=>n.id));if(scopeCenter){let keep=new Set([scopeCenter]),front=[scopeCenter],dir=$('direction').value,depth=+$('depth').value;for(let i=0;i<depth&&front.length;i++){let next=[];for(let e of edges){if(!visibleRels.has(e.label)||!set.has(e.source)||!set.has(e.target))continue;for(let id of front){let t=dir!=='in'&&e.source===id?e.target:dir!=='out'&&e.target===id?e.source:null;if(t&&!keep.has(t)){keep.add(t);next.push(t)}}}front=next}set=new Set([...set].filter(x=>keep.has(x)))}return set}
function el(tag,attrs={},text){let e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e}
function render(){let vis=allowed(),q=$('q').value.trim().toLowerCase();$('nodes').replaceChildren();$('edges').replaceChildren();let ec=0;for(let e of edges){if(!vis.has(e.source)||!vis.has(e.target)||!visibleRels.has(e.label))continue;ec++;let a=byId[e.source],b=byId[e.target],g=el('g',{class:'edge'+(edgeId===e.id?' selected':''),'data-edge':e.id});let dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy),sx=a.x+dx/l*81,sy=a.y+dy/l*25,ex=b.x-dx/l*81,ey=b.y-dy/l*25;g.append(el('path',{d:`M${sx},${sy} Q${(sx+ex)/2+8},${(sy+ey)/2-10} ${ex},${ey}`,'marker-end':'url(#arrow)'}),el('text',{x:(sx+ex)/2,y:(sy+ey)/2-7,'text-anchor':'middle'},e.label),el('title',{},byId[e.source].name+' → '+e.label+' → '+byId[e.target].name));$('edges').append(g)}for(let n of nodes){if(!vis.has(n.id))continue;let c=colors[n.kind],g=el('g',{class:'node'+(selected.has(n.id)?' selected':'')+(q&&n.name.toLowerCase().includes(q)?' hit':''),'data-node':n.id,transform:`translate(${n.x},${n.y})`});g.append(el('rect',{x:-86,y:-27,width:172,height:54,rx:n.kind.includes('属性')?25:8,fill:c[0],stroke:c[1]}),el('text',{'text-anchor':'middle',y:-1},n.name),el('text',{'text-anchor':'middle',y:16,class:'kind'},n.kind));$('nodes').append(g)}$('world').setAttribute('transform',`translate(${tx},${ty}) scale(${z})`);$('percent').textContent=Math.round(z*100)+'%';$('stats').textContent=`显示 ${vis.size}/${nodes.length} 节点 · ${ec}/${edges.length} 关系${selected.size?' · 已选 '+selected.size+' 项':''}`;$('empty').classList.toggle('hidden',vis.size>0);buttons()}
function resizeFit(){fit()}function fit(ids=allowed()){let arr=nodes.filter(n=>ids.has(n.id));if(!arr.length){render();return}let w=$('stage').clientWidth,h=$('stage').clientHeight;let minX=Math.min(...arr.map(n=>n.x))-110,maxX=Math.max(...arr.map(n=>n.x))+110,minY=Math.min(...arr.map(n=>n.y))-65,maxY=Math.max(...arr.map(n=>n.y))+65;z=Math.max(.1,Math.min(1.6,(w-60)/(maxX-minX),(h-80)/(maxY-minY)));tx=w/2-(minX+maxX)/2*z;ty=h/2-(minY+maxY)/2*z;render()}
function setZoom(v,px=$('stage').clientWidth/2,py=$('stage').clientHeight/2){let nz=Math.max(.1,Math.min(4,v));tx=px-(px-tx)*nz/z;ty=py-(py-ty)*nz/z;z=nz;render()}function zoomBy(k){setZoom(z*k)}function setTool(v){tool=v;$('selectTool').classList.toggle('on',v==='select');$('panTool').classList.toggle('on',v==='pan');$('stage').style.cursor=v==='pan'?'grab':'default'}
function panel(id){let e=$(id);e.classList.toggle('hidden');if(id==='inspector')detailClosed=e.classList.contains('hidden');if(innerWidth<1100&&!e.classList.contains('hidden'))$(id==='filters'?'inspector':'filters').classList.add('hidden');$('filterBtn').classList.toggle('on',!$('filters').classList.contains('hidden'));$('detailBtn').classList.toggle('on',!$('inspector').classList.contains('hidden'));if(id==='inspector')details();}

function details(){let body='<div class="head"><b>图谱详情</b><button onclick="panel(\'inspector\')">×</button></div>';if(edgeId){let e=edges.find(e=>e.id===edgeId);body+=`<div class="card"><span class="tag">${e.label==='包含'||e.label==='接入'?'对象链接':'定义关联'}</span><h3>${byId[e.source].name}</h3><p>— ${e.label} → ${byId[e.target].name}</p></div><h4>关系说明</h4><p>此连线来自本体中的实际定义或引用，不表示函数执行顺序。</p><button class="primary" onclick="definition()">打开定义 ↗</button>`}else if(selected.size===1){let n=byId[[...selected][0]];body+=`<div class="card"><span class="tag">${n.kind}</span><h3>${n.name}</h3></div><h4>业务定义</h4><p>${n.desc}</p>${n.kind.includes('属性')?'<h4>数据类型</h4><p>'+(n.id==='series'?'时间序列 · 观测值：数值':n.id==='alias'?'文本':'数值')+'</p>':''}<div style="display:flex;gap:6px;margin-top:15px"><button onclick="fit(selected)">定位选中</button><button onclick="enterScope()">${scopeCenter?'以此为中心':'查看关联'}</button></div><h4>直接关系</h4>`;edges.filter(e=>e.source===n.id||e.target===n.id).forEach(e=>{let id=e.source===n.id?e.target:e.source;body+=`<button class="rel" onclick="locate('${id}')">${e.source===n.id?'→':'←'} ${e.label} · ${byId[id].name}</button>`});body+='<button class="primary" onclick="definition()">打开定义 ↗</button>'}else if(selected.size>1){body+=`<div class="card"><h3>已选择 ${selected.size} 个节点</h3><p>拖动其中任一节点可一起移动。</p></div><button onclick="fit(selected)">定位选中</button> <button onclick="selected.clear();render();details()">取消选中</button>`}else body+='<p class="muted">选择一个节点或关系查看详情。</p>';$('inspector').innerHTML=body}
function definition(){$('modalBody').innerHTML='<h3>打开现有定义页面</h3><p>正式实现按稳定标识进入对象、属性、链接、规则或动作的现有页面；编辑或取消后返回图谱，保留视口和选择。</p><p class="muted">此处为导航模拟，不修改任何本体。</p>';$('modal').classList.remove('hidden')}
function locate(id){if(!visibleKinds.has(byId[id].kind)){visibleKinds.add(byId[id].kind);filters();msg('已打开该节点类型筛选')}if(scopeCenter&&!allowed().has(id))exitScope();selected=new Set([id]);edgeId='';render();openDetail();fit(selected);$('results').classList.add('hidden')}
function filters(){let mk=(target,labels,set,all)=>{target.replaceChildren();for(let name of labels){let label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=set.has(name);input.onchange=()=>{input.checked?set.add(name):set.delete(name);if(scopeCenter&&!visibleKinds.has(byId[scopeCenter].kind)){exitScope();msg('中心节点被筛选隐藏，已退出关联查看')}selected=new Set([...selected].filter(id=>allowed().has(id)));edgeId='';render();details();search()};let text=document.createElement('span');text.textContent=name;let count=document.createElement('small');count.textContent=all.filter(x=>(x.kind||x.label)===name).length;label.append(input,text,count);target.append(label)}};mk($('kinds'),Object.keys(colors),visibleKinds,nodes);mk($('relations'),[...new Set(edges.map(e=>e.label))],visibleRels,edges)}
function search(){let q=$('q').value.trim().toLowerCase(),hits=nodes.filter(n=>n.name.toLowerCase().includes(q));$('results').replaceChildren();$('results').classList.toggle('hidden',!q);if(q){let h=document.createElement('small');h.style.padding='9px';h.style.display='block';h.textContent=hits.length+' 个结果 · 搜索仅高亮，不隐藏其他节点';$('results').append(h);hits.forEach(n=>{let b=document.createElement('button');b.textContent=n.name+' · '+n.kind+(allowed().has(n.id)?'':' · 显示并定位');b.onclick=()=>locate(n.id);$('results').append(b)})}render()}
$('q').oninput=search;$('q').onkeydown=e=>{if(e.key==='Enter'){let n=nodes.find(n=>n.name.toLowerCase().includes($('q').value.trim().toLowerCase()));if(n)locate(n.id)}if(e.key==='Escape')$('results').classList.add('hidden')};
function enterScope(){if(selected.size!==1)return;let id=[...selected][0];if(scopeCenter)exitScope();scopeBackup={snapshot:snap(),selected:[...selected],undo:undoStack,redo:redoStack};undoStack=[];redoStack=[];scopeCenter=id;$('scope').hidden=false;$('scopeTitle').textContent=byId[id].name+' · 关联查看';scopeChange()}
function scopeChange(){if(!scopeCenter)return;scopeBackup.snapshot.positions.forEach((p,i)=>Object.assign(nodes[i],p));if($('localLayout').value==='circle'){let list=nodes.filter(n=>allowed().has(n.id)&&n.id!==scopeCenter),c=byId[scopeCenter];list.forEach((n,i)=>{n.x=c.x+270*Math.cos(i/list.length*Math.PI*2);n.y=c.y+200*Math.sin(i/list.length*Math.PI*2)})}undoStack=[];redoStack=[];fit();details()}
function exitScope(){if(!scopeCenter)return;scopeCenter='';$('scope').hidden=true;let b=scopeBackup;scopeBackup=null;selected=new Set(b.selected);undoStack=b.undo;redoStack=b.redo;restore(b.snapshot);details()}
function showAll(){if(scopeCenter)exitScope();visibleKinds=new Set(Object.keys(colors));visibleRels=new Set(edges.map(e=>e.label));selected.clear();edgeId='';$('q').value='';$('results').classList.add('hidden');filters();details();fit()}
function arrange(){remember();let list=nodes.filter(n=>allowed().has(n.id));if($('layout').value==='types'){let ct={};list.forEach(n=>{let col=n.kind==='对象'?0:n.kind.includes('属性')?1:2;let i=ct[col]||0;ct[col]=i+1;n.x=120+col*320;n.y=90+i*100})}else{list.forEach((n,i)=>{n.x=470+360*Math.cos(i/list.length*Math.PI*2);n.y=310+240*Math.sin(i/list.length*Math.PI*2)})}fit();msg('模拟布局已整理，可撤销；不修改业务定义')}
function resetPositions(){remember();let vis=allowed();nodes.forEach((n,i)=>{if(vis.has(n.id))Object.assign(n,base[i])});fit();msg('已重置可见节点位置，可撤销')}
function maximum(){$('shell').classList.toggle('max');$('maxBtn').textContent=$('shell').classList.contains('max')?'退出最大化':'最大化'}
function help(){$('modalBody').innerHTML='<h3>画布操作</h3><p>单击查看详情，Shift+单击增减选择；选择模式拖空白框选，移动模式拖空白平移。Space临时平移。</p><p>F定位选中，Shift+F适应窗口，+ / −缩放。画布内 Ctrl/⌘+Z 撤销布局；加Shift重做。输入框不拦截。</p><p>Esc依次关闭搜索/弹层、退出邻域、取消选中、退出最大化。</p><p class="muted">本原型只演示交互。账号隔离缓存、真实定义导航、精确关联布局与大图性能须按需求实现。</p>';$('modal').classList.remove('hidden')}
function point(e){let r=$('svg').getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}function modelPoint(p){return{x:(p.x-tx)/z,y:(p.y-ty)/z}}
$('svg').onpointerdown=e=>{if(e.button!==0)return;$('stage').focus();$('results').classList.add('hidden');let p=point(e),g=e.target.closest('[data-node]'),ed=e.target.closest('[data-edge]');if(g){let id=g.dataset.node;if(e.shiftKey){selected.has(id)?selected.delete(id):selected.add(id)}else if(!selected.has(id))selected=new Set([id]);edgeId='';drag={kind:'nodes',start:p,snap:snap(),ids:[...selected]}}else if(ed){selected.clear();edgeId=ed.dataset.edge;openDetail();render();return}else{drag={kind:space||tool==='pan'&&!e.shiftKey?'pan':'box',start:p,snap:snap(),add:e.shiftKey,selected:[...selected]}}$('svg').setPointerCapture(e.pointerId);render();details()};
$('svg').onpointermove=e=>{if(!drag)return;let p=point(e),dx=p.x-drag.start.x,dy=p.y-drag.start.y;if(Math.hypot(dx,dy)>3)drag.moved=true;if(drag.kind==='nodes'){drag.ids.forEach(id=>{let i=nodes.findIndex(n=>n.id===id);nodes[i].x=drag.snap.positions[i].x+dx/z;nodes[i].y=drag.snap.positions[i].y+dy/z});render()}else if(drag.kind==='pan'){tx=drag.snap.tx+dx;ty=drag.snap.ty+dy;render()}else{let r=$('rubber');r.setAttribute('visibility','visible');r.setAttribute('x',Math.min(p.x,drag.start.x));r.setAttribute('y',Math.min(p.y,drag.start.y));r.setAttribute('width',Math.abs(dx));r.setAttribute('height',Math.abs(dy))}};
$('svg').onpointerup=e=>{if(!drag)return;let d=drag;drag=null;if(d.kind==='nodes'&&d.moved)remember(d.snap);if(d.kind==='box'){selected=new Set(d.add?d.selected:[]);if(d.moved){let a=modelPoint(d.start),b=modelPoint(point(e)),vis=allowed();nodes.forEach(n=>{if(vis.has(n.id)&&n.x>=Math.min(a.x,b.x)&&n.x<=Math.max(a.x,b.x)&&n.y>=Math.min(a.y,b.y)&&n.y<=Math.max(a.y,b.y))selected.add(n.id)})}edgeId='';$('rubber').setAttribute('visibility','hidden')}render();details();if(selected.size||edgeId)openDetail()};$('svg').ondblclick=e=>{let g=e.target.closest('[data-node]');if(g){selected=new Set([g.dataset.node]);openDetail(true);fit(selected)}};$('svg').addEventListener('wheel',e=>{e.preventDefault();let p=point(e);setZoom(z*(e.deltaY<0?1.12:.893),p.x,p.y)},{passive:false});
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='Escape'){if(!$('modal').classList.contains('hidden'))$('modal').classList.add('hidden');else if(scopeCenter)exitScope();else if(selected.size||edgeId){selected.clear();edgeId='';render();details()}else if($('shell').classList.contains('max'))maximum();return}if(!($('stage')===document.activeElement))return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(e.key===' '){e.preventDefault();space=true}else if(e.key.toLowerCase()==='f'&&!e.metaKey&&!e.ctrlKey){e.preventDefault();fit(!e.shiftKey&&selected.size?selected:allowed())}else if(e.key==='+')zoomBy(1.2);else if(e.key==='-')zoomBy(.833);else if(e.key==='?')help()});document.addEventListener('keyup',e=>{if(e.key===' ')space=false});window.onblur=()=>space=false;
let previous={w:0,h:0};new ResizeObserver(()=>{let w=$('stage').clientWidth,h=$('stage').clientHeight;if(!previous.w)fit();else{tx+=(w-previous.w)/2;ty+=(h-previous.h)/2;render()}previous={w,h}}).observe($('stage'));if(innerWidth<=1280){$('filters').classList.add('hidden');$('filterBtn').classList.remove('on')}filters();render();details();
</script></html>
