const nodes=[{id:'sql',name:'查询所属储能簇',kind:'sql',desc:'根据设备编号查询储能簇编号与额定容量。',input:'设备编号',inputType:'文本',source:'entry',code:BASE.sql,output:'储能簇记录',outputType:'对象列表'},{id:'redis',name:'读取每个簇的 SOC',kind:'redis',desc:'逐条取数，将 SOC 追加到原记录，保留簇编号与容量。',input:'储能簇记录',inputType:'对象列表',source:'sql',code:BASE.redis,output:'含 SOC 的储能簇记录',outputType:'对象列表'},{id:'calc',name:'计算设备 SOC',kind:'calc',desc:'按额定容量加权汇总；SOC 为 0–100 的百分数。',input:'含 SOC 的储能簇记录',inputType:'对象列表',source:'redis',code:BASE.calc,output:'设备 SOC',outputType:'数值'}];

function rangeIds(){const a=nodes.findIndex(n=>n.id===rangeStart),b=nodes.findIndex(n=>n.id===rangeEnd);return a>=0&&b>=a?nodes.slice(a,b+1).map(n=>n.id):[]}

const entry={id:'entry',name:'编排输入',output:'设备编号',outputType:'文本'},end={id:'end',name:'编排输出',output:'设备 SOC',outputType:'数值'};

function renderGraph(){const world=$('#world');if(!world)return;const all=[entry,...nodes,end],width=all.length*236;world.style.width=width+'px';let wires='';for(let i=0;i<all.length;i++){const n=all[i],src=n.id==='end'?flowOutput:n.source;if(!src||src==='fixed')continue;const j=all.findIndex(x=>x.id===src);if(j<0)continue;const x1=j*236+(all[j].kind?200:148)+16,x2=i*236+16;wires+=`<path d="M ${x1} 180 C ${x1+28} 180 ${x2-28} 180 ${x2} 180" marker-end="url(#arrow)"/>`}

return `<section class="block"><details><summary>名称与说明</summary><label>节点名称<input data-name="${n.id}" value="${esc(n.name)}"></label><label>说明<textarea data-desc="${n.id}">${esc(n.desc)}</textarea></label></details></section><section class="block"><div class="row spread"><h3>输入</h3><small>选择来源，带出类型</small></div><div class="param"><div class="p-top"><strong>${esc(n.input)}</strong><span class="tag push">${esc(n.inputType)}</span></div><button class="source" data-source="${n.id}">${esc(sourceName(n))}　⌄</button><details style="margin-top:7px"><summary>参数定义</summary><small>技术名：${n.id==='sql'?'device_id':'rows'} · 必填</small></details></div></section><section class="block"><h3>实现</h3>${implementation}</section><section class="block"><h3>输出</h3><div class="param"><div class="p-top"><strong>${esc(n.output)}</strong><span class="tag push">${esc(n.outputType)}</span></div><small>${n.outputType==='对象列表'?(n.kind==='redis'?'记录字段：id、capacity、soc':'记录字段：id、capacity'):n.outputType==='文本'?'文本，设备编号':'数值，范围约定 0–100'}</small></div></section><section class="block"><details><summary>高级设置</summary><label>超时<input value="30 秒（示例默认值）" readonly></label><p class="help">本原型不执行 SQL、Redis、HTTP 或 Python。</p>${n.kind==='calc'?'<p class="help">空列表、容量合计为 0、缺少 SOC：返回具体错误，不用 0 代替。</p>':''}</details></section>`}

function bindingView(){return `<div class="page-content"><div class="row page-title"><div><h1>储能设备 · SOC</h1><p>电池的剩余电量百分比，描述当前储能设备的荷电状态。</p></div><span class="tag blue push">数值</span></div><section class="card"><details><summary>取值说明</summary><textarea style="margin-top:12px" aria-label="属性取值说明" readonly>按所属储能簇的额定容量，对各簇实时 SOC 进行加权平均。</textarea></details></section><section class="card"><div class="row spread"><h2>属性取值</h2><span class="tag">函数编排</span></div><label class="form-field">选择编排<select aria-label="选择编排"><option>${esc(flowName)}</option></select></label><div class="row spread"><small>输入 1 项 · 输出 1 项 · 内部处理节点 5 个</small><button class="link" data-view="editor">编辑此编排 →</button></div><label class="form-field">取值输出<select><option>设备 SOC · 数值</option></select></label><h3 style="margin-top:24px">输入绑定</h3><div class="two"><label class="form-field">设备编号 · 文本<select id="bindingFrom"><option value="instanceId" ${bindingFrom==='instanceId'?'selected':''}>当前对象 → 实例编号</option><option value="constant" ${bindingFrom==='constant'?'selected':''}>固定值</option></select></label><label class="form-field">${bindingFrom==='constant'?'固定值':'绑定摘要'}<input id="bindingValue" value="${bindingFrom==='constant'?esc(bindingConstant):'当前储能设备的实例编号'}" ${bindingFrom==='constant'?'':'readonly'}></label></div><div class="note">项目：${projectName()}。正式版需要检查连接与输入输出类型，编排测试通过不等于属性取值已验证。</div><div class="row" style="margin-top:20px"><button class="primary" data-action="saveBinding">保存属性来源</button><span class="muted" id="bindingStatus">${bindingSaved?'示例绑定已暂存；未写入工作台':'仅演示绑定，不触发任何业务查询'}</span></div></section></div>`}
function problems(){const p=[];for(const n of nodes){if(!n.name.trim())p.push({id:n.id,text:'节点名称未填写'});if(!n.source)p.push({id:n.id,text:'输入未选择取值来源'});if(!n.code.trim())p.push({id:n.id,text:'实现内容未填写'});if(n.source&&n.source!=='fixed'&&!nodeBy(n.source))p.push({id:n.id,text:'引用的输入来源已失效'});if(project!=='park'&&['sql','redis'].includes(n.kind))p.push({id:n.id,text:'当前项目未配置所需连接'})}if(!flowOutput||!nodes.some(n=>n.id===flowOutput))p.push({id:'end',text:'编排输出未绑定有效来源'});return p}
function renderDock(){const body=$('#dockBody');if(!body)return;if(view==='test')dock='test';body.hidden=!dock;if(!dock)return;$$('[data-dock]').forEach(b=>b.classList.toggle('active',b.dataset.dock===dock));if(dock==='issues'){const p=problems();body.innerHTML=checked===null?'<div class="empty">尚未检查配置。检查不会运行节点。<br><button data-action="check" style="margin-top:12px">检查示例配置</button></div>':`${checked!==generation?'<div class="note warning" style="margin:12px 18px">配置已修改，请重新检查。以下仅为当前示例的本地提示。</div>':''}${p.length?p.map(x=>`<div class="issue"><span class="tag bad">待处理</span><div><strong>${esc(nodeBy(x.id)?.name||x.id)}</strong><br>${esc(x.text)}</div><button class="link" data-select="${x.id}">去处理 →</button></div>`).join(''):'<div class="empty">✓ 示例结构检查通过<br>未验证 SQL 语法、真实连接或自定义实现；不代表正式配置通过。</div>'}`;return}body.innerHTML=`<div class="test-grid"><div class="test-input"><h3>测试输入</h3><select id="testTarget" aria-label="测试范围"><option value="all" ${testTarget==='all'?'selected':''}>整条编排</option><option value="group" ${testTarget==='group'?'selected':''}>连续片段</option>${nodes.map(n=>`<option value="${n.id}" ${testTarget===n.id?'selected':''}>单节点 · ${esc(tagged(n.id))}</option>`).join('')}</select>${testTarget==='group'?rangeControls():''}<small>${esc(inputHint())}</small><label>${['all','sql','normalize'].includes(effectiveTarget())?'设备编号 · 文本':effectiveTarget()==='format'?'SOC · 数值':'输入记录 · JSON 列表'}</label>${['all','sql','normalize','format'].includes(effectiveTarget())?`<input id="testInput" value="${esc(testInput)}" aria-label="测试输入"><small>${effectiveTarget()==='format'?'输入 52.1234 可查看保留两位小数。':'示例设备 1、2；其他编号演示空数据。'}</small>`:`<textarea id="testInput" spellcheck="false" aria-label="测试输入">${esc(testInput)}</textarea>`}<div class="row" style="margin-top:12px"><button class="primary" data-action="execute">运行示例</button><button class="link" data-action="sample">填入示例</button></div></div><div class="test-output" id="testOutput">${resultView()}</div></div>`}
function resultView(){
 if(!result)return '<div class="empty">选择测试范围，填写输入后运行。<br>范围外的节点不会执行，片段内自动传递输出。</div>';
 const stale=result.generation!==generation,entry=result.entries?.find(e=>e.id===resultNode),group=result.target==='group';
 let content='';
 if(entry){if(resultTab==='steps')content=result.entries.map(e=>`<p class="muted" style="padding:7px 0">${e.status==='success'?'✓':e.status==='failed'?'✕':'—'} ${esc(e.name)} · ${e.status==='success'?'成功':e.status==='failed'?'失败':'因上游失败，未执行'}</p>`).join('');else if(resultTab==='input')content=entry.status==='skipped'?'<div class="empty">此节点未执行，没有本次输入。</div>':`<pre>${esc(JSON.stringify(entry.input,null,2))}</pre>`;else if(entry.status==='failed')content=`<div class="note warning">${esc(entry.error)}</div><p class="muted">后续所选节点已停止；范围外节点始终不执行。</p>`;else if(entry.status==='skipped')content='<div class="empty">上游失败，此节点未执行；没有输出。</div>';else content=Array.isArray(entry.output)?rowsTable(entry.output):typeof entry.output==='number'?`<div class="result-value">${esc(entry.output)} <small>%</small></div><pre>${esc(JSON.stringify({soc:entry.output},null,2))}</pre>`:`<pre>${esc(JSON.stringify({device_id:entry.output},null,2))}</pre>`}
 else content=`<div class="note warning">${esc(result.error||'没有执行结果')}</div>`;
 return `<div class="row spread"><h3>${group?'片段测试结果':result.target==='all'?'编排测试结果':'节点测试结果'}</h3><span class="tag ${stale?'warn':result.ok?'ok':'bad'}">${stale?'配置已变化 · 上次结果':result.ok?'示例成功':'示例失败'}</span></div><p class="muted" style="margin:8px 0">${esc(result.scope)}</p><small>${esc(result.project)} · 固定算法本地模拟</small>${result.excluded?.length?`<p class="excluded">本次不执行：${result.excluded.map(esc).join('；')}</p>`:''}${result.entries?.length?`<div class="step-results" aria-label="本次各节点结果">${result.entries.map(e=>`<button data-result-node="${e.id}" class="${resultNode===e.id?'active':''}">${esc(e.name)} <small>${e.status==='success'?'✓':e.status==='failed'?'失败':'未执行'}</small></button>`).join('')}</div><div class="result-tabs"><button data-resulttab="output" class="${resultTab==='output'?'active':''}">输出</button><button data-resulttab="input" class="${resultTab==='input'?'active':''}">本节点输入</button><button data-resulttab="steps" class="${resultTab==='steps'?'active':''}">执行记录</button></div>`:''}${content}`;
}
function rowsTable(rows){if(!rows.length)return '<div class="empty">输出为空列表</div>';const keys=[...new Set(rows.flatMap(x=>Object.keys(x)))];return `<div style="overflow:auto"><table><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${keys.map(k=>`<td>${esc(r[k]??'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function sample(target){if(target==='group')return sample(rangeStart);if(['all','sql','normalize'].includes(target))return '1';if(target==='format')return '52.1234';return JSON.stringify(target==='redis'?[{id:101,capacity:200},{id:102,capacity:300}]:[{id:101,capacity:200,soc:40},{id:102,capacity:300,soc:60}],null,2)}

function validateRows(rows,needSoc){if(!Array.isArray(rows))throw Error('输入应为 JSON 列表，例如 [{"id":101,"capacity":200}]。');rows.forEach((r,i)=>{if(!r||typeof r!=='object'||Array.isArray(r))throw Error(`第 ${i+1} 条记录不是对象。`);if(typeof r.capacity!=='number'||!Number.isFinite(r.capacity)||r.capacity<0)throw Error(`第 ${i+1} 条记录的 capacity 必须是非负数。`);if(needSoc&&(typeof r.soc!=='number'||!Number.isFinite(r.soc)||r.soc<0||r.soc>100))throw Error(`第 ${i+1} 条记录的 soc 缺失或不在 0–100 范围内。`)});return rows}
function runExampleNode(id,value){
 if(id==='normalize'){if(typeof value!=='string'||!value.trim())throw Error('请提供设备编号。');return value.trim()}
 if(id==='sql'){const v=String(value).trim();if(!v)throw Error('请提供设备编号。');return v==='1'?[{id:101,capacity:200},{id:102,capacity:300}]:v==='2'?[{id:201,capacity:120},{id:202,capacity:180}]:[]}
 if(id==='redis'){validateRows(value,false);const socs={101:40,102:60,201:75,202:50};return value.map((r,i)=>{if(socs[r.id]===undefined)throw Error(`第 ${i+1} 条记录（簇 ${r.id??'未知'}）没有 SOC 示例值，停止处理。`);return {...r,soc:socs[r.id]}})}
 if(id==='calc'){validateRows(value,true);const cap=value.reduce((s,r)=>s+r.capacity,0);if(!value.length||cap===0)throw Error('没有可计算记录，或额定容量合计为 0，无法计算 SOC。');return value.reduce((s,r)=>s+r.soc*r.capacity,0)/cap}
 if(id==='format'){if(typeof value!=='number'||!Number.isFinite(value)||value<0||value>100)throw Error('输入 SOC 必须是 0–100 的有限数值。');return Math.round((value+Number.EPSILON)*100)/100}
 throw Error('新增节点不在固定算法示例范围内。')
}
function executeDemo(){
 if($('#testInput'))testInput=$('#testInput').value;
 const ids=targets(),excluded=nodes.filter(n=>!ids.includes(n.id)).map(n=>tagged(n.id));
 const out={generation,target:testTarget,project:projectName(),scope:ids.map(tagged).join(' → '),input:testInput,ok:false,steps:[],executed:[],entries:[],excluded};
 try{
  if(!ids.length)throw Error('请选择有效的起点和终点。');
  if(testTarget==='all'&&(nodes.length!==5||problems().length||flowOutput!=='format'))throw Error('编排配置有缺项或包含新增节点，请检查配置；原型仅支持初始五节点示例。');
  for(let i=0;i<ids.length;i++){
   const n=nodeBy(ids[i]);if(!n||!BASE[n.id]||n.code!==BASE[n.id])throw Error('本原型不执行自定义实现。请恢复原示例，或在正式实现中验证自定义内容。');
   if(i>0&&n.source!==ids[i-1])throw Error('所选片段的参数绑定不连续，请检查节点来源。');
   if(testTarget==='all'&&i===0&&n.source!=='entry')throw Error('编排入口绑定已修改，请恢复示例。');
   if(['sql','redis'].includes(n.id)&&project!=='park')throw Error('储能示范站尚未配置所需连接。请切回创智园二期运行示例。');
  }
  const first=ids[0];let value;
  if(['normalize','sql'].includes(first))value=testInput;
  else if(first==='format'){if(!testInput.trim())throw Error('请填写 SOC 数值。');value=Number(testInput)}
  else{try{value=JSON.parse(testInput)}catch{throw Error('输入不是有效 JSON，请使用标准双引号。')}}
  out.input=JSON.parse(JSON.stringify(value));let failed=false;
  for(const id of ids){const entry={id,name:tagged(id),status:'waiting',input:null,output:null};out.entries.push(entry);if(failed){entry.status='skipped';continue}entry.input=JSON.parse(JSON.stringify(value));try{value=runExampleNode(id,value);entry.output=JSON.parse(JSON.stringify(value));entry.status='success';out.executed.push(id);out.steps.push(entry.name+'：示例成功')}catch(e){entry.status='failed';entry.error=e.message;out.error=e.message;failed=true}}
  if(!failed){out.ok=true;const last=ids.at(-1);out.value=['calc','format'].includes(last)?{soc:value}:last==='normalize'?{device_id:value}:{rows:value};if(Array.isArray(value))out.rows=value}
 }catch(e){out.error=e.message}
 result=out;resultNode=out.entries.find(e=>e.status==='failed')?.id||out.entries.at(-1)?.id||'';resultTab='output';renderDock();renderGraph();
}
function showModal(title,body,foot='<button data-close>关闭</button>',wide=false){focusBefore=document.activeElement;$('#modalRoot').innerHTML=`<div class="modal-shade"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="modal-head"><h2>${esc(title)}</h2><button class="quiet" data-close aria-label="关闭">×</button></header><div class="modal-body">${body}</div><footer class="modal-foot">${foot}</footer></section></div>`;$('#modalRoot input,#modalRoot textarea,#modalRoot select,#modalRoot button')?.focus()}
function closeModal(){$('#modalRoot').innerHTML='';if(focusBefore?.isConnected)focusBefore.focus()}
function sourcePicker(id){sourceOwner=id;const n=nodeBy(id),index=nodes.indexOf(n);const candidates=[entry,...nodes.slice(0,index)];showModal('输入来源 · '+n.input,`<p>选择来源后带出数据类型。只展示当前节点之前的输出，避免循环依赖。</p><input id="sourceSearch" placeholder="搜索节点或输出" aria-label="搜索输入来源"><div id="sourceOptions"><div class="source-group">编排输入与上游节点</div>${candidates.map(c=>{const ok=c.outputType===n.inputType;return `<button class="source-option ${n.source===c.id?'chosen':''}" data-pick-source="${c.id}" ${ok?'':'disabled'}><strong>${esc(c.name)} → ${esc(c.output)}</strong><small>${c.outputType}${ok?'':' · 与当前输入类型不兼容'}</small></button>`}).join('')}<div class="source-group">固定值</div><button class="source-option" data-fixed-source ${n.inputType==='对象列表'?'disabled':''}>输入固定值<small>${n.inputType==='对象列表'?'本例列表输入使用上游记录；单节点测试可直接填写 JSON。':'用于常量参数；与单次测试输入分开。'}</small></button></div><button class="link danger" style="margin-top:15px" data-clear-source>清除当前绑定</button>`)}
function addPicker(){showModal('添加处理节点',`<p>按处理任务选择节点。新节点仅演示配置，不纳入本地算法执行。</p><div class="kind-grid">${Object.entries(KIND).map(([k,t])=>`<button data-add-kind="${k}"><strong>${t}</strong><small>${{sql:'读取表或视图中的数据',redis:'读取实时值，支持逐条记录',calc:'确定性表达式计算',python:'由模型推演代码结果，非沙箱执行',http:'调用业务接口'}[k]}</small></button>`).join('')}</div>`)}
function setProject(p){if(p===project)return;project=p;markChanged();render();notify('已切换运行项目，原测试结果保留并标为过期')}
function resetExample(){nodes.splice(0,nodes.length,...JSON.parse(JSON.stringify(INITIAL_NODES)));flowOutput='format';selected='';checked=null;result=null;Object.keys(testDrafts).forEach(k=>delete testDrafts[k]);testInput='1';testTarget='all';rangeStart='sql';rangeEnd='calc';resultNode='';markChanged();closeModal();render();notify('已恢复初始五节点示例')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if('close'in d){closeModal();return}if(d.view){if(view==='test')testDrafts[draftKey()]=testInput;view=d.view;if(view==='editor'&&dock==='test')dock='';closeModal();render();return}if(d.select){selectNode(d.select);return}if(d.test){openTest(d.test);return}if(d.dock){dock=d.dock;renderDock();return}if(d.source){sourcePicker(d.source);return}if(d.pickSource){const n=nodeBy(sourceOwner);n.source=d.pickSource;n.inputType=nodeBy(d.pickSource).outputType;markChanged();closeModal();renderInspector();renderGraph();return}if('fixedSource'in d){showModal('设置固定值',`<p>输入在每次调用编排时使用的固定值。单次测试输入不会修改此配置。</p><label class="form-field">值<input id="fixedValue" value="${esc(nodeBy(sourceOwner).fixed??'')}"></label>`,'<button data-close>取消</button><button class="primary" data-confirm-fixed>确定</button>');return}if('confirmFixed'in d){const n=nodeBy(sourceOwner);n.source='fixed';n.fixed=$('#fixedValue').value;markChanged();closeModal();renderInspector();renderGraph();return}if('clearSource'in d){nodeBy(sourceOwner).source='';markChanged();closeModal();renderInspector();renderGraph();return}if(d.expand){const n=nodeBy(d.expand);showModal('编辑实现 · '+n.name,`<textarea class="code" id="expandedCode" spellcheck="false">${esc(n.code)}</textarea><small>这里只编辑内容；不会执行用户 SQL 或代码。</small>`,`<button data-close>取消</button><button class="primary" data-apply-code="${n.id}">应用修改</button>`,true);return}if(d.applyCode){nodeBy(d.applyCode).code=$('#expandedCode').value;markChanged();closeModal();renderInspector();return}if(d.resultNode){resultNode=d.resultNode;resultTab='output';$('#testOutput').innerHTML=resultView();return}if(d.resulttab){resultTab=d.resulttab;$('#testOutput').innerHTML=resultView();return}if(d.addKind){const k=d.addKind;showModal('新建'+KIND[k],`<label class="form-field">节点名称<input id="newNodeName" value="${esc(KIND[k])}节点"></label><p id="newNodeError" class="error-text"></p>`,`<button data-close>取消</button><button class="primary" data-confirm-add="${k}">添加节点</button>`);return}if(d.confirmAdd){const name=$('#newNodeName').value.trim();if(!name){$('#newNodeError').textContent='请填写节点名称';return}const k=d.confirmAdd,id='new'+nodeCounter++;nodes.push({id,name,kind:k,desc:'',input:'输入参数',inputType:'文本',source:'',code:k==='python'?'def main(value):\n    return {"result": value}':'',output:'处理结果',outputType:'数值'});selected=id;markChanged();closeModal();render();selectNode(id);return}if(d.delete){const n=nodeBy(d.delete);showModal('删除节点',`<p>删除「${esc(n.name)}」？引用该节点的输入将变为未绑定，相关连线一并移除。</p><p>仅修改本页示例，可通过“模拟范围说明”恢复初始节点。</p>`,`<button data-close>取消</button><button class="danger" data-confirm-delete="${n.id}">删除节点</button>`);return}if(d.confirmDelete){const i=nodes.findIndex(n=>n.id===d.confirmDelete);if(i>=0)nodes.splice(i,1);nodes.forEach(n=>{if(n.source===d.confirmDelete)n.source=''});if(flowOutput===d.confirmDelete)flowOutput='';selected='';if(testTarget===d.confirmDelete){testTarget='all';testInput='1'}markChanged();closeModal();render();return}if(d.info){showModal(d.info,`<p>此入口保留正式工作台的导航位置。本原型聚焦编排编辑、测试和属性绑定，不展开「${esc(d.info)}」。</p>`);return}
const a=d.action||b.id;switch(a){case'list':listOpen=!listOpen;render();break;case'closeInspector':selectNode('');break;case'check':checked=generation;dock='issues';render();break;case'add':addPicker();break;case'dock':dock=dock?'':'issues';render();break;case'execute':executeDemo();break;case'sample':testInput=sample(testTarget);renderDock();break;case'fit':{const vp=$('#viewport');zoom=Math.min(1,Math.max(.35,(vp.clientWidth-50)/([entry,...nodes,end].length*236)));vp.scrollLeft=0;renderGraph();break}case'actual':zoom=1;renderGraph();break;case'zoomin':zoom=Math.min(1.5,zoom+.1);renderGraph();break;case'zoomout':zoom=Math.max(.35,zoom-.1);renderGraph();break;case'collapse':$('#rail').classList.toggle('mini');break;case'rename':showModal('编排名称',`<label class="form-field">名称<input id="flowNameInput" value="${esc(flowName)}"></label><p id="nameError" class="error-text"></p>`,'<button data-close>取消</button><button class="primary" data-action="confirmRename">确定</button>');break;case'confirmRename':if(!$('#flowNameInput').value.trim()){$('#nameError').textContent='请填写名称';break}flowName=$('#flowNameInput').value.trim();markChanged();closeModal();render();break;case'saveBinding':if(bindingFrom==='constant'&&!bindingConstant.trim()){notify('请填写设备编号固定值');break}if(!nodeBy(flowOutput)){notify('编排输出已失效，请先修复编排');break}bindingSaved=true;$('#bindingStatus').textContent='示例绑定已暂存；未写入工作台';notify('属性绑定已在本页暂存');break;case'scopeInfo':showModal('原型模拟范围',`<p>可体验：编排列表、节点选择与编辑、参数来源选择、增删节点、项目切换、单节点测试、连续片段测试、整条示例测试、返回属性绑定。</p><p>测试用本地固定样例计算，不连接数据库、Redis、HTTP 或模型；不执行输入的 SQL、Python 和自定义公式。编辑实现后不会用旧逻辑伪装执行成功。</p><p>逐条取数并保留记录、列表加权表达式仅为示意能力，不在本期实施范围；正式验收采用现有标量公式链。图中坐标固定，不演示自由拖动、分支多边界输入、跨项目连接映射或运行历史。</p><p>所有修改仅在本页内存中，刷新清空。编排菜单位置仅沿用示例导航，不涉及本次导航重组。</p><p>配套文档：<a href="需求说明.md">需求说明 v1.1</a> · <a href="开发计划.md">开发计划</a> · <a href="执行指令.md">执行指令</a></p>`,'<button data-action="resetExample">恢复初始节点</button><button data-close>关闭</button>');break;case'resetExample':resetExample();break}}
);
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.code){nodeBy(d.code).code=t.value;markChanged()}else if(d.name){nodeBy(d.name).name=t.value;markChanged();renderGraph()}else if(d.desc){nodeBy(d.desc).desc=t.value;markChanged()}else if(t.id==='testInput'){testInput=t.value;testDrafts[draftKey()]=testInput}else if(t.id==='bindingValue'){bindingConstant=t.value;bindingSaved=false;$('#bindingStatus').textContent='有未保存的示例修改'}else if(t.id==='nodeSearch')$$('#nodeRows button').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(t.value.toLowerCase()));else if(t.id==='sourceSearch')$$('.source-option').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(t.value.toLowerCase()));else if(t.id==='flowSearch'){const match=flowName.toLowerCase().includes(t.value.toLowerCase());$('#flowRow').hidden=!match;$('#noFlows').hidden=match}});
document.addEventListener('change',e=>{const t=e.target;if(['railProject','runProject'].includes(t.id))setProject(t.value);else if(t.id==='testTarget'){testDrafts[draftKey()]=testInput;testTarget=t.value;testInput=testDrafts[draftKey()]??sample(testTarget);renderDock()}else if(t.id==='rangeStart'||t.id==='rangeEnd'){testDrafts[draftKey()]=testInput;if(t.id==='rangeStart')rangeStart=t.value;else rangeEnd=t.value;testInput=testDrafts[draftKey()]??sample('group');renderDock()}else if(t.id==='outputSource'){flowOutput=t.value;markChanged();renderGraph()}else if(t.id==='bindingFrom'){bindingFrom=t.value;bindingSaved=false;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modalRoot').children.length)closeModal();else if(selected)selectNode('');return}if(e.key==='Tab'&&$('#modalRoot .modal')){const all=$$('#modalRoot button,#modalRoot input,#modalRoot textarea,#modalRoot select').filter(x=>!x.disabled&&!x.hidden);if(e.shiftKey&&document.activeElement===all[0]){e.preventDefault();all.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===all.at(-1)){e.preventDefault();all[0]?.focus()}}});
render();
</script><style>
