const rows=[['O01','共享修改保护','保留既有高影响保存保护，不重新设计弹窗','既有功能，回归验收'],['O02','引用完整性','移除关联不删定义；依赖未处理不能删除','既有功能，回归验收'],['O03 / O04','返回、阅读、入口与布局','编辑返回、长文本、术语说明、菜单精简','下一期'],['P01','检查有效性','保留检查过期、读取失败不假通过；概览与待办重排延期','拆分：功能本期'],['P02','映射列表和编辑体验','统一表格/状态标签/说明顺序/折叠方式','下一期'],['P03','来源变更数据保护','依赖检测、保留原绑定、无效配置不得发布；新影响交互延期','拆分：功能本期'],['P04','连接与目录正确性','凭据、连通与目录结果真实；依赖完整性；字段丢失保留配置','拆分：功能本期'],['P05','编排绑定有效性','按声明校验输入输出；依赖变化使检查失效；返回路径/引用展示延期','拆分：功能本期'],['P06','项目发布校验','当前基线与服务端复核；问题去重分组/定位返回/发布页重排延期','拆分：功能本期'],['P07','引用切换数据保护','比较绑定基线；冲突拒绝；不静默丢弃配置；新比较界面延期','拆分：功能本期']];

function scope(){return `<section class="card"><h1>改版 v2 · 暂缓样式和交互优化</h1><p>本期只保留数据、引用、配置与发布正确性。已有界面和已实现保护继续使用，不做新的布局、抽屉、返回路径或交互流程改造。</p><p><strong>必要错误反馈沿用现有组件；不把新增影响弹窗作为本期交付要求。</strong></p><div class="tablewrap"><table class="changes"><thead><tr><th>编号</th><th>功能</th><th>范围</th><th>本期处理</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section><section class="card"><h2>原型如何评审</h2><p>切换本体/项目，点击“模拟…”观察功能约束：失败不假成功、变更使检查失效、旧配置不丢、发布不能绕过校验。模拟按钮不是待新增的产品按钮。</p>${btn('查看本体保护','nav','data-page="ontology"','primary')} ${btn('查看项目校验','nav','data-page="validation"')}</section><section class="card"><h2>继续延期</h2><p>管理本体、本体校验发布及版本恢复、对象级本体校验、MCP口径生成、编排依赖冻结体系继续延期。下一期的样式/交互方案仍需重新确认，不自动开工。</p></section>`}
function ontology(){return `<section class="card"><h1>共享属性 · 额定容量</h1>${mark('O01','验收既有保护：高影响保存依赖当前编辑内容和引用集合；不是新增编辑交互。')}<p>当前引用：${s.refs.join('、')||'无'} · 当前草稿修订 ${s.ontRev}</p><label class="field"><span>数据类型</span><select id="type">${['数值','文本'].map(v=>`<option ${s.editType===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><span>业务定义</span><textarea id="definition">${esc(s.editDefinition)}</textarea></label>${btn('模拟保存检查','shared-check','','primary')} ${btn('模拟引用发生变化','refs-change')}${s.impact?`<div class="notice warning"><strong>已有影响确认的功能示意</strong><p>类型：${esc(s.shared.type)} → ${esc(s.editType)}<br>原定义：${esc(s.shared.definition)}<br>新定义：${esc(s.editDefinition)}<br>影响：${s.refs.join('、')}</p>${btn('取消确认，保留输入','impact-cancel')} ${btn('模拟已确认后保存','impact-save')}</div>`:''}${postponed('编辑容器、返回位置、展示样式和长文本优化')}</section><section class="card"><h2>引用与删除</h2>${mark('O02','依赖保护继续保留，不因交互延期取消已有保护。')}<p>规则：储能SOC口径 · ${s.ruleExists?'定义存在':'定义已删除'} · 引用：${s.ruleRefs.join('、')||'无'}</p>${btn('模拟删除规则定义','rule-delete')} ${btn('模拟移除簇的规则关联','rule-unlink')} ${btn('模拟容量转为私有','detach')}<p>簇容量：${s.privateCluster?'已转为私有，内容保留':'共享引用'}；设备的共享引用${s.refs.includes('储能设备')?'仍保留':'已变化'}。</p></section>`}
function home(){return `<section class="card"><h1>项目概览 · 创智园二期</h1>${mark('P01','保留检查基线有效性；不重排概览或新增待办。')}<p>引用储能本体 ${s.reference} · 草稿 r${s.revision}</p>${showResult(s.checkFailed?'读取/检查失败，不能判断为零问题。':fresh()?'检查结果对应当前配置基线。':'旧检查结果已过期，不能作为当前通过依据。')}${btn('模拟说明改动','note-change')} ${btn('模拟检查失败','check-fail')} ${btn('重新检查（模拟）','check')}${postponed('概览卡片、统计排版、待办定位入口')}</section>`}
function binding(){return `<section class="card"><h1>对象映射 · 储能簇</h1>${mark('P03','只演示来源变更的数据保护，新增影响清单/确认流程延期。')}<p>来源表：${esc(s.table)}</p><p>额定容量绑定：m_storage_cluster_phase.capacity</p><p>说明：${esc(s.rawNote)}</p>${btn('模拟换来源表','source-change')} ${btn('模拟手动恢复来源表','source-restore')}${showResult(problems().filter(x=>x.includes('实例来源')).join('\n')||'当前来源与容量绑定相容。')}<p class="muted">旧绑定不被删除或自动同名迁移；失效时允许保留草稿，但不能通过发布校验。若正式协议不能保留中间态，应拒绝本次变更并保留编辑输入，不能清空配置。</p>${postponed('P02全部；映射列表、状态标签、说明位置、默认展开及新来源影响弹窗')}</section>`}
function connections(){return `<section class="card"><h1>数据连接 · 项目业务库</h1>${mark('P04','保留结果真实性与依赖保护；不要求三列状态、引用抽屉或新目录差异页面。')}<p>凭据：${s.credential?'已配置':'缺失'}；连通：${s.network}；目录版本：${s.catalogRevision}</p><p>目录字段：${s.catalog.join('、')}；原属性字段：${s.field}</p>${btn('模拟连通成功','connect')} ${btn('模拟目录删除capacity','catalog-change')} ${btn('模拟目录恢复capacity','catalog-restore')} ${btn('模拟依赖读取失败','dependency-fail')} ${btn('模拟删除连接','connection-delete')}${showResult(problems().filter(x=>x.includes('目录')).join('\n')||'仅有连通记录不证明实际属性取值成功。')}${postponed('连接状态布局、使用位置抽屉、目录差异定位入口')}</section>`}
function flows(){return `<section class="card"><h1>函数编排 · 设备SOC计算</h1>${mark('P05','保留输入输出匹配与依赖变更失效，不重做编排编辑器。')}<p>声明输入：${s.flowInputs.join('、')}；属性原绑定：${s.bindingInput} ← 当前实例ID；输出：soc（数值）。</p>${btn('模拟删除原输入声明','flow-change')} ${btn('模拟恢复原声明','flow-restore')}${showResult(problems().filter(x=>x.includes('编排')).join('\n')||'当前输入绑定与声明相容；未执行任何节点。')}<div class="notice warning">既有单节点、连续片段及全流程测试保持。项目快照尚不能据此保证编排内容固定；依赖冻结继续另议。</div>${postponed('输入输出摘要布局、引用筛选和展示、进入编排再返回属性的新增交互')}</section>`}
function validation(){const p=problems();return `<section class="card"><h1>项目校验与发布</h1>${mark('P06','保留当前基线、依赖完整性与发布时重验；不改问题列表及修复路径。')}<p>草稿 r${s.revision}；上次检查 r${s.checked}；${s.checkFailed?'检查失败':fresh()?'基线有效':'结果过期'}</p>${showResult(s.checkFailed?'检查失败，不能得出是否通过。':p.length?p.join('\n'):'此示例当前未发现配置错误；不代表真实执行成功。')}${btn('检查当前配置（模拟）','check','','primary')} ${btn('模拟检查失败','check-fail')} ${btn('模拟发布请求','publish-request')} ${btn('模拟提交发布','publish-submit')}<p>已发布项目版本：v${s.published}；发布请求基线：${s.publishRequest===null?'尚未发起':'r'+s.publishRequest}</p><p class="muted">两个模拟按钮用于在请求与提交间插入变更、验证服务端拒绝，不是要求正式产品新增两步确认。</p>${postponed('问题去重分组呈现、精准跳转后返回重查、发布页面重组')}</section>`}
function reference(){return `<section class="card"><h1>管理引用版本</h1>${mark('P07','保留既有比较/确认流程的数据约束，不开发新版差异展示。')}<p>当前引用 ${s.reference} → 目标 ${s.target}</p><p>示例目标3.0.0移除了采样SOC。切换后原配置保留为失效项，不能发布。</p>${btn('模拟已有比较','compare')} ${btn('模拟并发改动','concurrent')} ${btn('模拟切换失败','switch-fail')} ${btn('模拟已有确认切换','switch')}<p>比较基线：${s.preview===null?'无':'r'+s.preview}；旧采样配置：${s.retired?'保留，引用失效':'保留，引用有效'}</p>${postponed('新影响分类、比较排版、确认后自动定位待修复项')}</section>`}
function render(){const nav=s.space==='ontology'?[['ontology','对象与共享定义']]:[['home','项目概览'],['connections','数据连接'],['binding','对象映射'],['flows','函数编排'],['validation','项目校验与发布'],['reference','管理引用版本']];document.getElementById('app').innerHTML=`<aside class="rail"><div class="brand">◇ 本体工作台<small>FUNCTIONAL SCOPE · V2</small></div><div class="spaces">${btn('本体','space','data-value="ontology"',s.space==='ontology'?'active':'')}${btn('项目','space','data-value="project"',s.space==='project'?'active':'')}</div><nav>${btn('改动范围','nav','data-page="scope"',s.page==='scope'?'active':'')}${nav.map(([id,t])=>btn(t,'nav',`data-page="${id}"`,s.page===id?'active':'')).join('')}</nav><div class="muted">原型导航仅组织功能演示，不改正式菜单。</div></aside><header class="top"><strong>${names[s.page]}</strong><span class="status">仅内存模拟</span></header><div class="shell"><div class="demo"><strong>v2 · 样式与交互优化延期</strong>${btn(s.mark?'隐藏改动标注':'显示改动标注','marks')}${btn('重置','reset')}<a href="需求说明.md">当前需求 v2</a><a href="交互原型_v1.html">历史 v1（含延期方案）</a></div><main>${s.notice?`<div class="notice" role="status">${esc(s.notice)}</div>`:''}${({scope,ontology,home,binding,connections,flows,validation,reference})[s.page]()}<p class="footnote">无网络、无真实数据、无设备操作。模拟控件用于验证功能约束，不是新增产品交互需求。</p></main></div>`}
function act(a,d={}){capture();if(a==='reset'){location.reload();return}if(a==='marks'){s.mark=!s.mark;render();return}if(a==='space'){s.space=d.value;s.page=s.space==='ontology'?'ontology':'home';s.notice='';render();return}if(a==='nav'){s.page=d.page;if(d.page!=='scope')s.space=d.page==='ontology'?'ontology':'project';s.notice='';render();return}
if(a==='shared-check'){if(!s.editDefinition.trim()){s.notice='定义不能为空。'}else if(s.editType===s.shared.type&&s.editDefinition===s.shared.definition){s.notice='无修改，不生成修订。'}else{s.impact=JSON.stringify([s.shared,s.refs,s.editType,s.editDefinition]);s.notice='模拟既有高影响保护：确认前不保存。'}}
if(a==='impact-cancel'){s.impact=null;s.notice='取消确认，未保存内容保留。'}
if(a==='refs-change'){s.refs=s.refs.includes('储能系统')?s.refs.filter(x=>x!=='储能系统'):[...s.refs,'储能系统'];s.notice='模拟其他编辑改变引用集合，旧确认不能复用。'}
if(a==='impact-save'){if(!s.impact||s.impact!==JSON.stringify([s.shared,s.refs,s.editType,s.editDefinition])){s.notice='基线或编辑内容已变化，请重新核对。';s.impact=null}else{s.shared={type:s.editType,definition:s.editDefinition};s.ontRev++;s.impact=null;s.notice='本体草稿已模拟保存，项目固定引用和项目检查基线未改变。'}}
if(a==='rule-unlink'){s.ruleRefs=[];s.notice='仅解除关联，规则定义仍保留。'}if(a==='rule-delete'){if(s.ruleRefs.length)s.notice='阻断：储能簇仍引用该规则。';else{s.ruleExists=false;s.notice='模拟现有确认后删除无引用规则定义。'}}if(a==='detach'){s.privateCluster=true;s.refs=s.refs.filter(x=>x!=='储能簇');s.notice='仅当前对象转为私有，保留当前内容；其他共享引用不变。'}
if(a==='note-change'){s.rawNote+='（已修订）';changed('说明已变化，旧检查过期。')}
if(a==='source-change'){s.table='m_storage_cluster_new';changed('来源改变，原属性与说明保留。')}
if(a==='source-restore'){s.table='m_storage_cluster_phase';changed('恢复来源后也须重新检查，不能复用旧结果。')}
if(a==='connect'){s.network='可达（模拟）';s.notice='连通成功不修改项目检查结果，也不自动刷新目录。'}
if(a==='catalog-change'||a==='catalog-restore'){s.catalog=a==='catalog-change'?['id']:['capacity','id'];s.catalogRevision++;changed('目录变化，相关检查失效；原字段capacity未删除。')}
if(a==='dependency-fail'){s.dependencyFailed=true;s.notice='依赖读取失败，不能据此认为没有引用。'}
if(a==='connection-delete')s.notice=s.dependencyFailed?'阻断：无法确认依赖，连接未删除。':'阻断：对象、属性与编排仍引用连接。';
if(a==='flow-change'||a==='flow-restore'){s.flowInputs=a==='flow-change'?['deviceKey']:['storageId'];changed('编排声明变化，原输入绑定保留，项目检查失效。')}
if(a==='check-fail'){s.checkFailed=true;s.notice='检查失败，旧结果不可作为当前通过依据。'}
if(a==='check'){s.checked=s.revision;s.checkFailed=false;s.notice='模拟配置检查完成：'+problems().length+'项阻断。没有执行业务查询。'}
if(a==='publish-request'){if(!fresh()||problems().length){s.notice='拒绝发起：需要当前检查有效且无阻断。';s.publishRequest=null}else{s.publishRequest=s.revision;s.notice='模拟请求已记录基线；实际提交仍要重新校验。'}}
if(a==='publish-submit'){if(s.publishRequest===null||s.publishRequest!==s.revision||!fresh()||problems().length)s.notice='发布被拒绝：请求基线或依赖已失效，请重新检查。';else{s.published++;s.publishRequest=null;s.notice='项目配置发布成功（模拟），未冻结外部编排、未执行操作。'}}
if(a==='compare'){s.preview=s.revision;s.notice='既有比较完成（模拟），绑定当前项目修订。'}
if(a==='concurrent'){changed('模拟并发更新：旧比较与检查失效。')}
if(a==='switch-fail'){s.failSave=true;s.notice='下一次切换模拟保存失败，原引用应保持。'}
if(a==='switch'){if(s.preview!==s.revision)s.notice='拒绝切换：请先对当前修订重新比较。';else if(s.failSave){s.failSave=false;s.notice='保存失败，项目引用未改变。'}else{s.reference=s.target;s.retired=true;changed('仅更新项目草稿引用；旧采样配置保留，引用失效需处理。')}}
render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,b.dataset)});
window.__prototype={s,act,render,problems,fresh,rows};render();
</script></body></html>
