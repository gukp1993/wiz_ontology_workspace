<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>函数编排 · 交互优化方案 v1</title>
<style>
:root{--ink:#203249;--muted:#65758a;--line:#dce3ed;--blue:#2458d5;--soft:#edf3ff;--bg:#f5f7fb;--bad:#b53434;--good:#168054;--amber:#9b660d}*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:white;border:1px solid var(--line);border-radius:6px;padding:7px 12px;white-space:nowrap}button:hover{border-color:#8ca7da;background:#f5f8ff}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:var(--blue);border-color:var(--blue);color:white}.quiet{border-color:transparent;background:transparent}.active{background:var(--soft)!important;color:var(--blue)!important;border-color:#97b2ee!important}.muted,small{color:var(--muted)}small{font-size:12px}.badge{font-size:12px;border-radius:12px;padding:2px 8px;background:#eef1f6}.error{color:var(--bad)}.good{color:var(--good)}.amber{color:var(--amber)}[hidden]{display:none!important}a{color:var(--blue)}
.shell{height:100dvh;display:flex;overflow:hidden}.rail{width:64px;flex-shrink:0;background:#182d42;color:white;display:flex;align-items:center;flex-direction:column;padding:18px 8px;gap:20px}.rail strong{font-size:24px}.rail button{background:transparent;color:#bed0e2;border:0;padding:10px;font-size:12px}.rail button.active{background:#2b4560!important;color:white!important}.rail small{writing-mode:vertical-rl;letter-spacing:3px;color:#99acc1;margin-top:auto}.page{display:flex;flex:1;min-width:0;min-height:0;flex-direction:column}.head{padding:12px 20px 10px;background:white;border-bottom:1px solid var(--line)}.headrow,.row{display:flex;align-items:center;gap:10px}.headrow{justify-content:space-between;flex-wrap:wrap}.titlegroup{display:flex;align-items:center;gap:12px;min-width:0}.titlegroup h1{font-size:18px;margin:0}.head small{display:block;margin-top:6px}.head details{margin:6px 0 0;color:var(--muted);font-size:12px}.head summary{cursor:pointer}.head p{margin:8px 0}.toolbar{display:flex;gap:6px;align-items:center;min-height:50px;padding:8px 16px;border-bottom:1px solid var(--line);background:white;flex-wrap:wrap}.push{margin-left:auto}.modebar{min-height:40px;display:flex;align-items:center;gap:10px;padding:6px 18px;background:#f0f4fa;border-bottom:1px solid var(--line);font-size:12px}.modebar button{padding:3px 8px}.body{display:flex;min-height:0;flex:1;position:relative}.nodes{width:180px;flex-shrink:0;background:white;border-right:1px solid var(--line);overflow:auto;padding:12px 8px}.nodes h3{font-size:12px;margin:4px 8px 12px;color:var(--muted)}.listrow{display:flex;align-items:center;gap:5px;margin:3px 0}.listrow button{flex:1;min-width:0;text-align:left;white-space:normal;border-color:transparent;display:flex;flex-direction:column}.listrow small{margin-top:3px}.listrow input{width:16px;height:16px}.center{min-width:0;flex:1;position:relative;overflow:hidden;background-image:radial-gradient(#d5dfed 1px,transparent 1px);background-size:20px 20px}.viewport{position:absolute;inset:0;overflow:auto}.world{width:920px;height:460px;position:relative;transform-origin:0 0}.wires{position:absolute;inset:0;pointer-events:none}.node{position:absolute;width:158px;min-height:72px;padding:12px;text-align:left;white-space:normal;box-shadow:0 3px 10px #172f5010;background:white;border-left:4px solid #6a87b9;border-radius:8px}.node strong{display:block;font-size:14px;line-height:1.4}.node small{display:block;margin-bottom:4px;font-size:11px}.node.sql{border-left-color:#399b72}.node.calc{border-left-color:#b86b9a}.node.boundary{border-left-color:#8170b1;min-height:60px}.node.checked{outline:2px dashed #327f87;outline-offset:4px}.node .mark{display:inline-block;font-size:11px;color:var(--bad);margin-top:5px}.pick{position:absolute;z-index:2;width:24px;height:24px}.canvasnote{position:absolute;bottom:12px;left:14px;pointer-events:none;font-size:12px;color:var(--muted);background:#ffffffeb;padding:6px 10px;border-radius:6px}.inspector{width:400px;flex-shrink:0;background:white;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.detailhead{padding:14px 18px 10px;border-bottom:1px solid var(--line)}.detailhead h2{font-size:16px;margin:6px 0}.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 12px}.tabs button{flex:1;padding:10px 4px;border:0;border-bottom:2px solid transparent;border-radius:0}.tabs button.active{border-bottom:2px solid var(--blue)!important}.content{padding:18px;overflow:auto;flex:1;min-height:0}.content label{display:block;font-weight:600;font-size:12px;margin:0 0 6px}.content input,.content select,.content textarea,.modal input,.modal select{width:100%;padding:9px 10px;border:1px solid #cbd6e6;border-radius:5px;background:white;margin:0 0 10px}.content textarea{resize:vertical;min-height:70px}.content p{font-size:12px;color:var(--muted);margin-top:4px}.field{padding:12px;border:1px solid var(--line);border-radius:6px;margin:12px 0}.field.focused{outline:2px solid var(--blue);background:#f5f8ff}.code{font:12px/1.8 ui-monospace,Menlo,monospace!important;min-height:215px!important;white-space:pre;overflow:auto}.notice{background:#f1f5fc;border-radius:6px;padding:10px;font-size:12px;margin:12px 0}.dock{background:white;border-top:1px solid var(--line);flex-shrink:0}.dockhead{display:flex;align-items:center;padding:6px 16px;gap:10px}.dockcontent{height:178px;overflow:auto;padding:0 18px 12px}.issue{display:flex;gap:14px;align-items:center;border-top:1px solid #edf0f5;padding:10px 0}.issue button{margin-left:auto}.resultgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.resultgrid>div{border:1px solid var(--line);padding:14px;border-radius:6px}.menuwrap{position:relative}.menu{position:absolute;top:40px;left:0;background:white;border:1px solid var(--line);box-shadow:0 8px 24px #162d4d22;min-width:160px;padding:5px;z-index:15;border-radius:7px}.menu button{display:block;border:0;width:100%;text-align:left}.modalback{position:fixed;inset:0;background:#13243d66;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}.modal{background:white;border-radius:10px;width:560px;max-width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 60px #0f213a44}.modal h2{font-size:18px;margin:0 0 16px}.modal .row{justify-content:flex-end;margin-top:18px}.modal .code{width:100%;height:45vh;border:1px solid var(--line);padding:12px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:10px 18px;background:#24384e;color:white;box-shadow:0 4px 20px #0002;border-radius:7px;z-index:80;max-width:85vw}.prototype{padding:5px 16px;background:#fff8e9;color:#82611f;font-size:11px;border-bottom:1px solid #efdfba}.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:1439px){.nodes{position:absolute;inset:0 auto 0 0;z-index:18;box-shadow:8px 0 20px #1b32531a;width:210px}}@media(max-width:1099px){.inspector{position:absolute;right:0;top:0;bottom:0;z-index:20;width:400px;box-shadow:-8px 0 24px #142e5222}.head{padding:10px 14px}.titlegroup h1{font-size:16px}}@media(max-width:767px){.rail{display:none}.inspector{width:100%}.headrow{gap:8px}.headrow .row{flex-wrap:wrap}.toolbar{gap:4px;padding:6px}.toolbar button{padding:6px}.modebar{flex-wrap:wrap}.resultgrid{grid-template-columns:1fr}.dockcontent{height:170px}.titlegroup{flex-wrap:wrap}.prototype{font-size:10px}}@media(max-height:690px){.dock.expanded{position:absolute;bottom:0;left:64px;right:0;z-index:25;box-shadow:0 -8px 24px #162f5122}.dockcontent{height:170px}}
</style></head>
<body><div class="shell"><aside class="rail"><strong title="本体工作台">◇</strong><button title="项目工作区" data-info="原型聚焦函数编排；正式页面保留工作区导航。">项目</button><button class="active" title="函数编排">编排</button><small>ONTOLOGY WORKSPACE</small></aside><main class="page">
<div class="prototype">交互原型 v1 · 不连接业务系统，不保存数据；检查、绑定、运行均为本地模拟。完整方案见同目录需求说明。</div>
<header class="head"><div class="headrow"><div class="titlegroup"><button class="quiet" id="back">← 编排列表</button><h1>设备 SOC 计算</h1></div><div class="row"><small id="save">原型未持久化</small><button id="check">检查配置</button><button id="checkState" class="quiet">尚未检查</button><button class="primary" id="runAll">运行全部</button></div></div><details><summary>说明与运行上下文</summary><p>示例：通过额定容量和剩余电量计算 SOC。当前项目：创智园二期（示例）。实际运行将使用项目配置的连接。</p></details></header>
<div class="toolbar"><button id="toggleList" aria-expanded="false">节点列表</button><div class="menuwrap"><button id="add" aria-expanded="false">＋ 添加节点</button><div class="menu" id="addMenu" hidden><button data-kind="sql">SQL 查询</button><button data-kind="python">Python</button><button data-kind="calc">计算公式</button><button data-kind="redis">Redis</button><button data-kind="http">HTTP 请求</button></div></div><button id="bindMode">建立绑定</button><button id="testMode">选择测试节点</button><span class="push"></span><button id="layout">整理</button><button id="fit">全图</button><button id="actual">100%</button></div>
<div class="modebar" id="modebar"></div>
<section class="body"><aside class="nodes" id="list" hidden><h3>节点 <span id="nodeCount"></span></h3><div id="nodeList"></div></aside><section class="center" aria-label="编排画布"><div class="viewport" id="viewport"><div class="world" id="world"><svg class="wires" width="920" height="460" aria-label="由输入绑定派生的关系线"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#8fa6c2"/></marker></defs><g id="lines"></g></svg><div id="graph"></div></div></div><div class="canvasnote">点击节点查看配置 · 选择测试范围不会替代详情选择</div></section><aside class="inspector" id="inspector" hidden><header class="detailhead"><div class="row"><small id="nodeType"></small><span class="push"></span><button class="quiet" id="closeDetail" aria-label="关闭节点详情">×</button></div><h2 id="nodeTitle"></h2><div class="row"><button id="testNode">测试此节点</button><button class="quiet" id="more">更多操作…</button></div></header><nav class="tabs" aria-label="节点配置"><button data-tab="inputs">输入</button><button data-tab="implementation">实现</button><button data-tab="outputs">输出</button><button data-tab="advanced">高级</button></nav><div class="content" id="content"></div></aside></section>
<section class="dock" id="dock"><div class="dockhead"><button class="quiet" id="issuesTab">问题 <span id="issueCount"></span></button><button class="quiet" id="resultsTab">本次结果</button><small id="dockState">尚未检查</small><button id="collapseDock" class="quiet push" aria-label="展开或收起问题和结果">展开 ↑</button></div><div class="dockcontent" id="dockContent" hidden></div></section></main></div>
<div class="modalback" id="modalBack" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="row"><button id="modalCancel">取消</button><button class="primary" id="modalOk">确认</button></div></section></div><div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
const $=id=>document.getElementById(id);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kinds={sql:'SQL',python:'Python · LLM 推演',calc:'计算公式',redis:'Redis',http:'HTTP',boundary:'编排边界'};
let nodes=[{id:'input',name:'编排输入',kind:'boundary',x:45,y:185},{id:'cap',name:'查询额定容量',kind:'sql',x:260,y:105},{id:'soc',name:'计算设备 SOC',kind:'calc',x:495,y:185},{id:'output',name:'编排输出',kind:'boundary',x:730,y:265}];
let selected='',tab='implementation',mode='inspect',source='',tests=new Set(),bound=false,outBound=false,checked=false,stale=false,issues=[],dockOpen=false,dockTab='issues',result=null,generation=0,zoom=1,dialogAction=null,dialogReturn=null,dialogDirty=false,code='SELECT rated_capacity\nFROM storage_device\nWHERE id = :storageId';
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3500)}
function dirty(){generation++;if(checked)stale=true;renderStatus();renderDock();$('save').textContent='原型已修改 · 未持久化'}
function nodeIssue(id){return checked&&!stale?issues.filter(x=>x.id===id).length:0}
function draw(){
 $('nodeCount').textContent=nodes.length;$('nodeList').innerHTML=nodes.map(n=>`<div class="listrow">${mode==='test'&&n.kind!=='boundary'?`<input type="checkbox" aria-label="测试 ${escapeHtml(n.name)}" data-pick="${n.id}" ${tests.has(n.id)?'checked':''}>`:''}<button data-node="${n.id}" class="${selected===n.id?'active':''}"><strong>${escapeHtml(n.name)}</strong><small>${kinds[n.kind]}${nodeIssue(n.id)?` · ${nodeIssue(n.id)} 个问题`:''}</small></button></div>`).join('');
 $('graph').innerHTML=nodes.map(n=>`${mode==='test'&&n.kind!=='boundary'?`<input class="pick" type="checkbox" data-pick="${n.id}" style="left:${n.x-8}px;top:${n.y-11}px" aria-label="测试 ${escapeHtml(n.name)}" ${tests.has(n.id)?'checked':''}>`:''}<button data-node="${n.id}" class="node ${n.kind} ${selected===n.id?'active':''} ${tests.has(n.id)&&mode==='test'?'checked':''}" style="left:${n.x}px;top:${n.y}px"><small>${kinds[n.kind]}</small><strong>${escapeHtml(n.name)}</strong>${nodeIssue(n.id)?`<span class="mark">! ${nodeIssue(n.id)} 个问题</span>`:''}</button>`).join('');
 const has=id=>nodes.some(n=>n.id===id);let wires=[];if(has('cap'))wires.push([203,215,260,140]);if(bound&&has('cap')&&has('soc'))wires.push([418,145,495,220]);if(outBound&&has('soc'))wires.push([653,225,730,297]);$('lines').innerHTML=wires.map(([x,y,a,b])=>`<path d="M${x},${y} C${(x+a)/2},${y} ${(x+a)/2},${b} ${a},${b}" stroke="#8fa6c2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>`).join('');renderMode();
}
function renderMode(){
 $('bindMode').classList.toggle('active',mode==='bind');$('testMode').classList.toggle('active',mode==='test');
 $('modebar').innerHTML=mode==='bind'?`<strong>建立绑定</strong><span>${source?'来源已选：'+escapeHtml(nodes.find(n=>n.id===source).name)+'，请选择目标节点':'先点击来源节点，再点击目标节点'}</span><button id="exitMode">退出 · Esc</button>`:mode==='test'?`<strong>测试范围：${tests.size} 个节点</strong><span>${missing().length?'缺少上游：查询额定容量':'范围按依赖顺序执行；点击节点名称仍可查看配置'}</span>${missing().length?'<button id="complete">补选所需上游</button>':''}<button id="testGroup" ${!tests.size||missing().length?'disabled':''}>测试所选节点</button><button id="exitMode">退出 · Esc</button>`:'<span>查看模式 · 先配置节点，再通过输入绑定组织流程</span>';
}
function missing(){return bound&&tests.has('soc')&&!tests.has('cap')?['cap']:[]}
function select(id,focusField=false){selected=id;const n=nodes.find(n=>n.id===id);$('inspector').hidden=!n;if(!n){draw();return}if(n.kind==='boundary')tab=id==='output'?'outputs':'inputs';$('nodeType').textContent=kinds[n.kind];$('nodeTitle').textContent=n.name;$('testNode').hidden=n.kind==='boundary';$('more').hidden=n.kind==='boundary';document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.hidden=n.kind==='boundary'&&b.dataset.tab!==tab});renderContent();draw();if(focusField){const field=$('bindingField');if(field){field.classList.add('focused');field.querySelector('select')?.focus()}}}
function renderContent(){const n=nodes.find(n=>n.id===selected);if(!n)return;let s='';
 if(n.id==='output')s=`<label>输出参数</label><input value="soc" readonly><div class="field" id="bindingField"><label for="outBinding">来源 *</label><select id="outBinding"><option value="">请选择节点输出</option><option value="soc" ${outBound?'selected':''}>计算设备 SOC → soc</option></select><p>绑定输出后，流程才能向调用方返回结果。</p></div>`;
 else if(n.id==='input')s='<label>编排输入</label><div class="field"><strong>storageId</strong><p>设备编号 · 数值 · 必填</p></div><p>原型使用单个示例参数；正式版保留现有增删与类型编辑。</p>';
 else if(tab==='inputs')s=n.id==='soc'?`<div class="field"><label>剩余电量 remainingEnergy</label><input value="55" readonly><small>固定值，仅作界面演示</small></div><div class="field" id="bindingField"><label for="inBinding">额定容量 capacity · 来源 *</label><select id="inBinding"><option value="">请选择来源</option><option value="cap" ${bound?'selected':''}>查询额定容量 → capacity</option></select><p>选择上游输出后自动生成连线。</p></div>`:'<div class="field"><label>参数名（代码中使用）</label><input value="storageId" readonly><label>类型 / 来源</label><input value="数值 / 编排输入 → storageId" readonly></div><small>原型仅展开此示例，正式版保留所有参数维护功能。</small>';
 else if(tab==='implementation')s=n.kind==='sql'?`<label>数据连接</label><select><option>创智园数据库（示例）</option></select><div class="row"><label>SQL 模板</label><button class="quiet push" id="expandCode">展开编辑</button></div><textarea id="code" class="code" spellcheck="false">${escapeHtml(code)}</textarea><p>使用 :storageId 引用输入参数。这里只保存示例文本，不执行。</p>`:n.kind==='calc'?'<label>输出 soc · 计算公式</label><textarea id="formula" class="code">remainingEnergy / capacity * 100</textarea><p>使用现有计算引擎；本原型仅演示布局，不计算业务结果。</p>':n.kind==='python'?'<div class="notice">由大模型推演，非本地 Python 执行。</div><label>Python 代码</label><textarea class="code">def main(value):\n    return {"result": value}</textarea><button id="skeleton">重建骨架…</button>':`<label>${kinds[n.kind]} 实现配置</label><div class="notice">正式版保留当前 ${kinds[n.kind]} 全部字段。原型不连接、不发请求。</div>`;
 else if(tab==='outputs')s=`<div class="field"><label>输出参数名</label><input value="${n.id==='soc'?'soc':'capacity'}" readonly><label>数据类型</label><input value="数值" readonly></div><p>名称用于下游绑定；改名继续以稳定 ID 维持引用。</p>`;
 else s='<label>超时（毫秒）</label><input type="number" value="30000"><label>最大返回行数</label><input type="number" value="1000"><p>仅演示已有高级设置分区。本轮不新增执行策略。</p>';
 $('content').innerHTML=s;
}
function renderStatus(){$('checkState').textContent=stale?'待重新检查':checked?(issues.length?`${issues.length} 个问题`:'检查通过'):'尚未检查';$('checkState').className='quiet '+(stale?'amber':issues.length?'error':checked?'good':'');$('issueCount').textContent=checked?`(${issues.length}${stale?' · 上次':''})`:'';$('dockState').textContent=stale?'配置已修改，上次结论待重新检查':checked?'当前示例配置的检查结果':'尚未检查'}
function check(){issues=[];if(nodes.some(n=>n.id==='soc')&&!bound)issues.push({id:'soc',section:'inputs',name:'计算设备 SOC',field:'输入「额定容量」',message:'尚未选择来源'});if(!outBound)issues.push({id:'output',section:'outputs',name:'编排输出',field:'输出「soc」',message:'尚未绑定节点输出'});checked=true;stale=false;dockTab='issues';dockOpen=true;renderStatus();renderDock();draw()}
function renderDock(){$('dock').classList.toggle('expanded',dockOpen);$('dockContent').hidden=!dockOpen;$('collapseDock').textContent=dockOpen?'收起 ↓':'展开 ↑';$('issuesTab').classList.toggle('active',dockTab==='issues');$('resultsTab').classList.toggle('active',dockTab==='results');if(dockTab==='issues')$('dockContent').innerHTML=!checked?'<div class="empty">点击“检查配置”，发现缺失和不匹配的配置。</div>':issues.length?issues.map(i=>`<div class="issue"><span class="error">错误</span><div><strong>${escapeHtml(i.name)} · ${i.field}</strong><small style="display:block">${i.message}${stale?'（上次检查，需重新确认）':''}</small></div><button data-locate="${i.id}" data-section="${i.section}">去处理 →</button></div>`).join(''):'<div class="empty good">当前示例配置检查通过。配置检查不代表业务执行成功。</div>';else $('dockContent').innerHTML=result?`<p><strong>${result.title}</strong> · ${result.time} <span class="badge">${generation!==result.generation?'上次配置快照':'提交时快照'}</span></p><div class="resultgrid"><div><small>范围</small><br>${escapeHtml(result.scope)}</div><div><small>示例状态</small><br><span class="good">成功（模拟）</span></div><div><small>输出演示</small><br>soc = 55%</div></div><small>未调用任何真实 API。正式版展示实际返回结果。</small>`:'<div class="empty">尚无测试结果。可测试单节点、所选范围或全部编排。</div>'}
function modal(title,body,action,label='确认'){dialogReturn=document.activeElement;dialogDirty=false;$('modalTitle').textContent=title;$('modalBody').innerHTML=body;dialogAction=action;$('modalOk').textContent=label;$('modalBack').hidden=false;($('modalBody').querySelector('input,textarea,select')||$('modalCancel')).focus()}
function closeModal(force=false){if(dialogDirty&&!force&&!window.confirm('放弃本次弹窗中的未提交修改？'))return;$('modalBack').hidden=true;dialogAction=null;dialogDirty=false;dialogReturn?.focus()}
function test(scope){const title=scope==='all'?'运行全部':scope==='group'?'测试所选节点':'测试此节点';const name=scope==='all'?'全部编排':scope==='group'?[...tests].map(id=>nodes.find(n=>n.id===id).name).join('、'):nodes.find(n=>n.id===selected)?.name||'';modal(title,`<div class="notice">范围：${escapeHtml(name)}<br>当前项目：创智园二期（示例）</div><label>storageId · 数值</label><input id="testValue" type="number" value="1"><p class="muted">正式版按测试范围收集必要输入，固定值只读。真实外部调用需展示执行摘要。</p><small>本原型点击后仅生成模拟结果。</small>`,()=>{if($('testValue').value===''){toast('请填写数值输入');return false}result={title,time:new Date().toLocaleTimeString(),scope:name,generation};dockTab='results';dockOpen=true;renderDock();toast('模拟测试结束，未调用业务系统')},'开始模拟测试')}
function binding(sourceId,targetId){if(sourceId==='cap'&&targetId==='soc'){modal('建立参数绑定','<div class="notice">查询额定容量 → 计算设备 SOC</div><label>来源输出</label><select><option>capacity · 数值</option></select><label>目标输入</label><select><option>额定容量 capacity · 数值</option></select><small>确认后修改输入绑定，画布连线由绑定派生。</small>',()=>{bound=true;dirty();mode='inspect';source='';select('soc')},'确认绑定')}else if(sourceId==='soc'&&targetId==='output'){modal('绑定编排输出','<div class="notice">计算设备 SOC → 编排输出 soc</div>',()=>{outBound=true;dirty();mode='inspect';source='';select('output')},'确认绑定')}else{toast('此原型支持“查询额定容量 → 计算设备 SOC → 编排输出”；其他连接交由正式版类型校验');source='';renderMode()}}
$('check').onclick=check;$('checkState').onclick=()=>{dockTab='issues';dockOpen=true;renderDock()};$('toggleList').onclick=()=>{$('list').hidden=!$('list').hidden;$('toggleList').setAttribute('aria-expanded',String(!$('list').hidden))};$('closeDetail').onclick=()=>select('');$('bindMode').onclick=()=>{mode=mode==='bind'?'inspect':'bind';source='';draw()};$('testMode').onclick=()=>{mode=mode==='test'?'inspect':'test';source='';draw()};$('runAll').onclick=()=>test('all');$('testNode').onclick=()=>test('single');$('back').onclick=()=>toast('原型仅展示编辑页；正式版返回编排列表并保留草稿。');$('add').onclick=()=>{$('addMenu').hidden=!$('addMenu').hidden;$('add').setAttribute('aria-expanded',String(!$('addMenu').hidden))};$('collapseDock').onclick=()=>{dockOpen=!dockOpen;renderDock()};$('issuesTab').onclick=()=>{dockTab='issues';dockOpen=true;renderDock()};$('resultsTab').onclick=()=>{dockTab='results';dockOpen=true;renderDock()};$('actual').onclick=()=>{zoom=1;$('world').style.transform='scale(1)';$('actual').textContent='100%'};$('fit').onclick=()=>{zoom=Math.min(1,($('viewport').clientWidth-30)/920,($('viewport').clientHeight-30)/460);zoom=Math.max(.25,zoom);$('world').style.transform=`scale(${zoom})`;$('actual').textContent=`${Math.round(zoom*100)}% → 100%`};$('layout').onclick=()=>toast('示例已采用默认排布；正式版整理位置可撤销，不改变参数绑定。');
$('more').onclick=()=>modal('节点操作','<p>删除节点会移除其配置，并影响引用它的输入/输出绑定。正式版列出每一处引用。</p>',()=>{const id=selected;nodes=nodes.filter(n=>n.id!==id);tests.delete(id);if(id==='cap')bound=false;if(id==='soc'){bound=false;outBound=false}dirty();select('')},'删除当前节点');$('modalCancel').onclick=()=>closeModal();$('modalOk').onclick=()=>{if(dialogAction&&dialogAction()===false)return;closeModal(true)};$('modalBody').addEventListener('input',()=>dialogDirty=true);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.info){toast(b.dataset.info);return}if(b.dataset.node){const id=b.dataset.node;if(mode==='bind'){if(!source){source=id;renderMode()}else if(source===id)toast('请选择另一个目标节点');else binding(source,id)}else select(id);return}if(b.dataset.tab){tab=b.dataset.tab;select(selected);return}if(b.dataset.locate){tab=b.dataset.section;select(b.dataset.locate,true);return}if(b.dataset.kind){const id='node'+Date.now(),kind=b.dataset.kind;nodes.splice(nodes.length-1,0,{id,name:'新建'+kinds[kind]+'节点',kind,x:270,y:330});$('addMenu').hidden=true;$('add').setAttribute('aria-expanded','false');dirty();tab='implementation';select(id);toast('已添加原型节点；仅演示节点配置分区。');return}if(b.id==='exitMode'){mode='inspect';source='';draw()}if(b.id==='complete'){missing().forEach(id=>tests.add(id));draw()}if(b.id==='testGroup')test('group');if(b.id==='expandCode')modal('SQL 模板 · 展开编辑',`<textarea id="largeCode" class="code" spellcheck="false">${escapeHtml(code)}</textarea>`,()=>{code=$('largeCode').value;dirty();renderContent()},'应用到节点');if(b.id==='skeleton')modal('重建 Python 骨架','<p>将覆盖当前代码正文。正式版确认后仍可撤销；取消不会改动代码。</p>',()=>toast('原型演示：已确认覆盖，不修改工作台文件。'),'确认覆盖');});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.pick){t.checked?tests.add(t.dataset.pick):tests.delete(t.dataset.pick);draw()}if(t.id==='inBinding'){bound=!!t.value;dirty();draw()}if(t.id==='outBinding'){outBound=!!t.value;dirty();draw()}});$('content').addEventListener('input',e=>{if(e.target.id==='code')code=e.target.value;if(e.target.id==='code'||e.target.id==='formula')dirty()});document.addEventListener('keydown',e=>{if(!$('modalBack').hidden){if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const f=[...$('modalBack').querySelectorAll('button,input,textarea,select')].filter(x=>!x.disabled&&!x.hidden);let i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}return}if(e.key==='Escape'){if(!$('addMenu').hidden){$('addMenu').hidden=true;return}mode='inspect';source='';draw()}});
$('list').hidden=window.innerWidth<1440;$('toggleList').setAttribute('aria-expanded',String(!$('list').hidden));draw();renderStatus();renderDock();
</script></body></html>
