# Python 代码规范基线（2026-09-21 起）
# 参照：PEP 8（github.com/python/peps/blob/master/pep-0008.txt）
#       Google Python Style Guide（github.com/google/styleguide）
# 工具：Ruff（github.com/astral-sh/ruff）
# 策略：只启用错误级规则（pyflakes F + pycodestyle 核心 E4/E7/E9 + bugbear B），
# 不启用 E501 行长等风格规则——既有代码含大量长行与中文注释，不做大规模重排；
# 新增/修改代码按 line-length 120 控制行宽。
target-version = "py39"
line-length = 120
extend-exclude = ["frontend", "文档", "ontology", "data", "worktree", ".runtime", "node_modules"]

[lint]
select = ["E4", "E7", "E9", "F", "B"]
# 排除项均为「仓库既有风格不重排」的明确偏离，新代码也按此豁免：
# - E701/E702/E703/E731/E741：紧凑单行写法与短名（历史代码大量存在，不重排）
# - E402：测试在设置 WIZ_WORKBENCH_ROOT/env 后再 import 是既有隔离约定；模块内延迟导入是性能/循环依赖约定
# - B023：闭包捕获循环变量——既有 35 处均经测试验证为安全用法，登记为已知债务逐步消化
ignore = ["E701", "E702", "E703", "E731", "E741", "E402", "B023"]
